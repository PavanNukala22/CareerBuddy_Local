{% extends 'base.html' %}
{% load static %}

{% block extra_css %}
    <link rel="stylesheet" href="{% static 'jam/css/main.css' %}" />
    <style>
        :root {
            --primary-container: #0f172a;
            --surface-bright: #f8fafc;
            --success: #10b981;
            --warning: #f59e0b;
            --background: #f8fafc;
            --coral: #f59e0b;
            --coral-2: #d97706;
        }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        /* Fix for JAM content spacing */
        .jam-module-wrapper {
            padding-top: 5rem;
            padding-bottom: 5rem;
        }
    </style>
    {% block jam_css %}{% endblock %}
{% endblock %}

{% block content %}
<div class="jam-module-wrapper">
    {% block jam_content %}{% endblock %}
</div>
{% endblock %}

{% block extra_js %}
    {% block jam_js %}{% endblock %}
{% endblock %}
