{% extends 'base.html' %}
{% block content %}
<div class="container py-5" style="max-width:480px;">
  <div class="card shadow-sm border-0 rounded-4 p-4 p-md-5 text-center">
    <div class="d-inline-flex align-items-center justify-content-center mb-3 mx-auto" style="width:64px;height:64px;border-radius:18px;background:#ecfdf5;color:#16a34a;font-size:28px;"><i class="fas fa-envelope-open-text"></i></div>
    <h3 class="fw-bold mb-2" style="color:#0f172a;">Check your email</h3>
    <p class="text-muted small mb-4">If an account exists for that email, we've sent a password reset link. Please check your inbox (and spam folder). The link is valid for a limited time.</p>
    <a href="{% url 'login' %}" class="btn btn-outline-primary w-100 py-2 fw-bold" style="border-radius:10px;">Back to login</a>
  </div>
</div>
{% endblock %}
