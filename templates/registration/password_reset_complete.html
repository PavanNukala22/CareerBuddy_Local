{% extends 'base.html' %}
{% block content %}
<div class="container py-5" style="max-width:480px;">
  <div class="card shadow-sm border-0 rounded-4 p-4 p-md-5 text-center">
    <div class="d-inline-flex align-items-center justify-content-center mb-3 mx-auto" style="width:64px;height:64px;border-radius:18px;background:#ecfdf5;color:#16a34a;font-size:28px;"><i class="fas fa-circle-check"></i></div>
    <h3 class="fw-bold mb-2" style="color:#0f172a;">Password reset successful</h3>
    <p class="text-muted small mb-4">Your password has been updated. You can now log in with your new password.</p>
    <a href="{% url 'login' %}" class="btn btn-primary w-100 py-2 fw-bold" style="border-radius:10px;background:linear-gradient(135deg,#185adb,#1d4ed8);border:none;">Go to login</a>
  </div>
</div>
{% endblock %}
