{% extends 'base.html' %}
{% block content %}
<div class="container py-5" style="max-width:480px;">
  <div class="reset-card card shadow-sm border-0 rounded-4 p-4 p-md-5">
    <style>
      .reset-card input{width:100%;padding:.65rem .85rem;border:1px solid #cbd5e1;border-radius:10px;font-size:.95rem;margin-top:.25rem;}
      .reset-card input:focus{outline:none;border-color:#185adb;box-shadow:0 0 0 3px rgba(24,90,219,.15);}
    </style>
    <div class="text-center mb-3">
      <div class="d-inline-flex align-items-center justify-content-center mb-2" style="width:56px;height:56px;border-radius:16px;background:#eff6ff;color:#185adb;font-size:24px;"><i class="fas fa-key"></i></div>
      <h3 class="fw-bold mb-1" style="color:#0f172a;">Forgot your password?</h3>
      <p class="text-muted small mb-0">Enter your account email and we'll send you a secure link to reset it.</p>
    </div>
    <form method="post" class="mt-3">
      {% csrf_token %}
      <label class="form-label small fw-semibold">Email address</label>
      {{ form.email }}
      {% if form.email.errors %}<div class="text-danger small mt-1">{{ form.email.errors.0 }}</div>{% endif %}
      <button type="submit" class="btn btn-primary w-100 py-2 fw-bold mt-3" style="border-radius:10px;background:linear-gradient(135deg,#185adb,#1d4ed8);border:none;">
        <i class="fas fa-paper-plane me-2"></i>Send reset link
      </button>
    </form>
    <div class="text-center mt-3">
      <a href="{% url 'login' %}" class="small text-decoration-none" style="color:#64748b;"><i class="fas fa-arrow-left me-1"></i>Back to login</a>
    </div>
  </div>
</div>
{% endblock %}
