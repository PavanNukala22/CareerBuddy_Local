<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}CareerBuddy – Learn. Grow. Get Hired.{% endblock %}</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
  rel="stylesheet">

{% load static %}
<link rel="stylesheet" href="/theme-cbuddy.css">

<style>
  /* ===== Same token system as the Skill Up module (static/001 Career Buddy/index.html) ===== */
  :root {
    --teal: #14213D;
    --teal-2: #0b1526;
    --gold: #FCA311;
    --bg-soft: #f1f3ff;
    --ink: #161c27;
    --body: #4a5568;
    --line: #e2e8f0;
    --line-2: #dde2f3;
    --shadow-sm: 0 1px 2px rgba(16, 24, 40, .04), 0 1px 3px rgba(16, 24, 40, .06);
    --shadow: 0 8px 24px -12px rgba(16, 24, 40, .18);
    --maxw: 1280px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Outfit', system-ui, sans-serif;
    color: var(--ink);
    background: #fff;
  }

  .material-symbols-outlined {
    font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    vertical-align: middle;
  }

  /* ===== Header / Nav — identical markup/classes to the Skill Up module ===== */
  header.topbar {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(255, 255, 255, .86);
    backdrop-filter: saturate(160%) blur(10px);
    -webkit-backdrop-filter: saturate(160%) blur(10px);
    border-bottom: 1px solid var(--line);
  }

  .nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 24px;
    padding: 14px 28px;
    max-width: var(--maxw);
    margin: 0 auto;
    position: relative;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    color: var(--ink);
    letter-spacing: -.01em;
    font-size: 18px;
    text-decoration: none;
  }

  .topbar .brand {
    position: absolute;
    left: 28px;
    top: 50%;
    transform: translateY(-50%);
  }

  .brand .badge {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    background: #14213D;
    color: #fff;
    display: grid;
    place-items: center;
    font-size: 16px;
    letter-spacing: -.02em;
  }

  .brand b { color: #FCA311; font-weight: 700; }

  .nav-links { display: flex; gap: 6px; align-items: center; }

  .nav-links a {
    font-weight: 600;
    color: var(--body);
    font-size: 14px;
    text-decoration: none;
    padding: 8px 16px;
    border-radius: 8px;
    line-height: 1.4;
    display: inline-flex;
    align-items: center;
    transition: background .15s ease, color .15s ease;
  }

  .nav-links a:hover { background: rgba(20,33,61,.08); color: #14213D; }

  .nav-links a.active {
    background: #14213D;
    color: #fff;
  }

  .menu-toggle {
    display: none;
    background: none;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 6px 10px;
  }

  @media (max-width:960px) {
    .nav { justify-content: space-between; }
    .topbar .brand { position: static; transform: none; }
    .nav-links {
      display: none;
      position: absolute;
      top: 64px;
      left: 0; right: 0;
      background: #fff;
      flex-direction: column;
      align-items: stretch;
      padding: 14px 20px;
      border-bottom: 1px solid var(--line);
      box-shadow: var(--shadow);
    }
    .nav-links.open { display: flex; }
    .menu-toggle { display: inline-flex; align-items: center; gap: 6px; }
  }

  /* ===== Page content ===== */
  .page-wrap { max-width: var(--maxw); margin: 0 auto; padding: 40px 28px 64px; }

  .page-header { margin-bottom: 28px; }
  .page-header h1 {
    font-size: 32px;
    font-weight: 700;
    color: var(--teal);
    margin: 0 0 6px;
  }
  .page-header p { color: var(--body); margin: 0; font-size: 15px; }

  .badge-count {
    background: var(--teal);
    color: #fff;
    font-weight: 700;
    font-size: 13px;
    padding: 8px 16px;
    border-radius: 100px;
    display: inline-block;
  }

  .card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 24px;
    box-shadow: var(--shadow-sm);
  }

  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .02em;
    padding: 6px 14px;
    border-radius: 100px;
  }
  .status-pill .material-symbols-outlined { font-size: 15px; }
  .status-not-completed { background: #eef0f5; color: var(--body); }
  .status-locked { background: #fdecea; color: #A64B3C; }
  .status-eligible { background: #fff4e0; color: #8a5a00; }
  .status-certified { background: #e7f3ea; color: #2e6b3e; }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-family: inherit;
    font-weight: 700;
    font-size: 14px;
    padding: 12px 22px;
    border-radius: 8px;
    border: 1.5px solid transparent;
    cursor: pointer;
    text-decoration: none;
  }
  .btn-primary { background: var(--teal); color: #fff; }
  .btn-primary:hover { background: var(--teal-2); }
  .btn-outline { background: transparent; border-color: var(--line-2); color: var(--teal); }
  .btn-outline:hover { background: var(--bg-soft); }
  .btn-block { width: 100%; }

  .alert-error {
    background: #fdecea;
    color: #A64B3C;
    border: 1px solid #f3c9c3;
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 14px;
    margin-bottom: 16px;
  }

  .form-input {
    width: 100%;
    font-family: inherit;
    font-size: 15px;
    padding: 12px 14px;
    border: 1.5px solid var(--line-2);
    border-radius: 8px;
    color: var(--ink);
  }
  .form-input:focus {
    outline: none;
    border-color: var(--teal);
  }
</style>
{% block extra_head %}{% endblock %}
</head>
<body>

  <header class="topbar">
    <div class="nav">
      <a class="brand" href="/">
        <span class="badge">
          <svg width="18" height="18" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M8 5.5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2V7H8V5.5Z" fill="none" stroke="#fff" stroke-width="1.6" stroke-linejoin="round" />
            <rect x="3.5" y="7" width="17" height="11.5" rx="2.2" fill="#fff" />
            <rect x="3.5" y="10.7" width="17" height="1.6" fill="#185adb" />
          </svg>
        </span>
        <span>Career <b>Buddy</b></span>
      </a>
      <button class="menu-toggle" onclick="document.getElementById('navlinks').classList.toggle('open')">
        <span class="material-symbols-outlined" style="font-size:20px">menu</span>
        Menu
      </button>
      <nav id="navlinks" class="nav-links">
        <a href="/skill-up/">Home</a>
        <a href="/skill-up/#depth-english">English &amp; Vocab</a>
        <a href="/skill-up/#depth-aptitude">Aptitude</a>
        <a href="/skill-up/#depth-tech">Tech</a>
        <a href="/skill-up/#section-sitemap">Sitemap</a>
        <a href="/skill-up/assessment/" class="active"><span class="material-symbols-outlined" style="font-size:16px; margin-right:4px;" aria-hidden="true">workspace_premium</span>Certifications</a>
        <a href="/skill-up/#section-depth">Browse all</a>
      </nav>
    </div>
  </header>

  <div class="page-wrap">
    {% block content %}{% endblock %}
  </div>

</body>
</html>
