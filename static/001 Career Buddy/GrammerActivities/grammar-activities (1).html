<!DOCTYPE html>
<html lang="en">

<head><script src="/static/js/content-protection.js?v=2" data-cb-protect></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>English Grammar — Interactive Practice</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap');

    :root {
      --bg: #f8fafc;
      --white: #ffffff;
      --border: #e2e8f0;
      --border-hover: #cbd5e1;
      --text-dark: #0f172a;
      --text-mid: #334155;
      --text-soft: #64748b;
      --text-muted: #94a3b8;
      --blue: #185adb;
      --blue-light: #eff6ff;
      --blue-border: #bfdbfe;
      --green: #10b981;
      --green-bg: #ecfdf5;
      --green-border: #a7f3d0;
      --red: #ef4444;
      --red-bg: #fef2f2;
      --red-border: #fecaca;
      --gold: #FCA311;
      --gold-bg: #fffbeb;
      --correct: #10b981;
      --correct-bg: #ecfdf5;
      --wrong: #ef4444;
      --wrong-bg: #fef2f2;
      --radius: 12px;
      --radius-lg: 16px;
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, .06), 0 1px 2px rgba(0, 0, 0, .04);
      --shadow: 0 4px 16px rgba(0, 0, 0, .06), 0 1px 3px rgba(0, 0, 0, .04);
      --shadow-hover: 0 8px 24px rgba(0, 0, 0, .1), 0 2px 6px rgba(0, 0, 0, .06);
      --mono: 'Courier New', monospace;
      --font: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font);
      background: var(--bg);
      color: var(--text-dark);
    }

    .wrap {
      max-width: 1240px;
      margin: 0 auto;
      padding: 30px 24px 80px;
    }

    /* ---------- Header ---------- */
    .app-header {
      margin-bottom: 36px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 24px;
    }

    .app-header .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 13.5px;
      font-weight: 700;
      color: #0f172a;
      background: #e9eff6;
      border: 1px solid #cbd5e1;
      padding: 6px 18px;
      border-radius: 50px;
      letter-spacing: normal;
      text-transform: none;
      margin-bottom: 16px;
    }

    .app-header h1 {
      font-size: 32px;
      font-weight: 800;
      color: var(--text-dark);
      margin: 0 0 6px;
      letter-spacing: -.5px;
    }

    .app-header h1 span {
      color: var(--gold);
    }

    .app-header .subtitle {
      color: var(--text-soft);
      font-size: 15px;
      margin: 0;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    /* ---------- Section heading ---------- */
    .section-heading {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .section-heading h2 {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-dark);
      margin: 0;
    }

    .section-heading .count-badge {
      font-size: 12px;
      font-weight: 600;
      background: var(--border);
      color: var(--text-soft);
      padding: 3px 9px;
      border-radius: 20px;
      font-family: var(--mono);
      letter-spacing: .04em;
    }

    /* ---------- Level Navbar ---------- */
    .level-grid {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--white);
      padding: 6px;
      border: 1px solid var(--border);
      border-radius: 14px;
      margin-bottom: 32px;
      box-shadow: var(--shadow-sm);
    }

    @media(max-width:640px) {
      .level-grid {
        flex-direction: column;
      }
    }

    .level-card {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 11px 20px;
      border-radius: 10px;
      font-size: 14.5px;
      font-weight: 600;
      color: var(--text-mid);
      background: transparent;
      border: none;
      cursor: pointer;
      transition: all .18s ease;
      white-space: nowrap;
      box-shadow: none;
    }

    .level-card:hover {
      color: var(--blue);
      background: #f1f5f9;
      transform: none;
      box-shadow: none;
      border-color: transparent;
    }

    .level-card:focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 2px;
    }

    .level-card.active {
      background: #14213D;
      color: #ffffff !important;
      border: none;
      box-shadow: 0 4px 14px rgba(20, 33, 61, 0.25);
    }

    .level-card .level-icon {
      font-size: 18px;
      display: inline-block;
      margin: 0;
    }

    .level-card .level-name {
      font-weight: 600;
      font-size: 14.5px;
    }

    .level-card.active .level-name {
      color: #ffffff;
    }

    .level-card .level-count {
      font-size: 12px;
      opacity: 0.75;
      margin-left: 3px;
      font-weight: 500;
    }

    .level-card .level-tagline {
      display: none;
    }

    /* ---------- Module list ---------- */
    .module-list {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    @media(max-width:700px) {
      .module-list {
        grid-template-columns: 1fr;
      }
    }

    .module-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px;
      cursor: pointer;
      transition: border-color .18s ease, box-shadow .18s ease, transform .18s ease;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .module-card:hover {
      border-color: var(--blue);
      box-shadow: var(--shadow-hover);
      transform: translateY(-2px);
    }

    .module-card:focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 2px;
    }

    .module-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      background: var(--bg);
      border: 1px solid var(--border);
      flex-shrink: 0;
    }

    .module-type {
      font-size: 10.5px;
      letter-spacing: .08em;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
      font-family: var(--mono);
    }

    .module-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-dark);
      margin: 0;
      line-height: 1.3;
    }

    .module-desc {
      font-size: 13px;
      color: var(--text-soft);
      margin: 0;
      line-height: 1.5;
      flex: 1;
    }

    .module-open {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--blue);
      margin-top: 4px;
      transition: gap .15s;
    }

    .module-card:hover .module-open {
      gap: 8px;
    }

    /* Legacy arrow support */
    .module-arrow {
      display: none;
    }

    /* ---------- Lesson & Quiz shared header ---------- */
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-soft);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      margin-bottom: 20px;
      background: none;
      border: none;
      padding: 0;
      font-family: inherit;
      transition: color .15s;
    }

    .back-link:hover {
      color: var(--blue);
    }

    .title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
      gap: 10px;
    }

    .title-row .title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 22px;
      font-weight: 700;
      color: var(--text-dark);
    }

    .level-tag {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .06em;
      color: var(--blue);
      background: var(--blue-light);
      border: 1px solid var(--blue-border);
      padding: 4px 12px;
      border-radius: 20px;
      white-space: nowrap;
      text-transform: uppercase;
      font-family: var(--mono);
    }

    hr.rule {
      border: none;
      border-top: 1px solid var(--border);
      margin: 14px 0 22px;
    }

    /* ---------- Lesson screen ---------- */
    .lesson-section {
      display: none;
    }

    .lesson-section.active {
      display: block;
    }

    .lesson-block {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 22px 24px;
      margin-bottom: 12px;
      box-shadow: var(--shadow-sm);
    }

    .lesson-block h3 {
      font-size: 16px;
      font-weight: 700;
      margin: 0 0 8px;
      color: var(--text-dark);
    }

    .lesson-block p {
      font-size: 14.5px;
      line-height: 1.7;
      color: var(--text-mid);
      margin: 0 0 12px;
    }

    .lesson-examples {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .lesson-examples li {
      font-size: 14px;
      background: var(--blue-light);
      border: 1px solid var(--blue-border);
      border-radius: 8px;
      padding: 9px 13px;
      color: var(--text-mid);
    }

    .lesson-examples li b {
      color: var(--blue);
    }

    .start-assessment-row {
      display: flex;
      justify-content: flex-end;
      margin-top: 16px;
    }

    /* ---------- Quiz screen ---------- */
    .progress-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: var(--text-soft);
      margin-bottom: 8px;
      font-weight: 500;
    }

    .progress-bar-track {
      height: 5px;
      border-radius: 6px;
      background: var(--border);
      overflow: hidden;
      margin-bottom: 28px;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--blue), #3b82f6);
      border-radius: 6px;
      transition: width .3s ease;
    }

    .prompt {
      font-size: 20px;
      line-height: 1.6;
      margin-bottom: 24px;
      color: var(--text-dark);
      font-weight: 500;
    }

    .prompt .accent {
      color: var(--blue);
    }

    .blank {
      display: inline-block;
      min-width: 90px;
      border-bottom: 2px solid var(--blue);
      margin: 0 4px;
      height: 1.3em;
    }

    .blank.filled {
      color: var(--blue);
      font-weight: 700;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    @media(max-width:520px) {
      .options-grid {
        grid-template-columns: 1fr;
      }
    }

    .option-btn {
      font-size: 15px;
      font-family: inherit;
      font-weight: 500;
      padding: 15px 14px;
      border-radius: 12px;
      border: 1.5px solid var(--border);
      background: var(--white);
      color: var(--text-dark);
      cursor: pointer;
      transition: border-color .15s, background .15s, transform .1s;
      text-align: center;
      box-shadow: var(--shadow-sm);
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--blue);
      background: var(--blue-light);
      transform: translateY(-1px);
    }

    .option-btn:active:not(:disabled) {
      transform: scale(.98);
    }

    .option-btn:disabled {
      cursor: default;
    }

    .option-btn.correct {
      background: var(--correct-bg);
      border-color: var(--correct);
      color: #065f46;
      font-weight: 700;
    }

    .option-btn.wrong {
      background: var(--wrong-bg);
      border-color: var(--wrong);
      color: #991b1b;
      font-weight: 700;
    }

    /* word order */
    .wo-build {
      min-height: 56px;
      border: 2px dashed var(--border-hover);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
      background: var(--bg);
    }

    .wo-build .placeholder {
      color: var(--text-muted);
      font-size: 14px;
      padding: 8px 2px;
    }

    .wo-chip {
      background: var(--blue);
      color: #fff;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: background .15s;
    }

    .wo-chip:hover {
      background: #1448b0;
    }

    .wo-bank {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }

    .wo-word {
      background: var(--white);
      border: 1.5px solid var(--border);
      padding: 9px 15px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      color: var(--text-dark);
      transition: border-color .15s, background .15s;
      box-shadow: var(--shadow-sm);
    }

    .wo-word:hover {
      border-color: var(--blue);
      background: var(--blue-light);
    }

    .wo-word:disabled {
      opacity: .4;
      cursor: default;
    }

    .wo-actions {
      display: flex;
      gap: 10px;
    }

    .feedback-banner {
      margin-top: 16px;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 14.5px;
      font-weight: 500;
      display: none;
    }

    .feedback-banner.show {
      display: block;
    }

    .feedback-banner.correct {
      background: var(--correct-bg);
      color: #065f46;
      border: 1px solid var(--green-border);
    }

    .feedback-banner.wrong {
      background: var(--wrong-bg);
      color: #991b1b;
      border: 1px solid var(--red-border);
    }

    .nav-row {
      margin-top: 24px;
      display: flex;
      justify-content: flex-end;
    }

    .btn {
      font-family: inherit;
      font-size: 14.5px;
      font-weight: 700;
      padding: 11px 26px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      background: var(--blue);
      color: #ffffff;
      letter-spacing: .01em;
      transition: background .15s, transform .15s, box-shadow .15s;
      box-shadow: 0 2px 8px rgba(24, 90, 219, 0.25);
    }

    .btn:hover {
      background: #1448b0;
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(24, 90, 219, 0.35);
    }

    .btn:disabled {
      background: var(--border);
      color: var(--text-muted);
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    .btn.secondary {
      background: var(--white);
      color: var(--text-mid);
      border: 1.5px solid var(--border);
      box-shadow: var(--shadow-sm);
    }

    .btn.secondary:hover {
      border-color: var(--blue);
      color: var(--blue);
      background: var(--blue-light);
      box-shadow: none;
    }

    /* results */
    .results {
      text-align: center;
      padding: 36px 10px 10px;
    }

    .results .score-circle {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      background: var(--green-bg);
      border: 3px solid var(--correct);
    }

    .results .score-circle .num {
      font-size: 34px;
      color: #065f46;
      font-weight: 800;
    }

    .results .score-circle .den {
      font-size: 13px;
      color: var(--text-soft);
    }

    .results h2 {
      font-size: 24px;
      font-weight: 700;
      color: var(--text-dark);
      margin-bottom: 6px;
    }

    .results p {
      color: var(--text-soft);
      margin-bottom: 26px;
    }

    .results-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    /* ---------- Level header (lesson/quiz) ---------- */
    .level-header-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
    }

    .level-header-row .level-header-icon {
      font-size: 24px;
    }

    .level-header-row h2 {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-dark);
      margin: 0;
    }
  </style>

<body>
  <div class="wrap">

    <div class="app-header">
      <div class="eyebrow">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z" />
        </svg>
        Interactive practice
      </div>
      <h1>English <span>Grammar</span></h1>

    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function pickQuestions(moduleId) {
      const lvl = currentLevel();
      const bank = lvl.BANKS[moduleId];
      const setKeyId = lvl.id + ":" + moduleId;
      const prevKey = state.lastSetKey[setKeyId] || "";
      let attempt = 0;
      let chosen, key;
      do {
        const shuffled = shuffle(bank).slice(0, Math.min(QUESTIONS_PER_ROUND, bank.length));
        chosen = shuffled;
        key = shuffled.map(q => q.sentence || q.answer).join("|");
        attempt++;
      } while (key === prevKey && attempt < 6);
      state.lastSetKey[setKeyId] = key;
      return chosen;
    }

      progressText.textContent = `Question ${state.index + 1} of ${state.questions.length}`;
      scoreText.textContent = `${state.correctCount} correct`;
      progressFill.style.width = `${(state.index / state.questions.length) * 100}%`;

      const lvl = currentLevel();
      const mod = lvl.MODULES.find(m => m.id === state.moduleId);
      const q = state.questions[state.index];

      if (mod.mode === "fillblank") {
        renderFillBlank(q);
      } else if (mod.mode === "spoterror") {
        renderSpotError(q);
      } else if (mod.mode === "wordorder") {
        renderWordOrder(q);
      } else if (mod.mode === "transform") {
        renderTransform(q);
      }
    }

    function markProgressComplete() {
      progressFill.style.width = `${((state.index + 1) / state.questions.length) * 100}%`;
    }

    /* ---- Fill blank ---- */
    function renderFillBlank(q) {
      const promptEl = document.createElement("div");
      promptEl.className = "prompt";
      promptEl.innerHTML = `<span class="accent">${q.p[0]}</span><span class="blank" id="blankSpan"></span><span class="accent">${q.p[1]}</span>`;

      const grid = document.createElement("div");
      grid.className = "options-grid";
      const opts = shuffle(q.options);
      opts.forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.textContent = opt;
        btn.addEventListener("click", () => handleAnswer(btn, opt, q.answer, grid, () => {
          document.getElementById("blankSpan").textContent = opt;
          document.getElementById("blankSpan").classList.add("filled");
        }));
        grid.appendChild(btn);
      });

      questionArea.innerHTML = "";
      questionArea.appendChild(promptEl);
      questionArea.appendChild(grid);
    }

    /* ---- Spot error ---- */
    function renderSpotError(q) {
      const promptEl = document.createElement("div");
      promptEl.className = "prompt";
      promptEl.innerHTML = `“${q.sentence}”<br><span style="font-size:15px;color:var(--text-mid)">Which word is the mistake?</span>`;

      const grid = document.createElement("div");
      grid.className = "options-grid";
      const opts = shuffle(q.options);
      opts.forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.textContent = opt;
        btn.addEventListener("click", () => handleAnswer(btn, opt, q.answer, grid));
        grid.appendChild(btn);
      });

      questionArea.innerHTML = "";
      questionArea.appendChild(promptEl);
      questionArea.appendChild(grid);
    }

    /* ---- Word order ---- */
    function renderWordOrder(q) {
      const promptEl = document.createElement("div");
      promptEl.className = "prompt";
      promptEl.innerHTML = `Arrange the words to form a correct sentence:`;

      const buildArea = document.createElement("div");
      buildArea.className = "wo-build";
      const placeholder = document.createElement("span");
      placeholder.className = "placeholder";
      placeholder.textContent = "Tap words below to build the sentence…";
      buildArea.appendChild(placeholder);

      const bank = document.createElement("div");
      bank.className = "wo-bank";

      const built = [];
      const shuffledWords = shuffle(q.words);

      function refreshBuildArea() {
        buildArea.innerHTML = "";
        if (built.length === 0) {
          buildArea.appendChild(placeholder);
        } else {
          built.forEach((w, idx) => {
            const chip = document.createElement("button");
            chip.className = "wo-chip";
            chip.textContent = w.text;
            chip.title = "Remove";
            chip.addEventListener("click", () => {
              if (state.answered) return;
              built.splice(idx, 1);
              w.btn.disabled = false;
              refreshBuildArea();
              checkBtn.disabled = built.length === 0;
            });
            buildArea.appendChild(chip);
          });
        }
      }

      shuffledWords.forEach(word => {
        const btn = document.createElement("button");
        btn.className = "wo-word";
        btn.textContent = word;
        btn.addEventListener("click", () => {
          if (state.answered) return;
          built.push({ text: word, btn });
          btn.disabled = true;
          refreshBuildArea();
          checkBtn.disabled = false;
        });
        bank.appendChild(btn);
      });

      const actions = document.createElement("div");
      actions.className = "wo-actions";
      const checkBtn = document.createElement("button");
      checkBtn.className = "btn";
      checkBtn.textContent = "Check";
      checkBtn.disabled = true;
      const resetBtn = document.createElement("button");
      resetBtn.className = "btn secondary";
      resetBtn.textContent = "Reset";
      resetBtn.addEventListener("click", () => {
        if (state.answered) return;
        built.length = 0;
        bank.querySelectorAll("button").forEach(b => b.disabled = false);
        refreshBuildArea();
        checkBtn.disabled = true;
      });

      checkBtn.addEventListener("click", () => {
        const attempt = built.map(w => w.text).join(" ");
        const isCorrect = attempt.toLowerCase() === q.answer.toLowerCase();
        finalizeAnswer(isCorrect, q.answer);
        checkBtn.disabled = true;
        resetBtn.disabled = true;
        bank.querySelectorAll("button").forEach(b => b.disabled = true);
      });

      actions.appendChild(checkBtn);
      actions.appendChild(resetBtn);

      questionArea.innerHTML = "";
      questionArea.appendChild(promptEl);
      questionArea.appendChild(buildArea);
      questionArea.appendChild(bank);
      questionArea.appendChild(actions);
    }

    /* ---- Sentence transformation ---- */
    function renderTransform(q) {
      const promptEl = document.createElement("div");
      promptEl.className = "prompt";
      promptEl.innerHTML = `&ldquo;${q.sentence}&rdquo;<br><span style="font-size:15px;color:var(--text-mid)">Rewrite the sentence using the word: <span class="accent" style="font-weight:700">${q.keyword}</span></span>`;

      const grid = document.createElement("div");
      grid.className = "options-grid";
      grid.style.gridTemplateColumns = "1fr";
      const opts = shuffle(q.options);
      opts.forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.textContent = opt;
        btn.addEventListener("click", () => handleAnswer(btn, opt, q.answer, grid));
        grid.appendChild(btn);
      });

      questionArea.innerHTML = "";
      questionArea.appendChild(promptEl);
      questionArea.appendChild(grid);
    }

    /* ---- shared answer handling for multiple-choice modes ---- */
    function handleAnswer(btn, chosen, correctAnswer, grid, onCorrectExtra) {
      if (state.answered) return;
      state.answered = true;

      const isCorrect = chosen === correctAnswer;
      Array.from(grid.children).forEach(b => {
        b.disabled = true;
        if (b.textContent === correctAnswer) b.classList.add("correct");
      });
      if (!isCorrect) btn.classList.add("wrong");
      if (isCorrect && onCorrectExtra) onCorrectExtra();

      finalizeAnswer(isCorrect, correctAnswer);
    }

    function finalizeAnswer(isCorrect, correctAnswer) {
      state.answered = true;
      if (isCorrect) state.correctCount++;

      feedbackBanner.classList.add("show");
      if (isCorrect) {
        feedbackBanner.classList.add("correct");
        feedbackBanner.textContent = "Correct! Well done.";
      } else {
        feedbackBanner.classList.add("wrong");
        feedbackBanner.textContent = `Not quite. Correct answer: "${correctAnswer}"`;
      }

      scoreText.textContent = `${state.correctCount} correct`;
      markProgressComplete();
      nextBtn.disabled = false;
    }

    /* ===================== RESULTS ===================== */
    function showResults() {
      quizBody.style.display = "none";
      resultsArea.style.display = "block";
      const total = state.questions.length;
      const score = state.correctCount;
      const pct = Math.round((score / total) * 100);

      let message;
      if (pct === 100) message = "Perfect score! Excellent work.";
      else if (pct >= 80) message = "Great job — almost perfect!";
      else if (pct >= 50) message = "Good effort — keep practicing!";
      else message = "Keep practicing — you'll improve fast!";

      resultsArea.innerHTML = `
    <div class="results">
      <div class="score-circle">
        <div class="num">${score}/${total}</div>
        <div class="den">${pct}%</div>
      </div>
      <h2>${message}</h2>
      <p>You've completed this practice set.</p>
      <div class="results-actions">
        <button class="btn" id="retryBtn">Try again</button>
        <button class="btn secondary" id="reviewBtn">Review lesson</button>
        <button class="btn secondary" id="homeBtn">Back to modules</button>
      </div>
    </div>
  `;

      document.getElementById("retryBtn").addEventListener("click", () => startAssessment(state.moduleId));
      document.getElementById("reviewBtn").addEventListener("click", () => { showScreen("lesson"); });
      document.getElementById("homeBtn").addEventListener("click", () => showScreen("home"));
    }
  </script>
</body>

</html>
