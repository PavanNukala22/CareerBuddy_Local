<!DOCTYPE html>
<html lang="en">
<head><script src="/static/js/content-protection.js?v=2" data-cb-protect></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude Code Guide — Tech Center</title>
<link rel="stylesheet" href="/theme-cbuddy.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#161c27;
    --ink-soft:#4a5568;
    --paper:#f1f3ff;
    --lav:#f9f9ff;
    --card:#ffffff;
    --line:#e2e8f0;
    --line-2:#dde2f3;
    --navy:#14213D;
    --navy-soft:#0b1526;
    --clay:#FCA311;
    --clay-soft:#fdeecb;
    --gold:#7a5c00;
    --green:#38a169;
    --green-bg:#e9f7ef;
    --red:#e53e3e;
    --red-bg:#fdecec;
    --radius:8px;
    --radius-lg:14px;
    --serif: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    --sans: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    --mono: 'JetBrains Mono', "Liberation Mono", Menlo, monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:var(--sans);
    background:var(--lav);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}

  /* ===== Breadcrumb ===== */
  .crumbs{
    max-width:1400px;margin:0 auto;padding:18px 28px 10px;
    font-size:13px;color:var(--ink-soft);display:flex;gap:8px;align-items:center;
  }
  .crumbs b{color:var(--ink);font-weight:600;}
  .crumbs .sep{opacity:.5;}

  /* ===== Shell ===== */
  .shell{
    max-width:1400px;margin:0 auto 60px;background:var(--card);
    border-radius:16px;border:1px solid var(--line);
    box-shadow:0 1px 2px rgba(20,16,8,.03), 0 12px 32px -20px rgba(20,16,8,.18);
    overflow:hidden;
  }

  /* ===== Header ===== */
  .head{
    display:flex;align-items:center;justify-content:space-between;
    padding:20px 28px;border-bottom:1px solid var(--line);
    flex-wrap:wrap;gap:14px;
  }
  .head-left{display:flex;align-items:center;gap:14px;}
  .badge-cc{
    width:44px;height:44px;border-radius:11px;
    background:linear-gradient(155deg,var(--navy),var(--navy-soft));
    color:var(--clay);display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:16px;letter-spacing:.02em;
    box-shadow:0 4px 10px -4px rgba(20,33,61,.5);
  }
  .head-title{font-family:var(--serif);font-size:23px;font-weight:700;line-height:1.1;}
  .head-sub{font-family:var(--mono);font-size:12px;color:var(--ink-soft);margin-top:3px;}
  .head-right{display:flex;align-items:center;gap:10px;}
  .pill{
    display:inline-flex;align-items:center;gap:7px;
    padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;
    border:1px solid var(--line);background:var(--paper);
  }
  .pill .dot{width:7px;height:7px;border-radius:50%;background:var(--green);}
  .btn{
    padding:8px 16px;border-radius:8px;border:1px solid var(--line);
    background:var(--paper);font-size:13px;font-weight:600;cursor:pointer;
    color:var(--ink);
  }
  .btn:hover{background:var(--paper);}
  .btn.primary{background:var(--navy);color:#fff;border-color:var(--navy);}
  .btn.primary:hover{background:var(--navy-soft);}

  /* ===== Tabs ===== */
  .tabbar{
    display:flex;flex-wrap:nowrap;border-bottom:1px solid var(--line);
    background:var(--paper);padding:8px;gap:6px;justify-content:space-between;
  }
  .tab{
    display:flex;align-items:center;gap:5px;white-space:nowrap;
    padding:10px 8px;font-size:12.3px;font-weight:600;color:var(--ink-soft);
    cursor:pointer;border-radius:8px;user-select:none;
    flex:1 1 0;justify-content:center;min-width:0;
    transition:color .15s ease,background-color .15s ease;
  }
  .tab span:not(.count){overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tab:hover{color:var(--ink);background:var(--paper);}
  .tab.active{color:#fff;background:var(--navy);font-weight:700;}
  .tab.active:hover{color:#fff;background:var(--navy);}
  .tab .count{
    font-size:10px;font-weight:700;color:var(--ink-soft);background:var(--paper);
    padding:1px 6px;border-radius:999px;flex-shrink:0;
  }
  .tab.active .count{background:rgba(255,255,255,.2);color:#fff;}
  .tab.assessment{color:var(--gold);}
  .tab.assessment.active{color:#fff;}
  @media (max-width:960px){
    .tabbar{overflow-x:auto;justify-content:flex-start;}
    .tab{flex:0 0 auto;padding:10px 14px;}
  }

  /* ===== Body layout ===== */
  .body{display:flex;align-items:flex-start;}
  .sidebar{
    width:250px;flex-shrink:0;border-right:1px solid var(--line);
    background:var(--paper);min-height:520px;padding:20px 14px;
    position:sticky;top:0;
  }
  .sidebar-title{
    font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--ink-soft);
    padding:4px 10px 10px;
  }
  .side-link{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:9px 10px;border-radius:8px;font-size:13.5px;color:var(--ink-soft);
    cursor:pointer;line-height:1.3;
  }
  .side-link:hover{background:var(--paper);color:var(--ink);}
  .side-link.active{background:var(--navy);color:#fff;font-weight:600;}
  .side-link .lvl{
    font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:5px;
    background:var(--paper);color:var(--ink-soft);flex-shrink:0;
  }
  .side-link.active .lvl{background:rgba(255,255,255,.18);color:#fff;}
  .lvl.beg{background:var(--green-bg);color:var(--green);}
  .lvl.int{background:var(--clay-soft);color:var(--gold);}
  .lvl.adv{background:var(--red-bg);color:var(--red);}
  .side-link.active .lvl.beg,.side-link.active .lvl.int,.side-link.active .lvl.adv{background:rgba(255,255,255,.2);color:#fff;}

  .content{flex:1;min-width:0;padding:38px 46px 60px;}
  .content h1{
    font-family:var(--serif);font-size:34px;margin:0 0 10px;line-height:1.15;
  }
  .content > .lede{font-size:16px;color:var(--ink-soft);max-width:640px;margin:0 0 30px;line-height:1.6;}

  .section{margin-bottom:44px;padding-top:6px;scroll-margin-top:20px;}
  .section-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
  .section h2{font-family:var(--serif);font-size:22px;margin:0;}
  .level-tag{
    font-size:10.5px;font-weight:700;letter-spacing:.03em;padding:3px 9px;border-radius:6px;
  }
  .level-tag.beg{background:var(--green-bg);color:var(--green);}
  .level-tag.int{background:var(--clay-soft);color:var(--gold);}
  .level-tag.adv{background:var(--red-bg);color:var(--red);}
  .section p{font-size:15px;line-height:1.7;color:var(--ink-soft);margin:0 0 14px;max-width:720px;}
  .section ul, .section ol{margin:0 0 14px;padding-left:20px;max-width:700px;}
  .section li{font-size:15px;line-height:1.7;color:var(--ink-soft);margin-bottom:6px;}
  .section code, code.inline{
    font-family:var(--mono);background:var(--paper);padding:2px 6px;border-radius:5px;font-size:13px;color:var(--gold);
  }
  pre{
    background:var(--navy-soft);color:#e5e9f0;padding:14px 16px;border-radius:9px;
    font-family:var(--mono);font-size:12.8px;overflow-x:auto;margin:0 0 14px;line-height:1.6;
    max-width:760px;
  }
  pre .cmt{color:#7c8aa8;}
  .callout{
    border:1px solid var(--line);background:var(--lav);border-radius:10px;
    padding:14px 16px;font-size:14px;color:var(--ink-soft);max-width:700px;margin:0 0 16px;
    display:flex;gap:10px;line-height:1.6;
  }
  .callout .ic{flex-shrink:0;font-weight:700;color:var(--navy);}
  .callout.tip{background:var(--green-bg);border-color:var(--green);}
  .callout.tip .ic{color:var(--green);}
  .callout.warn{background:var(--clay-soft);border-color:var(--clay);}
  .callout.warn .ic{color:var(--gold);}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:760px;margin:0 0 16px;}
  @media (max-width:760px){.grid2{grid-template-columns:1fr;}}
  .minicard{border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:var(--paper);}
  .minicard h4{margin:0 0 6px;font-size:14px;font-family:var(--sans);}
  .minicard p{margin:0;font-size:13.3px;color:var(--ink-soft);}

  table.ref{border-collapse:collapse;width:100%;max-width:760px;margin:0 0 16px;font-size:13.5px;}
  table.ref th{text-align:left;padding:9px 12px;background:var(--paper);border:1px solid var(--line);font-size:12px;color:var(--ink-soft);}
  table.ref td{padding:9px 12px;border:1px solid var(--line);vertical-align:top;}
  table.ref td code{white-space:nowrap;}

  .synergy-card{
    border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:0 0 16px;max-width:760px;
    background:var(--paper);
  }
  .synergy-title{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;margin-bottom:6px;}
  .synergy-title .n{
    width:24px;height:24px;border-radius:7px;background:var(--navy);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;
  }
  .synergy-combo{display:flex;align-items:center;gap:8px;font-size:12.5px;font-family:var(--mono);color:var(--clay);margin-bottom:8px;flex-wrap:wrap;}
  .synergy-combo .plus{color:var(--ink-soft);}
  .synergy-card p{margin:0;font-size:14px;}

  /* ===== Assessment (full-screen paged, Career Buddy pattern) ===== */
  .assess-overlay{
    display:none;
    position:fixed; inset:0; z-index:1000;
    background:var(--lav);
    overflow-y:auto;
    padding:32px 24px 100px;
  }
  .assess-overlay.show{ display:block; }
  .assess-card{
    max-width:760px; margin:0 auto;
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius-lg);
    box-shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06);
    overflow:hidden;
  }
  .assess-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:22px 26px 18px; gap:14px;
  }
  .assess-head-left{display:flex;align-items:center;gap:11px;}
  .assess-head-left svg{width:20px;height:20px;color:var(--gold);flex-shrink:0;}
  .assess-head-left h3{margin:0;font-size:19px;font-weight:700;color:var(--ink);}
  .assess-close{
    width:32px;height:32px;border-radius:999px;border:1px solid var(--line);
    background:var(--paper);color:var(--ink-soft);display:flex;align-items:center;justify-content:center;
    cursor:pointer;flex-shrink:0;
  }
  .assess-close:hover{background:var(--line);color:var(--ink);}
  .assess-close svg{width:15px;height:15px;}
  .assess-progress-track{height:6px;background:var(--paper);}
  .assess-progress-fill{height:100%;background:var(--clay);width:0%;transition:width .25s ease;}
  .assess-meta{
    display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;
    padding:16px 26px 0;
  }
  .assess-count{font-size:13px;font-weight:600;color:var(--ink-soft);}
  .assess-badges{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .assess-pill{font-size:11px;font-weight:700;letter-spacing:.03em;padding:5px 12px;border-radius:999px;white-space:nowrap;}
  .assess-pill.topic{background:rgba(20,33,61,.08);color:var(--navy);}
  .assess-pill.type{background:var(--clay-soft);color:var(--gold);}
  .assess-body{padding:18px 26px 6px;}
  .assess-q{font-size:17px;font-weight:600;line-height:1.5;margin:0 0 18px;color:var(--ink);}
  .assess-foot{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:18px 26px 28px;
  }
  .assess-nav-btn{
    padding:10px 18px;border-radius:8px;border:1px solid var(--line);background:var(--card);
    font-size:13.5px;font-weight:600;cursor:pointer;color:var(--ink);font-family:var(--sans);
  }
  .assess-nav-btn:hover:not(:disabled){border-color:var(--clay);}
  .assess-nav-btn:disabled{opacity:.4;cursor:default;}
  .assess-nav-btn.primary{background:var(--navy);border-color:var(--navy);color:#fff;}
  .assess-nav-btn.primary:hover:not(:disabled){background:var(--clay);border-color:var(--clay);color:var(--navy);}

  .opt-list{display:flex;flex-direction:column;gap:10px;margin-bottom:16px;}
  .opt-btn{
    display:block; width:100%; text-align:left;
    padding:13px 16px; border:1px solid var(--line); border-radius:9px;
    cursor:pointer; font-size:14.5px; background:var(--card); color:var(--ink);
    font-family:var(--sans);
  }
  .opt-btn:hover:not(:disabled){border-color:var(--clay);}
  .opt-btn:disabled{cursor:default;}
  .opt-btn.correct{background:var(--green-bg);border-color:#a7ddc0;color:#1f7a44;font-weight:600;}
  .opt-btn.incorrect{background:var(--red-bg);border-color:#f2b8b8;color:#c53030;font-weight:600;}

  .fill-line{font-size:15.5px;line-height:2.1;font-weight:600;margin-bottom:16px;color:var(--ink);}
  .fill-input{
    border:none;border-bottom:2px solid var(--clay);background:transparent;
    font-family:var(--mono);font-size:14.5px;padding:2px 6px;width:180px;color:var(--navy);font-weight:700;
    outline:none;
  }
  .fill-input:focus{border-bottom-color:var(--navy);}

  textarea.short-input{
    width:100%;min-height:100px;border:1px solid var(--line);border-radius:9px;
    padding:12px 14px;font-family:var(--sans);font-size:14.3px;resize:vertical;outline:none;
    margin-bottom:16px;
  }
  textarea.short-input:focus{border-color:var(--clay);}

  .qactions{display:flex;align-items:center;gap:12px;margin-top:-6px;margin-bottom:16px;}
  .feedback{
    margin:0 0 16px;padding:12px 14px;border-radius:9px;font-size:14px;line-height:1.6;display:none;
  }
  .feedback.show{display:block;}
  .feedback.correct{background:var(--green-bg);color:#1f7a44;}
  .feedback.incorrect{background:var(--red-bg);color:#c53030;}
  .feedback.neutral{background:var(--lav);color:var(--navy);}
  .feedback b{display:block;margin-bottom:3px;}

  .result-panel{
    border:1px solid var(--line);border-radius:14px;padding:28px 30px;
    background:linear-gradient(155deg,var(--navy),var(--navy-soft));color:#fff;margin:4px 0 22px;
  }
  .result-panel h3{font-family:var(--serif);font-size:24px;margin:0 0 6px;}
  .result-panel p{margin:0 0 16px;color:var(--line-2);font-size:14px;}
  .result-bars{display:flex;flex-direction:column;gap:10px;}
  .rbar-row{display:flex;align-items:center;gap:12px;font-size:13px;}
  .rbar-label{width:150px;flex-shrink:0;color:var(--line-2);}
  .rbar-track{flex:1;height:8px;background:rgba(255,255,255,.15);border-radius:99px;overflow:hidden;}
  .rbar-fill{height:100%;background:var(--clay);border-radius:99px;}
  .rbar-val{width:46px;text-align:right;font-weight:700;}
  .result-actions{display:flex;gap:12px;flex-wrap:wrap;}

  ::selection{background:var(--clay-soft);}

  @media (max-width:900px){
    .body{flex-direction:column;}
    .sidebar{width:100%;position:relative;border-right:none;border-bottom:1px solid var(--line);}
    .content{padding:28px 20px 50px;}
  }
</style>
<style>
/* CareerBuddy: sticky sidebar visible scrollbar */
.toc,.sidebar,.sidenav{scrollbar-width:thin;scrollbar-color:#cbd2e0 transparent}
.toc::-webkit-scrollbar,.sidebar::-webkit-scrollbar,.sidenav::-webkit-scrollbar{width:9px;height:9px}
.toc::-webkit-scrollbar-thumb,.sidebar::-webkit-scrollbar-thumb,.sidenav::-webkit-scrollbar-thumb{background:#cbd2e0;border-radius:8px}
.toc::-webkit-scrollbar-thumb:hover,.sidebar::-webkit-scrollbar-thumb:hover,.sidenav::-webkit-scrollbar-thumb:hover{background:#9aa4b8}
.toc::-webkit-scrollbar-track,.sidebar::-webkit-scrollbar-track,.sidenav::-webkit-scrollbar-track{background:transparent}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap">
<style>
/* -- Unify typography: Outfit everywhere (CareerBuddy) -- */
body,h1,h2,h3,h4,h5,h6,p,a,span,li,ul,ol,dl,dt,dd,td,th,div,section,article,header,footer,nav,aside,main,label,button,input,select,textarea,blockquote,figcaption,small,strong,b,em,i{font-family:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif !important}
.material-symbols-outlined,.material-icons{font-family:'Material Symbols Outlined','Material Icons' !important}
code,pre,kbd,samp,tt,.mono,[class*="mono"],[class*="Mono"],[class*="code"],[class*="Code"],[class*="tok"],[class*="hljs"]{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Consolas,monospace !important}
</style>
<style>
/* CareerBuddy: devops nav pill */
.tab .tab-icon,.tab-btn .tab-icon,.tab .tab-emoji,.tab-btn .tab-emoji,.tab .ico,.tab-btn .ico,.tab .tab-ico,.tab-btn .tab-ico,.tab .icon,.tab-btn .icon,.tab .emoji,.tab-btn .emoji{display:none !important}
.tab .tab-num,.tab-btn .tab-num,.tab .num,.tab-btn .num,.tab .tab-index,.tab-btn .tab-index{display:none !important}
.tab,.tab-btn{border-radius:8px !important;border-bottom:none !important}
.tab:not(.active),.tab-btn:not(.active){color:#4a5568 !important;background:transparent !important;transition:background .15s,color .15s}
.tab:not(.active):hover,.tab-btn:not(.active):hover{background:#eef1f7 !important;color:#14213D !important}
.tab.active:hover,.tab-btn.active:hover{background:#0b1526 !important}
.tab.active,.tab-btn.active,.tabbar .active,.tab-bar .active,.tabs .active,[role="tab"][aria-selected="true"]{
  background:#14213D !important;color:#fff !important;border-radius:8px !important;
  border-bottom-color:transparent !important;font-weight:700 !important}
.tab.active::after,.tab-btn.active::after{display:none !important}
.tab.active .tab-num,.tab.active .num,.tab-btn.active .num,.tab.active .count,.tab-btn.active .count{
  color:#fff !important;background:rgba(255,255,255,.2) !important}
</style>
<style>
/* CareerBuddy: full-stretch containers */
.shell,.wrap,.container,.layout,.main,.content,.doc,.page,.page-inner,.reading,.article,.main-content,.body-wrap{max-width:none !important}
</style>
<style>
/* CareerBuddy: full-bleed + sticky nav + tight tabs */
.wrap,.shell,.layout,.container,.doc,.page,.main-content{margin:0 !important;padding-top:0 !important;padding-left:0 !important;padding-right:0 !important}
.tabbar,.tabs{position:sticky !important;top:0 !important;z-index:45 !important;background:#fff !important}
.tabbar,.tabs,.tab-bar{gap:2px !important}
</style>
<style>
/* CareerBuddy: restore sticky (overflow fix) */
.shell,.wrap,.layout,.container,.app,.doc,.page,.grid,.body-wrap{overflow:visible !important}
</style>

<style>
/* Sticky section navigation — matches the uploaded reference */
.tabbar{
  position:sticky !important;
  top:0 !important;
  z-index:1000 !important;
  background:#fff !important;
  border-bottom:1px solid var(--line) !important;
}
.sidebar{
  position:sticky !important;
  top:64px !important;
  max-height:calc(100vh - 64px) !important;
  overflow-y:auto !important;
}
</style>
<style id="requested-sticky-header-remove-print">
/* Both header and tab row now sticky, stacked. Sidebar offset computed by JS below. */
.head{position:sticky !important;top:0 !important;z-index:1001 !important;background:#fff !important;}
.tabbar{position:sticky !important;top:var(--head-h,64px) !important;z-index:1000 !important;background:#fff !important;}
.sidebar{position:sticky !important;top:var(--stack-h,120px) !important;max-height:calc(100vh - var(--stack-h,120px)) !important;overflow-y:auto !important;}
</style>
<style id="assess-btn-color">
#startAssessBtn,#startReferenceAssessment,.assessment-cta,.assess-start-btn,button[onclick*="__mockExamStart"]:not(.tab){background:#14213D !important;color:#fff !important;border:1px solid #14213D !important}
#startAssessBtn:hover,#startReferenceAssessment:hover,.assessment-cta:hover,.assess-start-btn:hover,button[onclick*="__mockExamStart"]:not(.tab):hover{background:#0b1526 !important;color:#fff !important}
</style>
<style id="hide-nav-count">.tabbar .tab .count,#tabbar .tab .count{display:none !important}</style>
<style>
/* sidebar-unify — navy active items + no rainbow bar (match course UI) */
.toc-progress, .side-progress, .rail-progress { background:#14213D !important; background-image:none !important; }

const DATA = {
"getting-started": {
  label:"Getting Started",
  lede:"Claude Code is Anthropic's agentic coding tool — it reads your codebase, edits files, runs commands, and works alongside your existing tools from the terminal, an IDE, a desktop app, or the browser.",
  sections:[
    {id:"what-is", title:"What is Claude Code?", level:"beg",
     body:`
      <p>Claude Code is an AI coding assistant that goes beyond autocomplete. Instead of just suggesting a line of code, it can understand your whole project, plan an approach, edit multiple files, run your test suite, and even open a pull request — all from a conversation.</p>
      <p>It runs on several surfaces that share the same underlying engine, so your project settings, instructions, and connected tools carry over no matter where you work:</p>
      <div class="grid2">
        <div class="minicard"><h4>Terminal CLI</h4><p>The full-featured command-line experience. Most people start here.</p></div>
        <div class="minicard"><h4>IDE extensions</h4><p>VS Code and JetBrains plugins with inline diffs and plan review.</p></div>
        <div class="minicard"><h4>Desktop app</h4><p>A standalone app for visual diff review and parallel sessions.</p></div>
        <div class="minicard"><h4>Web / mobile</h4><p>Kick off long-running tasks from a browser or the Claude app.</p></div>
      </div>
      <div class="callout tip"><span class="ic">Tip</span> New learners should start with the Terminal CLI — every other surface builds on the same concepts you'll pick up there.</div>`},
    {id:"install", title:"Installation Methods", level:"beg",
     body:`
      <p>The recommended way to install Claude Code is the native installer, which keeps itself updated automatically.</p>
      <pre><span class="cmt"># macOS, Linux, or WSL</span>
curl -fsSL https://claude.ai/install.sh | bash

<span class="cmt"># Windows PowerShell</span>
irm https://claude.ai/install.ps1 | iex</pre>
      <p>Alternative install paths exist for teams with existing package workflows:</p>
      <table class="ref">
        <tr><th>Method</th><th>Command</th><th>Auto-updates?</th></tr>
        <tr><td>Homebrew</td><td><code>brew install --cask claude-code</code></td><td>No — run <code>brew upgrade</code></td></tr>
        <tr><td>WinGet</td><td><code>winget install Anthropic.ClaudeCode</code></td><td>No</td></tr>
        <tr><td>npm</td><td><code>npm install -g @anthropic-ai/claude-code</code></td><td>Depends on setup</td></tr>
        <tr><td>Linux packages</td><td><code>apt</code> / <code>dnf</code> / <code>apk</code></td><td>Varies</td></tr>
      </table>
      <p>IDE users can instead search "Claude Code" in the VS Code Extensions panel, or install the JetBrains plugin from the Marketplace (the JetBrains plugin still needs the CLI installed underneath it).</p>`},
    {id:"quickstart", title:"Quick Start Guide", level:"beg",
     body:`
      <p>Once installed, open a project folder and launch Claude Code:</p>
      <pre>cd your-project
claude</pre>
      <p>You'll be prompted to log in the first time. From there, a typical first session looks like this:</p>
      <ol>
        <li><b>Ask a question</b> — "What does this codebase do?" to get oriented.</li>
        <li><b>Make a small change</b> — describe a bug or feature in plain language.</li>
        <li><b>Review the diff</b> — Claude Code shows exactly what it plans to edit before writing.</li>
        <li><b>Run and verify</b> — ask it to run tests or start the app to confirm the change works.</li>
        <li><b>Commit</b> — "commit this with a descriptive message" hands off the git workflow too.</li>
      </ol>
      <div class="callout"><span class="ic">Note</span> Claude Code asks for permission before running commands or editing files unless you've changed its permission mode — see Core Features for the full picture.</div>`},
    {id:"commands", title:"Essential Commands", level:"beg",
     body:`
      <table class="ref">
        <tr><th>Command</th><th>What it does</th></tr>
        <tr><td><code>claude</code></td><td>Start an interactive session in the current directory</td></tr>
        <tr><td><code>claude "prompt"</code></td><td>Start a session with an initial instruction</td></tr>
        <tr><td><code>claude -p "prompt"</code></td><td>Run once, non-interactively, and print the result</td></tr>
        <tr><td><code>/mcp</code></td><td>View and manage connected MCP servers</td></tr>
        <tr><td><code>/memory</code></td><td>View or edit what Claude Code remembers about this project</td></tr>
        <tr><td><code>/hooks</code></td><td>View configured hooks</td></tr>
        <tr><td><code>/status</code></td><td>Check your account, model, and active configuration</td></tr>
      </table>
      <p>Claude Code also composes well with the shell — pipe logs into it, run it inside CI, or chain it with other tools:</p>
      <pre>tail -200 app.log | claude -p "flag anything unusual"</pre>`},
    {id:"whats-new", title:"What's New", level:"int",
     body:`
      <p>Recent releases have focused on scaling Claude Code from a single assistant into a small engineering team you direct. A few highlights worth knowing as a baseline:</p>
      <ul>
        <li><b>Agent teams</b> — multiple named teammates working in parallel on one task, coordinated by a lead agent.</li>
        <li><b>Routines</b> — cloud-scheduled tasks that keep running even when your laptop is closed.</li>
        <li><b>Workflows</b> — Claude Code can write and save a reusable multi-step script for a repeated job, like "fix lint errors in every file."</li>
        <li><b>Remote Control</b> — pick up a local session from your phone or another device.</li>
      </ul>
      <p>These are covered in more depth in Tool Synergies and Platforms & Integrations.</p>`}
  ]
},

"core-concepts": {
  label:"Core Concepts",
  lede:"Before customizing Claude Code, it helps to understand the mental model underneath it: the agentic loop, what Claude can see, and how a session manages its own memory.",
  sections:[
    {id:"agentic-loop", title:"The Agentic Loop", level:"beg",
     body:`
      <p>Claude Code doesn't just respond once — it works in a loop. Given a task, it reasons about what to do, calls a tool (read a file, run a command, edit code), observes the result, and decides the next step. This repeats until the task is done or it needs your input.</p>
      <div class="callout"><span class="ic">Think of it as</span> a developer who talks through their plan out loud, tries something, checks whether it worked, and adjusts — rather than a single autocomplete guess.</div>
      <p>Two things drive this loop: the underlying <b>model</b> (its reasoning) and the <b>tools</b> available to it (Read, Write, Edit, Bash, and any MCP tools you've connected).</p>`},
    {id:"access", title:"What Claude Can Access", level:"beg",
     body:`
      <p>By default, Claude Code can read and edit files inside your working directory, run shell commands, and search the web. It cannot reach outside that project folder unless you explicitly grant an additional directory, and every meaningful action is gated by your permission settings.</p>`},
    {id:"environments", title:"Environments and Interfaces", level:"int",
     body:`
      <p>A <b>surface</b> is where you interact with Claude Code (terminal, IDE, desktop, web). An <b>execution environment</b> is where its commands actually run — your local machine, a cloud sandbox, or a self-hosted runner. You can start a session locally and later move it to the cloud, or the reverse, without losing context.</p>`},
    {id:"sessions", title:"Working With Sessions", level:"int",
     body:`
      <p>A session is a single ongoing conversation and its history. Sessions can be:</p>
      <ul>
        <li><b>Resumed</b> — pick a previous session back up, including its working state.</li>
        <li><b>Forked</b> — branch off an existing session to try an alternate approach without losing the original.</li>
        <li><b>Named</b> — give a session a memorable label so it's easy to find later.</li>
      </ul>
      <p>Run <code>claude --resume</code> or use the in-session session picker to jump back into earlier work.</p>`},
    {id:"context-window", title:"The Context Window", level:"int",
     body:`
      <p>Everything Claude Code has "read" so far — your prompts, file contents, tool results — lives in its context window. Context windows are large but finite. As a session grows, Claude Code monitors usage and, when space runs low, performs <b>compaction</b>: it summarizes older parts of the conversation to free up room while preserving what matters.</p>
      <div class="callout warn"><span class="ic">Watch for</span> long sessions that touch many large files. Managing context proactively — using subagents for exploration, or starting a fresh session for a new task — keeps responses sharp and reduces cost.</div>`},
    {id:"memory", title:"CLAUDE.md and Auto Memory", level:"int",
     body:`
      <p><code>CLAUDE.md</code> is a markdown file at your project root that Claude Code reads at the start of every session. Use it for anything you'd tell a new teammate on day one: coding conventions, architecture notes, preferred libraries, and review checklists.</p>
      <pre><span class="cmt"># CLAUDE.md</span>
- Use TypeScript strict mode
- Prefer functional React components
- Run npm test before proposing a commit</pre>
      <p>Separately, <b>auto memory</b> lets Claude Code save its own learnings across sessions — things it discovered by working in your codebase — without you writing anything. You can review and edit what it has saved with <code>/memory</code>.</p>`},
    {id:"checkpoints", title:"Checkpoints & Permissions", level:"adv",
     body:`
      <p>Every file edit Claude Code makes is tracked as a checkpoint, so you can rewind to an earlier state if a change goes the wrong direction — a safety net that sits alongside, not instead of, git. Combined with a permission mode that fits the task, checkpoints let you loosen the reins (auto-accepting edits, for instance) while keeping an easy way back.</p>`}
  ]
},

"using-claude-code": {
  label:"Using Claude Code",
  lede:"Practical patterns for day-to-day work: how to phrase requests, structure a session, and avoid the most common failure modes.",
  sections:[
    {id:"workflows", title:"Common Workflows", level:"beg",
     body:`
      <p>A few request patterns cover most day-to-day usage:</p>
      <div class="grid2">
        <div class="minicard"><h4>Understand a codebase</h4><p>"Give me a quick overview of how auth works here."</p></div>
        <div class="minicard"><h4>Fix a bug</h4><p>Paste the error message or describe the symptom — Claude Code traces it to the cause.</p></div>
        <div class="minicard"><h4>Refactor</h4><p>Describe the target shape; ask it to keep behavior identical and run tests after.</p></div>
        <div class="minicard"><h4>Open a PR</h4><p>"Commit this and open a PR with a summary of the change."</p></div>
      </div>`},
    {id:"plan-first", title:"Explore, Then Plan, Then Code", level:"int",
     body:`
      <p>For anything non-trivial, it helps to separate exploration from execution. Ask Claude Code to investigate and propose an approach first — this is what <b>plan mode</b> is for. It reviews the codebase and shares a plan for your approval before touching any files, which catches misunderstandings early and cheaply.</p>`},
    {id:"steer", title:"It's a Conversation", level:"beg",
     body:`
      <p>You can interrupt Claude Code mid-task to redirect it — you don't have to wait for it to finish before correcting course. Course-correcting early, rather than letting a wrong approach run to completion, is one of the highest-leverage habits for working efficiently.</p>`},
    {id:"delegate", title:"Delegate, Don't Dictate", level:"int",
     body:`
      <p>The more effective pattern is describing the outcome you want and letting Claude Code figure out the mechanics, rather than specifying every step yourself. "Add rate limiting to the API" tends to work better than dictating exact function names and line numbers — save that precision for cases where you genuinely need a specific implementation.</p>`},
    {id:"prompt-library", title:"Prompt Recipes", level:"int",
     body:`
      <p>Some phrasing patterns consistently produce better results:</p>
      <ul>
        <li><b>Ask for verification</b>: "...and run the tests afterward" gives Claude Code a way to check its own work.</li>
        <li><b>Reference files directly</b>: <code>@path/to/file.ts</code> pulls a file into context precisely, instead of describing it.</li>
        <li><b>Scope large jobs</b>: "audit every file under <code>src/api</code> for missing error handling" is more reliable than an unscoped "check the codebase."</li>
      </ul>`},
    {id:"best-practices", title:"Best Practices", level:"adv",
     body:`
      <p>A few habits separate efficient Claude Code usage from frustrating usage:</p>
      <ul>
        <li><b>Give Claude a way to verify its work</b> — tests, linters, or a running app it can check against.</li>
        <li><b>Manage context aggressively</b> — start fresh sessions for unrelated tasks rather than letting one session sprawl.</li>
        <li><b>Use subagents for investigation</b> — delegate open-ended research to a subagent so it doesn't fill your main context.</li>
        <li><b>Add an adversarial review step</b> — for high-stakes changes, ask a second pass to actively look for what's wrong with the first.</li>
        <li><b>Automate at scale</b> — non-interactive mode (<code>claude -p</code>) and parallel sessions let you fan a repeated task out across many files or repos.</li>
      </ul>`}
  ]
},

"core-features": {
  label:"Core Features",
  lede:"The building blocks you'll customize and combine as you go from casual use to a tailored setup: skills, hooks, subagents, plugins, permissions, and checkpoints.",
  sections:[
    {id:"permission-modes", title:"Permission Modes", level:"beg",
     body:`
      <p>Permission modes control how much Claude Code asks before acting:</p>
      <table class="ref">
        <tr><th>Mode</th><th>Behavior</th></tr>
        <tr><td><b>Default</b></td><td>Asks before file edits and commands</td></tr>
        <tr><td><b>Plan</b></td><td>Investigates and proposes a plan before any changes</td></tr>
        <tr><td><b>Accept edits</b></td><td>Auto-approves file edits, still asks before running commands</td></tr>
        <tr><td><b>Auto</b></td><td>A classifier auto-approves routine, low-risk actions</td></tr>
        <tr><td><b>Bypass permissions</b></td><td>Skips checks entirely — use only in trusted, sandboxed environments</td></tr>
      </table>`},
    {id:"skills", title:"Skills", level:"int",
     body:`
      <p>A skill packages a repeatable workflow — instructions, and optionally supporting files — that Claude Code can invoke by name, like <code>/review-pr</code> or <code>/deploy-staging</code>. Skills let a team encode "how we do X here" once and reuse it, instead of re-explaining the process in every conversation.</p>
      <p>Skills live in a project's <code>.claude/skills</code> directory (or your user-level config for personal skills) and are auto-discovered — Claude Code decides when a skill is relevant based on its description, similar to how it decides when to search documentation.</p>`},
    {id:"hooks", title:"Hooks", level:"adv",
     body:`
      <p>Hooks run a shell command automatically at specific points in the loop — before a tool runs, after a file changes, when a session starts, and more. Common uses: auto-formatting code after every edit, blocking edits to protected files, or re-injecting project context after the conversation compacts.</p>
      <pre><span class="cmt">// .claude/settings.json (excerpt)</span>
{
  "hooks": {
    "PostToolUse": [{ "matcher": "Edit", "command": "prettier --write $FILE" }]
  }
}</pre>`},
    {id:"subagents", title:"Subagents", level:"adv",
     body:`
      <p>A subagent is a separate Claude Code instance with its own context window, dispatched by the main session to investigate or execute a slice of work. Because a subagent's exploration doesn't consume the main conversation's context, this is the standard way to keep a long session efficient — for example, delegating "find every place this function is called" to a subagent instead of doing it inline.</p>`},
    {id:"plugins", title:"Plugins", level:"adv",
     body:`
      <p>A plugin bundles skills, hooks, MCP servers, and other components into a single installable package, distributed through a marketplace. Where a skill solves one workflow, a plugin can ship an entire toolkit — for instance, a security-review plugin that adds scanning skills, a background monitor, and its own MCP server together.</p>`},
    {id:"checkpointing", title:"Checkpointing", level:"int",
     body:`
      <p>Claude Code automatically tracks file changes as it makes them, so you can rewind the conversation and the filesystem together to an earlier point — useful when an approach turns out to be wrong several steps in. Checkpointing complements git; it isn't a replacement for committing your work.</p>`}
  ]
},

"platforms": {
  label:"Platforms & Integrations",
  lede:"Claude Code meets you where you already work — in CI/CD pipelines, chat tools, and the browser — not just in a terminal window.",
  sections:[
    {id:"surfaces", title:"Where to Run Claude Code", level:"beg",
     body:`
      <table class="ref">
        <tr><th>Surface</th><th>Best for</th></tr>
        <tr><td>Terminal CLI</td><td>Full control, scripting, CI</td></tr>
        <tr><td>VS Code / JetBrains</td><td>Inline diffs without leaving the editor</td></tr>
        <tr><td>Desktop app</td><td>Visual diff review, multiple parallel sessions</td></tr>
        <tr><td>Web (claude.ai/code)</td><td>Kick off long tasks with no local setup</td></tr>
        <tr><td>Mobile app</td><td>Monitor and steer cloud sessions on the go</td></tr>
      </table>`},
    {id:"github", title:"GitHub Actions & Code Review", level:"int",
     body:`
      <p>Claude Code can run inside GitHub Actions to automatically review pull requests, respond to <code>@claude</code> mentions in issue comments, or run a scheduled maintenance skill. Set-up is a guided <code>/install-github-app</code> flow that installs the GitHub App and adds a starter workflow file.</p>
      <p>Code Review, a related feature, posts inline severity-rated findings on every pull request automatically, tunable with a <code>REVIEW.md</code> file the same way <code>CLAUDE.md</code> tunes a session.</p>`},
    {id:"gitlab", title:"GitLab CI/CD", level:"int",
     body:`
      <p>A comparable integration exists for GitLab: Claude Code responds to <code>@claude</code> mentions on issues and merge requests, turning an issue directly into an MR. It works with self-hosted GitLab as well as GitLab.com, including through Amazon Bedrock or Google Cloud's Agent Platform for organizations that route model traffic through those providers.</p>`},
    {id:"slack", title:"Slack", level:"int",
     body:`
      <p>Mentioning <code>@Claude</code> in a connected Slack channel starts a Claude Code session scoped to a chosen repository. It's a convenient way to route a bug report straight into a pull request without anyone opening a terminal — useful for non-engineers filing issues or for triage during on-call.</p>`},
    {id:"chrome", title:"Claude in Chrome", level:"adv",
     body:`
      <p>The Chrome extension lets Claude Code see and interact with a real browser: testing a local web app end-to-end, reading console logs while debugging, filling out forms, or extracting data from a page. This closes the loop for frontend work — Claude Code can make a change and then visually verify it rendered correctly.</p>`},
    {id:"remote", title:"Remote Control & Mobile", level:"adv",
     body:`
      <p>Remote Control lets you pick up a running local session from your phone or another device and keep steering it — useful when you need to approve a step or answer a question while away from your desk. It requires a Claude subscription and a full-scope login.</p>`}
  ]
},

"tool-synergies": {
  label:"Tool Synergies",
  lede:"Individual features are useful on their own, but Claude Code's advanced users get most of their leverage by combining them. Here are proven pairings, roughly ordered from foundational to advanced.",
  sections:[
    {id:"synergy-grid", title:"Feature Combinations Worth Knowing", level:"adv",
     body:`
      <div class="synergy-card"><div class="synergy-title"><span class="n">1</span>Skills + Subagents</div>
        <div class="synergy-combo">Skills <span class="plus">+</span> Subagents</div>
        <p>Run a skill inside a dedicated subagent so its exploration and tool calls stay off the main conversation's context — ideal for research-heavy skills.</p></div>

      <div class="synergy-card"><div class="synergy-title"><span class="n">2</span>Hooks + Permission Modes</div>

const TOPIC_ORDER = ["getting-started","core-concepts","using-claude-code","core-features","platforms","tool-synergies","build-sdk","reference"];

/* =========================================================
   QUIZ DATA
   ========================================================= */
const QUIZ = [];

/* =========================================================
   STATE
   ========================================================= */
let state = {
  activeTopic: "getting-started",
  visited: JSON.parse(localStorage.getItem("cc_visited")||"[]"),
  quizAnswers: {}, // qIndex -> {submitted, correct}
  quizIndex: 0,
  quizShowingResults: false,
};

function saveVisited(){ localStorage.setItem("cc_visited", JSON.stringify(state.visited)); }

function markVisited(topic){
  if(!state.visited.includes(topic)){
    state.visited.push(topic);
    saveVisited();
    updateProgress();
  }
}

function updateProgress(){
  const total = TOPIC_ORDER.length + 1; // +1 for assessment
  const done = state.visited.length;
  const pct = Math.round((done/total)*100);
  document.getElementById("progressLabel").textContent = pct + "% complete";
}

/* =========================================================
   RENDER: TABS
   ========================================================= */
function renderTabs(){
  const bar = document.getElementById("tabbar");
  bar.innerHTML = "";
  TOPIC_ORDER.forEach(key=>{
    const d = DATA[key];
    const tab = document.createElement("div");
    tab.className = "tab" + (state.activeTopic===key ? " active":"");
    tab.title = d.label;
    tab.innerHTML = `<span>${d.label}</span> <span class="count">${d.sections.length}</span>`;
    tab.onclick = ()=>{
      state.activeTopic = key;
      // Start the newly selected topic from the beginning so its first
      // sidebar sub-topic is visible instead of retaining the previous scroll position.
      window.scrollTo({top:0, behavior:"smooth"});
      render();
      requestAnimationFrame(()=>{
        const sidebar = document.getElementById("sidebar");
        if(sidebar) sidebar.scrollTop = 0;
        const firstLink = sidebar && sidebar.querySelector(".side-link");
        if(firstLink) firstLink.classList.add("active");
      });
    };
    bar.appendChild(tab);
  });
  const qtab = document.createElement("div");
  qtab.className = "tab assessment";
  qtab.title = "Assessment";
  qtab.innerHTML = `<span>📝 Assessment</span> <span class="count">${QUIZ.length}</span>`;
  qtab.onclick = openAssessment;
  bar.appendChild(qtab);
}

/* =========================================================
   RENDER: SIDEBAR + CONTENT for topic
   ========================================================= */
function levelTag(lvl){
  const map = {beg:["Beginner","beg"], int:["Intermediate","int"], adv:["Advanced","adv"]};
  const [label,cls] = map[lvl];
  return `<span class="level-tag ${cls}">${label}</span>`;
}
function levelPill(lvl){
  const map = {beg:"Beg", int:"Int", adv:"Adv"};
  return `<span class="lvl ${lvl}">${map[lvl]}</span>`;
}

function renderTopic(key){
  markVisited(key);
  const d = DATA[key];
  const sidebar = document.getElementById("sidebar");
  sidebar.innerHTML = `<div class="sidebar-title">${d.label.toUpperCase()}</div>` +
    d.sections.map(s=>`<div class="side-link" data-target="${s.id}"><span>${s.title}</span>${levelPill(s.level)}</div>`).join("");

  sidebar.querySelectorAll(".side-link").forEach(el=>{
    el.onclick = ()=>{
      document.getElementById(el.dataset.target).scrollIntoView({behavior:"smooth", block:"start"});
    };
  });

  const content = document.getElementById("content");
  content.innerHTML = `
    <h1>${d.label}</h1>
    <p class="lede">${d.lede}</p>
    ${d.sections.map(s=>`
      <div class="section" id="${s.id}">
        <div class="section-head"><h2>${s.title}</h2>${levelTag(s.level)}</div>
        ${s.body}
      </div>
    `).join("")}
  `;

  // scroll spy
  const obs = new IntersectionObserver((entries)=>{
    entries.forEach(e=>{
      if(e.isIntersecting){
        sidebar.querySelectorAll(".side-link").forEach(l=>l.classList.remove("active"));
        const link = sidebar.querySelector(`.side-link[data-target="${e.target.id}"]`);
        if(link) link.classList.add("active");
      }
    });
  }, {rootMargin:"-20% 0px -70% 0px"});
  content.querySelectorAll(".section").forEach(s=>obs.observe(s));
}

/* =========================================================
   ASSESSMENT — full-screen paged card (Career Buddy pattern)
   ========================================================= */
const assessOverlay = document.getElementById("assessOverlay");
const assessProgressFill = document.getElementById("assessProgressFill");
const assessCount = document.getElementById("assessCount");
const assessBadges = document.getElementById("assessBadges");
const assessBody = document.getElementById("assessBody");
const assessFoot = document.getElementById("assessFoot");
const assessPrevBtn = document.getElementById("assessPrevBtn");
const assessNextBtn = document.getElementById("assessNextBtn");

function openAssessment(){if(window.__mockExamStart)return window.__mockExamStart();
  markVisited("assessment");
  state.quizIndex = 0;
  state.quizShowingResults = false;
  assessOverlay.classList.add("show");
  document.body.style.overflow = "hidden";
  renderAssessStep();
}
function closeAssessment(){
  assessOverlay.classList.remove("show");
  document.body.style.overflow = "";
}
document.getElementById("assessCloseBtn").onclick = closeAssessment;

function typeLabel(type){
  return type==="mcq" ? "CHOOSE ANSWER" : type==="fill" ? "FILL IN THE BLANK" : "SHORT ANSWER";
}

function computeScore(){
  let correctCount=0, attempted=0;
  const byType = {mcq:{c:0,t:0}, fill:{c:0,t:0}, short:{c:0,t:0}};
  QUIZ.forEach((q,i)=>{
    const a = state.quizAnswers[i];
    byType[q.type].t++;
    if(a && a.submitted){
      attempted++;
      if(a.correct){ correctCount++; byType[q.type].c++; }
    }
  });
  return {correctCount, attempted, total:QUIZ.length, byType};
}

function renderAssessStep(){
  if(state.quizShowingResults){ renderResultsStep(); return; }

  const i = state.quizIndex;
  const q = QUIZ[i];
  const total = QUIZ.length;

  assessProgressFill.style.width = (((i+1)/total)*100) + "%";
  assessCount.textContent = "Question " + (i+1) + " of " + total;
  assessBadges.innerHTML =
    `<span class="assess-pill topic">${q.topic.toUpperCase()}</span>` +
    `<span class="assess-pill type">${typeLabel(q.type)}</span>`;

  const answer = state.quizAnswers[i];
  const answered = !!(answer && answer.submitted);

  let bodyHtml = `<p class="assess-q">${q.type==="fill" ? "Fill in the blank:" : q.prompt}</p>`;

  if(q.type==="mcq"){
    bodyHtml += `<div class="opt-list" id="optList">` +
      q.options.map((opt,oi)=>{
        let cls = "opt-btn";
        if(answered){
          if(oi===q.correct) cls += " correct";
          else if(answer.selected===oi) cls += " incorrect";
        }
        return `<button type="button" class="${cls}" data-i="${oi}" ${answered?"disabled":""}>${opt}</button>`;
      }).join("") + `</div>`;
  } else if(q.type==="fill"){
    const parts = q.prompt.split("___");
    bodyHtml += `<div class="fill-line">${parts[0]}<input type="text" class="fill-input" id="fillInput" placeholder="type answer" ${answered?"disabled":""} value="${answered ? (answer.value||"") : ""}">${parts[1]||""}</div>`;
    if(!answered) bodyHtml += `<div class="qactions"><button class="assess-nav-btn primary" id="checkBtn">Check Answer</button></div>`;
  } else {
    bodyHtml += `<textarea class="short-input" id="shortInput" placeholder="Write your answer here..." ${answered?"disabled":""}>${answered ? (answer.value||"") : ""}</textarea>`;
    if(!answered) bodyHtml += `<div class="qactions"><button class="assess-nav-btn primary" id="checkBtn">Submit Answer</button></div>`;
  }

  if(answered){
    if(q.type==="mcq"){
      bodyHtml += `<div class="feedback show ${answer.correct?"correct":"incorrect"}"><b>${answer.correct?"Correct!":"Not quite."}</b>${q.explain}</div>`;
    } else if(q.type==="fill"){
      bodyHtml += `<div class="feedback show ${answer.correct?"correct":"incorrect"}"><b>${answer.correct ? "Correct!" : "Not quite — accepted answer: " + q.answers[0]}</b>${q.explain}</div>`;
    } else {
      bodyHtml += `<div class="feedback show neutral"><b>${answer.correct ? "Nice — that touches the key idea." : "Recorded — compare with the model answer below."}</b><span style="opacity:.85">Model answer: ${q.model}</span></div>`;
    }
  }

  assessBody.innerHTML = bodyHtml;

  if(q.type==="mcq" && !answered){
    assessBody.querySelectorAll(".opt-btn").forEach(btn=>{
      btn.onclick = ()=> answerMCQ(i, parseInt(btn.dataset.i));
    });
  } else if(q.type==="fill" && !answered){
    document.getElementById("checkBtn").onclick = ()=> answerFill(i);
  } else if(q.type==="short" && !answered){
    document.getElementById("checkBtn").onclick = ()=> answerShort(i);
  }

  assessFoot.innerHTML = "";
  assessFoot.appendChild(assessPrevBtn);
  assessFoot.appendChild(assessNextBtn);
  assessPrevBtn.disabled = (i===0);
  assessNextBtn.textContent = (i===total-1) ? "Finish" : "Next";
  assessPrevBtn.onclick = ()=> goToStep(i-1);
  assessNextBtn.onclick = ()=>{
    if(i===total-1){ showResults(); } else { goToStep(i+1); }
  };

  assessOverlay.scrollTop = 0;
}

function goToStep(i){
  if(i<0 || i>=QUIZ.length) return;
  state.quizIndex = i;
  renderAssessStep();
}

function answerMCQ(i, selected){
  const q = QUIZ[i];
  const isCorrect = selected === q.correct;
  state.quizAnswers[i] = {submitted:true, correct:isCorrect, selected};
  renderAssessStep();
}

function answerFill(i){
  const q = QUIZ[i];
  const input = document.getElementById("fillInput");
  const val = input.value.trim();
  if(!val) return;
  const isCorrect = q.answers.some(a=>a.toLowerCase()===val.toLowerCase());
  state.quizAnswers[i] = {submitted:true, correct:isCorrect, value:val};
  renderAssessStep();
}

function answerShort(i){
  const q = QUIZ[i];
  const input = document.getElementById("shortInput");
  const val = input.value.trim();
  if(!val) return;
  const lower = val.toLowerCase();
  const hitCount = q.keywords.filter(k=>lower.includes(k)).length;
  const isCorrect = hitCount >= 1 && val.length > 25;
  state.quizAnswers[i] = {submitted:true, correct:isCorrect, value:val};
  renderAssessStep();
}

function showResults(){
  state.quizShowingResults = true;
  renderResultsStep();
}

function renderResultsStep(){
  const s = computeScore();
  const pct = s.attempted ? Math.round((s.correctCount/s.attempted)*100) : 0;

  function rowFor(type,label){
    const {c,t} = s.byType[type];
    const p = t ? Math.round((c/t)*100) : 0;
    return `<div class="rbar-row"><div class="rbar-label">${label}</div><div class="rbar-track"><div class="rbar-fill" style="width:${p}%"></div></div><div class="rbar-val">${c}/${t}</div></div>`;
  }

  let verdict = "Keep reviewing — revisit the sections tied to the questions you missed.";
  if(pct>=80) verdict = "Strong grasp of the material — you're ready for advanced workflows.";
  else if(pct>=50) verdict = "Solid start — a second pass over Core Features and Tool Synergies will help.";

  assessProgressFill.style.width = "100%";
  assessCount.textContent = "Results";
  assessBadges.innerHTML = "";

  assessBody.innerHTML = `
    <div class="result-panel">
      <h3>${s.attempted}/${s.total} answered · ${pct}% accuracy</h3>
      <p>${verdict}</p>
      <div class="result-bars">
        ${rowFor("mcq","Multiple Choice")}
        ${rowFor("fill","Fill in the Blank")}
        ${rowFor("short","Short Answer")}
      </div>
    </div>`;

  assessFoot.innerHTML = `
    <button type="button" class="assess-nav-btn" id="retakeBtn">↺ Retake Assessment</button>
    <button type="button" class="assess-nav-btn primary" id="exitBtn">Exit</button>
  `;
  document.getElementById("retakeBtn").onclick = ()=>{
    state.quizAnswers = {};
    state.quizIndex = 0;
    state.quizShowingResults = false;
    renderAssessStep();
  };
  document.getElementById("exitBtn").onclick = closeAssessment;

  assessOverlay.scrollTop = 0;
}

/* =========================================================
   MAIN RENDER
   ========================================================= */
function render(){
  renderTabs();
  renderTopic(state.activeTopic);
  updateProgress();
}

document.getElementById("resetBtn").onclick = ()=>{
  state.visited = [];
  state.quizAnswers = {};
  saveVisited();
  state.activeTopic = "getting-started";
  render();
};

render();
</script>

  .exam-confirm .box{background:#fff;color:#161c27;border-radius:14px;max-width:430px;width:100%;padding:26px 24px;box-shadow:0 24px 60px rgba(0,0,0,.35);animation:ecpop .18s ease}
  @keyframes ecpop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
  .exam-confirm h3{font-size:18px;font-weight:800;margin:0 0 8px}

  .exam-confirm .row{display:flex;gap:10px;justify-content:flex-end}
  .exam-overlay,.exam-overlay *{-webkit-user-select:none;user-select:none}
  .exam-cover{position:fixed;inset:0;z-index:100002;background:#0b1526;color:#fff;display:none;flex-direction:column;gap:8px;align-items:center;justify-content:center;text-align:center;font-family:'Outfit',system-ui,sans-serif;font-size:20px;font-weight:700;padding:24px}
  .exam-cover small{font-weight:500;color:#cdd5e5;font-size:14px}
  @media(max-width:820px){.exam-main{grid-template-columns:1fr}.exam-side{border-left:none;border-top:1px solid #e2e8f0}}
  `;
  function injectCss(){ if(document.getElementById('examCss'))return; const s=document.createElement('style'); s.id='examCss'; s.textContent=css; document.head.appendChild(s); }
  function fmt(t){const m=Math.floor(t/60),s=t%60;return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;}

  function examConfirm(title,msg,okLabel){
    return new Promise(res=>{
      injectCss();
      const d=document.createElement('div'); d.className='exam-confirm';
      d.innerHTML=`<div class="box"><h3>${title}</h3><p>${msg}</p><div class="row">
        <button class="exam-btn nav" data-a="0">Cancel</button>
        <button class="exam-btn primary" data-a="1">${okLabel||'Submit'}</button></div></div>`;
      document.body.appendChild(d);
      d.addEventListener('click',e=>{
        if(e.target===d){d.remove();res(false);return;}
        const b=e.target.closest('[data-a]'); if(!b)return;
        d.remove(); res(b.dataset.a==='1');
      });
    });
  }

  /* ---- score history (localStorage, shared across the exam tab + guide) ---- */
  const LS_KEY='claudeScores';
  function loadScores(){ try{return JSON.parse(localStorage.getItem(LS_KEY)||'[]');}catch(e){return[];} }
  function saveScore(score,total){
    const a=loadScores();
    a.unshift({score,total,pct:Math.round(score/total*100),ts:Date.now()});
    try{localStorage.setItem(LS_KEY,JSON.stringify(a.slice(0,50)));}catch(e){}
    renderScoreboard();
  }
  function renderScoreboard(){
    const el=document.getElementById('scoreBoard'); if(!el)return;
    const a=loadScores();
    if(!a.length){ el.style.display='none'; return; }
    el.style.display='block';
    const best=a.reduce((m,x)=>x.pct>m.pct?x:m,a[0]);
    const last5=a.slice(0,5);
    const fmtd=ts=>{const d=new Date(ts);return d.toLocaleDateString(undefined,{month:'short',day:'numeric'})+' '+d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'});};
    el.innerHTML=`
      <div style="display:flex;gap:16px;flex-wrap:wrap;align-items:stretch;margin-top:18px">
        <div style="flex:0 0 auto;min-width:150px;background:#14213D;color:#fff;border-radius:14px;padding:18px 22px;text-align:center">
          <div style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#FCA311">Top score</div>
          <div style="font-size:34px;font-weight:800;line-height:1.1;margin-top:4px">${best.score}<span style="font-size:18px;color:#cdd5e5">/${best.total}</span></div>
          <div style="font-size:12px;color:#cdd5e5">${best.pct}%</div>
        </div>
        <div style="flex:1;min-width:220px;background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:14px 18px">
          <div style="font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#64748b;margin-bottom:6px">Last ${last5.length} attempt${last5.length>1?'s':''}</div>
          ${last5.map(x=>`<div style="display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid #f1f3ff;font-size:13px">
              <span style="font-weight:700;color:#14213D">${x.score}/${x.total} <span style="color:#64748b;font-weight:600">&middot; ${x.pct}%</span></span>
              <span style="color:#94a3b8">${fmtd(x.ts)}</span></div>`).join('')}
        </div>
      </div>`;
  }

  /* ---- proctoring: no tab-switch (3 strikes -> auto-submit), deter screenshots ---- */
  let warns=0, lastWarn=0, proctorOn=false;
  function examWarn(title,msg){
    injectCss();
    const d=document.createElement('div'); d.className='exam-confirm';
    d.innerHTML=`<div class="box"><h3>${title}</h3><p>${msg}</p><div class="row"><button class="exam-btn primary" data-a="1">OK</button></div></div>`;
    document.body.appendChild(d);
    d.addEventListener('click',e=>{ if(e.target.closest('[data-a]'))d.remove(); });
  }
  function showCover(){
    if(!examOn)return;
    let c=document.getElementById('examCover');
    if(!c){ c=document.createElement('div'); c.id='examCover'; c.className='exam-cover';
      c.innerHTML='<div>&#9888;&#65039; Test paused &mdash; return to this window</div><small>Leaving the test counts as a warning.</small>';
      document.body.appendChild(c); }
    c.style.display='flex';
  }
  function hideCover(){ const c=document.getElementById('examCover'); if(c)c.style.display='none'; }
  function countWarn(){
    if(!proctorOn||!examOn)return;
    const now=Date.now(); if(now-lastWarn<800)return; lastWarn=now;
    warns++;
    if(warns>=3){ examWarn('Test submitted','You left the test 3 times. It has been auto-submitted.'); submitExam(true); }
    else { examWarn('Warning '+warns+' of 3','Switching tabs, leaving the window, or exiting fullscreen is not allowed. After 3 warnings the test is auto-submitted.'); }
  }
  function fsHandler(){ if(examOn && !document.fullscreenElement){ countWarn(); } }
  function visHandler(){ if(document.hidden){ showCover(); countWarn(); } else { hideCover(); } }
  function blurHandler(){ showCover(); countWarn(); }
  function focusHandler(){ hideCover(); }
  function blockEvt(e){ e.preventDefault(); return false; }
  function keyGuard(e){
    const k=(e.key||'').toLowerCase();
    if((e.ctrlKey||e.metaKey)&&['c','x','s','p','u'].includes(k)){ e.preventDefault(); return false; }
    if(k==='printscreen'){ e.preventDefault(); }
  }
  function printGuard(e){
    if((e.key||'')==='PrintScreen'){ try{navigator.clipboard.writeText('');}catch(_){}
      examWarn('Not allowed','Screenshots are not permitted during the test.'); }
  }
  function startProctor(){
    warns=0; lastWarn=0; proctorOn=true;
    document.addEventListener('visibilitychange',visHandler);
    document.addEventListener('fullscreenchange',fsHandler);
    window.addEventListener('blur',blurHandler);
    window.addEventListener('focus',focusHandler);
    document.addEventListener('contextmenu',blockEvt,true);
    document.addEventListener('copy',blockEvt,true);
    document.addEventListener('cut',blockEvt,true);
    document.addEventListener('keydown',keyGuard,true);
    document.addEventListener('keyup',printGuard,true);
  }
  function stopProctor(){
    proctorOn=false;
    document.removeEventListener('visibilitychange',visHandler);
    document.removeEventListener('fullscreenchange',fsHandler);
    window.removeEventListener('blur',blurHandler);
    window.removeEventListener('focus',focusHandler);
    document.removeEventListener('contextmenu',blockEvt,true);
    document.removeEventListener('copy',blockEvt,true);
    document.removeEventListener('cut',blockEvt,true);
    document.removeEventListener('keydown',keyGuard,true);
    document.removeEventListener('keyup',printGuard,true);
    hideCover();
  }

  function startEntry(){
    if(inIframe){ window.open(location.pathname+'?mode=exam','_blank'); return; }
    showSplash();
  }

  function showSplash(){
    injectCss();
    const sp=document.createElement('div'); sp.className='exam-splash'; sp.id='examSplash';
    sp.innerHTML=`<div class="card">
      <h2>&#127919; Claude Code &mdash; Mock Test</h2>
      <p>A timed, exam-style assessment modelled on real technical screening tests.</p>
      <ul>
        <li><b>50 questions</b> to attempt</li>
        <li><b>60-minute</b> timer &mdash; the test auto-submits when time is up</li>
        <li>Navigate freely, <b>mark questions for review</b>, then submit</li>
        <li>Results and explanations are shown only after you submit</li>
      </ul>
      <p style="font-weight:700;color:#14213D;margin-bottom:6px">Exam rules</p>
      <ul style="margin-top:0">
        <li>The test runs in <b>fullscreen</b> &mdash; stay in fullscreen the whole time</li>
        <li><b>No tab / window switching</b> and <b>no exiting fullscreen</b></li>
        <li><b>3 warnings</b> (tab-switch or fullscreen-exit) &rarr; the test <b>auto-submits</b></li>
        <li><b>Screenshots, copy and right-click are disabled</b></li>
      </ul>
      <button class="exam-btn primary" id="examBegin" style="width:100%;padding:14px">Start Test &rarr;</button>
    </div>`;
    document.body.appendChild(sp);
    document.getElementById('examBegin').addEventListener('click',()=>{
      if(document.documentElement.requestFullscreen){document.documentElement.requestFullscreen().catch(()=>{});}
      sp.remove(); enterExam();
    });
  }

  async function enterExam(){
    injectCss();
    let ov=document.createElement('div'); ov.className='exam-overlay'; ov.id='examOverlay';
    ov.innerHTML='<div class="exam-q-pane" style="grid-column:1/-1;padding:60px;text-align:center;color:#64748b">Loading your test&hellip;</div>';
    document.body.appendChild(ov);
    document.body.style.overflow='hidden';
    try{
      const res=await fetch(API_Q,{headers:{'Accept':'application/json'}});
      const data=await res.json(); items=data.questions||[];
    }catch(e){ items=[]; }
    if(!items.length){ ov.innerHTML='<div class="exam-q-pane" style="grid-column:1/-1;padding:60px;text-align:center">Could not load the test. Close and try again.</div>'; return; }
    answers={}; marked={}; cur=0; remaining=EXAM_SECONDS; examOn=true;
    ov.innerHTML=`
      <div class="exam-top">
        <div><div class="et-title">Claude Code &mdash; Mock Test</div><div class="et-sub">50 questions &middot; one attempt &middot; good luck</div></div>
        <div class="exam-timer" id="examTimer">${fmt(remaining)}</div>
      </div>
      <div class="exam-main">
        <div class="exam-q-pane" id="examQ"></div>
        <div class="exam-side">
          <div class="exam-count">Answered <b id="examAnsN">0</b> / ${items.length}</div>
          <h4>Question palette</h4>
          <div class="exam-palette" id="examPal"></div>
          <div class="exam-legend">
            <span><i style="background:#14213D;border-color:#14213D"></i> Answered</span>
            <span><i style="background:#FCA311;border-color:#FCA311"></i> Marked for review</span>
            <span><i></i> Not answered</span>
          </div>
          <button class="exam-btn submit" id="examSubmit" style="width:100%">Submit Test</button>
        </div>
      </div>`;
    document.getElementById('examSubmit').addEventListener('click',()=>submitExam(false));
    buildPalette(); renderQ();
    timerId=setInterval(tick,1000);
    window.addEventListener('beforeunload',beforeUnload);
    startProctor();
  }

  function beforeUnload(e){ if(examOn){e.preventDefault();e.returnValue='';} }

  function tick(){
    remaining--; const el=document.getElementById('examTimer');
    if(el){ el.textContent=fmt(Math.max(remaining,0)); if(remaining<=300)el.classList.add('warn'); }
    if(remaining<=0){ submitExam(true); }
  }

  function buildPalette(){
    const pal=document.getElementById('examPal'); pal.innerHTML='';
    items.forEach((it,n)=>{
      const b=document.createElement('button'); b.className='pal'; b.textContent=n+1; b.dataset.n=n;
      b.addEventListener('click',()=>{cur=n;renderQ();});
      pal.appendChild(b);
    });
    refreshPalette();
  }
  function refreshPalette(){
    document.querySelectorAll('#examPal .pal').forEach(b=>{
      const n=+b.dataset.n, id=items[n].id;
      b.classList.toggle('answered', id in answers);
      b.classList.toggle('marked', !!marked[id]);
      b.classList.toggle('cur', n===cur);
    });
    const el=document.getElementById('examAnsN'); if(el)el.textContent=Object.keys(answers).length;
  }

  function renderQ(){
    const it=items[cur], id=it.id, pane=document.getElementById('examQ');
    pane.innerHTML=`
      <div class="exam-qnum">Question ${cur+1} of ${items.length}</div>
      <div class="exam-qtext">${it.q}${it.difficulty?`<span class="diff">${it.difficulty}</span>`:''}</div>
      ${it.code?`<pre><code>${it.code}</code></pre>`:''}
      <div class="exam-opts" id="examOpts">${it.options.map((o,i)=>`<div class="exam-opt${answers[id]===i?' sel':''}" data-i="${i}"><span class="k">${String.fromCharCode(65+i)}</span><span>${o}</span></div>`).join('')}</div>
      <div class="exam-actions">
        <button class="exam-btn nav" id="examPrev" ${cur===0?'disabled':''}>&larr; Previous</button>
        <button class="exam-btn mark${marked[id]?' on':''}" id="examMark">${marked[id]?'★ Marked':'☆ Mark for review'}</button>
        <button class="exam-btn nav" id="examNext" ${cur===items.length-1?'disabled':''}>Next &rarr;</button>
      </div>`;
    pane.querySelectorAll('#examOpts .exam-opt').forEach(el=>el.addEventListener('click',()=>{
      answers[id]=+el.dataset.i;
      pane.querySelectorAll('#examOpts .exam-opt').forEach(x=>x.classList.remove('sel'));
      el.classList.add('sel'); refreshPalette();
    }));
    const prev=document.getElementById('examPrev'), next=document.getElementById('examNext');
    if(prev)prev.addEventListener('click',()=>{if(cur>0){cur--;renderQ();}});
    if(next)next.addEventListener('click',()=>{if(cur<items.length-1){cur++;renderQ();}});
    document.getElementById('examMark').addEventListener('click',()=>{marked[id]=!marked[id];renderQ();refreshPalette();});
    refreshPalette();
  }

  async function submitExam(auto){
    if(!examOn)return;
    const unanswered=items.length-Object.keys(answers).length;
    if(!auto){
      const ok=await examConfirm('Submit test?', unanswered>0
        ? 'You have '+unanswered+' unanswered question(s). Once submitted, you can\'t change your answers.'
        : 'Once submitted, you can\'t change your answers.', 'Submit test');
      if(!ok)return;
    }
    examOn=false; clearInterval(timerId);
    window.removeEventListener('beforeunload',beforeUnload);
    stopProctor();
    const payload={answers:{}};
    items.forEach(it=>{ payload.answers[it.id] = (it.id in answers)?answers[it.id]:-1; });
    const ov=document.getElementById('examOverlay');
    ov.innerHTML='<div class="exam-q-pane" style="grid-column:1/-1;padding:60px;text-align:center;color:#64748b">Grading your test&hellip;</div>';
    let data;
    try{
      const res=await fetch(API_S,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
      data=await res.json();
    }catch(e){ ov.innerHTML='<div class="exam-q-pane" style="grid-column:1/-1;padding:60px;text-align:center">Could not grade the test. Please try again.</div>'; return; }
    showResults(data);
  }

  function showResults(data){
    const results=data.results||{}, total=items.length, score=data.score||0;
    saveScore(score,total);
    const pct=Math.round(score/total*100);
    let msg='Keep practicing &mdash; review the explanations below and try again.';
    if(pct>=85)msg='Outstanding &mdash; strong command of OOP, basics to edge cases.';
    else if(pct>=65)msg='Solid pass. A little more practice on the tricky ones and you are set.';
    else if(pct>=50)msg='Borderline &mdash; revisit the topics you missed and retake.';
    const rev=items.map((it,n)=>{
      const r=results[it.id]||{}; const you=answers[it.id];
      const attempted=(you!=null);
      let inner='<div class="rq">Q'+(n+1)+'. '+it.q+'</div>';
      if(!attempted){
        // Not attempted: reveal nothing (answer stays protected)
        inner+='<div class="ra">Your answer: <i>Not answered</i></div>';
        return '<div class="r no">'+inner+'</div>';
      }
      const youTxt=String.fromCharCode(65+you)+'. '+it.options[you];
      const cor=(r.answer!=null&&r.answer>=0)?(String.fromCharCode(65+r.answer)+'. '+it.options[r.answer]):'';
      inner+='<div class="ra '+(r.correct?'cor':'wrong')+'">Your answer: '+youTxt+'</div>'
        +(r.correct?'':'<div class="ra cor">Correct: '+cor+'</div>')
        +(r.explanation?'<div class="rx">'+r.explanation+'</div>':'');
      return '<div class="r '+(r.correct?'ok':'no')+'">'+inner+'</div>';
    }).join('');
    const ov=document.getElementById('examOverlay');
    ov.innerHTML=`
      <div class="exam-top"><div class="et-title">Result &mdash; Claude Code Mock Test</div>
        <button class="exam-btn" id="examClose" style="background:rgba(255,255,255,.15);color:#fff">&#10005; Close</button></div>
      <div class="exam-q-pane" style="grid-column:1/-1">
        <div class="exam-result">
          <div class="exam-score">${score} / ${total}</div>
          <div class="exam-rmsg">${pct}% correct &mdash; ${msg}</div>
          <div style="margin-top:16px"><button class="exam-btn primary" id="examRetry">&#8635; Take another test</button></div>
          <div class="exam-rmsg" id="examRedirect" style="margin-top:8px;color:#94a3b8"></div>
          <div class="exam-rev">${rev}</div>
        </div>
      </div>`;
    let left=30;
    const rd=document.getElementById('examRedirect');
    const setTxt=()=>{ if(rd)rd.textContent='Returning to the assessment page in '+left+'s…'; };
    setTxt();
    const rt=setInterval(()=>{ left--; setTxt(); if(left<=0){ clearInterval(rt); goBack(); } },1000);
    function goBack(){
      if(document.fullscreenElement){ document.exitFullscreen().catch(()=>{}); }
      if(window.opener){ try{ window.close(); }catch(_){} }
      location.href=location.pathname;   // fallback: reload guide (assessment) page
    }
    document.getElementById('examRetry').addEventListener('click',()=>{ clearInterval(rt); document.getElementById('examOverlay').remove(); enterExam(); });
    document.getElementById('examClose').addEventListener('click',()=>{ clearInterval(rt); goBack(); });
  }

  function closeExam(){
    stopProctor();
    const ov=document.getElementById('examOverlay'); if(ov)ov.remove();
    document.body.style.overflow='';
    if(document.fullscreenElement){document.exitFullscreen().catch(()=>{});}
  }

  const startBtn=document.getElementById('assessStartBtn');
  if(startBtn)startBtn.addEventListener('click',startEntry);
  window.__mockExamStart=startEntry;
  renderScoreboard();
  window.addEventListener('storage',e=>{ if(e.key===LS_KEY)renderScoreboard(); });
  if(new URLSearchParams(location.search).get('mode')==='exam'){ showSplash(); }
})();
</script>
<script>
/* Keep the sticky stack aligned even if the header height changes. */
(function(){
  function updateStickyOffsets(){
    const head=document.querySelector('.head');
    const tabbar=document.querySelector('.tabbar');
    if(head) document.documentElement.style.setProperty('--head-sticky-height', head.offsetHeight+'px');
    if(tabbar) document.documentElement.style.setProperty('--tab-sticky-height', tabbar.offsetHeight+'px');
  }
  updateStickyOffsets();
  window.addEventListener('resize', updateStickyOffsets);
  if(window.ResizeObserver){
    const ro=new ResizeObserver(updateStickyOffsets);
    const head=document.querySelector('.head'), tabbar=document.querySelector('.tabbar');
    if(head) ro.observe(head);
    if(tabbar) ro.observe(tabbar);
  }
})();
</script>
<script>
function setCCStickyOffsets(){
  var h = document.querySelector('.head');
  var t = document.querySelector('.tabbar');
  var hh = h ? h.offsetHeight : 64;
  var th = t ? t.offsetHeight : 56;
  var root = document.documentElement.style;
  root.setProperty('--head-h', hh + 'px');
  root.setProperty('--stack-h', (hh + th) + 'px');
}
window.addEventListener('load', setCCStickyOffsets);
window.addEventListener('resize', setCCStickyOffsets);
document.addEventListener('DOMContentLoaded', setCCStickyOffsets);
setTimeout(setCCStickyOffsets, 50);
</script>
