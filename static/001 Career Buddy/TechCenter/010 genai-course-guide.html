<!DOCTYPE html>
<html lang="en">

<title>GenAI · Agentic AI — Complete Course Material</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" />
<style>
  :root{
    --navy:#14213D; --navy-2:#0b1526; --gold:#FCA311; --gold-soft:#fdeecb; --gold-ink:#7a5c00;
    --bg:#f9f9ff; --bg-soft:#f1f3ff; --teal-50:#e6ebf3;
    --ink:#161c27; --body:#4a5568; --muted:#718096; --line:#e2e8f0; --line-2:#dde2f3;
    --success:#38a169; --success-bg:#e9f7ef; --danger:#e53e3e; --danger-bg:#fdecec;
    --radius:8px; --radius-lg:14px;
    --shadow-sm:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06);
    --shadow:0 8px 24px -12px rgba(16,24,40,.18);
    /* legacy aliases kept so the rest of the stylesheet below (unchanged selectors)
       resolves to the new navy/gold system without a line-by-line rewrite */
    --panel:#ffffff; --faint:var(--muted);
    --green:var(--navy); --green-deep:var(--navy-2); --green-soft:var(--bg-soft);
    --blue:var(--navy); --blue-soft:var(--bg-soft);
    --purple:var(--navy); --purple-soft:var(--teal-50);
    --amber:var(--gold-ink); --amber-soft:var(--gold-soft);
    --red:var(--danger); --red-soft:var(--danger-bg);
    --serif:'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --sans:'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --mono:'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); line-height:1.6; -webkit-font-smoothing:antialiased;}
  a{color:inherit;}

  .topbar{background:var(--panel); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:50;}
  .topbar-inner{max-width:1180px; margin:0 auto; padding:16px 26px; display:flex; align-items:center; gap:34px;}
  .brand{display:flex; align-items:center; gap:11px; font-weight:700; font-size:20px;}
  .brand .logo{width:34px; height:34px; border-radius:9px; background:var(--green-deep); display:grid; place-items:center; color:#fff; font-size:16px;}
  .brand .b2{color:var(--green);}
  .nav{display:flex; align-items:center; gap:26px; margin-left:auto; font-size:15px; color:var(--muted);}
  .nav .browse{background:var(--green-deep); color:#fff; padding:9px 16px; border-radius:9px; font-weight:600; font-size:14px;}

  .crumbs{max-width:1180px; margin:0 auto; padding:16px 26px 0; font-size:14px; color:var(--faint);}
  .crumbs b{color:var(--muted); font-weight:500;}
  .wrap{max-width:1180px; margin:32px auto 60px; padding:0 26px;}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:20px; box-shadow:var(--shadow); overflow:hidden;}

  .course-head{padding:22px 30px; display:flex; align-items:center; gap:16px; border-bottom:1px solid var(--line);}
  .ga-badge{width:42px; height:42px; border-radius:11px; background:var(--green-deep); color:#fff; display:grid; place-items:center; font-family:var(--serif); font-weight:600; font-size:16px; letter-spacing:.5px;}
  .course-head h2{font-family:var(--serif); font-size:23px; margin:0; font-weight:600;}
  .pill-progress{font-size:12px; letter-spacing:.12em; font-weight:600; color:var(--navy); background:var(--bg-soft); border:1px solid var(--line-2); padding:5px 12px; border-radius:999px;}
  .reset{margin-left:auto; font-size:13px; color:var(--muted); border:1px solid var(--line); background:var(--bg-soft); padding:8px 14px; border-radius:9px; cursor:pointer;}
  .reset:hover{background:var(--teal-50);}

  .tabs{display:flex; gap:6px; padding:6px 22px 0; border-bottom:1px solid var(--line); flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch;}
  .tabs::-webkit-scrollbar{height:0;}
  .tab-break{display:none;}
  .tab{display:flex; align-items:center; gap:9px; padding:15px 14px 17px; cursor:pointer; font-size:14.5px; color:var(--muted); border-bottom:2px solid transparent; margin-bottom:-1px; font-weight:500; white-space:nowrap;}
  .tab .num{font-family:var(--mono); font-size:12px; color:var(--faint);}
  .tab:hover{color:var(--ink);}
  .tab.active{color:var(--green-deep); border-bottom-color:var(--green-deep); font-weight:600;}
  .tab.active .num{color:var(--green);}

  .layout{display:grid; grid-template-columns:236px 1fr; gap:0;}
  .rail{padding:26px 20px 26px 48px; border-right:1px solid var(--line); position:sticky; top:16px; align-self:start; max-height:calc(100vh - 32px); overflow:auto;}
  .rail .lbl{font-size:11px; letter-spacing:.16em; color:var(--faint); font-weight:600; margin-bottom:14px;}
  .rail a{display:block; font-size:13.5px; color:var(--muted); padding:6px 0; text-decoration:none; border-left:0; padding-left:18px; margin-left:0; line-height:1.35;}
  .rail a:hover{color:var(--ink);}
  .rail a.on{display:block !important; width:100% !important; color:#fff !important; background:#14213D !important; border:0 !important; border-left:0 !important; font-weight:700 !important; border-radius:10px !important; padding:10px 24px !important; margin:0 0 4px 0 !important; box-sizing:border-box !important; text-decoration:none !important;}

  .content{padding:34px 46px 60px; min-width:0;}
  .eyebrow{font-size:12px; letter-spacing:.14em; font-weight:600; color:var(--green); text-transform:uppercase;}
  .content h1{font-family:var(--serif); font-weight:600; font-size:44px; line-height:1.1; margin:14px 0 10px;}
  .content h1 em{font-style:italic; color:var(--green);}
  .lede{font-family:var(--serif); font-style:italic; font-size:19px; color:var(--muted); margin:0 0 26px; max-width:62ch;}

  .content h2{font-family:var(--serif); font-weight:600; font-size:27px; margin:46px 0 6px; scroll-margin-top:90px; display:flex; align-items:center; flex-wrap:wrap; gap:10px;}
  .content h3{font-size:17px; font-weight:600; margin:26px 0 6px; color:var(--ink);}
  .content h4{font-size:15px; font-weight:600; margin:18px 0 4px; color:var(--green-deep);}
  .content p{margin:12px 0; max-width:72ch; color:var(--body);}
  .content ul, .content ol{max-width:72ch; margin:12px 0; padding-left:22px;}
  .content li{margin:7px 0;}
  .content strong{font-weight:600;}
  .divider{height:1px; background:var(--line); margin:44px 0;}

  .level{font-size:10px; letter-spacing:.06em; font-weight:700; text-transform:uppercase; padding:3px 9px; border-radius:999px; border:1px solid; font-family:var(--sans); white-space:nowrap;}
  .lvl-new{color:var(--gold-ink); background:var(--gold-soft); border-color:#f3dfa6;}
  .lvl-int{color:var(--navy); background:var(--teal-50); border-color:var(--line-2);}
  .lvl-adv{color:#fff; background:var(--navy); border-color:var(--navy);}

  .infobox{background:var(--bg-soft); border:1px solid var(--line); border-radius:var(--radius); padding:22px 24px; margin:24px 0;}
  .badges{display:flex; flex-wrap:wrap; gap:10px; margin-top:16px;}
  .badge{display:inline-flex; align-items:center; gap:7px; background:#fff; border:1px solid var(--line); border-radius:999px; padding:7px 14px; font-size:13px; color:var(--muted); font-weight:500;}

  .callout{border-left:3px solid var(--navy); background:var(--bg-soft); border-radius:0 10px 10px 0; padding:14px 18px; margin:20px 0; font-size:15px; max-width:74ch;}
  .callout .tag{font-size:11px; letter-spacing:.1em; font-weight:700; text-transform:uppercase; color:var(--navy); display:block; margin-bottom:4px;}
  .callout.tip{border-color:var(--gold-ink); background:var(--gold-soft);} .callout.tip .tag{color:var(--gold-ink);}
  .callout.new{border-color:var(--navy); background:var(--teal-50);} .callout.new .tag{color:var(--navy);}
  .callout.deep{border-color:var(--navy-2); background:var(--teal-50);} .callout.deep .tag{color:var(--navy-2);}

  pre{background:var(--navy-2); color:#e6e9ef; border-radius:12px; padding:18px 20px; overflow:auto; font-family:var(--mono); font-size:12.8px; line-height:1.65; margin:18px 0; max-width:100%;}
  pre .c{color:#7f8a9c;} pre .k{color:#c792ea;} pre .s{color:#a5d6a7;} pre .f{color:#82aaff;} pre .n{color:var(--gold);}
  code.inline{font-family:var(--mono); font-size:.88em; background:var(--bg-soft); padding:2px 6px; border-radius:5px; color:var(--ink);}

  table.tbl{border-collapse:collapse; width:100%; margin:20px 0; font-size:14px;}
  table.tbl th, table.tbl td{border:1px solid var(--line); padding:10px 13px; text-align:left; vertical-align:top;}
  table.tbl th{background:var(--bg-soft); font-weight:600;}
  table.tbl td code{font-size:.86em;}

  .assess-intro{background:var(--navy); color:#eaf0fb; border-radius:16px; padding:26px 28px; margin:10px 0 24px;}
  .assess-intro h2{font-family:var(--serif); color:#fff; margin:0 0 6px; font-size:26px; display:block;}
  .assess-intro p{color:#c5d2ea; margin:6px 0 0; max-width:70ch;}

  .qcard{border:1px solid var(--line); border-radius:14px; padding:20px 22px; margin:18px 0; background:#fff;}
  .qhead{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .qtype{font-size:11px; letter-spacing:.1em; font-weight:700; text-transform:uppercase; color:var(--faint);}
  .qtext{font-weight:600; font-size:16px; margin:8px 0 14px;}
  .opt{display:flex; align-items:flex-start; gap:11px; border:1px solid var(--line); border-radius:10px; padding:11px 14px; margin:8px 0; cursor:pointer; font-size:15px; transition:background .12s, border-color .12s;}
  .opt:hover{background:var(--bg-soft);}
  .opt .mark{width:22px; height:22px; border-radius:6px; border:1.5px solid var(--line-2); flex:none; display:grid; place-items:center; font-size:13px; font-weight:700; color:#fff;}
  .opt.correct{border-color:var(--success); background:var(--success-bg);} .opt.correct .mark{background:var(--success); border-color:var(--success);}
  .opt.wrong{border-color:var(--danger); background:var(--danger-bg);} .opt.wrong .mark{background:var(--danger); border-color:var(--danger);}
  .opt.locked{cursor:default;}
  .explain{font-size:14px; color:var(--muted); margin-top:12px; padding-top:12px; border-top:1px dashed var(--line); display:none;}
  .explain.show{display:block;}
  .explain b{color:var(--navy);}
  .btn{font-family:var(--sans); font-size:14px; font-weight:600; border:1px solid var(--line); background:var(--bg-soft); color:var(--ink); padding:9px 16px; border-radius:9px; cursor:pointer;}
  .btn:hover{background:var(--teal-50);}
  .btn.primary{background:var(--navy); border-color:var(--navy); color:#fff;}
  .btn.primary:hover{background:var(--navy-2);}
  .btn:disabled{opacity:.45; cursor:not-allowed;}
  .model{display:none; margin-top:14px; padding:14px 16px; background:var(--bg-soft); border:1px solid var(--line); border-radius:10px; font-size:14.5px;}
  .model.show{display:block;}
  .model .tag{font-size:11px; letter-spacing:.1em; font-weight:700; text-transform:uppercase; color:var(--navy); display:block; margin-bottom:6px;}
  .scorebar{position:sticky; bottom:14px; margin-top:24px; background:var(--navy-2); color:#fff; border-radius:12px; padding:14px 20px; display:flex; align-items:center; gap:16px; box-shadow:0 10px 30px rgba(11,21,38,.3);}
  .scorebar .s-num{font-family:var(--serif); font-size:22px; font-weight:600;}
  .scorebar .s-lbl{font-size:13px; color:#aeb6c2;}

  /* ---------- Assessment full-screen takeover (Rule 8) ---------- */
  .assess-overlay{position:fixed; inset:0; z-index:1000; background:var(--bg); overflow:auto; display:none;}
  .assess-overlay.show{display:block;}
  .assess-inner{max-width:1080px; margin:0 auto; padding:26px 40px 80px;}
  .assess-top{display:flex; align-items:center; justify-content:space-between; gap:14px; margin-bottom:22px;}
  .assess-progress{font-family:var(--mono); font-size:12.5px; color:var(--muted); letter-spacing:.04em;}
  .assess-exit{font-family:var(--sans); font-size:14px; font-weight:600; color:var(--muted); background:#fff; border:1px solid var(--line); border-radius:9px; padding:8px 14px; cursor:pointer;}
  .assess-exit:hover{background:var(--bg-soft); color:var(--ink);}
  .assess-bar{height:5px; border-radius:999px; background:var(--line); overflow:hidden; margin-bottom:26px;}
  .assess-bar-fill{height:100%; background:var(--gold); border-radius:999px; transition:width .2s;}
  .assess-nav{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:22px;}
  .assess-nav .spacer{flex:1;}
  .assess-summary{border:1px solid var(--line); background:#fff; border-radius:14px; padding:20px 22px; margin:0 0 26px; box-shadow:var(--shadow-sm);}
  .assess-summary .row{display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;}
  .assess-summary .stat{font-size:13px; color:var(--muted);}
  .assess-summary .stat b{color:var(--ink);}
  .assess-final{text-align:center; padding:40px 20px;}
  .assess-final .big{font-family:var(--serif); font-size:48px; font-weight:600; color:var(--navy); margin:6px 0;}

  @media (max-width:860px){
    .layout{grid-template-columns:1fr;} .rail{display:none;}
    .content{padding:26px 22px 50px;} .content h1{font-size:33px;}
    .nav{display:none;} .topbar-inner{padding:14px 18px;} .wrap{padding:0 14px;}
  }
</style>
<style>
/* CareerBuddy: sticky sidebar visible scrollbar */
.toc,.sidebar,.sidenav{scrollbar-width:thin;scrollbar-color:#cbd2e0 transparent}
.toc::-webkit-scrollbar,.sidebar::-webkit-scrollbar,.sidenav::-webkit-scrollbar{width:9px;height:9px}
.toc::-webkit-scrollbar-thumb,.sidebar::-webkit-scrollbar-thumb,.sidenav::-webkit-scrollbar-thumb{background:#cbd2e0;border-radius:8px}
.toc::-webkit-scrollbar-thumb:hover,.sidebar::-webkit-scrollbar-thumb:hover,.sidenav::-webkit-scrollbar-thumb:hover{background:#9aa4b8}
.toc::-webkit-scrollbar-track,.sidebar::-webkit-scrollbar-track,.sidenav::-webkit-scrollbar-track{background:transparent}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap">
<style>
/* -- Unify typography: Outfit everywhere (CareerBuddy) -- */
body,h1,h2,h3,h4,h5,h6,p,a,span,li,ul,ol,dl,dt,dd,td,th,div,section,article,header,footer,nav,aside,main,label,button,input,select,textarea,blockquote,figcaption,small,strong,b,em,i{font-family:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif !important}
.material-symbols-outlined,.material-icons{font-family:'Material Symbols Outlined','Material Icons' !important}
code,pre,kbd,samp,tt,.mono,[class*="mono"],[class*="Mono"],[class*="code"],[class*="Code"],[class*="tok"],[class*="hljs"]{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Consolas,monospace !important}
</style>
<style>
/* CareerBuddy: devops nav pill */
.tab .tab-icon,.tab-btn .tab-icon,.tab .tab-emoji,.tab-btn .tab-emoji,.tab .ico,.tab-btn .ico,.tab .tab-ico,.tab-btn .tab-ico,.tab .icon,.tab-btn .icon,.tab .emoji,.tab-btn .emoji{display:none !important}
.tab .tab-num,.tab-btn .tab-num,.tab .num,.tab-btn .num,.tab .tab-index,.tab-btn .tab-index{display:none !important}
.tab,.tab-btn{border-radius:8px !important;border-bottom:none !important}
.tab:not(.active),.tab-btn:not(.active){color:#4a5568 !important;background:transparent !important;transition:background .15s,color .15s}
.tab:not(.active):hover,.tab-btn:not(.active):hover{background:#eef1f7 !important;color:#14213D !important}
.tab.active:hover,.tab-btn.active:hover{background:#0b1526 !important}
.tab.active,.tab-btn.active,.tabbar .active,.tab-bar .active,.tabs .active,[role="tab"][aria-selected="true"]{
  background:#14213D !important;color:#fff !important;border-radius:8px !important;
  border-bottom-color:transparent !important;font-weight:700 !important}
.tab.active::after,.tab-btn.active::after{display:none !important}
.tab.active .tab-num,.tab.active .num,.tab-btn.active .num,.tab.active .count,.tab-btn.active .count{
  color:#fff !important;background:rgba(255,255,255,.2) !important}
</style>
<style>
/* CareerBuddy: full-stretch containers */
.shell,.wrap,.container,.layout,.main,.content,.doc,.page,.page-inner,.reading,.article,.main-content,.body-wrap{max-width:none !important}
</style>
<style>
/* CareerBuddy: full-bleed + sticky nav + tight tabs */
.wrap,.shell,.layout,.container,.doc,.page,.main-content{margin:0 !important;padding-top:0 !important;padding-left:0 !important;padding-right:0 !important}
.tabbar,.tabs{position:sticky !important;top:0 !important;z-index:45 !important;background:#fff !important}
.tabbar,.tabs,.tab-bar{gap:2px !important}
</style>
<style>
/* CareerBuddy: restore sticky (overflow fix) */
.shell,.wrap,.layout,.container,.app,.doc,.page,.grid,.body-wrap{overflow:visible !important}
</style>
<style>
  /* CareerBuddy: keep course header, tabs, and TOC visible while reading */
  :root{
    --course-head-h: 88px;
    --tabs-h: 72px;
    --sticky-total: 160px;
  }

  /* Sticky elements cannot be constrained by the card's overflow clipping. */
  .card{
    overflow:visible !important;
  }

  .course-head{
    position:sticky !important;
    top:0 !important;
    z-index:60 !important;
    background:#fff !important;
  }

  .tabs{
    position:sticky !important;
    top:var(--course-head-h) !important;
    z-index:55 !important;
    background:#fff !important;
  }

  .rail{
    position:sticky !important;
    top:var(--sticky-total) !important;
    align-self:start !important;
    max-height:calc(100vh - var(--sticky-total) - 16px) !important;
    overflow:auto !important;
    background:#fff;
    z-index:40;
  }

  .content h2{
    scroll-margin-top:calc(var(--sticky-total) + 16px) !important;
  }

  html{
    scroll-padding-top:calc(var(--sticky-total) + 16px);
  }

  @media (max-width:860px){
    .rail{display:none !important;}
    .tabs{top:var(--course-head-h) !important;}
  }
</style>
<style>
/* Final sidebar active-state styling: match the Course tab background exactly. */
#rail a.on,
#rail a.on:visited,
#rail a.on:hover,
#rail a.on:focus{
  display:block !important;
  width:100% !important;
  box-sizing:border-box !important;
  background:#14213D !important;
  color:#fff !important;
  border:0 !important;
  border-left:0 !important;
  border-radius:10px !important;
  font-weight:700 !important;
  padding:10px 24px !important;
  margin:0 0 4px 0 !important;
  text-decoration:none !important;
}
</style>
<style id="assess-btn-color">
#startAssessBtn,#startReferenceAssessment,.assessment-cta,.assess-start-btn,button[onclick*="__mockExamStart"]:not(.tab){background:#14213D !important;color:#fff !important;border:1px solid #14213D !important}
#startAssessBtn:hover,#startReferenceAssessment:hover,.assessment-cta:hover,.assess-start-btn:hover,button[onclick*="__mockExamStart"]:not(.tab):hover{background:#0b1526 !important;color:#fff !important}
</style>
<style>
/* sidebar-unify — navy active items + no rainbow bar (match course UI) */
.toc-progress, .side-progress, .rail-progress { background:#14213D !important; background-image:none !important; }
.nav-item.active, .sidebar-nav .active, .sidebar .active, .toc .active,
[class*="toc"] a.active, aside a.active, .side-nav .active, .nav-sub .active {
  background:#14213D !important; color:#fff !important; border-radius:8px !important;
}
.nav-item.active *, .sidebar .active *, .toc .active *, .sidebar-nav .active * { color:#fff !important; }
.nav-item.active .nav-dot, .sidebar .active .nav-dot { background:#FCA311 !important; }
</style>
<style>/* CareerBuddy: nav bar scrollbar visible */
.tabbar,.tabs,.tab-bar,.tab-nav,[role="tablist"]{scrollbar-width:thin !important;scrollbar-color:#9aa4b8 transparent !important;overflow-x:auto !important}
.tabbar::-webkit-scrollbar,.tabs::-webkit-scrollbar,.tab-bar::-webkit-scrollbar,.tab-nav::-webkit-scrollbar,[role="tablist"]::-webkit-scrollbar{display:block !important;height:8px !important}
.tabbar::-webkit-scrollbar-thumb,.tabs::-webkit-scrollbar-thumb,.tab-bar::-webkit-scrollbar-thumb,.tab-nav::-webkit-scrollbar-thumb,[role="tablist"]::-webkit-scrollbar-thumb{background:#cbd2e0 !important;border-radius:8px}
.tabbar::-webkit-scrollbar-thumb:hover,.tabs::-webkit-scrollbar-thumb:hover,.tab-bar::-webkit-scrollbar-thumb:hover{background:#9aa4b8 !important}
.tabbar::-webkit-scrollbar-track,.tabs::-webkit-scrollbar-track,.tab-bar::-webkit-scrollbar-track,.tab-nav::-webkit-scrollbar-track,[role="tablist"]::-webkit-scrollbar-track{background:transparent}
</style>
<style>/* CareerBuddy: nav bar bg effect (v1) */
.tabbar,.tabs,.tab-bar,.nav-tabs,.mode-tabs,.mode-bar,nav.tabs,[role="tablist"]{
 background:#ffffff !important;
 border-top:none !important;
 border-bottom:1px solid #e2e8f0 !important;
 box-shadow:0 2px 6px rgba(20,33,61,.05) !important;
}
</style>

  html:`
    <div class="eyebrow">Course Syllabus · Self-paced</div>
    <h1>Generative &amp; <em>Agentic AI</em></h1>
    <p class="lede">From the foundations of machine learning, through the transformer architecture that powers every modern model, to deploying autonomous AI agents that plan, act, and interact with real tools — written to onboard a total beginner and still push an experienced engineer.</p>

    <div class="infobox">
      <p style="margin:0">This track goes end to end: <strong>ML fundamentals → neural networks → the transformer, explained fully → how LLMs are trained and used → generative models beyond text (diffusion, GANs, multimodal) → retrieval (RAG) → agents → shipping to production</strong>. Every topic starts in plain English, then goes deep with intuition, math, code, and real trade-offs.</p>
      <div class="badges">
        <span class="badge">📘 8 Modules</span>
        <span class="badge">🧠 Transformers explained fully</span>
        <span class="badge">🎨 Diffusion &amp; multimodal</span>
        <span class="badge">💻 Hands-on code</span>
        <span class="badge">🏆 Capstone project</span>
        <span class="badge">📝 3 assessments</span>
      </div>
    </div>

    <h2 id="who">Who this is for ${L.new}</h2>
    <p>Two audiences, one path. <strong>Newcomers</strong> who can write a little Python and call an API will find every concept introduced from zero, with nothing assumed. <strong>Experienced engineers</strong> who already ship software will find the advanced sections — attention math, positional encodings, decoding strategies, fine-tuning trade-offs, diffusion mechanics, agent architectures, evals, and LLMOps — deep enough to genuinely skill up, not just review.</p>

    <h2 id="how">How the levels work ${L.new}</h2>
    <p>Every major section is tagged so you can pace yourself. Read in order the first time; on a re-read, an experienced reader can jump straight to the ${L.adv} sections.</p>
    <ul>
      <li>${L.new} &nbsp;core idea in plain language — never skip if you're new.</li>
      <li>${L.int} &nbsp;the working knowledge you need to build real things.</li>
      <li>${L.adv} &nbsp;depth, math, and production trade-offs that separate a user from an engineer.</li>
    </ul>
    <div class="callout new"><span class="tag">For newcomers</span>Don't be intimidated by the Advanced tags. Read them once for exposure even if they don't fully land — the second pass, after you've built something, is when they click.</div>

    <h2 id="goals">Learning goals ${L.new}</h2>
    <ul>
      <li>Use ML vocabulary precisely and choose the right technique for a problem.</li>
      <li>Explain a transformer end to end — tokens, embeddings, attention, the full block, and how text is generated — not just "it predicts the next word".</li>
      <li>Understand how LLMs are trained (pretraining, SFT, RLHF, DPO) and adapted cheaply (LoRA, quantisation).</li>
      <li>Know the whole generative-AI family: autoregressive LLMs, GANs, VAEs, diffusion models, and multimodal systems.</li>
      <li>Build and <em>evaluate</em> a production-grade RAG pipeline with hybrid search and reranking.</li>
      <li>Design agents with the right architecture (ReAct, Plan-Execute, Reflexion) plus memory, tools, and guardrails.</li>
      <li>Ship an agentic app with observability, evals, cost controls, and security.</li>
    </ul>

    <h2 id="curriculum">The eight modules ${L.new}</h2>
    <table class="tbl">
      <tr><th>Module</th><th>Newcomer takeaway</th><th>Advanced payload</th></tr>
      <tr><td><strong>01 · Foundations</strong></td><td>Learning types, fit, metrics, neural nets</td><td>Optimisers, regularisation, backprop, ROC/PR, calibration</td></tr>
      <tr><td><strong>02 · Transformers</strong></td><td>What attention is and why it won</td><td>Q/K/V math, MHA/MQA/GQA, RoPE, KV cache, MoE</td></tr>
      <tr><td><strong>03 · LLMs</strong></td><td>Tokens, decoding, prompting</td><td>Scaling laws, RLHF/DPO, LoRA/QLoRA, reasoning models</td></tr>
      <tr><td><strong>04 · Generative Models</strong></td><td>How images/audio are generated</td><td>Diffusion, GANs, VAEs, CLIP, multimodal LLMs</td></tr>
      <tr><td><strong>05 · RAG</strong></td><td>Ground a model in your data</td><td>Hybrid + rerank, contextual retrieval, RAG evals</td></tr>
      <tr><td><strong>06 · Agentic AI</strong></td><td>The agent loop &amp; tools</td><td>ReAct vs Plan-Execute vs Reflexion, memory, multi-agent, MCP</td></tr>
      <tr><td><strong>07 · Production</strong></td><td>Put it together, ship it</td><td>LLMOps, tracing, routing, OWASP-LLM security, cost engineering</td></tr>
      <tr><td><strong>08 · Assessments</strong></td><td>Check your understanding</td><td>Three graded assessments across the whole track</td></tr>
    </table>

    <h2 id="path">Two ways through ${L.new}</h2>
    <table class="tbl">
      <tr><th>If you're a fresher</th><th>If you're experienced</th></tr>
      <tr><td>Read every section top-to-bottom. Run each code block before moving on. Take Assessment 1 after Module 03, Assessment 2 after Module 05, and Assessment 3 after Module 07.</td><td>Skim ${L.new}, focus on ${L.int} and ${L.adv}. Go straight to the trade-off tables, math, code, and "failure modes" callouts. Use the assessments to find your gaps fast.</td></tr>
    </table>

    <h2 id="glossary">Quick glossary ${L.new}</h2>
    <p>A cheat-sheet of terms you'll meet, so nothing feels like jargon later:</p>
    <table class="tbl">
      <tr><th>Term</th><th>One-line meaning</th></tr>
      <tr><td><strong>Model / weights</strong></td><td>The learned numbers that turn an input into an output.</td></tr>
      <tr><td><strong>Parameter</strong></td><td>A single learnable number; "7B" means 7 billion of them.</td></tr>
      <tr><td><strong>Token</strong></td><td>A sub-word chunk of text — the unit a model actually reads and writes.</td></tr>
      <tr><td><strong>Embedding</strong></td><td>A list of numbers (a vector) that represents meaning.</td></tr>
      <tr><td><strong>Inference</strong></td><td>Running a trained model to get an answer (vs training it).</td></tr>
      <tr><td><strong>Context window</strong></td><td>How many tokens the model can "see" at once.</td></tr>
      <tr><td><strong>Fine-tuning</strong></td><td>Extra training to adapt a model to a task or style.</td></tr>
      <tr><td><strong>RAG</strong></td><td>Retrieve relevant text at query time and feed it to the model.</td></tr>
      <tr><td><strong>Agent</strong></td><td>An LLM in a loop that can use tools to get things done.</td></tr>
    </table>

    <h2 id="outcomes">What you'll be able to do ${L.new}</h2>
    <p>Take a plain problem — "answer support tickets from our docs", "generate product images", "book meetings for me", "summarise 200 PDFs" — and reason precisely about whether it needs a single prompt, a generative model, RAG, or a full agent, then <strong>build it, evaluate it, secure it, and estimate its cost</strong>.</p>
  `
};

/* ============================ MODULE 1 · FOUNDATIONS ============================ */
PAGES.m1 = {
  toc:[["stack","AI vs ML vs Deep Learning"],["types","Types of learning"],["data","Data, features & splits"],["fit","Bias, variance & fit"],["reg","Regularisation & normalisation"],["nn","Neural nets & backprop"],["opt","Optimisers & learning rate"],["loss","Loss functions"],["metrics","Metrics beyond accuracy"],["roc","ROC, PR & calibration"],["ex1","Worked example: classifier + threshold"]],
  html:`
    <div class="eyebrow">Module 01 · Foundations</div>
    <h1>AI <em>Foundations</em></h1>
    <p class="lede">The mental models everything else stands on — and the deep-learning machinery that makes transformers and LLMs possible in the first place.</p>

    <h2 id="stack">AI vs ML vs Deep Learning ${L.new}</h2>
    <p>These three terms are used loosely, but they actually nest inside each other like Russian dolls. Getting the distinction right stops a lot of later confusion.</p>
    <ul>
      <li><strong>Artificial Intelligence (AI)</strong> is the broadest goal: making machines do things that seem to require intelligence. This includes old-school rule systems (chess engines from the 1990s, a tax program full of if/else logic) as well as everything modern.</li>
      <li><strong>Machine Learning (ML)</strong> is the subset of AI where the system <em>learns patterns from data</em> instead of being told the rules by a programmer. You show it examples; it figures out the rule.</li>
      <li><strong>Deep Learning (DL)</strong> is the subset of ML built on <em>many-layered neural networks</em>. This is where images, speech, and language models live — including every LLM in this course.</li>
    </ul>
    <p>The single clearest dividing line: <strong>if a human hand-wrote every <code class="inline">if/else</code>, it's classic programming; if the behaviour was fitted from examples, it's ML.</strong> Generative AI (the whole point of this course) is a branch of deep learning that <em>produces new content</em> — text, images, audio, code — rather than just labelling or scoring existing content.</p>
    <div class="callout"><span class="tag">Discriminative vs generative</span>A <em>discriminative</em> model answers "which class is this?" (spam or not). A <em>generative</em> model answers "what comes next / what would a plausible example look like?" and can create new samples. LLMs and diffusion models are generative; a spam filter is discriminative. Keep this split in mind — Module 04 makes it central.</div>

    <h2 id="types">Types of learning ${L.new}</h2>
    <p>How a model learns depends on what kind of feedback it gets. There are four families you'll hear about constantly.</p>
    <h3>Supervised learning</h3>
    <p>The data has <strong>labels</strong> — every input ships with its correct answer. The model learns the mapping input → output by minimising its error on those known answers. Two sub-types:</p>
    <ul>
      <li><strong>Regression</strong> predicts a continuous number: house price, tomorrow's temperature, expected revenue.</li>
      <li><strong>Classification</strong> predicts a category: spam / not-spam, cat / dog / bird, positive / negative sentiment.</li>
    </ul>
    <h3>Unsupervised learning</h3>
    <p>No labels at all — the model finds structure on its own. Common jobs: <strong>clustering</strong> (group similar customers), <strong>dimensionality reduction</strong> (PCA, t-SNE, UMAP to compress and visualise high-dimensional data), and <strong>anomaly detection</strong> (flag the transactions that don't fit any cluster).</p>
    <h3>Self-supervised learning ${L.int}</h3>
    <p>The trick that makes modern LLMs possible. There are no human labels, but the model <em>creates its own</em> from raw data: hide the next word and predict it, or mask a word in the middle and reconstruct it. Because the "label" is just another part of the input, you can train on the entire internet without anyone labelling anything. <strong>This is how a base LLM is pre-trained.</strong></p>
    <h3>Reinforcement learning (RL) ${L.int}</h3>
    <p>An <strong>agent</strong> takes actions in an environment and learns from <strong>rewards</strong> — no correct answer is given, only a score for how things turned out. It powers game-playing AIs (Go, StarCraft) and a key alignment step for LLMs (RLHF, Module 03). Conceptually it is the seed of the agents in Module 06.</p>
    <div class="callout"><span class="tag">Thread to pull</span>"Take an action, observe feedback, adjust" is the RL loop — and it is exactly the loop an agentic LLM runs, with tools instead of a game controller. Hold onto this; it returns in Module 06.</div>

    <h2 id="data">Data, features & splits ${L.int}</h2>
    <p>Models are only as good as their data, so a few foundational ideas matter before any modelling.</p>
    <ul>
      <li><strong>Features</strong> are the input columns the model sees. <strong>Feature engineering</strong> — turning raw data into informative features (e.g. deriving "day of week" from a timestamp) — often beats a fancier model on tabular data. Deep learning reduces the need for it by learning features itself, which is a big part of why it took over vision and language.</li>
      <li><strong>The curse of dimensionality</strong> — as you add features, the space grows exponentially and data becomes sparse, so distances stop being meaningful. More columns is not always better; irrelevant features add noise.</li>
      <li><strong>Data leakage</strong> — accidentally letting information from the future or from the test set influence training. It produces amazing scores that collapse in production. The classic fix: fit every transformation (scalers, vocabularies) on <em>training data only</em>.</li>
    </ul>
    <p>Always split your data into <strong>train / validation / test</strong>. You learn weights on train, tune choices on validation, and touch test exactly once, at the very end. If you tune against test, you have quietly overfit to your own exam.</p>

    <h2 id="fit">Bias, variance & fit ${L.int}</h2>
    <p>A model's real job is not to memorise the training data — it's to <strong>generalise</strong> to data it has never seen. Two opposite failure modes stand in the way, and nearly every ML decision is a balance between them.</p>
    <table class="tbl">
      <tr><th></th><th>Underfitting (high bias)</th><th>Overfitting (high variance)</th></tr>
      <tr><td>Cause</td><td>Model too simple to capture the real pattern</td><td>Model memorises training noise, not the signal</td></tr>
      <tr><td>Train accuracy</td><td>Low</td><td>Very high</td></tr>
      <tr><td>Test accuracy</td><td>Low</td><td>Low (the giveaway)</td></tr>
      <tr><td>Fix</td><td>Bigger model, more/better features, train longer</td><td>More data, regularisation, simpler model, early stopping</td></tr>
    </table>
    <p>The tell-tale sign of overfitting is a <strong>large gap</strong> between training and test scores: the model aced the questions it saw and flunked the ones it didn't. Underfitting shows up as poor scores <em>everywhere</em>. The sweet spot in the middle is the <strong>bias–variance trade-off</strong>.</p>
    <h4>K-fold cross-validation ${L.adv}</h4>
    <p>With limited data, a single train/test split is noisy — you might get lucky or unlucky in what lands in each side. <strong>K-fold</strong> rotates the validation set: split the data into K equal parts, train on K−1 and validate on the held-out one, then repeat K times so every part is the validation set once. Average the K scores for a stable estimate, and read the variance across folds as a health check — a small dataset whose score swings wildly from fold to fold is warning you that any single number is unreliable.</p>

    <h2 id="reg">Regularisation & normalisation ${L.adv}</h2>
    <p><strong>Regularisation</strong> is the umbrella term for anything that fights overfitting by discouraging the model from becoming needlessly complex. The four you must know:</p>
    <ul>
      <li><strong>L2 (ridge)</strong> — adds a penalty proportional to the sum of <em>squared</em> weights. It shrinks all weights smoothly toward zero, discouraging any single feature from dominating, but rarely zeroes anything out completely.</li>
      <li><strong>L1 (lasso)</strong> — penalises the sum of <em>absolute</em> weights. Crucially, it drives some weights to <em>exactly</em> zero, giving you automatic feature selection (a sparse model that ignores useless inputs).</li>
      <li><strong>Dropout</strong> — during training, randomly switch off a fraction of neurons on each step so the network can't lean on any single pathway. It behaves like training an ensemble of many thinner networks and averaging them.</li>
      <li><strong>Early stopping</strong> — watch validation loss and stop the moment it stops improving, before the model starts memorising noise. Cheap and remarkably effective.</li>
    </ul>
    <p><strong>Normalisation</strong> is a different tool: it keeps the numbers flowing through the network well-scaled so training stays stable. <strong>Batch norm</strong> normalises each feature across a batch of examples; <strong>layer norm</strong> normalises across the features within a single example. <em>Layer norm is what transformers use</em> — it doesn't depend on batch size and works for variable-length sequences, both of which matter for language. You'll see it again, everywhere, in Module 02.</p>

    <h2 id="nn">Neural nets & backprop ${L.int}</h2>
    <p>A <strong>neuron</strong> does something almost embarrassingly simple: it multiplies each input by a <strong>weight</strong>, adds them up, adds a <strong>bias</strong>, and passes the result through a non-linear <strong>activation function</strong>. Stack thousands of these into layers, wire the outputs of one layer into the inputs of the next, and the whole network can approximate astonishingly complex functions.</p>
    <p>The non-linearity is not optional. Without it, stacking layers is pointless: a chain of linear steps collapses algebraically into a single linear step, so a 100-layer network would be no more powerful than one layer. The activation is what gives depth its power.</p>
    <table class="tbl">
      <tr><th>Activation</th><th>Behaviour</th><th>Use / caveat</th></tr>
      <tr><td><code>ReLU</code></td><td>max(0, x) — zero for negatives, linear for positives</td><td>Default for hidden layers; fast; can "die" (stuck at 0 forever)</td></tr>
      <tr><td><code>GELU</code></td><td>a smooth, curvy ReLU</td><td>Standard inside transformers</td></tr>
      <tr><td><code>Sigmoid</code></td><td>squashes any number to (0,1)</td><td>Binary output; saturates at the ends → vanishing gradients</td></tr>
      <tr><td><code>Tanh</code></td><td>squashes to (−1,1)</td><td>Zero-centred; also saturates</td></tr>
      <tr><td><code>Softmax</code></td><td>turns a vector into a probability distribution</td><td>Multi-class output layer; sums to 1</td></tr>
    </table>
    <p>Training is a four-step loop, repeated over millions of examples until the weights are good:</p>
    <ol>
      <li><strong>Forward pass</strong> — push an input through the network to get a prediction.</li>
      <li><strong>Loss</strong> — measure how wrong that prediction was with a loss function (below).</li>
      <li><strong>Backpropagation</strong> — use the chain rule from calculus to compute, for every single weight, how much it contributed to the error. That contribution is the weight's <em>gradient</em>.</li>
      <li><strong>Gradient descent</strong> — nudge every weight a small step in the direction that reduces the loss (opposite its gradient). Repeat.</li>
    </ol>
    <div class="callout deep"><span class="tag">Deep dive · vanishing & exploding gradients</span>In a deep network, a weight's gradient is a product of many terms, one per layer it flows back through. If those terms are consistently below 1, the product shrinks toward zero as it travels back — early layers barely learn (<em>vanishing</em>). If they're above 1, it blows up and training diverges (<em>exploding</em>). The fixes that made deep learning actually work: ReLU/GELU activations, careful weight initialisation, normalisation layers, <strong>residual (skip) connections</strong>, and gradient clipping. Residual connections in particular — giving the gradient a clean shortcut around each block — are why we can train networks hundreds of layers deep, and they are a core ingredient of the transformer.</div>
<pre><span class="c"># One training step (PyTorch-style) — this loop underlies everything</span>
<span class="f">pred</span> = model(x)               <span class="c"># forward pass</span>
loss = loss_fn(pred, y_true)   <span class="c"># how wrong were we?</span>
loss.<span class="f">backward</span>()               <span class="c"># backprop fills in every gradient</span>
optimizer.<span class="f">step</span>()               <span class="c"># nudge weights to reduce loss</span>
optimizer.<span class="f">zero_grad</span>()          <span class="c"># reset gradients for the next batch</span></pre>

    <h2 id="opt">Optimisers & learning rate ${L.adv}</h2>
    <p>Plain gradient descent computes the gradient over the whole dataset before each step — accurate but painfully slow. In practice we use smarter variants:</p>
    <ul>
      <li><strong>SGD (stochastic gradient descent)</strong> updates on one example at a time (very noisy); <strong>mini-batch</strong> uses a small batch (say 32–256) per step — the standard compromise between speed and stability.</li>
      <li><strong>Momentum</strong> keeps a moving average of recent gradients so updates build speed through flat regions and don't zig-zag across narrow valleys.</li>
      <li><strong>Adam / AdamW</strong> adapt a separate learning rate for every parameter using running estimates of the gradient's mean and variance. This is the default optimiser for deep nets and LLMs; AdamW is the version with correct weight decay.</li>
    </ul>
    <p>The <strong>learning rate</strong> — how big each step is — is the single most important hyperparameter. Too high and training overshoots and diverges; too low and it crawls or gets stuck in a bad spot. Modern training almost always uses a <strong>schedule</strong>: a short <em>warm-up</em> that ramps the rate up from near zero (avoiding early instability), followed by a <em>decay</em> (cosine or linear) down toward zero, so the model takes big confident steps early and delicate fine-tuning steps late.</p>

    <h2 id="loss">Loss functions ${L.int}</h2>
    <p>The loss is the number the optimiser actually tries to make small. Pick it to match the task, because it defines what "good" means to the model.</p>
    <table class="tbl">
      <tr><th>Task</th><th>Typical loss</th><th>Why</th></tr>
      <tr><td>Regression</td><td>MSE / MAE</td><td>Penalise distance from the true number. MSE punishes large errors much harder; MAE is more robust to outliers.</td></tr>
      <tr><td>Classification</td><td>Cross-entropy</td><td>Punishes confident wrong probabilities. <strong>This is exactly what an LLM minimises on next-token prediction.</strong></td></tr>
      <tr><td>Imbalanced / detection</td><td>Focal loss</td><td>Down-weights easy, common examples so rare classes aren't drowned out.</td></tr>
      <tr><td>Similarity / embeddings</td><td>Contrastive / triplet</td><td>Pull similar pairs together and push dissimilar pairs apart in vector space (used to train the embedding models in Module 05).</td></tr>
    </table>

    <h2 id="metrics">Metrics beyond accuracy ${L.int}</h2>
    <p>Accuracy — the fraction you got right — is intuitive but <strong>lies under class imbalance</strong>. If 99% of email is legitimate, a lazy model that always says "legitimate" scores 99% accuracy while catching zero spam. To see the truth, read the <strong>confusion matrix</strong>:</p>
    <table class="tbl">
      <tr><th></th><th>Predicted spam</th><th>Predicted legit</th></tr>
      <tr><td><strong>Actually spam</strong></td><td>True Positive (TP)</td><td>False Negative (FN) — a miss</td></tr>
      <tr><td><strong>Actually legit</strong></td><td>False Positive (FP) — a false alarm</td><td>True Negative (TN)</td></tr>
    </table>
    <ul>
      <li><strong>Precision</strong> = TP / (TP + FP) — of everything we flagged, how much was actually right? Punishes false alarms.</li>
      <li><strong>Recall</strong> = TP / (TP + FN) — of all the real positives out there, how many did we catch? Punishes misses.</li>
      <li><strong>F1</strong> = the harmonic mean of precision and recall — one balanced number when you care about both.</li>
    </ul>

    <h2 id="roc">ROC, PR & calibration ${L.adv}</h2>
    <p>Most classifiers don't output a hard yes/no — they output a <em>probability</em>, and you pick a <strong>threshold</strong> to turn it into a decision. Sweeping that threshold from 0 to 1 traces out curves that summarise the model at every operating point:</p>
    <ul>
      <li><strong>ROC-AUC</strong> — plots true-positive rate against false-positive rate across all thresholds. The area under it (AUC) equals the probability the model ranks a random positive above a random negative: 0.5 is a coin flip, 1.0 is perfect. It can look flatteringly high on very imbalanced data.</li>
      <li><strong>Precision–Recall curve</strong> — more honest than ROC when positives are rare, because it ignores the huge, easy mass of true negatives and focuses on the class you care about.</li>
      <li><strong>Calibration</strong> — when the model says "0.8", is it actually right about 80% of the time? A confident-but-miscalibrated model is dangerous in any decision system. Fix it with temperature scaling or Platt scaling after training.</li>
    </ul>
    <div class="callout tip"><span class="tag">Choose by the cost of error</span>Spam filter → favour precision (losing a real email hurts more than seeing one spam). Cancer screening → favour recall (a missed case is catastrophic; a false alarm just means another test). The metric follows the business cost, never the other way round.</div>

    <h2 id="ex1">Worked example: classifier + threshold tuning ${L.int}</h2>
    <p>The full supervised story in one script — plus the advanced move most tutorials skip: tuning the decision threshold to hit a target precision instead of blindly using 0.5.</p>
<pre><span class="k">from</span> sklearn.feature_extraction.text <span class="k">import</span> TfidfVectorizer
<span class="k">from</span> sklearn.linear_model <span class="k">import</span> LogisticRegression
<span class="k">from</span> sklearn.model_selection <span class="k">import</span> train_test_split
<span class="k">from</span> sklearn.metrics <span class="k">import</span> precision_recall_curve, classification_report
<span class="k">import</span> numpy <span class="k">as</span> np

X_tr, X_te, y_tr, y_te = train_test_split(emails, labels, test_size=<span class="n">0.3</span>, stratify=labels)

vec = TfidfVectorizer(ngram_range=(<span class="n">1</span>,<span class="n">2</span>))
Xtr = vec.<span class="f">fit_transform</span>(X_tr)     <span class="c"># learn vocab on TRAIN only (no leakage)</span>
Xte = vec.<span class="f">transform</span>(X_te)

clf = LogisticRegression(C=<span class="n">1.0</span>).<span class="f">fit</span>(Xtr, y_tr)   <span class="c"># C = inverse L2 strength</span>
proba = clf.<span class="f">predict_proba</span>(Xte)[:, <span class="n">1</span>]           <span class="c"># P(spam)</span>

<span class="c"># pick the threshold that gives >= 0.95 precision</span>
prec, rec, thr = precision_recall_curve(y_te, proba)
idx = np.<span class="f">argmax</span>(prec >= <span class="n">0.95</span>)
chosen = thr[idx]
preds = (proba >= chosen).astype(int)
<span class="f">print</span>(<span class="s">f"threshold={chosen:.2f}"</span>)
<span class="f">print</span>(classification_report(y_te, preds))</pre>
    <p>Two disciplines are on display. We fit the vectoriser on training data only (avoiding <strong>data leakage</strong>), and we <em>engineer the threshold to the business requirement</em> rather than accepting the 0.5 default. That single idea — decisions come from a probability plus a deliberately chosen threshold — carries all the way into agent guardrails in Module 06.</p>

    <div class="callout"><span class="tag">Assignment 01</span>On a real SMS-spam dataset: (a) compare Logistic Regression vs Naive Bayes using F1; (b) plot the precision–recall curve; (c) tune the threshold for 95% precision and report the recall you sacrificed. Then two sentences: which model would you ship, and why?</div>
  `
};

PAGES.m2 = {
  toc:[["why","Why transformers won"],["pipeline","The pipeline: text to output"],["embed","Token & positional embeddings"],["pos","Positional encodings (RoPE)"],["attn","Self-attention: Q, K, V"],["mha","Multi-head attention"],["block","The full transformer block"],["variants","Attention variants (MQA/GQA/Flash)"],["families","Encoder / decoder / enc-dec"],["kv","KV cache"],["moe","Mixture of Experts"],["ctx","Context window & long context"]],
  html:`
    <div class="eyebrow">Module 02 · The Architecture</div>
    <h1>The <em>Transformer</em>, in full</h1>
    <p class="lede">Every modern generative model — GPT, Claude, Gemini, Llama, Stable Diffusion's text encoder — is built on the transformer. This module opens it up completely, from the input tokens to the output, with the attention math at its heart.</p>

    <h2 id="why">Why transformers won ${L.new}</h2>
    <p>Before 2017, sequence models were <strong>RNNs</strong> (recurrent neural networks) and their better-behaved cousins <strong>LSTMs</strong>. They read text one word at a time, carrying a "hidden state" that summarised everything so far. Two problems crippled them:</p>
    <ul>
      <li><strong>They were sequential.</strong> Word 500 couldn't be processed until words 1–499 were done, so training couldn't be parallelised — a fatal flaw in the GPU era.</li>
      <li><strong>They forgot.</strong> Information had to survive being squeezed through the hidden state at every step, so long-range dependencies (a pronoun referring to a noun 40 words back) faded away. LSTMs helped but didn't cure it.</li>
    </ul>
    <p>The 2017 paper <em>"Attention Is All You Need"</em> threw out recurrence entirely and replaced it with <strong>attention</strong>: a mechanism that lets every word look directly at every other word in one parallel step, no matter how far apart. Suddenly training was fully parallel <em>and</em> long-range links were one hop away. That combination is why transformers took over, and why models could finally be scaled to billions of parameters.</p>
    <div class="callout new"><span class="tag">The one-sentence version</span>A transformer replaces "read left to right, remembering as you go" with "let every token attend to every other token at once" — parallel, and with no distance penalty on memory.</div>

    <h2 id="pipeline">The pipeline: text to output ${L.new}</h2>
    <p>Before the details, here is the whole journey a piece of text takes through a transformer. Every later section zooms into one of these boxes:</p>
<pre><span class="c">"The cat sat"</span>
   │
   ▼  <span class="c">1. TOKENISE — split into sub-word tokens</span>
["The", " cat", " sat"]
   │
   ▼  <span class="c">2. EMBED — each token → a vector of meaning</span>
   ▼  <span class="c">   + POSITIONAL info so order is known</span>
[vec, vec, vec]
   │
   ▼  <span class="c">3. TRANSFORMER BLOCKS (xN) — attention + FFN</span>
   ▼  <span class="c">   each token's vector is refined by looking at the others</span>
[richer, richer, richer]
   │
   ▼  <span class="c">4. OUTPUT HEAD — final vector → probability over vocab</span>
P(next token) → pick "on", "down", "quietly"...</pre>
    <p>An LLM simply repeats this loop: predict one token, append it, run the whole thing again. Everything in this module is about steps 2 and 3 — how the vectors are built and how attention refines them.</p>

    <h2 id="embed">Token & positional embeddings ${L.int}</h2>
    <p>A neural network only does maths on numbers, so the first job is turning each token into a vector. Two ideas stack here.</p>
    <h4>Token embeddings — meaning as geometry</h4>
    <p>Every token in the vocabulary gets a learned vector (say 4096 numbers long). These vectors are positioned during training so that <strong>meaning becomes geometry</strong>: words used in similar ways end up close together. The famous early demonstration (from Word2Vec, the 2013 ancestor of all this) was that vector arithmetic worked — <code class="inline">king − man + woman ≈ queen</code>. Modern transformers learn these embeddings as part of the model rather than separately, but the intuition is identical: <em>the embedding is where meaning is stored as a direction in space.</em></p>
    <h4>Positional embeddings — because attention is order-blind</h4>
    <p>Here's a subtlety that trips people up: pure attention has <strong>no idea what order the tokens are in.</strong> It treats the input like a bag of words, so "dog bites man" and "man bites dog" would look identical. To fix this, we add <strong>positional information</strong> to each token embedding so the model knows position 1 from position 5. The original transformer used fixed <em>sinusoidal</em> patterns; later models learned position vectors; the modern favourite is rotary (RoPE), covered next.</p>

    <h2 id="pos">Positional encodings, incl. RoPE ${L.adv}</h2>
    <p>How you inject position turns out to matter a lot for how far a model can generalise. The main schemes:</p>
    <ul>
      <li><strong>Sinusoidal (original)</strong> — add fixed sine/cosine waves of different frequencies to each position. Requires no training and extends to any length, but the model has to learn to decode it.</li>
      <li><strong>Learned absolute</strong> — a trainable vector per position (used by BERT, GPT-2). Simple, but it can't handle positions longer than it was trained on.</li>
      <li><strong>RoPE (Rotary Positional Embeddings)</strong> — instead of adding a position vector, it <em>rotates</em> the Query and Key vectors by an angle that depends on position. The elegant consequence: the attention score between two tokens then depends only on their <em>relative</em> distance, not their absolute positions. This is why RoPE (used in Llama, Mistral, and most current open models) extends gracefully to longer contexts and is the de-facto standard today.</li>
      <li><strong>ALiBi</strong> — skips embeddings entirely and instead adds a distance-based penalty to attention scores (far-away tokens get gently down-weighted). Also extrapolates well to longer sequences.</li>
    </ul>
    <div class="callout deep"><span class="tag">Deep dive · why "relative" matters</span>A model that only knows absolute positions ("this is token #512") struggles the moment you feed it a sequence longer than it saw in training. A model that reasons about relative distance ("this token is 3 back from that one") has learned something that stays true at any length. That is the core reason RoPE and ALiBi enable the long context windows modern models advertise.</div>

    <h2 id="attn">Self-attention: Q, K, V ${L.adv}</h2>
    <p>This is the beating heart of the transformer, so we'll go slowly. In plain terms: for every token, the model asks <em>"which other tokens should I pay attention to in order to understand myself?"</em> — and it answers that question for all tokens simultaneously.</p>
    <p>The mechanism uses three vectors, derived from each token by three learned weight matrices. The database-lookup analogy is the clearest way in:</p>
    <ul>
      <li><strong>Query (Q)</strong> — "what am I looking for?" Think of it as a search query the token issues.</li>
      <li><strong>Key (K)</strong> — "what do I offer / what am I about?" Each token advertises itself with a key, like a label on a filing cabinet.</li>
      <li><strong>Value (V)</strong> — "what I'll actually contribute if you attend to me." The content that gets passed along.</li>
    </ul>
    <p>A token's new representation is a <strong>weighted blend of every token's Value</strong>, where the weights come from how well its Query matches each Key. Strong match → that token's Value dominates the blend.</p>
<pre><span class="c"># Scaled dot-product attention — the single most important equation in modern AI</span>
scores  = Q @ K.T / sqrt(d_k)     <span class="c"># how well each query matches each key</span>
weights = softmax(scores)          <span class="c"># turn scores into a distribution (rows sum to 1)</span>
output  = weights @ V              <span class="c"># weighted blend of the values</span></pre>
    <p>Two pieces deserve a line each. The <code class="inline">softmax</code> converts raw match scores into clean probabilities that sum to 1, so each token's update is a proper weighted average. The <code class="inline">/ sqrt(d_k)</code> scaling stops the dot products from growing huge as the vector dimension grows, which would shove softmax into a flat, saturated region where gradients vanish and learning stalls.</p>
    <p>A concrete example: in <em>"The <strong>bank</strong> raised interest rates"</em>, the token "bank" issues a Query that strongly matches the Keys of "interest" and "rates". Their Values flow into "bank"'s new representation, resolving the ambiguity toward the financial meaning rather than a riverbank. Attention is how context disambiguates words.</p>
    <h4>Causal masking ${L.adv}</h4>
    <p>When a model is <em>generating</em> text, it must not peek at future tokens — that would be cheating, since at inference time the future doesn't exist yet. <strong>Causal masking</strong> enforces this by setting the attention scores for all future positions to −∞ before the softmax, so each token can only attend to itself and earlier tokens. This one trick is what makes a transformer able to generate left-to-right.</p>

    <h2 id="mha">Multi-head attention ${L.adv}</h2>
    <p>One attention computation can only focus on one kind of relationship at a time. Real language needs many at once — grammar, who-refers-to-whom, topic, tone. So transformers run <strong>several attention computations in parallel</strong>, called <em>heads</em>. Each head has its own Q/K/V matrices and is free to specialise: one head might track subject–verb agreement, another might follow long-range topic, another might resolve pronouns. Their outputs are concatenated and mixed back together. More heads = more relationships captured per layer, which is a big part of why transformers are so expressive.</p>

    <h2 id="block">The full transformer block ${L.adv}</h2>
    <p>Attention is only half of a transformer layer. A complete block wires four components together, and this exact pattern is repeated dozens of times (a "40-layer" model has 40 of these stacked):</p>
    <ol>
      <li><strong>Multi-head self-attention</strong> — tokens exchange information (the "communication" step).</li>
      <li><strong>Feed-forward network (FFN)</strong> — each token is then processed independently through a small 2-layer MLP (usually expanding to ~4× the width and back). This is the "thinking" step where the model transforms what it gathered. Fun fact: the FFN holds most of a transformer's parameters.</li>
      <li><strong>Residual (skip) connections</strong> — the input of each sub-layer is added back to its output. This gives gradients a clean highway and lets the model learn small refinements rather than rebuilding the signal from scratch — the same trick from Module 01 that made deep nets trainable.</li>
      <li><strong>Layer normalisation</strong> — keeps the numbers well-scaled at each step. Modern models put it <em>before</em> each sub-layer ("pre-norm"), which trains more stably than the original "post-norm" design.</li>
    </ol>
<pre><span class="c"># One transformer block, in pseudo-code (pre-norm style)</span>
x = x + <span class="f">attention</span>(<span class="f">layernorm</span>(x))     <span class="c"># communicate: tokens look at each other</span>
x = x + <span class="f">ffn</span>(<span class="f">layernorm</span>(x))           <span class="c"># compute: refine each token on its own</span>
<span class="c"># repeat this block N times, then a final head projects to vocabulary</span></pre>
    <p>That's it. A transformer is this block, stacked, with embeddings at the bottom and a probability-over-vocabulary head at the top. Everything impressive an LLM does emerges from scaling this simple, repeated structure.</p>

    <h2 id="variants">Attention variants: MQA, GQA, Flash ${L.adv}</h2>
    <p>Standard multi-head attention is powerful but memory-hungry at inference. Several variants trade a little quality for big speed/memory wins, and you'll see their names on model cards:</p>
    <table class="tbl">
      <tr><th>Variant</th><th>Idea</th><th>Why it exists</th></tr>
      <tr><td><strong>MHA</strong> (multi-head)</td><td>Every head has its own K and V</td><td>Most expressive; the original design</td></tr>
      <tr><td><strong>MQA</strong> (multi-query)</td><td>All heads share one K and V</td><td>Much smaller KV cache → faster inference, slight quality drop</td></tr>
      <tr><td><strong>GQA</strong> (grouped-query)</td><td>Heads share K/V in small groups</td><td>The sweet spot — near-MHA quality, near-MQA speed. Used by Llama-2/3 and most current models.</td></tr>
      <tr><td><strong>FlashAttention</strong></td><td>Same maths, smarter memory use on the GPU</td><td>Computes attention without ever materialising the huge score matrix → far less memory, much faster. Not an approximation — exact.</td></tr>
      <tr><td><strong>Sparse / sliding-window</strong></td><td>Each token attends only to a nearby window (+ a few globals)</td><td>Breaks the O(n²) cost for very long sequences; used in long-context models.</td></tr>
    </table>

    <h2 id="families">Encoder, decoder, encoder-decoder ${L.int}</h2>
    <p>Not every transformer is an LLM. The same block gets arranged into three families depending on the job — knowing which is which explains a lot of model names:</p>
    <table class="tbl">
      <tr><th>Family</th><th>How it attends</th><th>Good for</th><th>Examples</th></tr>
      <tr><td><strong>Encoder-only</strong></td><td>Every token sees every other (no mask) — full bidirectional context</td><td>Understanding: classification, search embeddings, NER</td><td>BERT, RoBERTa, most embedding models</td></tr>
      <tr><td><strong>Decoder-only</strong></td><td>Causal mask — each token sees only the past</td><td>Generation: text completion, chat</td><td>GPT, Claude, Llama, Gemini, Mistral</td></tr>
      <tr><td><strong>Encoder-decoder</strong></td><td>Encoder reads input fully; decoder generates output while attending to it</td><td>Transformation: translation, summarisation</td><td>T5, BART, original transformer</td></tr>
    </table>
    <p>The headline: <strong>the chatbots and LLMs you interact with are almost all decoder-only</strong> — a stack of causally-masked blocks that predicts the next token. Encoder-only models power the retrieval and embeddings you'll meet in Module 05. Same Lego brick, different assembly.</p>

    <h2 id="kv">KV cache ${L.adv}</h2>
    <p>When an LLM generates token by token, a naive implementation would re-compute attention over the entire sequence every single step — enormous wasted work. The <strong>KV cache</strong> fixes this: once a token's Key and Value vectors are computed, they never change, so we <em>store</em> them and reuse them. Each new token only computes its own Q/K/V and attends over the cached keys/values. This is the difference between generation being feasible and being hopeless. The catch: the cache grows with sequence length and eats GPU memory — which is exactly why MQA/GQA (which shrink the cache) were invented, and why very long conversations get expensive.</p>

    <h2 id="moe">Mixture of Experts (MoE) ${L.adv}</h2>
    <p>A standard ("dense") model runs every parameter for every token. A <strong>Mixture of Experts</strong> model instead has many parallel FFN "experts" and a small <em>router</em> that, for each token, activates only a few of them. So a model might have 400B total parameters but only run ~40B per token. The payoff: much larger capacity (more knowledge) at the compute cost of a far smaller model. The costs: all those experts must still fit in memory, and the router can load-balance poorly. MoE is behind several frontier models precisely because it decouples "how much the model knows" from "how much it costs to run each token."</p>

    <h2 id="ctx">Context window & long context ${L.int}</h2>
    <p>The <strong>context window</strong> is the maximum number of tokens the model can attend over at once — its working memory for a single request. Everything (system prompt, your message, retrieved documents, the conversation so far, and the response being generated) must fit inside it. Two consequences to internalise:</p>
    <ul>
      <li><strong>Cost is quadratic.</strong> Because standard attention compares every token to every other, doubling the context roughly quadruples the attention compute. Long context is genuinely expensive — this is the reason behind FlashAttention, sparse attention, and prompt-trimming discipline.</li>
      <li><strong>"Lost in the middle."</strong> Even within the window, models often attend best to the beginning and end and can overlook material buried in the middle. Put the most important instructions and context where the model looks hardest.</li>
    </ul>
    <div class="callout tip"><span class="tag">Why this module pays off later</span>Every practical decision downstream — why long prompts cost more (Module 07), why we retrieve <em>few, relevant</em> chunks instead of dumping everything (Module 05), why agent memory must be compressed (Module 06) — traces straight back to the quadratic attention cost you just learned here.</div>

    <div class="callout"><span class="tag">Assignment 02</span>Implement scaled dot-product attention from scratch in NumPy for a 4-token toy sequence: build Q, K, V, compute the score matrix, apply a causal mask, softmax it, and produce the output. Then (a) print the attention weights and interpret which token attends to which; (b) add a second head and concatenate; (c) in two sentences, explain what would break if you removed the <code>/sqrt(d_k)</code> scaling.</div>
  `
};
