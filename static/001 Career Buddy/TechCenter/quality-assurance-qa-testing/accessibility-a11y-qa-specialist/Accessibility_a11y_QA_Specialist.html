<style>

.mb{display:none}

details{border:1px solid var(--line);border-radius:10px;margin:10px 0;background:#fff}summary{padding:12px 16px;font-weight:600;cursor:pointer}details p{padding:0 16px 12px;margin:0}
.nb{background:var(--acc);color:#fff;border:0;padding:11px 24px;border-radius:8px;font-weight:600;cursor:pointer;margin-top:12px;font-size:15px}
.ov{display:none;position:fixed;inset:0;z-index:1000;background:var(--bg);overflow-y:auto;user-select:none;-webkit-user-select:none}.ov.open{display:block}
.ovb{max-width:860px;margin:0 auto;padding:0 24px 60px}.osh{position:sticky;top:0;background:var(--bg);padding-top:20px;z-index:5}
.ovh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.ovt{font-size:19px;font-weight:700}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0 18px}.bar i{display:block;height:100%;background:var(--acc);transition:width .3s}

.q label{display:flex;gap:10px;align-items:center;padding:10px 14px;margin:8px 0;border:1px solid var(--line);border-radius:8px;background:var(--soft);cursor:pointer}.q label:hover{border-color:var(--acc)}
.rv{margin:10px 0;padding:12px 16px;border-radius:10px;font-size:14.5px}.rv.g{background:var(--greens)}.rv.b{background:var(--reds)}
.big{font-size:46px;font-weight:700;text-align:center;margin:10px 0}
.ph{margin-bottom:6px}.eyebrow2{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}.ptitle2{font-size:36px;line-height:1.15;font-weight:700;margin:6px 0 10px}.psub2{color:var(--ink2);font-size:17px;max-width:720px;margin:0 0 18px}
.toc a.active{background:var(--acc);color:#fff;font-weight:600}.section h2 span{margin-right:4px}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}@media(max-width:640px){.compare{grid-template-columns:1fr}}.cc{border-radius:10px;padding:12px 16px;font-size:14.5px;border:1px solid var(--line)}.cc b{display:block;margin-bottom:4px}.cc.bad{background:var(--reds);border-color:#f5b5ac}.cc.good{background:var(--greens);border-color:#bdd9d2}
.callout{display:flex;gap:12px}.callout:before{content:"\1F4A1";font-size:20px}

<div class="ha"><span class="pill"><span class="dot"></span><span id="pt" aria-live="polite"></span></span><button class="btn" onclick="act(0)">Reset</button></div></div><nav class="tabbar" id="tabbar" aria-label="Course modules"></nav></header>

<script>
const P=s=>s,pre=s=>`<pre><button class="cp">Copy</button><code>${s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</code></pre>`;
const tb=(h,r)=>`<div class="tblw"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.map(x=>`<tr>${x.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table></div>`;
const cards=a=>`<div class="grid">${a.map(([t,d],i)=>`<div class="card" style="--c:hsl(${i*47+200},55%,38%)"><b>${t}</b>${d}</div>`).join('')}</div>`;
const flow=a=>`<div class="fl">${a.map(x=>`<div class="st">${x}</div>`).join('')}</div>`;
const co=(t,k='')=>`<div class="callout ${k}">${t}</div>`;
const M=[
['Overview & Fundamentals','♿','Course Overview & Accessibility Fundamentals','What accessibility QA is, who it serves and the principles behind every check you will run.','linear-gradient(135deg,#14213D,#2f7d5b)',[
['1. Course Overview',`<p>An Accessibility (a11y) QA Specialist makes sure websites, apps and documents can be used by everyone, including people who are blind, have low vision, are deaf or hard of hearing, have motor or cognitive disabilities, or rely on assistive technology. You will learn to audit against <b>WCAG 2.1 / 2.2</b>, understand <b>Section 508</b> and <b>ADA</b> expectations, test with screen readers, braille displays and switch devices, use auditing tools, and inspect code for semantics, ARIA, keyboard order, focus and announcements.</p>${cards([['Standards & Compliance','WCAG 2.1/2.2 (A, AA, AAA), Section 508, ADA'],['Assistive Technologies','JAWS, NVDA, VoiceOver, TalkBack, braille, switch'],['Auditing Tools','axe DevTools, WAVE, Lighthouse, ARC Toolkit, contrast analyzers'],['Code Inspection','Semantic HTML, ARIA, tab order, focus, live announcements']])}`],
['2. Learning Objectives',`<ul><li>Map any defect to the correct WCAG success criterion and level.</li><li>Explain legal drivers: ADA, Section 508 and related laws.</li><li>Operate NVDA, JAWS, VoiceOver and TalkBack for test sessions.</li><li>Run automated scans and know what they miss.</li><li>Inspect markup, ARIA, focus order and dynamic announcements.</li><li>Write clear a11y defects and an Accessibility Conformance Report.</li></ul>`],
['3. Prerequisites',`<ul><li>Basic HTML and CSS reading ability (tags, attributes, forms).</li><li>Familiarity with browser DevTools.</li><li>General QA concepts: test cases, defects, severity and priority.</li><li>A Windows or macOS machine and an Android or iOS device for practice.</li></ul>${co('No coding is needed to start, but you must be comfortable reading code to inspect it.')}`],
['4. Fundamentals',`<p>Accessibility means removing barriers so people with disabilities can perceive, operate and understand content. It also helps older users, people on small screens, bright sunlight or noisy places. WCAG organises everything under four principles called <b>POUR</b>.</p>${tb(['Principle','Meaning','Example check'],[['Perceivable','Users can sense the content','Alt text, captions, contrast'],['Operable','Users can use controls','Keyboard access, no traps, enough time'],['Understandable','Content and behaviour are clear','Labels, error messages, language'],['Robust','Works with current and future AT','Valid semantics, name/role/value']])}<h3>Common user needs</h3>${cards([['Blind','Screen reader, braille display'],['Low vision','Zoom, high contrast, large text'],['Motor','Keyboard only, switch, voice control'],['Deaf / HoH','Captions and transcripts'],['Cognitive','Plain language, consistent layout']])}`]]],
['Standards & Core Concepts','📜','Standards, Compliance & Core Concepts','WCAG 2.1 / 2.2, conformance levels and the laws that make accessibility mandatory.','linear-gradient(135deg,#3b2a6b,#2f6fb0)',[
['5. Core Concepts',`<h3>WCAG conformance levels</h3>${tb(['Level','Meaning','Examples'],[['A','Minimum; barriers that block users','Alt text, keyboard operable, no keyboard trap'],['AA','Standard target for most laws','4.5:1 text contrast, captions, reflow, focus visible'],['AAA','Highest; not required for whole sites','7:1 contrast, sign language, reading level']])}<h3>What WCAG 2.2 added</h3><ul><li><b>2.4.11</b> Focus Not Obscured (Minimum), AA</li><li><b>2.5.7</b> Dragging Movements, AA</li><li><b>2.5.8</b> Target Size (Minimum) 24 by 24 CSS px, AA</li><li><b>3.2.6</b> Consistent Help, A</li><li><b>3.3.7</b> Redundant Entry, A</li><li><b>3.3.8</b> Accessible Authentication (Minimum), AA</li></ul>${co('WCAG 2.2 builds on 2.1, so a site that meets 2.2 also meets 2.1 (the obsolete 4.1.1 Parsing was removed in 2.2).')}<h3>Laws and policies</h3>${tb(['Standard','Who it applies to','Key point'],[['Section 508 (US)','Federal agencies and their ICT','Refresh incorporates WCAG 2.0 A and AA'],['ADA (US)','Public entities (Title II) and public accommodations (Title III)','Courts treat websites as covered; DOJ rule for state/local government adopts WCAG 2.1 AA'],['EN 301 549 / EAA','EU public sector and many products','References WCAG 2.1 AA']])}${co('Laws change. Always confirm the current rule and deadlines with legal counsel before citing them in a report.','warn')}`],
['6. Topics & Subtopics',`${tb(['Topic','Subtopics'],[['Perceivable','Text alternatives, captions, audio description, contrast, text spacing, reflow'],['Operable','Keyboard, focus order, focus visible, skip links, timing, motion, target size'],['Understandable','Page language, labels, instructions, errors, consistent navigation'],['Robust','Name/role/value, status messages, valid markup, ARIA'],['Assistive tech','Screen readers, braille, switch, magnifiers, voice control'],['Reporting','Defects, severity, VPAT / ACR, remediation tracking']])}`]]],
['Examples & Hands-on','🧪','Practical Examples & Hands-on Practice','See real inaccessible code, fix it, then practise on your own machine.','linear-gradient(135deg,#7a2f1f,#d9730d)',[
['7. Practical Examples',`<h3>Fake button vs real button</h3>${pre('<!-- Bad: not focusable, no role, no keyboard -->\n<div onclick="save()">Save</div>\n\n<!-- Good: native element gives role, focus, Enter and Space -->\n<button type="button" onclick="save()">Save</button>')}<h3>Form label and error</h3>${pre('<label for="email">Email</label>\n<input id="email" type="email" aria-describedby="err" aria-invalid="true">\n<p id="err">Enter an email like name@example.com</p>')}<h3>Announce a status message</h3>${pre('<div role="status" aria-live="polite" id="msg"></div>\n<script>msg.textContent = "3 items added to cart";<\/script>')}<h3>Contrast example</h3><p>Grey text <code>#777777</code> on white has a ratio of about 4.48:1, which fails AA for normal text (needs 4.5:1). Darken it to <code>#767676</code> or darker.</p>`],
['8. Hands-on Practice',`${flow(['Unplug the mouse','Tab through a page','Run axe scan','Read with NVDA','Check contrast','Log defects'])}<ol><li><b>Keyboard lab:</b> use Tab, Shift+Tab, Enter, Space and Esc on a sign-up page. Note any lost focus, trap or hidden control.</li><li><b>Screen reader lab:</b> turn on NVDA (Windows) or VoiceOver (Cmd+F5) and complete a form with your eyes closed or screen off.</li><li><b>Automated lab:</b> run axe DevTools and Lighthouse, then compare findings.</li><li><b>Zoom lab:</b> zoom to 400% and check reflow and clipped content.</li><li><b>Mobile lab:</b> enable TalkBack or iOS VoiceOver and swipe through a form.</li></ol>`]]],
['Intermediate & Advanced','🧠','Intermediate & Advanced Concepts','ARIA, focus management, dynamic content and complex widgets.','linear-gradient(135deg,#0b4f5c,#2f7d5b)',[
['9. Intermediate Concepts',`<p><b>First rule of ARIA:</b> use a native HTML element if one exists. ARIA only changes what assistive technology hears; it adds no behaviour or keyboard support.</p>${tb(['Concept','What to verify'],[['Landmarks','header, nav, main, footer or matching roles; one main per page'],['Headings','One h1, logical levels, no skipped levels used for styling'],['Accessible name','Every control has a name from label, text or aria-label'],['Tab order','Follows visual and reading order; avoid positive tabindex'],['Tables','th with scope; caption for data tables'],['Images','Meaningful alt; decorative uses alt=""']])}${pre('<nav aria-label="Primary">...</nav>\n<button aria-expanded="false" aria-controls="menu">Menu</button>\n<img src="chart.png" alt="Sales rose 20% in Q2">')}`],
['10. Advanced Concepts',`<ul><li><b>Focus management:</b> when a modal opens move focus inside, trap Tab within it, close with Esc, then return focus to the trigger.</li><li><b>SPA route changes:</b> move focus to the new heading and update the page title so users know the page changed.</li><li><b>Live regions:</b> <code>polite</code> waits for a pause, <code>assertive</code> interrupts; use sparingly.</li><li><b>Custom widgets:</b> tabs, combobox and menus must follow the WAI-ARIA Authoring Practices keyboard patterns.</li><li><b>Motion and preferences:</b> honour <code>prefers-reduced-motion</code> and avoid flashing more than 3 times a second.</li><li><b>Braille and switch:</b> check text order and that every action can be reached by sequential scanning.</li></ul>${pre('dialog.addEventListener("close", () => trigger.focus());\nmain.querySelector("h1").setAttribute("tabindex","-1");\nmain.querySelector("h1").focus(); // after route change')}`]]],
['Tools & Testing','🛠️','Tools, Workflows, Testing & Quality','Assistive technologies, auditing tools and a repeatable test process.','linear-gradient(135deg,#4a1d6b,#ad1a72)',[
['11. Tools & Workflows',`<h3>Assistive technologies</h3>${tb(['Technology','Platform','Typical pairing'],[['JAWS','Windows (paid)','Chrome, Edge'],['NVDA','Windows (free)','Firefox, Chrome'],['VoiceOver','macOS / iOS','Safari'],['TalkBack','Android','Chrome'],['Refreshable braille display','Connects to screen reader','Check text order and labels'],['Switch device','Sequential scanning','Everything reachable by keyboard focus']])}<h3>Auditing tools</h3>${tb(['Tool','Use'],[['axe DevTools','Rule-based scan with guided fixes'],['WAVE','Visual overlay of errors and structure'],['Lighthouse','Quick score inside Chrome DevTools'],['ARC Toolkit','Detailed checks and tab order view'],['Colour Contrast Analyser','Measure contrast of any pixels']])}${flow(['Plan scope','Automated scan','Keyboard test','Screen reader test','Code inspection','Report & retest'])}`],
['12. Testing & Quality',`<p>Automated tools catch only part of the problems, so every audit combines automated, manual and assistive technology testing.</p>${tb(['Severity','Meaning','Example'],[['Critical','Blocks a task for a group of users','Checkout button not keyboard accessible'],['High','Major difficulty, workaround exists','Missing form labels'],['Medium','Frustrating','Skipped heading level'],['Low','Minor','Redundant title attribute']])}<p>Document results in an <b>Accessibility Conformance Report (ACR)</b> based on a VPAT. Every defect should name the WCAG criterion, steps to reproduce, the AT and browser used, and a recommended fix.</p>${pre('Title: Checkout - Pay button not reachable by keyboard\nWCAG: 2.1.1 Keyboard (A)\nEnv: Chrome 126 + NVDA 2024.1\nSteps: 1. Tab through the form 2. Reach order summary\nExpected: Pay button receives focus\nActual: Focus skips the div-based button\nSeverity: Critical')}`]]],
['Projects & Best Practices','🚀','Projects, Best Practices & Troubleshooting','Apply the skills end to end and avoid the mistakes testers make most.','linear-gradient(135deg,#1f3a8a,#0e7490)',[
['13. Real-World Projects',`<h3>Project: Audit an e-commerce checkout</h3><ol><li>Define scope: home, search, product, cart, checkout.</li><li>Run axe and WAVE on each page and record issues.</li><li>Test every flow with keyboard only.</li><li>Complete a purchase with NVDA and VoiceOver.</li><li>Check contrast, zoom to 400%, and text spacing.</li><li>Inspect code for semantics, ARIA and focus handling.</li><li>Write defects, prioritise, then produce an ACR and retest fixes.</li></ol>${co('Deliverables: defect log, ACR, summary of conformance by WCAG level, and a remediation plan.','ok')}`],
['14. Best Practices',`<ul><li>Test early in design and not only before release.</li><li>Combine automated, manual and AT testing.</li><li>Use real screen readers, not only simulators.</li><li>Prefer native HTML and use ARIA only to fill gaps.</li><li>Include people with disabilities in usability testing.</li><li>Add accessibility checks to the definition of done and CI pipeline.</li><li>Use anonymised test data and never share screenshots containing personal information.</li></ul>`],
['15. Common Errors & Troubleshooting',`${tb(['Problem','Cause','Fix'],[['Screen reader says "button" with no name','Icon button without a label','Add aria-label or visible text'],['Focus disappears','Element removed or outline hidden','Return focus and restore focus styles'],['Keyboard trap','Modal without Esc handling','Allow Esc and move focus out'],['Status not announced','No live region or inserted too late','Pre-render role="status" container'],['Low contrast flagged','Light grey text','Adjust to 4.5:1 or 3:1 for large text'],['Reading order wrong','CSS visual reorder','Fix the DOM order']])}`]]],

['16. Interview Preparation',`<details><summary>What is the difference between WCAG A, AA and AAA?</summary><p>A is the minimum, AA is the common legal target and AAA is the highest, rarely required for an entire site.</p></details><details><summary>How would you test a login page for accessibility?</summary><p>Run an automated scan, use keyboard only, check labels, error messages and focus, then test with a screen reader and verify contrast.</p></details><details><summary>Why can ARIA make things worse?</summary><p>Incorrect roles or states give false information to assistive technology. Native elements are safer.</p></details><details><summary>How do you test a modal dialog?</summary><p>Focus moves in, Tab is trapped, Esc closes it, focus returns to the trigger and it is announced as a dialog.</p></details><details><summary>Can automated tools prove WCAG compliance?</summary><p>No. They find only a portion of issues, so manual and AT testing are required.</p></details><details><summary>Severity vs priority for an a11y defect?</summary><p>Severity is how badly users are blocked; priority is business urgency, often raised by legal risk.</p></details>`],
['17. Assessments',`<p>A timed, exam-style final assessment for the Accessibility (a11y) QA Specialist track. Questions cover every module of the course and are shuffled on every attempt.</p><ul><li><b>50 multiple-choice questions</b> — concept checks plus scenario-based judgement calls</li><li>60-minute timer, question palette, mark-for-review, full explanations after you submit</li><li>Fullscreen test, no tab or window switching (three warnings auto-submit), copy and right-click disabled</li><li>Pass mark is 70%.</li><li>Your attempts and top score are saved in this browser</li></ul>${co('These browser controls only discourage casual cheating. For high-stakes use, validate answers and attempts on your LMS server.','warn')}<button class="nb" id="assessStartBtn" type="button">▶ Start Assessment</button><div id="scoreBoard" style="display:none"></div>`],
['18. Course Summary',`${cards([['Standards','WCAG 2.1/2.2 A, AA, AAA with Section 508 and ADA as legal drivers'],['AT','JAWS, NVDA, VoiceOver, TalkBack, braille and switch'],['Tools','axe, WAVE, Lighthouse, ARC, contrast analyzers'],['Code','Semantic HTML, ARIA, focus, tab order, live regions']])}<p>You can now audit a product end to end, write precise defects, and report conformance. Next steps: practise on real sites, build a portfolio of audits, and consider the IAAP WAS or CPACC certification.</p>`]]]];

oided because they break order", "Required", "For buttons only"], "answer": 1, "exp": "They create confusing tab order."}, {"q": "When a modal opens, focus should...", "options": ["Stay on trigger", "Move inside and return on close", "Go to body", "Go to footer"], "answer": 1, "exp": "Focus is managed in and out of dialogs."}, {"q": "A decorative image should have...", "options": ["Long description", "alt=\"\"", "The file name", "No alt attribute"], "answer": 1, "exp": "Empty alt hides decoration from screen readers."}, {"q": "Automated tools typically find...", "options": ["All issues", "All WCAG failures", "Only a portion of issues", "Nothing"], "answer": 2, "exp": "Manual testing is still essential."}, {"q": "Which tool is made by Deque?", "options": ["WAVE", "axe DevTools", "ARC Toolkit", "Lighthouse"], "answer": 1, "exp": "axe is from Deque."}, {"q": "WAVE is produced by?", "options": ["WebAIM", "Deque", "Microsoft", "Apple"], "answer": 0, "exp": "WAVE comes from WebAIM."}, {"q": "Section 508 mainly applies to?", "options": ["US federal agencies ICT", "All EU shops", "Print only", "Games only"], "answer": 0, "exp": "It covers US federal ICT."}, {"q": "Reflow expects content to work at?", "options": ["200% only", "400% zoom (320 CSS px) without 2D scroll", "No zoom", "Only desktop"], "answer": 1, "exp": "WCAG 1.4.10 Reflow."}, {"q": "Best test data for a11y screenshots?", "options": ["Real customer data", "Anonymised test data", "Public share", "No data"], "answer": 1, "exp": "Protect personal information."}, {"q": "An input with only a placeholder...", "options": ["Has a good name", "Needs a visible label", "Is fine at AAA", "Is better than label"], "answer": 1, "exp": "Placeholders are not reliable labels."}, {"q": "Which WCAG criterion requires all functionality to be keyboard operable?", "options": ["1.4.3", "2.1.1", "3.3.1", "4.1.2"], "answer": 1, "exp": "2.1.1 Keyboard (Level A)."}, {"q": "SC 1.1.1 is about?", "options": ["Captions", "Non-text content", "Contrast", "Focus order"], "answer": 1, "exp": "It requires text alternatives for non-text content."}, {"q": "Which role announces status messages politely?", "options": ["alert", "status", "dialog", "banner"], "answer": 1, "exp": "role=status is a polite live region."}, {"q": "What does aria-hidden=\"true\" do?", "options": ["Hides from sighted users", "Removes the element from the accessibility tree", "Disables the element", "Makes text bold"], "answer": 1, "exp": "It hides content from assistive technology only."}, {"q": "Why add a skip link?", "options": ["Skip adverts", "Bypass repeated blocks (2.4.1)", "Skip login", "Hide the menu"], "answer": 1, "exp": "Keyboard users jump straight to main content."}, {"q": "Where should the page language be declared?", "options": ["meta charset", "lang attribute on html", "title element", "dir attribute"], "answer": 1, "exp": "3.1.1 Language of Page uses the lang attribute."}, {"q": "Which link text should be avoided?", "options": ["Descriptive text", "Vague text such as click here", "Text that states purpose", "Unique labels"], "answer": 1, "exp": "Links need meaningful text out of context."}, {"q": "WCAG 2.2 Target Size (Minimum) is?", "options": ["10 px", "24 by 24 CSS px", "44 px", "48 px"], "answer": 1, "exp": "SC 2.5.8 sets 24 by 24 CSS pixels at AA."}, {"q": "Which SC requires a visible keyboard focus indicator?", "options": ["2.4.7 Focus Visible", "1.3.1", "3.1.1", "1.4.1"], "answer": 0, "exp": "Focus Visible is 2.4.7."}, {"q": "Showing errors only in red fails which criterion?", "options": ["1.4.1 Use of Color", "2.1.1", "4.1.2", "3.2.1"], "answer": 0, "exp": "Colour must not be the only visual means of information."}, {"q": "Captions for prerecorded video are required at which level?", "options": ["Level A", "AA only", "AAA only", "Not required"], "answer": 0, "exp": "1.2.2 Captions (Prerecorded) is Level A."}, {"q": "Audio description for prerecorded video (1.2.5) is which level?", "options": ["A", "AA", "AAA", "None"], "answer": 1, "exp": "1.2.5 is Level AA."}, {"q": "Minimum contrast for UI components and graphics (1.4.11)?", "options": ["3:1", "4.5:1", "7:1", "2:1"], "answer": 0, "exp": "Non-text contrast is 3:1."}, {"q": "Who makes JAWS?", "options": ["Vispero", "Deque", "Apple", "Google"], "answer": 0, "exp": "JAWS is a Vispero product."}, {"q": "What is the VoiceOver rotor used for?", "options": ["Taking photos", "Navigating by headings, links and landmarks", "Changing brightness", "Zooming"], "answer": 1, "exp": "The rotor lists navigation targets."}, {"q": "A refreshable braille display outputs?", "options": ["Audio", "Tactile braille text", "Video", "Vibration alerts only"], "answer": 1, "exp": "It shows text from the screen reader as braille."}, {"q": "Switch device users mainly depend on?", "options": ["Mouse hover", "Sequential focus or scanning", "Voice", "Touch gestures"], "answer": 1, "exp": "Everything must be reachable via focus order."}, {"q": "A Lighthouse accessibility score is?", "options": ["Proof of compliance", "A partial automated indication", "A replacement for manual testing", "A speed metric"], "answer": 1, "exp": "It covers only automatically detectable issues."}, {"q": "ARC Toolkit is produced by?", "options": ["TPGi", "WebAIM", "Deque", "Google"], "answer": 0, "exp": "ARC Toolkit is from TPGi."}, {"q": "A Colour Contrast Analyser measures?", "options": ["Page speed", "Foreground and background contrast", "Alt text", "Headings"], "answer": 1, "exp": "It computes contrast ratios."}, {"q": "Best element for the main navigation block?", "options": ["div", "nav", "span", "b"], "answer": 1, "exp": "nav provides a landmark."}, {"q": "Visible label and accessible name should?", "options": ["Never match", "Match, so voice users can speak the label (2.5.3)", "Be hidden", "Use title"], "answer": 1, "exp": "Label in Name helps speech users."}, {"q": "A good form error should?", "options": ["Show only a red border", "Identify the field and describe the error in text", "Use an alert only", "Be hidden"], "answer": 1, "exp": "3.3.1 Error Identification."}, {"q": "How should data table headers be marked?", "options": ["td", "th with scope", "div", "span"], "answer": 1, "exp": "th with scope exposes relationships."}, {"q": "What causes a keyboard trap failure (2.1.2)?", "options": ["Esc closes dialog", "Focus stuck with no way out", "Skip link", "Natural order"], "answer": 1, "exp": "Users must always be able to move focus away."}, {"q": "3.3.8 Accessible Authentication discourages?", "options": ["Password managers", "Cognitive tests such as puzzles without alternative", "Email login", "Single sign-on"], "answer": 1, "exp": "Login must not rely on memory or puzzle solving alone."}, {"q": "1.4.12 Text Spacing means?", "options": ["Content keeps working when spacing is adjusted", "Spacing is fixed", "Font must be 20px", "No letter spacing"], "answer": 0, "exp": "Users can override spacing without loss."}, {"q": "Flashing content limit (2.3.1)?", "options": ["No more than 3 flashes per second", "10 per second", "Unlimited", "None allowed ever"], "answer": 0, "exp": "Three flashes per second protects against seizures."}, {"q": "The purpose of a VPAT or ACR is to?", "options": ["Market the product", "Document product conformance", "Review code", "Load test"], "answer": 1, "exp": "It reports conformance against standards."}, {"q": "When sharing an audit with screenshots you should?", "options": ["Post it publicly", "Redact personal data and credentials", "Include passwords", "Send tokens unencrypted"], "answer": 1, "exp": "Protect personal and sensitive information."}]};

const cmp=(a,b,c,d)=>`<div class="compare"><div class="cc bad"><b>&#10060; ${a}</b>${b}</div><div class="cc good"><b>&#9989; ${c}</b>${d}</div></div>`;
const S=M.flatMap(m=>m[5]),EM=["♿", "🎯", "📚", "🧱", "⚙️", "🗂️", "💻", "🧪", "🔧", "🚀", "🛠️", "✅", "🏗️", "⭐", "🩺", "🎤", "📝", "🏁"],X=["Throughout the course you will alternate between three modes of work: reading the standard, operating assistive technology, and inspecting code. A good specialist is fluent in all three because a defect found in one mode usually needs evidence from another. For example, a screen reader announcement problem is confirmed in the accessibility tree and then fixed in markup.", "Write objectives as observable skills. Instead of knowing WCAG, aim to be able to take a failing page, name the success criterion, reproduce it with a named browser and screen reader, and recommend a code-level fix. Review the list at the end of each section and tick off what you can now demonstrate.", "If you are new to code, spend an hour in DevTools. Right-click an element, choose Inspect, and open the Accessibility pane to see the computed name, role and states that assistive technology receives. This single habit makes later sections much easier.", "Disability can be permanent, temporary or situational: a broken arm, a bright screen outdoors or a noisy train. Designing for these cases improves usability for everyone. Remember also that accessibility is a shared responsibility across design, development, content and QA, not only a final test.", "Conformance is measured per page and per success criterion, and a page conforms only when all criteria at the chosen level pass. Partial claims are allowed for specific processes such as a full checkout flow. Techniques are sufficient ways to meet a criterion, while failures are documented patterns that always fail it.", "Use this topic map to plan an audit. For each topic list the criteria involved, the component types affected (forms, tables, media, navigation) and the test method. Building the map before testing prevents gaps and makes your report easier to structure.", "After each example, change the code on purpose to break it, then check what the screen reader and axe report. Seeing both the pass and fail results builds the pattern recognition that experienced auditors rely on.", "Record short notes while you practise: the tool, version, browser, steps and result. These notes become your portfolio and the evidence section of real defect reports. Repeat each lab on a different site so you see how the same defect appears in different designs.", "Accessible names are computed in a defined order: aria-labelledby, aria-label, native label or text content, then title or placeholder as fallbacks. Knowing this order explains why an element can look labelled yet be announced with a different name. Check the computed name in the browser accessibility pane.", "Test advanced widgets with several screen reader and browser pairs because support differs. Prefer patterns from the WAI-ARIA Authoring Practices, keep keyboard behaviour consistent and provide a simpler native alternative when a custom control cannot be made reliable.", "A practical workflow is to run automated tools first for quick wins, then keyboard, then screen reader, then visual checks such as zoom and contrast. Keep a checklist per page type and retest after every fix. Integrate axe into CI so regressions are caught before manual testing starts.", "Quality means traceability. Each defect links to a criterion, each criterion links to a test, and each test has a recorded result. Track metrics such as open issues by severity, pass rate by criterion and time to fix to show progress to stakeholders.", "Treat a project like a real engagement: agree scope and conformance target with the client, sample pages that represent every template, test with a defined browser and AT matrix, and present findings with screenshots and clear remediation advice. Plan a retest round after fixes.", "Adopt shift-left habits: review designs for contrast, focus states and target sizes before coding, give developers component-level checklists and keep an accessibility statement with a contact route for user feedback. Document known limitations honestly.", "When an issue is hard to reproduce, simplify: strip the page down in DevTools, test in another browser and screen reader and check whether a keyboard-only user is affected. Note whether the problem is a code defect or an AT or browser bug, because the owners differ.", "Interviewers value real examples. Prepare two or three stories: a defect you found with the WCAG criterion, how you proved it, and how it was fixed. Practise explaining technical ideas such as focus management in plain language for non-technical stakeholders.", "Before the assessment, review all sections once, then quiz yourself on contrast ratios, POUR, ARIA rules, focus handling and tool differences. The test checks understanding, so be ready to apply concepts to short scenarios and not just recall definitions.", "To keep growing, follow WCAG updates, join accessibility communities, test with people who use assistive technology and consider certifications such as CPACC or WAS from IAAP. Build a portfolio of audit reports with permission and keep practising on new technologies."],MOD=[["Overview & Fundamentals", "OVERVIEW", "Understand what an accessibility QA specialist does, what you will learn, what you need first, and how disability, POUR and assistive technology fit together.", "#2f7d5b", 0, 4], ["Core Concepts & Practice", "CORE & PRACTICE", "Learn WCAG 2.1 / 2.2 levels, Section 508 and ADA, then see failing and fixed code and practise with a keyboard and screen reader.", "#3b6fb0", 4, 8], ["Advanced & Workflows", "ADVANCED & WORKFLOWS", "Master ARIA, focus management and live regions, then use assistive technologies and audit tools in a repeatable workflow.", "#7a3fb0", 8, 12], ["Projects & Interview", "PROJECTS & INTERVIEW", "Run a real audit project, apply best practices, fix common errors and prepare for interviews.", "#d9730d", 12, 16], ["Assessment & Summary", "ASSESSMENT", "Take the 50-question secure assessment and review the key takeaways.", "#ad1a72", 16, 18]],E={4:`<h3>Success criteria quick reference</h3>${tb(['SC','Name','Level','How to test'],[['1.1.1','Non-text Content','A','Check alt text on every image, icon and control'],['1.3.1','Info and Relationships','A','Inspect headings, lists, tables and labels'],['1.4.3','Contrast (Minimum)','AA','Measure 4.5:1 text, 3:1 large text'],['1.4.10','Reflow','AA','Zoom to 400%, no 2-D scrolling'],['2.1.1','Keyboard','A','Complete every task with Tab, Enter, Space, arrows'],['2.4.3','Focus Order','A','Tab order matches reading order'],['2.4.7','Focus Visible','AA','Focus ring is always visible'],['3.3.1','Error Identification','A','Errors are described in text'],['4.1.2','Name, Role, Value','A','Check the accessibility tree'],['4.1.3','Status Messages','AA','Screen reader announces updates']])}${co('<b>Tip:</b> Cite the SC number, name and level in every defect so developers can look it up quickly.')}`,6:`<h3>Failing code versus fixed code</h3>${cmp('Fails','<code>&lt;img src="logo.png"&gt;</code> has no alt text. A screen reader reads the file name.','Passes','<code>&lt;img src="logo.png" alt="Acme home"&gt;</code> gives a meaningful name.')}${cmp('Fails','<code>&lt;a href="/more"&gt;Click here&lt;/a&gt;</code> is vague out of context.','Passes','<code>&lt;a href="/more"&gt;Read pricing details&lt;/a&gt;</code> states the purpose.')}${cmp('Fails','Fake table made of divs with no header cells.','Passes','Real <code>&lt;table&gt;</code> with <code>&lt;th scope="col"&gt;</code> and a caption.')}<h3>Walk-through: testing a search form</h3><ol><li>Tab to the field: does the focus ring show and is the label read?</li><li>Submit with Enter: does it work without a mouse?</li><li>Search with no results: is the message announced by a live region?</li><li>Zoom to 400%: is the button still reachable?</li><li>Run axe: confirm no automatic failures.</li></ol>`,8:`<h3>Computing the accessible name</h3>${tb(['Order','Source','Example'],[['1','aria-labelledby','&lt;input aria-labelledby="lbl"&gt;'],['2','aria-label','&lt;button aria-label="Close"&gt;'],['3','Native label or text','&lt;label for="email"&gt;'],['4','title / placeholder','Last resort, unreliable']])}<h3>Landmarks and headings</h3>${pre('<header>...</header>\n<nav aria-label="Primary">...</nav>\n<main id="main">\n  <h1>Order history</h1>\n  <section aria-labelledby="recent"><h2 id="recent">Recent orders</h2></section>\n</main>\n<footer>...</footer>')}${co('Use one <code>main</code> landmark and give repeated landmarks such as <code>nav</code> unique labels.')}`,9:`<h3>SPA route change</h3>${pre('router.afterEach(() => {\n  document.title = route.title;\n  const h1 = document.querySelector("h1");\n  h1.tabIndex = -1; h1.focus();\n});')}<h3>Live region politeness</h3>${tb(['Attribute','Use for','Caution'],[['aria-live="polite"','Cart updates, save confirmations','Waits for the user to pause'],['aria-live="assertive"','Session expiring, critical errors','Interrupts; use rarely'],['role="alert"','Errors that need immediate attention','Implies assertive'],['role="status"','Progress and status text','Implies polite']])}<h3>Dialog checklist</h3><ul><li>Has <code>role="dialog"</code> and an accessible name.</li><li>Focus moves inside on open and is trapped.</li><li>Esc closes; focus returns to the trigger.</li><li>Background content is inert.</li></ul>`,10:`<h3>Screen reader cheat sheet</h3>${tb(['Task','NVDA','JAWS','VoiceOver','TalkBack'],[['Start/stop','Ctrl+Alt+N','Launch app','Cmd+F5','Vol Up+Down (hold)'],['Next heading','H','H','Ctrl+Opt+Cmd+H','Swipe up/down (Headings)'],['Next link','K','U','Ctrl+Opt+Cmd+L','Swipe up/down (Links)'],['Elements list','NVDA+F7','Insert+F3','VO+U (rotor)','Local context menu'],['Read all','NVDA+Down','Insert+Down','VO+A','Swipe up 2 fingers']])}<h3>Audit workflow</h3>${flow(['Automated scan','Manual keyboard','AT pass','Code check','Log defect','Retest'])}${co('Always note the browser and AT version. The same page can behave differently with NVDA plus Firefox than with JAWS plus Chrome.')}`,11:`<h3>Browser and AT test matrix</h3>${tb(['Platform','Screen reader','Browser'],[['Windows','NVDA','Firefox, Chrome'],['Windows','JAWS','Chrome, Edge'],['macOS','VoiceOver','Safari'],['iOS','VoiceOver','Safari'],['Android','TalkBack','Chrome']])}<h3>Manual checks that tools miss</h3><ul><li>Meaningful alt text quality, not just presence.</li><li>Logical reading and focus order.</li><li>Clear link and button purpose.</li><li>Captions that are accurate and synchronised.</li><li>Error messages that are understandable.</li></ul>`,14:`${tb(['Error','Why it happens','Fix'],[['Placeholder used as label','Design shortcut','Add a visible label'],['Div button','Custom styling','Use button element'],['Empty heading or link','Icon only','Add text or aria-label'],['Auto-playing media','Marketing','Provide pause and mute'],['Hover-only menu','Mouse design','Support focus and keyboard'],['Time-outs without warning','Security timer','Warn and allow extension']])}`};

  function examDialog(title,msg,okLabel,cancel){

  /* ---- proctoring: tab-switch / fullscreen-exit warnings (3 strikes -> auto-submit) ---- */

    });

  const WARN_MSG={

  /* --- extra restrictions: screenshot, print, window switch, page close --- */
  function keyGuard(e){

  }
  function fsGate(first){
    if(!examOn)return;

      .then(()=>{ requestFs().then(()=>{fsWanted=true;}).catch(()=>{ fsGate(false); }); });

      <div class="exam-main">

          <div class="exam-count">Answered <b id="examAnsN">0</b> / ${items.length}</div>
          <h4>Question palette</h4>
          <div class="exam-palette" id="examPal"></div>
          <div class="exam-legend">
            <span><i style="background:#14213D;border-color:#14213D"></i> Answered</span>
            <span><i style="background:#FCA311;border-color:#FCA311"></i> Marked for review</span>
            <span><i></i> Not answered</span>
          </div>
          <button class="exam-btn submit" id="examSubmit" style="width:100%">Submit Test</button>
        </div>
      </div>`;
    document.body.appendChild(ov);
    document.body.style.overflow='hidden';
    document.getElementById('examSubmit').addEventListener('click',()=>submitExam(false));
    buildPalette(); renderQ();
    timerId=setInterval(tick,1000);
    window.addEventListener('beforeunload',beforeUnload);
    startProctor();
    checkInterrupted();
  }
  function beforeUnload(e){ if(examOn){e.preventDefault();e.returnValue='';} }
  function tick(){
    remaining--; const el=document.getElementById('examTimer');
    if(el){ el.textContent=fmt(Math.max(remaining,0)); if(remaining<=300)el.classList.add('warn'); }
    if(remaining<=0){ submitExam(true); }
  }
  function buildPalette(){
    const pal=document.getElementById('examPal'); pal.innerHTML='';
    items.forEach((it,n)=>{
      const b=document.createElement('button'); b.className='pal'; b.textContent=n+1; b.dataset.n=n;
      b.addEventListener('click',()=>{cur=n;renderQ();});
      pal.appendChild(b);
    });
    refreshPalette();
  }
  function refreshPalette(){
    document.querySelectorAll('#examPal .pal').forEach(b=>{
      const n=+b.dataset.n, id=items[n].id;
      b.classList.toggle('answered', id in answers);
      b.classList.toggle('marked', !!marked[id]);
      b.classList.toggle('cur', n===cur);
    });
    const el=document.getElementById('examAnsN'); if(el)el.textContent=Object.keys(answers).length;
  }
  function renderQ(){
    const it=items[cur], id=it.id, pane=document.getElementById('examQ');
    pane.innerHTML=`
      <div class="exam-qnum">Question ${cur+1} of ${items.length}${it.cat?' &middot; '+it.cat:''}</div>
      <div class="exam-qtext">${it.q}</div>
      <div class="exam-opts" id="examOpts">${it.options.map((o,i)=>`<div class="exam-opt${answers[id]===i?' sel':''}" data-i="${i}" tabindex="0"><span class="k">${String.fromCharCode(65+i)}</span><span>${o}</span></div>`).join('')}</div>
      <div class="exam-actions">
        <button class="exam-btn nav" id="examPrev" ${cur===0?'disabled':''}>&larr; Previous</button>
        <button class="exam-btn exam-mark${marked[id]?' on':''}" id="examMark">${marked[id]?'★ Marked':'☆ Mark for review'}</button>
        <button class="exam-btn nav" id="examNext" ${cur===items.length-1?'disabled':''}>Next &rarr;</button>
      </div>`;
    pane.querySelectorAll('#examOpts .exam-opt').forEach(el=>{
      const pick=()=>{ answers[id]=+el.dataset.i; pane.querySelectorAll('#examOpts .exam-opt').forEach(x=>x.classList.remove('sel')); el.classList.add('sel'); refreshPalette(); };
      el.addEventListener('click',pick);
      el.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();pick();} });
    });
    document.getElementById('examPrev').addEventListener('click',()=>{if(cur>0){cur--;renderQ();}});
    document.getElementById('examNext').addEventListener('click',()=>{if(cur<items.length-1){cur++;renderQ();}});
    document.getElementById('examMark').addEventListener('click',()=>{marked[id]=!marked[id];renderQ();});
    refreshPalette();
    pane.scrollTop=0;
  }
  async function submitExam(auto){
    if(!examOn)return;
    const unanswered=items.length-Object.keys(answers).length;
    if(!auto){
      const ok=await examDialog('Submit test?', unanswered>0
        ? 'You have '+unanswered+' unanswered question(s). Once submitted, you can\'t change your answers.'
        : 'Once submitted, you can\'t change your answers.', 'Submit test', true);
      if(!ok)return;
    }
    examOn=false; clearInterval(timerId);
    window.removeEventListener('beforeunload',beforeUnload);
    stopProctor();
    let score=0; items.forEach(it=>{ if(answers[it.id]===it.answer) score++; });
    showResults(score);
  }
  function showResults(score){
    const total=items.length; saveScore(score,total);
    const pct=Math.round(score/total*100);
    let msg='Keep practicing &mdash; review the explanations below, revisit the modules and try again.';
    if(pct>=85)msg='Outstanding &mdash; you are operating at an expert level for this role.';
    else if(pct>=(C.pass||65))msg='Solid pass. Review the questions you missed and you are interview-ready.';
    else if(pct>=50)msg='Borderline &mdash; revisit the modules you missed and retake.';
    const rev=items.map((it,n)=>{
      const you=answers[it.id], attempted=(you!=null), ok=attempted&&you===it.answer;
      let inner='<div class="rq">Q'+(n+1)+'. '+it.q+'</div>';
      inner+= attempted ? '<div class="ra '+(ok?'cor':'wrong')+'">Your answer: '+String.fromCharCode(65+you)+'. '+it.options[you]+'</div>' : '<div class="ra wrong">Your answer: <i>Not answered</i></div>';
      if(!ok) inner+='<div class="ra cor">Correct: '+String.fromCharCode(65+it.answer)+'. '+it.options[it.answer]+'</div>';
      if(it.exp) inner+='<div class="rx">'+it.exp+'</div>';
      return '<div class="r '+(ok?'ok':'no')+'">'+inner+'</div>';
    }).join('');
    const ov=document.getElementById('examOverlay');
    ov.innerHTML=`
      <div class="exam-top"><div class="et-title">Result &mdash; ${C.title}</div>
        <button class="exam-btn" id="examClose" style="background:rgba(255,255,255,.15);color:#fff">&#10005; Close</button></div>
      <div class="exam-q-pane" style="grid-column:1/-1">
        <div class="exam-result">
          <div class="exam-score">${score} / ${total}</div>
          <div class="exam-rmsg">${pct}% correct &mdash; ${msg}</div>
          <div style="margin-top:16px"><button class="exam-btn primary" id="examRetry">&#8635; Take another attempt</button></div>
          <div class="exam-rev">${rev}</div>
        </div>
      </div>`;
    document.getElementById('examRetry').addEventListener('click',()=>{ closeExam(); showSplash(); });
    document.getElementById('examClose').addEventListener('click',closeExam);
  }
  function closeExam(){
    stopProctor();
    const ov=document.getElementById('examOverlay'); if(ov)ov.remove();
    document.body.style.overflow='';
    fsWanted=false; if(inFs()){ (document.exitFullscreen||document.webkitExitFullscreen).call(document); }
  }
  document.addEventListener('click',e=>{ if(e.target.closest && e.target.closest('#assessStartBtn')) showSplash(); });
  renderScoreboard();
  new MutationObserver(()=>{ const el=document.getElementById('scoreBoard'); if(el && !el.dataset.r){ el.dataset.r='1'; renderScoreboard(); } })
    .observe(document.body,{childList:true,subtree:true});
})();
act(0);
</script><script>

  t.addEventListener('wheel',e=>{ if(t.scrollWidth>t.clientWidth && Math.abs(e.deltaY)>Math.abs(e.deltaX)){ t.scrollLeft+=e.deltaY; e.preventDefault(); } },{passive:false});
  let down=false,sx=0,sl=0,moved=false;

<script>/* CareerBuddy: screenshots are not allowed during the assessment */
(function(){
  // A web page cannot stop the operating system from taking a screenshot, so this makes
  // screenshots hard to take and useless if taken: the screen blanks while a capture tool
  // has focus or a screenshot key is pressed, the clipboard is overwritten after
  // Print Screen, printing is blocked, and every view carries a watermark with the
  // candidate's name and the time. Active in the assessment tab (?assess=1) and once an
  // assessment is started on a page opened outside the hub.
  var START='#assessStartBtn,#startAssessmentButton,#cbAssessStart,.assess-start-btn,.assessment-page-start,.assessment-start-page-btn';
  var framed=window.top!==window.self, on=false, cover=null, mark=null, hideT=null;
  // In the hub frame: remember who is signed in, so the assessment tab (which inherits this
  // tab's sessionStorage) can watermark with the candidate's name. Window capture runs
  // before the new-tab handler on document.
  window.addEventListener('click',function(e){
    if(!framed||!(e.target.closest&&e.target.closest(START)))return;
    try{var r=window.parent.document.getElementById('riya-assistant-root');
      if(r&&r.dataset.riyaUsername)sessionStorage.setItem('cbCandidate',r.dataset.riyaUsername);}catch(_){}
  },true);
  if(framed)return;

  function css(){
    var st=document.createElement('style');
    st.textContent='@media print{html,body{display:none!important}}'
      +'#cbShotCover{position:fixed;inset:0;z-index:2147483647;background:#0b1220;color:#fff;display:none;align-items:center;justify-content:center;text-align:center;font:600 18px/1.5 system-ui,sans-serif;padding:24px}'
      +'#cbShotCover.on{display:flex}'
      +'#cbShotMark{position:fixed;inset:0;z-index:2147483646;pointer-events:none;overflow:hidden;opacity:.11}'
      +'#cbShotMark span{position:absolute;white-space:nowrap;font:700 15px system-ui,sans-serif;color:#0b1220;transform:rotate(-24deg)}'
      +'body.cb-shot-guard{-webkit-user-select:none;user-select:none}';
    document.head.appendChild(st);
  }
  function watermark(){
    var who='', when=new Date().toLocaleString();
    try{who=sessionStorage.getItem('cbCandidate')||'';}catch(_){}
    var text='CareerBuddy assessment · '+(who?who+' · ':'')+when+' · Screenshots not allowed';
    mark=document.createElement('div');mark.id='cbShotMark';mark.setAttribute('aria-hidden','true');
    var html='';
    for(var y=-10;y<110;y+=14)for(var x=-20;x<110;x+=38)html+='<span style="left:'+x+'%;top:'+y+'%"></span>';
    mark.innerHTML=html;
    [].forEach.call(mark.children,function(s){s.textContent=text;});
    document.body.appendChild(mark);
  }
  function show(msg,ms){
    if(!cover)return;
    cover.textContent=msg||'Screenshots are not allowed during the assessment.';
    cover.classList.add('on');
    clearTimeout(hideT); hideT=null;
    if(ms)hideT=setTimeout(function(){hideT=null;if(document.hasFocus())cover.classList.remove('on');},ms);
  }
  function hide(){if(cover&&!hideT)cover.classList.remove('on');}
  function scrub(){ // overwrite whatever Print Screen put on the clipboard
    try{navigator.clipboard&&navigator.clipboard.writeText('Screenshots are not allowed during the CareerBuddy assessment.').catch(function(){});}catch(_){}
  }
  function isShotKey(e){
    var k=(e.key||'').toLowerCase();
    if(k==='printscreen'||e.keyCode===44)return true;                         // Print Screen (Windows / Linux)
    if(e.metaKey&&e.shiftKey&&['3','4','5','6','s'].indexOf(k)>=0)return true; // macOS Cmd+Shift+3/4/5/6, Win+Shift+S
    if((e.ctrlKey||e.metaKey)&&(k==='p'||(e.shiftKey&&k==='s')))return true;   // print / save-as
    return false;
  }
  function activate(){
    if(on)return; on=true;
    css();
    cover=document.createElement('div');cover.id='cbShotCover';cover.setAttribute('role','alert');
    document.body.appendChild(cover);
    document.body.classList.add('cb-shot-guard');
    watermark();
    window.addEventListener('keydown',function(e){
      if(isShotKey(e)){e.preventDefault();e.stopPropagation();scrub();show(null,2500);return;}
      if(e.key==='Meta'||e.key==='OS')show('Screenshots are not allowed during the assessment.',0); // Windows key: blank before Win+Shift+S
    },true);
    window.addEventListener('keyup',function(e){
      if(isShotKey(e)){e.preventDefault();scrub();show(null,2500);return;}  // Print Screen only reports keyup on Windows
      if(e.key==='Meta'||e.key==='OS'){hideT=null;hide();}
    },true);
    // Snipping Tool, Xbox Game Bar and similar capture tools take focus: blank the screen until it returns.
    window.addEventListener('blur',function(){show('The assessment is hidden while another window is active.',0);});
    window.addEventListener('focus',function(){hideT=null;hide();});
    document.addEventListener('visibilitychange',function(){if(document.hidden)show('The assessment is hidden while another window is active.',0);});
    window.addEventListener('beforeprint',function(){show(null,0);});
    window.addEventListener('afterprint',function(){hideT=null;hide();});
  }
  if(/[?&]assess=1(&|$)/.test(location.search))document.readyState==='loading'?document.addEventListener('DOMContentLoaded',activate):activate();
  window.addEventListener('click',function(e){if(e.target.closest&&e.target.closest(START))activate();},true);
})();
</script>

kit-scrollbar,.side:not(#_)::-webkit-scrollbar,.sidebar:not(#_)::-webkit-scrollbar,.sidenav:not(#_)::-webkit-scrollbar{width:8px}.toc:not(#_)::-webkit-scrollbar-thumb,.side:not(#_)::-webkit-scrollbar-thumb,.sidebar:not(#_)::-webkit-scrollbar-thumb,.sidenav:not(#_)::-webkit-scrollbar-thumb{background:#14213d!important;border-radius:8px}.toc:not(#_)::-webkit-scrollbar-track,.side:not(#_)::-webkit-scrollbar-track,.sidebar:not(#_)::-webkit-scrollbar-track,.sidenav:not(#_)::-webkit-scrollbar-track{background:#e9edf4!important;border-radius:8px}/* No "Tab X of Y" progress pill */.progress-pill:not(#_),#progressPill:not(#_),span:has(>#progressText):not(#_),#progressText:not(#_),span:has(>#pt):not(#_),#pt:not(#_),#ptxt:not(#_){display:none!important}</style><script id="cb-exam-cancel">/* Assessment tab (opened with ?assess=1 / ?mode=exam): Cancel on the rules screen and Close on the results close this tab
   and return to the course tab; the tab also closes by itself 30 seconds after the results appear. */
(function(){
  if(!/[?&](assess=1|mode=exam)(&|$)/.test(location.search))return;
  var CANCEL='#examCancel,#exC,#cbExamCancel,#cancelAssessmentButton,#cancelAssessment,[onclick*="closeAssessment"],.cb-exam-cancel';
  var BEGIN='#examBegin,#cbExamBegin,#beginExam,#startButton';
  var RESULT_CLOSE='#examClose,#cbClose,#resultClose,#closeResults,#exX'; // #examExit is the in-test Close (exam top bar), not a results button
  var AUTO_CLOSE=30, docs=[], timer=null, left=0, note=null;
  function leave(rules,home){
    try{if(window.opener&&!window.opener.closed)window.opener.focus();}catch(_){}
    window.close();
    // A tab the browser will not let a script close (opened directly): hide the rules screen, or go to Skill Up.
    setTimeout(function(){if(window.closed)return;if(rules&&rules.parentNode)rules.remove();else if(home)location.replace('/skill-up/');},150);
  }
  function shown(d,sel){var e=d.querySelector(sel);return !!(e&&e.getClientRects().length);}
  function resultsShown(){return docs.some(function(d){return shown(d,RESULT_CLOSE)||shown(d,'#resultScreen');});}
  function countdown(){
    var done=resultsShown();
    if(done&&!timer){
      left=AUTO_CLOSE;
      note=document.createElement('div');note.id='cbAutoClose';note.setAttribute('role','status');
      note.style.cssText='position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:2147483645;background:#14213d;color:#fff;font:600 14px system-ui,sans-serif;padding:10px 18px;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.25)';
      document.body.appendChild(note);
      var tick=function(){note.textContent='This tab will close in '+left+'s and return to the course';if(left--<=0){clearInterval(timer);leave(null,true);}};
      tick();timer=setInterval(tick,1000);
    }else if(!done&&timer){clearInterval(timer);timer=null;if(note)note.remove();} // another attempt started
  }
  function hook(doc){
    if(!doc||!doc.documentElement||doc.__cbCancel)return; doc.__cbCancel=1; docs.push(doc);
    doc.addEventListener('click',function(e){
      if(!e.target.closest)return;
      if(e.target.closest(RESULT_CLOSE)||(e.target.closest('#closeFinalAssessment')&&resultsShown())){setTimeout(function(){leave(null,true);},0);return;}
      var c=e.target.closest(CANCEL); if(!c)return;
      var rules=c.classList.contains('cb-exam-cancel')?(c.closest('[class*="splash"],[class*="modal"],[class*="overlay"]')||null):null;
      setTimeout(function(){leave(rules);},0);
    },true);
    function add(){
      countdown();
      var b=doc.querySelector(BEGIN); if(!b||b.__cbc)return; b.__cbc=1;
      var box=b.closest('.card,[class*="splash"],[class*="modal"],[class*="dialog"]')||b.parentElement;
      if(box.querySelector(CANCEL)||[].some.call(box.querySelectorAll('button'),function(x){return x.textContent.trim()==='Cancel';}))return;
      // This rules screen has no Cancel: add one beside (or under) the start button.
      var c=doc.createElement('button'); c.type='button'; c.className=b.className+' cb-exam-cancel'; c.textContent='Cancel';
      c.style.cssText='background:#fff;color:#14213d;border:1px solid #cbd5e1;box-shadow:none';
      var flex=/flex/.test((doc.defaultView||window).getComputedStyle(b.parentElement).display);
      if(flex){c.style.cssText+=';flex:0 0 auto;width:auto;margin:0 10px 0 0';b.parentNode.insertBefore(c,b);}
      else{c.style.cssText+=';display:block;width:100%;margin-top:10px';b.parentNode.insertBefore(c,b.nextSibling);}
    }
    add(); new MutationObserver(add).observe(doc.documentElement,{childList:true,subtree:true,attributes:true,attributeFilter:['class','style','hidden']});
  }
  function frames(){[].forEach.call(document.querySelectorAll('iframe'),function(f){var h=function(){try{hook(f.contentDocument);}catch(_){}};h();f.addEventListener('load',h);});}
  function init(){hook(document);frames();}
  document.readyState==='loading'?document.addEventListener('DOMContentLoaded',init):init();
})();
