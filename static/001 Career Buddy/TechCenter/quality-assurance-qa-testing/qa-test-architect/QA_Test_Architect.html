<header class="header"><div class="ht"><div class="brand"><button class="btn mb" onclick="tg()" aria-label="Open section menu">&#9776;</button><div class="mark">ARCH</div><span>QA / Test Architect<span class="sub"> · Strategy · Architecture · Infra · Cost</span></span></div>
<div class="ha"><span class="pill"><span class="dot"></span><span id="pt" aria-live="polite"></span></span><button class="btn" onclick="act(0)">Reset</button></div></div><nav class="tabbar" id="tabbar" aria-label="Course modules"></nav></header>

<script>
const P=s=>s,pre=s=>`<pre><button class="cp">Copy</button><code>${s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</code></pre>`;
const tb=(h,r)=>`<div class="tblw"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.map(x=>`<tr>${x.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table></div>`;
const cards=a=>`<div class="grid">${a.map(([t,d],i)=>`<div class="card" style="--c:hsl(${i*47+200},55%,38%)"><b>${t}</b>${d}</div>`).join('')}</div>`;
const flow=a=>`<div class="fl">${a.map(x=>`<div class="st">${x}</div>`).join('')}</div>`;
const co=(t,k='')=>`<div class="callout ${k}">${t}</div>`;
const M=[[0,0,0,0,0,[
['1. Course Overview',`<p>A <b>QA / Test Architect</b> designs how quality is built into a whole organisation: which tools teams use, where tests run in the pipeline, what blocks a release, and how test infrastructure scales without wasting money. You move from writing tests to designing the system that lets many teams ship safely.</p>${cards([['Strategic Tech Stack','Cross-organisation tooling, shift-left strategy, quality gates'],['System Architecture','Distributed systems, Kafka, RabbitMQ, observability, data pipelines'],['Quality Infrastructure','Selenium Grid, Moon, Playwright sharding, continuous testing governance'],['Cost & Efficiency','Faster CI, flakiness mitigation, cheaper cloud testing']])}`],
['2. Learning Objectives',`<ul><li>Define a test strategy and tooling standard for many teams.</li><li>Design shift-left practices and enforce quality gates in CI/CD.</li><li>Test microservices and event-driven systems with contract and observability techniques.</li><li>Verify data pipelines end to end.</li><li>Build scalable grids with Selenium Grid, Moon and Playwright sharding.</li><li>Cut pipeline time and cloud cost while reducing flaky tests.</li></ul>`],
['3. Prerequisites',`<ul><li>3 to 5 years of test automation experience (UI and API).</li><li>CI/CD basics: Git, pipelines, containers.</li><li>Basic knowledge of REST, messaging and databases.</li><li>Comfort reading code in at least one language.</li></ul>${co('You do not need to be a Kafka or Kubernetes expert, but you must understand what they do and how they fail.')}`],
['4. Fundamentals',`<p>A QA lead manages a team's testing. An architect sets <b>standards, platforms and strategy</b> across teams and balances risk, speed and cost.</p>${tb(['Concept','Meaning'],[['Shift-left','Test earlier: reviews, unit and contract tests, static analysis'],['Shift-right','Test safely in production with monitoring, canaries and feature flags'],['Test pyramid','Many unit tests, fewer integration tests, very few end-to-end tests'],['Quality gate','Automated pass or fail checkpoint in the pipeline'],['Observability','Logs, metrics and traces that explain system behaviour']])}${flow(['Define strategy','Choose tools','Build pipeline','Enforce gates','Measure','Optimise'])}`]]],
[0,0,0,0,0,[
['5. Core Concepts',`<h3>What a test strategy contains</h3>${tb(['Element','Question it answers'],[['Scope and risk','What matters most to the business?'],['Test levels','What belongs at unit, API, UI and E2E?'],['Tooling standard','Which tools do all teams use and why?'],['Environments and data','Where do tests run and with what data?'],['Quality gates','What blocks a merge or release?'],['Metrics','How do we know it works?']])}<h3>Typical quality gates</h3>${tb(['Stage','Gate','Example threshold'],[['Pre-merge','Unit tests, lint, static analysis','All pass, no new critical issues'],['Build','Coverage on changed code','80% of new lines'],['Pre-deploy','Contract and API tests','No breaking contract'],['Staging','Smoke and critical E2E','All critical flows pass'],['Production','Canary health','Error rate within SLO']])}`],
['6. Topics & Subtopics',`${tb(['Pillar','Subtopics'],[['Strategic tech stack','Tool selection criteria, standards, build vs buy, shift-left, quality gates'],['System architecture','Microservices, contract testing, Kafka, RabbitMQ, observability, data pipelines'],['Quality infrastructure','Selenium Grid, Moon, Playwright sharding, containers, governance'],['Cost and efficiency','Pipeline speed, test impact analysis, flakiness, spot instances, caching']])}`],
['7. Practical Examples',`<h3>Playwright sharding</h3>${pre('npx playwright test --shard=1/4\nnpx playwright test --shard=2/4\nnpx playwright test --shard=3/4\nnpx playwright test --shard=4/4')}<h3>CI matrix running four shards in parallel</h3>${pre('strategy:\n  fail-fast: false\n  matrix:\n    shard: [1, 2, 3, 4]\nsteps:\n  - run: npx playwright test --shard=${{ matrix.shard }}/4')}${co('Merge the shard reports into one report at the end so teams see a single result.')}<h3>Testing an event consumer</h3><ol><li>Publish an OrderCreated event to a test topic.</li><li>Wait for the consumer to process it with a bounded poll, not a fixed sleep.</li><li>Assert the database state and the emitted OrderConfirmed event.</li><li>Publish the same event again and assert nothing changes (idempotency).</li></ol>`],
['8. Hands-on Practice',`${flow(['Audit current stack','Draft standard','Add quality gate','Shard the suite','Measure flakiness','Report savings'])}<ol><li><b>Tool matrix lab:</b> score 3 UI tools on speed, stability, cost, community and skills.</li><li><b>Gate lab:</b> add a coverage and a lint gate to a sample pipeline.</li><li><b>Sharding lab:</b> split a 40-minute suite into 4 shards and compare timings.</li><li><b>Flake lab:</b> rerun a suite 20 times and rank the least stable tests.</li><li><b>Event lab:</b> produce and consume a Kafka message locally with a Docker compose file.</li></ol>`]]],
[0,0,0,0,0,[
['9. Intermediate Concepts',`<h3>Contract testing</h3><p>Consumer-driven contracts (for example Pact) let a consuming service state what it expects from a provider. The provider verifies it in CI, so breaking changes are caught without a shared test environment.</p><h3>Observability signals</h3>${tb(['Signal','Use in testing'],[['Logs','Debug failed tests with correlation IDs'],['Metrics','Assert latency and error rate during tests'],['Traces','Follow one request across services']])}<h3>Test data strategy</h3><ul><li>Create data through APIs, not the UI.</li><li>Isolate data per test run.</li><li>Mask production data before use.</li></ul>`],
['10. Advanced Concepts',`${tb(['Topic','What to verify'],[['Kafka','Ordering within a partition, consumer lag, rebalancing, replay'],['RabbitMQ','Exchange routing, acknowledgements, dead letter queues, retries'],['Idempotency','Processing a message twice has the same effect'],['Eventual consistency','Assert with bounded polling, not fixed sleeps'],['Chaos testing','Service, network and broker failure behaviour'],['Data pipelines','Row counts, schema, freshness, duplicates, null rates']])}${co('Distributed systems fail in partial ways. Design tests for timeouts, retries and out-of-order messages, not just the happy path.','warn')}`],
['11. Tools & Workflows',`${tb(['Area','Tools'],[['UI automation','Playwright, Selenium, Cypress'],['Execution grids','Selenium Grid, Moon, Selenoid, cloud device farms'],['Contracts','Pact, Spring Cloud Contract'],['Messaging','Kafka, RabbitMQ, Testcontainers'],['Observability','OpenTelemetry, Prometheus, Grafana, Jaeger'],['Quality gates','SonarQube, coverage tools, CI rules']])}${flow(['Commit','Static checks','Unit and contract','Deploy test env','Sharded E2E','Quality gate','Release'])}`],
['12. Testing & Quality',`<p>Governance means every team follows agreed standards and the architect can prove it with data.</p>${tb(['Metric','Why it matters'],[['Pipeline duration','Developer feedback speed'],['Flake rate','Trust in the suite'],['Escaped defects','Real quality outcome'],['Deployment frequency and change failure rate','DORA delivery health'],['Cost per pipeline run','Efficiency of the platform']])}`]]],
[0,0,0,0,0,[
['13. Real-World Projects',`<h3>Project: Quality platform for a microservices shop</h3><ol><li>Audit 10 teams and their tools; publish a tooling standard.</li><li>Define quality gates for every stage.</li><li>Add contract tests between order, payment and inventory services.</li><li>Test Kafka events including duplicates and ordering.</li><li>Build a Playwright sharding pipeline on a Kubernetes-based grid.</li><li>Create a dashboard for flake rate, duration and cost.</li></ol>${co('Deliverables: strategy document, tooling standard, pipeline templates, dashboards and a cost report.','ok')}`],
['14. Best Practices',`<ul><li>Choose tools by evidence from a time-boxed pilot.</li><li>Keep gates fast, clear and fair.</li><li>Prefer contract tests over shared integration environments.</li><li>Treat flaky tests as defects and quarantine them.</li><li>Run only impacted tests on pull requests; run everything nightly.</li><li>Use ephemeral environments and autoscaled grids.</li><li>Measure and publish quality and cost metrics.</li></ul>`],
['15. Common Errors & Troubleshooting',`${tb(['Problem','Cause','Fix'],[['Pipeline takes over an hour','Serial tests, no caching','Shard, cache dependencies, run impacted tests'],['Random failures','Shared data, fixed sleeps','Isolate data and use explicit waits'],['Grid queue is full','Too few nodes','Autoscale nodes and cap session time'],['Cloud bill growing','Idle machines','Spot instances and scheduled scale-down'],['Tests pass but prod breaks','Missing contracts and observability','Add contract tests and canary checks'],['Teams ignore gates','Slow or noisy gates','Tune thresholds and speed']])}`],
['16. Interview Preparation',`<details><summary>How would you choose a test automation tool for the whole company?</summary><p>Define criteria, run a pilot on real apps, score stability, speed, skills and cost, then publish a standard with an exception process.</p></details><details><summary>How do you test event-driven systems?</summary><p>Use contract tests for schemas, integration tests with real brokers in containers, bounded polling, idempotency and DLQ checks, plus tracing for visibility.</p></details><details><summary>How do you reduce a 60-minute pipeline?</summary><p>Parallelise and shard, cache dependencies, run only impacted tests on pull requests, remove duplicate E2E tests and fix flaky retries.</p></details><details><summary>How do you handle flaky tests?</summary><p>Detect them with reruns, quarantine, assign owners, find the root cause (data, timing, environment) and enforce a fix deadline.</p></details><details><summary>What should a quality gate be based on?</summary><p>Risk and measurable thresholds such as test pass rate, coverage of changed code, security findings and SLO health.</p></details>`]]],
[0,0,0,0,0,[

<h3>Bounded polling instead of fixed sleeps</h3>${L(
"export async function waitFor<T>(",
"  fn: () => Promise<T | undefined>,",
"  timeoutMs = 10000,",
"  intervalMs = 250",
"): Promise<T> {",
"  const end = Date.now() + timeoutMs;",
"  let last: unknown;",
"  while (Date.now() < end) {",
"    try {",
"      const value = await fn();",
"      if (value !== undefined) return value;",
"    } catch (e) { last = e; }",
"    await new Promise(r => setTimeout(r, intervalMs));",
"  }",
"  throw new Error('waitFor timed out' + (last ? ': ' + last : ''));",
"}")}
<p>Playwright also offers <code>expect.poll</code> for the same purpose inside assertions.</p>

<h3>Where each test type fits</h3>${tb(['Type','Catches','Needs','Speed'],[
['Unit','Logic errors','Nothing external','Milliseconds'],
['Contract','Breaking API or message changes','Broker, consumer and provider builds','Seconds'],
['Integration','Wiring, database and broker behaviour','Containers for dependencies','Seconds to minutes'],
['E2E','Broken user journeys','A deployed environment','Minutes']])}
<h3>Test data strategies</h3>${tb(['Strategy','Good for','Watch out for'],[
['Factories and builders','Readable, isolated test data','Drift from real data shapes'],
['API seeding','Realistic state without the UI','Needs stable test-only endpoints or auth'],
['Synthetic data generators','Volume and edge cases','Unrealistic distributions'],
['Masked production data','Realistic behaviour','Privacy rules and masking quality']])}
<h3>Carry a trace identifier from the test</h3>${L(
"const traceId = crypto.randomBytes(16).toString('hex');",
"const spanId = crypto.randomBytes(8).toString('hex');",
"const headers = { traceparent: '00-' + traceId + '-' + spanId + '-01' };",
"// Log traceId with the test result so a failure can be found in the tracing tool.")}`;
X[8]='Contract tests do not replace integration tests. They replace the <i>need for every team to share one integration environment</i> just to find out whether an API change is safe. Keep a small number of integration and E2E tests for the paths that really need a full stack.';

E[9]=`<h3>Message delivery guarantees</h3>${tb(['Guarantee','Meaning','Test focus'],[
['At most once','Messages may be lost, never repeated','Verify loss is acceptable and monitored'],
['At least once','Messages are never lost but may repeat','Duplicates must not change the outcome'],
['Exactly once (effect)','Duplicates are filtered or processing is transactional','Verify the end state, not the delivery count']])}
<h3>Idempotency patterns to look for</h3>${tb(['Pattern','How it works'],[
['Idempotency key','The producer sends a unique key; the consumer ignores a key it has seen'],
['Deduplication table','Processed message IDs are stored in the same transaction as the result'],
['Upsert','Writes replace or merge by natural key instead of inserting blindly'],
['Versioned events','Older versions are discarded when a newer one has been applied']])}
<h3>Kafka test checklist</h3><ul><li>Messages with the same key arrive in order within a partition.</li><li>Consumer lag stays under the agreed threshold during load.</li><li>A rebalance during processing does not lose or duplicate results.</li><li>Poison messages end up in a dead letter topic with context.</li><li>A consumer can replay from an earlier offset safely.</li></ul>
<h3>Design a chaos experiment</h3>${tb(['Step','Example'],[
['Steady state','Order confirmation p95 under 2 seconds, error rate under 1 percent'],
['Hypothesis','If one broker stops, orders are still confirmed within 5 seconds'],
['Experiment','Stop one broker for 5 minutes in a test environment'],
['Blast radius','Test environment only, with an abort condition on error rate'],
['Learn','Record what failed, fix, and re-run the experiment']])}
<h3>Data pipeline checks</h3>${L(
"-- completeness",
"SELECT (SELECT COUNT(*) FROM source.orders) - (SELECT COUNT(*) FROM warehouse.orders) AS missing_rows;",
"",
"-- duplicates",
"SELECT order_id, COUNT(*) FROM warehouse.orders GROUP BY order_id HAVING COUNT(*) > 1;",
"",
"-- freshness",
"SELECT MAX(updated_at) AS latest FROM warehouse.orders;",
"",
"-- null rate",
"SELECT AVG(CASE WHEN email IS NULL THEN 1.0 ELSE 0 END) AS null_rate FROM warehouse.customers;")}
${cmp('Fixed sleep','Wait 10 seconds and hope the consumer is done. Slow when fast, flaky when slow.','Bounded polling','Check every few hundred milliseconds up to a timeout and fail with a clear message.')}`;
X[9]='Exactly-once delivery is best understood as exactly-once <i>effect</i>. Brokers can offer transactional features within their own boundaries, but once a consumer writes to an external database or calls an API, you still need idempotent handling. Test the effect, not the promise.';

E[10]=`<h3>Tool selection scorecard</h3><p>Agree the weights with stakeholders before scoring, so the result is not reverse-engineered.</p>${tb(['Criterion','Weight','Tool A','Tool B','Tool C'],[
['Stability on your real apps','25%','&nbsp;','&nbsp;','&nbsp;'],
['Execution speed and parallelism','20%','&nbsp;','&nbsp;','&nbsp;'],
['Skills available in the organisation','15%','&nbsp;','&nbsp;','&nbsp;'],
['Ecosystem and community health','10%','&nbsp;','&nbsp;','&nbsp;'],
['Debugging and reporting','10%','&nbsp;','&nbsp;','&nbsp;'],
['Total cost (licences, infra, effort)','20%','&nbsp;','&nbsp;','&nbsp;']])}
<h3>Execution grid options</h3>${tb(['Option','Strength','Trade-off'],[
['Selenium Grid 4','Open source, standard protocol, runs on Docker or Kubernetes','You operate and scale it'],
['Moon','Browsers as containers on Kubernetes with autoscaling','Commercial licence; Kubernetes skills needed'],
['Selenoid','Lightweight Docker-based browser pool','Largely superseded by Moon from the same vendor'],
['Cloud device and browser farms','No infrastructure to run; real devices','Per-minute cost and data leaving your network']])}
<h3>Selenium Grid 4 components</h3>${cards([['Router','Receives new session and command requests and forwards them.'],['Distributor','Chooses a node that can run the requested capabilities.'],['Session Queue','Holds requests until a slot is free.'],['Session Map','Remembers which node runs each session.'],['Event Bus','Lets components communicate inside the grid.'],['Nodes','Run the browsers.']])}
<h3>Build or buy</h3>${cmp('Build when','You have platform engineers, strict data rules or very high volume, and the tool is a core differentiator.','Buy when','You need speed to value, have few platform engineers, or usage is spiky and unpredictable.')}`;
X[10]='When you pilot tools, give every candidate the same ten real test scenarios, the same time box and the same reviewers. Record not just pass rates but the effort to write, debug and maintain each test. Maintenance cost over a year usually outweighs licence cost.';

E[11]=`<h3>The four delivery metrics (DORA)</h3>${tb(['Metric','Definition','Quality angle'],[
['Deployment frequency','How often you deploy to production','Small batches are easier to test and roll back'],
['Lead time for changes','Commit to running in production','Slow tests directly increase it'],
['Change failure rate','Share of deployments that cause a failure needing a fix','Escaped defects and weak gates show up here'],
['Time to restore service','How long it takes to recover from a failed change','Observability and safe rollback reduce it']])}
<h3>Useful quality metrics and how to compute them</h3>${tb(['Metric','Formula or method'],[
['Flake rate','Runs that failed then passed on retry, divided by total runs'],
['Median and p90 pipeline time','Measured from commit to pipeline result, per repository'],
['Escaped defect rate','Production defects per release or per month, by severity'],
['Gate bypass rate','Merges or deployments that skipped a gate, divided by total'],
['Cost per pipeline run','Runner and grid minutes multiplied by unit price']])}
<h3>Quality maturity levels</h3>${tb(['Level','Description'],[
['1 Ad hoc','Testing depends on individuals; no shared standards'],
['2 Managed','Each team has a plan and a CI pipeline'],
['3 Standardised','Shared tools, gates and templates across teams'],
['4 Measured','Metrics are published and reviewed regularly'],
['5 Optimising','Data drives continuous change in strategy and platform']])}
${co('Metrics become targets and then stop being good measures. Never rank individuals by test counts or coverage; use metrics to find systemic problems.','warn')}`;
X[11]='Publish metrics per team but review them with the team, not about the team. Trends matter more than snapshots, so show a 12-week line with the date of each intervention (new gate, new grid, quarantine policy) marked on it.';

E[12]=`<h3>12-week plan for the quality platform project</h3>${tb(['Weeks','Focus','Output'],[
['1-2','Audit teams, tools, pipelines and defects','Current-state report and baseline metrics'],
['3-4','Pilot two UI tools; define strategy and standards','Scored matrix, ADR, draft standard'],
['5-6','Quality gates and pipeline templates','Reusable templates, gate documentation'],
['7-8','Contract tests and event testing on three services','Contracts in CI, consumer duplicate tests'],
['9-10','Sharded runs on an autoscaled grid','Grid configuration, timing comparison'],

<h3>Project 2: Flakiness reduction programme</h3><ol><li>Collect results from the last 30 days of pipeline runs.</li><li>Rank tests by flake rate and by cost to the team.</li><li>Quarantine the worst offenders automatically with an owner and a deadline.</li><li>Fix the top ten and categorise root causes (data, timing, environment, product bug).</li><li>Report flake rate weekly and celebrate removals.</li></ol>
<h3>Project 3: Cost and speed optimisation</h3>${tb(['Scenario (illustrative)','Wall-clock per run (min)','Runner-minutes per run'],[
['Serial suite of 40 minutes','40','40'],
['Four shards, 1 minute setup each','11','44'],
['Four shards and impacted tests on pull requests (30% of suite)','4','16']])}
<p>Assumptions: tests are evenly distributed and impacted selection runs about 30 percent of the suite on a typical pull request. Replace them with your own measurements.</p>
<h3>Project rubric</h3>${tb(['Area','Strong result looks like'],[
['Strategy','Clear scope, risks and standards with an exception process'],
['Architecture','Contracts and observability reduce reliance on shared environments'],
['Infrastructure','Grid scales up and down automatically with no manual steps'],
['Evidence','Baseline and after numbers for duration, flake rate and cost'],
['Communication','Executive summary a non-technical leader can act on']])}`;
X[12]='Close each project with a short <b>decision memo</b> for leaders: the problem, what you did, the measured result, the ongoing cost and what you recommend next. Architects are judged on influence as much as on technical output.';

E[13]=`<h3>Practice and anti-practice</h3>${cmp('Anti-pattern','One huge E2E suite that runs everything on every commit.','Better','Fast checks on pull requests, a focused critical-path E2E suite before release, full runs nightly.')}${cmp('Anti-pattern','Retries hide flakiness and nobody sees it.','Better','Allow limited retries but record every retry and track the flake rate.')}${cmp('Anti-pattern','A central team writes tests for everyone.','Better','A central team provides platform, templates and coaching; product teams own their tests.')}
<h3>Checklist before approving a new test platform</h3><ul><li>Can a team onboard in a day using a template?</li><li>Are results, logs, traces and videos kept for long enough to debug?</li><li>Is there a cap on cost and session time?</li><li>Is there a documented owner and on-call route?</li><li>Are secrets and test data handled according to policy?</li><li>Can we leave the tool without rewriting everything?</li></ul>
<h3>Common anti-patterns</h3>${tb(['Anti-pattern','Why it hurts'],[
['Testing through the UI only','Slow, brittle and hard to localise failures'],
['Shared mutable test environment','Tests interfere with each other and with demos'],
['Coverage as a target','Encourages weak assertions to hit a number'],
['Gates nobody owns','Thresholds go stale and are bypassed'],
['Tool of the month','Constant migration, no accumulated expertise']])}`;
X[13]='Best practices are context dependent. Before you adopt one from a blog post or conference talk, ask what problem it solved there, what it cost, and whether your constraints (team size, regulatory demands, release cadence) match.';

E[14]=`<h3>Flaky test triage flow</h3>${flow(['Reproduce with repeats','Check shared state','Inspect trace and logs','Classify cause','Fix or quarantine','Track to closure'])}
<h3>Useful commands</h3>${tb(['Situation','Command'],[
['Repeat a test many times','<code>npx playwright test --repeat-each=20</code>'],
['Rule out shared state','<code>npx playwright test --workers=1</code>'],
['Capture a trace','<code>npx playwright test --trace on</code>'],
['Open a trace','<code>npx playwright show-trace trace.zip</code>'],
['Check Selenium Grid health','<code>curl http://GRID_HOST:4444/status</code>'],
['Check Kafka consumer lag','<code>kafka-consumer-groups.sh --bootstrap-server localhost:9092 --describe --group GROUP</code>'],
['Check RabbitMQ queue depth','<code>rabbitmqctl list_queues name messages_ready messages_unacknowledged</code>']])}
<h3>Typical root causes of flakiness</h3>${tb(['Category','Examples','Fix'],[
['Timing','Fixed sleeps, animations, async rendering','Wait on conditions, not time'],
['Data','Shared accounts, leftover records, date assumptions','Create isolated data per test; control the clock'],
['Environment','Slow nodes, noisy neighbours, version drift','Pin versions, set resource limits, use ephemeral environments'],
['Order dependence','Test B only passes after test A','Make tests independent and randomise order'],
['Real product bug','Race condition in the application','Report it as a defect; do not mask with retries']])}`;
X[14]='When a failure appears only in CI, compare the environments first: CPU and memory limits, browser and driver versions, time zone, locale, network latency and the data present. A short script that prints these at the start of every run saves hours of speculation.';

E[15]=`${dt('Design a test platform for 50 engineering teams.','Clarify scale, languages and release cadence. Propose a self-service platform: pipeline templates, an autoscaled grid or container browsers, a shared reporting service, contract broker and dashboards. Define standards with an exception process, set quality gates per stage, plan onboarding by pilot teams first, and measure duration, flake rate, adoption and cost.')}${dt('How do you convince a team to adopt a standard they do not like?','Start with their pain points, show data from a pilot, make the standard the easiest path (templates, docs, support), allow documented exceptions and review the standard when evidence changes.')}${dt('How do you show the return on investment of quality work?','Link effort to outcomes: engineer-hours saved from faster pipelines, fewer escaped defects and incidents, shorter lead time, and lower cloud cost per run. Use before and after numbers with stated assumptions.')}${dt('When do you choose contract tests over E2E tests?','When the risk is a breaking change between services. Contract tests are fast and isolate the failing boundary. Keep E2E tests for critical user journeys that need the whole stack.')}${dt('Explain exactly-once processing and how you test it.','Exactly-once is best achieved as an idempotent effect. Publish duplicates, reorder messages, restart consumers mid-processing and assert the final state and emitted events are correct.')}${dt('What do you do in your first 90 days in this role?','Listen and audit in the first 30 days, publish a baseline and pick one visible problem to fix in the next 30, then deliver a standard and a platform improvement with measured results by day 90.')}
<h3>Answer structure that works</h3>${flow(['Clarify the context','State principles','Propose an approach','Describe trade-offs','Say how you would measure it'])}
<h3>Prepare three stories</h3><ul><li>A time you changed a standard across teams and how you handled resistance.</li><li>A time you cut cost or time with measurable results.</li><li>A time a production failure taught you something and what you changed.</li></ul>`;
X[15]='Interviewers for architect roles look for judgement. Whenever you recommend something, add one situation where you would <i>not</i> recommend it. That shows you understand trade-offs rather than reciting tools.';

  `;
  function injectCss(){ if(document.getElementById('examCss'))return; const s=document.createElement('style'); s.id='examCss'; s.textContent=css; document.head.appendChild(s); }

  function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

  function examDialog(title,msg,okLabel,cancel){

      injectCss();

  }

  function loadScores(){ try{return JSON.parse(localStorage.getItem(LS_KEY)||'[]');}catch(e){return[];} }

          ${last5.map(x=>`<div style="display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid #f1f3ff;font-size:13px">
              <span style="font-weight:700;color:#14213D">${x.score}/${x.total} <span style="color:#64748b;font-weight:600">&middot; ${x.pct}%</span></span>

        </div>

  }

  /* ---- proctoring: tab-switch / fullscreen-exit warnings (3 strikes -> auto-submit) ---- */
  let warns=0, lastWarn=0, proctorOn=false;
  function showCover(){
    if(!examOn)return;
    let c=document.getElementById('examCover');
    if(!c){ c=document.createElement('div'); c.id='examCover'; c.className='exam-cover';
      c.innerHTML='<div>&#9888;&#65039; Test paused &mdash; return to this window</div><small>Leaving the test counts as a warning.</small>';

    c.style.display='flex';
  }
  function hideCover(){ const c=document.getElementById('examCover'); if(c)c.style.display='none'; }
  function proctorModal(title,msg,count,btn,wantFs){
    return new Promise(res=>{
      if(!document.getElementById('examWarnCss')){
        const s=document.createElement('style'); s.id='examWarnCss';
        s.textContent=`.exam-warn{position:fixed;inset:0;z-index:100003;background:rgba(27,40,68,.97);color:#fff;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;font-family:'Noto Sans',system-ui,sans-serif}
.exam-warn .ew-box{max-width:620px;width:100%}
.exam-warn .ew-title{display:flex;align-items:center;justify-content:center;gap:14px;font-size:34px;font-weight:800;margin:0 0 20px}
.exam-warn .ew-title span{font-size:32px}
.exam-warn p{font-size:16px;margin:0 0 20px;line-height:1.5}
.exam-warn .ew-count{font-size:16px;margin:0 0 22px}
.exam-warn .ew-btn{background:#0b1526;color:#fff;border:0;border-radius:10px;padding:16px 25px;font:700 16px 'Noto Sans',system-ui,sans-serif;cursor:pointer}
.exam-warn .ew-btn:hover{background:#000}.exam-warn .ew-btn:focus-visible{outline:3px solid #FCA311;outline-offset:3px}`;
        document.head.appendChild(s);
      }
      const old=document.getElementById('examWarn'); if(old)old.remove();
      const d=document.createElement('div'); d.id='examWarn'; d.className='exam-warn';
      d.setAttribute('role','alertdialog'); d.setAttribute('aria-modal','true'); d.setAttribute('aria-label',title);
      d.innerHTML='<div class="ew-box"><div class="ew-title"><span>&#9888;&#65039;</span>'+title+'</div><p>'+msg+'</p>'+(count?'<div class="ew-count">Warning '+count+' of 3</div>':'')+'<button type="button" class="ew-btn" id="examWarnBtn">'+btn+'</button></div>';
      document.body.appendChild(d);
      const b=d.querySelector('#examWarnBtn'); b.focus();
      d.addEventListener('keydown',e=>{ if(e.key==='Tab'){e.preventDefault();b.focus();} });
      b.addEventListener('click',()=>{
        if(wantFs && !inFs()){ requestFs().then(()=>{fsWanted=true;}).catch(()=>{ fsGate(false); }); }
        graceUntil=Date.now()+2500; d.remove(); res();
      });
    });
  }
  const WARN_MSG={
    fs:['Fullscreen exited','The assessment must remain in fullscreen mode.'],
    tab:['Tab switch detected','Leaving the assessment tab is not allowed.'],
    blur:['Window focus lost','Switching to another window or application is not allowed.'],
    shot:['Screenshot attempt detected','Screenshots and screen capture are not allowed during the assessment.'],
    print:['Print or save attempt detected','Printing or saving the assessment page is not allowed.'],
    leave:['Page closed or reloaded','Your previous attempt was interrupted because the page was closed or reloaded. This counts as a warning.']
  };
  const INT_KEY='rhrms_interrupt_'+C.slug;
  let graceUntil=0;
  function countWarn(kind){
    if(!proctorOn||!examOn)return;
    const now=Date.now(); if(now-lastWarn<1500)return; lastWarn=now;
    warns++;
    const w=WARN_MSG[kind]||WARN_MSG.tab;
    if(warns>=3){
      submitExam(true);
      proctorModal(w[0],'You received 3 warnings, so the assessment has been closed and submitted automatically.',3,'View result',false);
    } else {
      proctorModal(w[0],w[1],warns,kind==='leave'?'Continue assessment':'Return to assessment',true);
    }
  }
  /* --- extra restrictions: screenshot, print, window switch, page close --- */
  function keyGuard(e){
    const k=(e.key||'').toLowerCase(), c=e.ctrlKey||e.metaKey;
    if(k==='printscreen'||e.code==='PrintScreen'){ e.preventDefault(); try{navigator.clipboard&&navigator.clipboard.writeText(' ');}catch(x){} countWarn('shot'); return false; }
    if(e.metaKey&&e.shiftKey&&['3','4','5','s'].includes(k)){ e.preventDefault(); countWarn('shot'); return false; }
    if(e.ctrlKey&&e.shiftKey&&k==='s'){ e.preventDefault(); countWarn('shot'); return false; }
    if(c&&(k==='p'||k==='s')){ e.preventDefault(); countWarn('print'); return false; }
    if(c&&['c','x','u','a'].includes(k)){ e.preventDefault(); return false; }
    if(e.key==='F12'||(c&&e.shiftKey&&['i','j','c'].includes(k))){ e.preventDefault(); return false; }
  }
  function keyUpGuard(e){ if(e.key==='PrintScreen'||e.code==='PrintScreen'){ try{navigator.clipboard&&navigator.clipboard.writeText(' ');}catch(x){} countWarn('shot'); } }
  function printHandler(){ countWarn('print'); }
  function blurHandler(){
    if(!examOn||Date.now()<graceUntil)return;
    setTimeout(()=>{
      if(!examOn||document.hidden||document.getElementById('examWarn')||Date.now()<graceUntil)return;
      if(document.hasFocus&&document.hasFocus())return;
      showCover(); countWarn('blur');
    },200);
  }
  function focusHandler(){ if(!document.hidden) hideCover(); }
  function pageHideHandler(){
    if(!examOn)return;
    const dup=(Date.now()-lastWarn<2000); /* tab-hidden already counted this close */
    try{ localStorage.setItem(INT_KEY,JSON.stringify({warns:warns+(dup?0:1),ts:Date.now()})); }catch(e){}
  }
  function checkInterrupted(){
    let p=null; try{ p=JSON.parse(localStorage.getItem(INT_KEY)||'null'); localStorage.removeItem(INT_KEY);}catch(e){}
    if(!p||!p.warns||Date.now()-p.ts>6*3600*1000)return;
    warns=Math.min(p.warns,3); lastWarn=Date.now();
    if(warns>=3){
      submitExam(true);
      proctorModal(WARN_MSG.leave[0],'You closed or reloaded the assessment 3 times, so it has been closed and submitted automatically.',3,'View result',false);
    } else proctorModal(WARN_MSG.leave[0],WARN_MSG.leave[1],warns,'Continue assessment',true);
  }
  function inFs(){ return !!(document.fullscreenElement||document.webkitFullscreenElement); }
  function requestFs(){
    const el=document.documentElement, fn=el.requestFullscreen||el.webkitRequestFullscreen;
    if(!fn) return Promise.reject(new Error('Fullscreen not supported'));
    try{ const r=fn.call(el,{navigationUI:'hide'}); return (r&&r.then)?r:new Promise((ok,no)=>setTimeout(()=>inFs()?ok():no(new Error('blocked')),400)); }catch(e){ return Promise.reject(e); }
  }
  function fsGate(first){
    if(!examOn)return;
    proctorModal('Fullscreen required', first?'The assessment must run in fullscreen mode. Click the button to continue.':'Your browser blocked fullscreen. Open this page directly in a browser tab (not inside a preview frame) and try again.', 0,'Enter fullscreen',false)
      .then(()=>{ requestFs().then(()=>{fsWanted=true;}).catch(()=>{ fsGate(false); }); });
  }
  function fsHandler(){ if(examOn && !inFs() && fsWanted){ countWarn('fs'); } }
  function visHandler(){ if(document.hidden){ showCover(); countWarn('tab'); } else { hideCover(); } }
  function blockEvt(e){ e.preventDefault(); return false; }
  let fsWanted=false;
  function startProctor(){
    warns=0; lastWarn=0; proctorOn=true;
    document.addEventListener('visibilitychange',visHandler);
    document.addEventListener('fullscreenchange',fsHandler);document.addEventListener('webkitfullscreenchange',fsHandler);
    document.addEventListener('contextmenu',blockEvt,true);
    document.addEventListener('copy',blockEvt,true);
    document.addEventListener('keydown',keyGuard,true);
    document.addEventListener('keyup',keyUpGuard,true);
    window.addEventListener('beforeprint',printHandler);
    window.addEventListener('blur',blurHandler);
    window.addEventListener('focus',focusHandler);
    window.addEventListener('pagehide',pageHideHandler);
    graceUntil=Date.now()+3000;
  }
  function stopProctor(){
    proctorOn=false;
    document.removeEventListener('visibilitychange',visHandler);
    document.removeEventListener('fullscreenchange',fsHandler);document.removeEventListener('webkitfullscreenchange',fsHandler);
    document.removeEventListener('contextmenu',blockEvt,true);
    document.removeEventListener('copy',blockEvt,true);
    document.removeEventListener('keydown',keyGuard,true);
    document.removeEventListener('keyup',keyUpGuard,true);
    window.removeEventListener('beforeprint',printHandler);
    window.removeEventListener('blur',blurHandler);
    window.removeEventListener('focus',focusHandler);
    window.removeEventListener('pagehide',pageHideHandler);
    try{localStorage.removeItem(INT_KEY);}catch(e){}
    hideCover();
  }

  function showSplash(){
    if(document.getElementById('examSplash')||document.getElementById('examOverlay'))return;
    injectCss();
    const sp=document.createElement('div'); sp.className='exam-splash'; sp.id='examSplash';
    sp.innerHTML=`<div class="exam-card">
      <h2>&#127919; ${C.title} &mdash; Final Assessment</h2>
      <p>A timed, exam-style assessment modelled on real enterprise hiring screens.</p>
      <ul>
        <li><b>${BANK.length} questions</b>, shuffled every attempt</li>
        <li><b>${C.minutes||60}-minute</b> timer &mdash; the test auto-submits when time is up</li>
        <li>Navigate freely, <b>mark questions for review</b>, then submit</li>
        <li>Correct answers and explanations are shown only after you submit</li>
      </ul>
      <p style="font-weight:700;color:#14213D;margin-bottom:6px">Exam rules</p>
      <ul style="margin-top:0">
        <li>The test runs in <b>fullscreen</b> where your browser allows it</li>
        <li><b>Do not</b> press Esc, exit fullscreen, switch tabs or windows, take screenshots, print, or close/reload the page</li>
        <li>Each violation is a <b>warning</b>. After <b>3 warnings</b> the assessment is <b>closed and auto-submitted</b></li>
        <li>Closing or reloading the page counts as a warning on your next start. Copy, right-click and print are disabled</li>
      </ul>
      <div style="display:flex;gap:10px"><button class="exam-btn nav" id="examCancel" style="flex:0 0 auto">Cancel</button>
      <button class="exam-btn primary" id="examBegin" style="flex:1;padding:14px">Start Test &rarr;</button></div>
    </div>`;
    document.body.appendChild(sp);
    document.getElementById('examCancel').addEventListener('click',()=>sp.remove());
    document.getElementById('examBegin').addEventListener('click',()=>{
      fsWanted=false;
      const fsReq=requestFs();
      sp.remove(); enterExam();
      fsReq.then(()=>{fsWanted=true;}).catch(()=>{ fsGate(true); });
    });
  }

  function enterExam(){
    injectCss();
    items = shuffle(BANK);
    answers={}; marked={}; cur=0; remaining=EXAM_SECONDS; examOn=true;
    const ov=document.createElement('div'); ov.className='exam-overlay'; ov.id='examOverlay';
    ov.innerHTML=`
      <div class="exam-top">
        <div><div class="et-title">${C.title} &mdash; Final Assessment</div><div class="et-sub">${items.length} questions &middot; one attempt &middot; good luck</div></div>
        <div class="exam-timer" id="examTimer">${fmt(remaining)}</div>
      </div>
      <div class="exam-main">
        <div class="exam-q-pane" id="examQ"></div>
        <div class="exam-side">
          <div class="exam-count">Answered <b id="examAnsN">0</b> / ${items.length}</div>
          <h4>Question palette</h4>
          <div class="exam-palette" id="examPal"></div>
          <div class="exam-legend">
            <span><i style="background:#14213D;border-color:#14213D"></i> Answered</span>
            <span><i style="background:#FCA311;border-color:#FCA311"></i> Marked for review</span>
            <span><i></i> Not answered</span>
          </div>
          <button class="exam-btn submit" id="examSubmit" style="width:100%">Submit Test</button>
        </div>
      </div>`;
    document.body.appendChild(ov);
    document.body.style.overflow='hidden';
    document.getElementById('examSubmit').addEventListener('click',()=>submitExam(false));
    buildPalette(); renderQ();
    timerId=setInterval(tick,1000);
    window.addEventListener('beforeunload',beforeUnload);
    startProctor();
    checkInterrupted();
  }
  function beforeUnload(e){ if(examOn){e.preventDefault();e.returnValue='';} }
  function tick(){
    remaining--; const el=document.getElementById('examTimer');
    if(el){ el.textContent=fmt(Math.max(remaining,0)); if(remaining<=300)el.classList.add('warn'); }
    if(remaining<=0){ submitExam(true); }
  }
  function buildPalette(){
    const pal=document.getElementById('examPal'); pal.innerHTML='';
    items.forEach((it,n)=>{
      const b=document.createElement('button'); b.className='pal'; b.textContent=n+1; b.dataset.n=n;
      b.addEventListener('click',()=>{cur=n;renderQ();});
      pal.appendChild(b);
    });
    refreshPalette();
  }
  function refreshPalette(){
    document.querySelectorAll('#examPal .pal').forEach(b=>{
      const n=+b.dataset.n, id=items[n].id;
      b.classList.toggle('answered', id in answers);
      b.classList.toggle('marked', !!marked[id]);
      b.classList.toggle('cur', n===cur);
    });
    const el=document.getElementById('examAnsN'); if(el)el.textContent=Object.keys(answers).length;
  }
  function renderQ(){
    const it=items[cur], id=it.id, pane=document.getElementById('examQ');
    pane.innerHTML=`
      <div class="exam-qnum">Question ${cur+1} of ${items.length}${it.cat?' &middot; '+it.cat:''}</div>
      <div class="exam-qtext">${it.q}</div>
      <div class="exam-opts" id="examOpts">${it.options.map((o,i)=>`<div class="exam-opt${answers[id]===i?' sel':''}" data-i="${i}" tabindex="0"><span class="k">${String.fromCharCode(65+i)}</span><span>${o}</span></div>`).join('')}</div>
      <div class="exam-actions">
        <button class="exam-btn nav" id="examPrev" ${cur===0?'disabled':''}>&larr; Previous</button>
        <button class="exam-btn exam-mark${marked[id]?' on':''}" id="examMark">${marked[id]?'★ Marked':'☆ Mark for review'}</button>
        <button class="exam-btn nav" id="examNext" ${cur===items.length-1?'disabled':''}>Next &rarr;</button>
      </div>`;
    pane.querySelectorAll('#examOpts .exam-opt').forEach(el=>{
      const pick=()=>{ answers[id]=+el.dataset.i; pane.querySelectorAll('#examOpts .exam-opt').forEach(x=>x.classList.remove('sel')); el.classList.add('sel'); refreshPalette(); };

  async function submitExam(auto){
    if(!examOn)return;
    const unanswered=items.length-Object.keys(answers).length;
    if(!auto){
      const ok=await examDialog('Submit test?', unanswered>0
        ? 'You have '+unanswered+' unanswered question(s). Once submitted, you can\'t change your answers.'

  function showResults(score){
    const total=items.length; saveScore(score,total);
    const pct=Math.round(score/total*100);
    let msg='Keep practicing &mdash; review the explanations below, revisit the modules and try again.';
    if(pct>=85)msg='Outstanding &mdash; you are operating at an expert level for this role.';
    else if(pct>=(C.pass||65))msg='Solid pass. Review the questions you missed and you are interview-ready.';
    else if(pct>=50)msg='Borderline &mdash; revisit the modules you missed and retake.';
    const rev=items.map((it,n)=>{
      const you=answers[it.id], attempted=(you!=null), ok=attempted&&you===it.answer;
      let inner='<div class="rq">Q'+(n+1)+'. '+it.q+'</div>';
      inner+= attempted ? '<div class="ra '+(ok?'cor':'wrong')+'">Your answer: '+String.fromCharCode(65+you)+'. '+it.options[you]+'</div>' : '<div class="ra wrong">Your answer: <i>Not answered</i></div>';
      if(!ok) inner+='<div class="ra cor">Correct: '+String.fromCharCode(65+it.answer)+'. '+it.options[it.answer]+'</div>';
      if(it.exp) inner+='<div class="rx">'+it.exp+'</div>';
      return '<div class="r '+(ok?'ok':'no')+'">'+inner+'</div>';
    }).join('');
    const ov=document.getElementById('examOverlay');
    ov.innerHTML=`
      <div class="exam-top"><div class="et-title">Result &mdash; ${C.title}</div>
        <button class="exam-btn" id="examClose" style="background:rgba(255,255,255,.15);color:#fff">&#10005; Close</button></div>
      <div class="exam-q-pane" style="grid-column:1/-1">
        <div class="exam-result">
          <div class="exam-score">${score} / ${total}</div>
          <div class="exam-rmsg">${pct}% correct &mdash; ${msg}</div>

          <div class="exam-rev">${rev}</div>
        </div>
      </div>`;
    document.getElementById('examRetry').addEventListener('click',()=>{ closeExam(); showSplash(); });
    document.getElementById('examClose').addEventListener('click',closeExam);
  }
  function closeExam(){
    stopProctor();
    const ov=document.getElementById('examOverlay'); if(ov)ov.remove();
    document.body.style.overflow='';
    fsWanted=false; if(inFs()){ (document.exitFullscreen||document.webkitExitFullscreen).call(document); }
  }
  document.addEventListener('click',e=>{ if(e.target.closest && e.target.closest('#assessStartBtn')) showSplash(); });
  renderScoreboard();
  new MutationObserver(()=>{ const el=document.getElementById('scoreBoard'); if(el && !el.dataset.r){ el.dataset.r='1'; renderScoreboard(); } })
    .observe(document.body,{childList:true,subtree:true});
})();
act(0);
</script><script>
(function(){
  const t=document.getElementById('tabbar'); if(!t)return;
  t.addEventListener('wheel',e=>{ if(t.scrollWidth>t.clientWidth && Math.abs(e.deltaY)>Math.abs(e.deltaX)){ t.scrollLeft+=e.deltaY; e.preventDefault(); } },{passive:false});
  let down=false,sx=0,sl=0,moved=false;
  t.addEventListener('pointerdown',e=>{ if(e.pointerType==='mouse'&&e.button!==0)return; down=true;moved=false;sx=e.clientX;sl=t.scrollLeft; });
  window.addEventListener('pointermove',e=>{ if(!down)return; const dx=e.clientX-sx; if(Math.abs(dx)>5){moved=true;t.classList.add('dragging');} if(moved)t.scrollLeft=sl-dx; });
  window.addEventListener('pointerup',()=>{ down=false; setTimeout(()=>t.classList.remove('dragging'),0); });
  t.addEventListener('click',e=>{ if(moved){ e.stopPropagation(); e.preventDefault(); moved=false; } },true);
  new MutationObserver(()=>{ const a=t.querySelector('.tab.active'); if(a) a.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'}); }).observe(t,{subtree:true,attributes:true,attributeFilter:['class']});
})();
</script>
<script>/* CareerBuddy hub: the final assessment opens in its own tab */
(function(){
  var SEL='#assessStartBtn,#startAssessmentButton,#cbAssessStart,.assess-start-btn,.assessment-page-start,.assessment-start-page-btn';
  var framed=window.top!==window.self;
  document.addEventListener('click',function(e){
    if(!framed)return;
    var b=e.target.closest&&e.target.closest(SEL); if(!b)return;
    e.preventDefault(); e.stopImmediatePropagation();
    window.open(location.pathname+'?assess=1','_blank');
  },true);
  if(!framed&&/[?&]assess=1(&|$)/.test(location.search)){
    window.addEventListener('load',function(){
      var b=document.querySelector(SEL); if(!b)return;
      var panel=b.closest('.panel');
      if(panel){ var i=[].indexOf.call(document.querySelectorAll('.panel'),panel), t=document.querySelectorAll('.tab')[i]; if(t)t.click(); }
      b.click();
    });
  }
})();
</script>
<script>/* CareerBuddy: screenshots are not allowed during the assessment */
(function(){
  // A web page cannot stop the operating system from taking a screenshot, so this makes
  // screenshots hard to take and useless if taken: the screen blanks while a capture tool
  // has focus or a screenshot key is pressed, the clipboard is overwritten after
  // Print Screen, printing is blocked, and every view carries a watermark with the
  // candidate's name and the time. Active in the assessment tab (?assess=1) and once an
  // assessment is started on a page opened outside the hub.
  var START='#assessStartBtn,#startAssessmentButton,#cbAssessStart,.assess-start-btn,.assessment-page-start,.assessment-start-page-btn';
  var framed=window.top!==window.self, on=false, cover=null, mark=null, hideT=null;
  // In the hub frame: remember who is signed in, so the assessment tab (which inherits this
  // tab's sessionStorage) can watermark with the candidate's name. Window capture runs
  // before the new-tab handler on document.
  window.addEventListener('click',function(e){
    if(!framed||!(e.target.closest&&e.target.closest(START)))return;
    try{var r=window.parent.document.getElementById('riya-assistant-root');
      if(r&&r.dataset.riyaUsername)sessionStorage.setItem('cbCandidate',r.dataset.riyaUsername);}catch(_){}
  },true);
  if(framed)return;

  function css(){
    var st=document.createElement('style');
    st.textContent='@media print{html,body{display:none!important}}'
      +'#cbShotCover{position:fixed;inset:0;z-index:2147483647;background:#0b1220;color:#fff;display:none;align-items:center;justify-content:center;text-align:center;font:600 18px/1.5 system-ui,sans-serif;padding:24px}'
      +'#cbShotCover.on{display:flex}'
      +'#cbShotMark{position:fixed;inset:0;z-index:2147483646;pointer-events:none;overflow:hidden;opacity:.11}'
      +'#cbShotMark span{position:absolute;white-space:nowrap;font:700 15px system-ui,sans-serif;color:#0b1220;transform:rotate(-24deg)}'
      +'body.cb-shot-guard{-webkit-user-select:none;user-select:none}';
    document.head.appendChild(st);
  }
  function watermark(){
    var who='', when=new Date().toLocaleString();
    try{who=sessionStorage.getItem('cbCandidate')||'';}catch(_){}
    var text='CareerBuddy assessment · '+(who?who+' · ':'')+when+' · Screenshots not allowed';
    mark=document.createElement('div');mark.id='cbShotMark';mark.setAttribute('aria-hidden','true');
    var html='';
    for(var y=-10;y<110;y+=14)for(var x=-20;x<110;x+=38)html+='<span style="left:'+x+'%;top:'+y+'%"></span>';
    mark.innerHTML=html;
    [].forEach.call(mark.children,function(s){s.textContent=text;});
    document.body.appendChild(mark);
  }
  function show(msg,ms){
    if(!cover)return;
    cover.textContent=msg||'Screenshots are not allowed during the assessment.';
    cover.classList.add('on');
    clearTimeout(hideT); hideT=null;
    if(ms)hideT=setTimeout(function(){hideT=null;if(document.hasFocus())cover.classList.remove('on');},ms);
  }
  function hide(){if(cover&&!hideT)cover.classList.remove('on');}
  function scrub(){ // overwrite whatever Print Screen put on the clipboard
    try{navigator.clipboard&&navigator.clipboard.writeText('Screenshots are not allowed during the CareerBuddy assessment.');}catch(_){}
  }
  function isShotKey(e){
    var k=(e.key||'').toLowerCase();
    if(k==='printscreen'||e.keyCode===44)return true;                         // Print Screen (Windows / Linux)
    if(e.metaKey&&e.shiftKey&&['3','4','5','6','s'].indexOf(k)>=0)return true; // macOS Cmd+Shift+3/4/5/6, Win+Shift+S
    if((e.ctrlKey||e.metaKey)&&(k==='p'||(e.shiftKey&&k==='s')))return true;   // print / save-as
    return false;
  }
  function activate(){
    if(on)return; on=true;
    css();
    cover=document.createElement('div');cover.id='cbShotCover';cover.setAttribute('role','alert');
    document.body.appendChild(cover);
    document.body.classList.add('cb-shot-guard');
    watermark();
    window.addEventListener('keydown',function(e){
      if(isShotKey(e)){e.preventDefault();e.stopPropagation();scrub();show(null,2500);return;}
      if(e.key==='Meta'||e.key==='OS')show('Screenshots are not allowed during the assessment.',0); // Windows key: blank before Win+Shift+S
    },true);
    window.addEventListener('keyup',function(e){
      if(isShotKey(e)){e.preventDefault();scrub();show(null,2500);return;}  // Print Screen only reports keyup on Windows
      if(e.key==='Meta'||e.key==='OS'){hideT=null;hide();}
    },true);
    // Snipping Tool, Xbox Game Bar and similar capture tools take focus: blank the screen until it returns.
    window.addEventListener('blur',function(){show('The assessment is hidden while another window is active.',0);});
    window.addEventListener('focus',function(){hideT=null;hide();});
    document.addEventListener('visibilitychange',function(){if(document.hidden)show('The assessment is hidden while another window is active.',0);});
    window.addEventListener('beforeprint',function(){show(null,0);});
    window.addEventListener('afterprint',function(){hideT=null;hide();});
  }
  if(/[?&]assess=1(&|$)/.test(location.search))document.readyState==='loading'?document.addEventListener('DOMContentLoaded',activate):activate();
  window.addEventListener('click',function(e){if(e.target.closest&&e.target.closest(START))activate();},true);
})();
</script>
