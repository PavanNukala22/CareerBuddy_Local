<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100%;font-family:'Outfit',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
body{background:#f9f9ff;padding:10px}
.container{min-height:calc(100vh - 24px);max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.top-section{flex:0 0 auto;background:#ffffff;border-radius:14px;padding:10px 16px;box-shadow:0 2px 10px rgba(20,33,61,.08);display:flex;flex-direction:column;border:1px solid #e5e5e5;font-family:'Outfit',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.top-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;flex-wrap:wrap;gap:6px}
.top-title{font-size:16px;font-weight:800;color:#14213D;display:flex;align-items:center;gap:8px}
.header-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.level-badge{background:#FCA311;color:#14213D;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:800;border:2px solid #fff}
.include-badge{background:#f0f1f4;color:#14213D;padding:4px 14px;border-radius:14px;font-size:12px;font-weight:800;box-shadow:none;border:1px solid #e5e5e5}
.mode-toggle{display:flex;gap:4px;background:transparent;padding:0;border-radius:14px;border:none}
.mode-btn{background:transparent;border:none;color:#14213D;font-weight:700;font-size:13px;padding:6px 16px;border-radius:12px;cursor:pointer;font-family:inherit}
.mode-btn.active{background:#14213D;color:#fff}
.book-list{display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;padding:6px 2px;flex:0 0 auto;align-items:center;scroll-behavior:smooth}
.mini-book{flex-shrink:0;width:82px;height:68px;border-radius:10px;cursor:pointer;background:#fff;border:1px solid #e2e8f0;border-top:3px solid var(--accent,#14213D);transition:transform .18s,box-shadow .18s;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#14213D;box-shadow:0 1px 3px rgba(16,24,40,.08);position:relative;user-select:none;padding:6px 4px;gap:2px}
.mini-book .b-emoji{font-size:20px;line-height:1}
.mini-book .b-pattern{font-size:16px;font-weight:700;color:#14213D}
.mini-book .b-count{font-size:9px;background:#f1f3ff;color:#718096;padding:1px 7px;border-radius:8px;font-weight:600}
.mini-book:hover{transform:translateY(-3px)}
.mini-book.active{transform:translateY(-5px) scale(1.08);box-shadow:0 0 0 2px #14213D;z-index:2}
.mini-book.active::after{content:'✓';position:absolute;top:-7px;right:-7px;background:#FCA311;color:#14213D;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;border:2px solid #fff}
.bottom-section{flex:1 1 auto;min-height:440px;position:relative}
.learn-view{height:100%;display:grid;grid-template-columns:45% 55%;gap:10px}
.card-display{background:#fff;border-radius:18px;padding:14px;box-shadow:0 6px 20px rgba(0,0,0,.12);display:flex;flex-direction:column;align-items:center;justify-content:space-between;perspective:1500px;position:relative;border:1px solid #e2e8f0}
.book-title{background:linear-gradient(135deg,#22345f,#14213D);color:#fff;padding:6px 16px;border-radius:14px;font-size:14px;font-weight:800;box-shadow:none;border:2px solid #fff}
.pronounce-btn{position:absolute;top:12px;right:12px;background:#14213D;border:none;color:#fff;width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:15px;box-shadow:0 1px 3px rgba(16,24,40,.08);z-index:10;transition:.15s}
.pronounce-btn:hover{background:#0b1526}
.flip-card{width:90%;height:65%;max-height:360px;min-height:210px;position:relative;cursor:pointer;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.4,0,.2,1)}
.flip-card.flipped{transform:rotateY(180deg)}
.flip-face{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:18px;display:flex;align-items:center;justify-content:center;flex-direction:column;box-shadow:0 10px 25px rgba(0,0,0,.18);border:1px solid #e2e8f0;overflow:hidden;padding:12px;gap:8px}
.flip-front{background:linear-gradient(135deg,var(--c1,#14213D),var(--c2,#14213D));color:#fff}
.flip-back{background:linear-gradient(135deg,#fefefe,#f1f3ff);color:#333;transform:rotateY(180deg)}
.big-emoji{font-size:clamp(40px,5vw,64px);filter:drop-shadow(0 4px 8px rgba(0,0,0,.25))}
.word-display{font-size:clamp(34px,5.4vw,66px);font-weight:800;text-align:center;letter-spacing:1px}
.word-display .h1{color:#fff5d6}.word-display .h2{color:#fff;text-decoration:underline;text-decoration-color:#FCA311;text-decoration-thickness:4px;text-underline-offset:6px}
.tap-hint{font-size:11px;color:#fff;opacity:.8;font-weight:700}
.phoneme-split{display:flex;gap:12px;font-size:clamp(24px,4.2vw,44px);font-weight:800;align-items:center;flex-wrap:wrap;justify-content:center}
.phoneme-chunk{background:#f1f3ff;color:#14213D;padding:6px 16px;border-radius:10px;border:1px solid #dde2f3}
.phoneme-chunk.h2{background:#fdeecb;color:#7a5c00;border-color:rgba(238,188,29,.5)}
.meaning-display{font-size:clamp(14px,1.7vw,18px);font-weight:600;text-align:center;line-height:1.4;color:#555;padding:0 8px}
.word-nav{display:flex;align-items:center;gap:10px;background:#f1f3ff;padding:6px 14px;border-radius:18px;border:2px solid #e2e8f0}
.nav-btn{background:#fff;border:1px solid #e2e8f0;color:#14213D;width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:18px;font-weight:700;box-shadow:none;transition:.15s}
.nav-btn:hover:not(:disabled){border-color:#14213D;background:#e6ebf3}
.nav-btn:disabled{opacity:.3;cursor:not-allowed}
.word-counter{font-size:13px;font-weight:700;color:#14213D;min-width:60px;text-align:center}
.details-panel{background:#fff;border-radius:18px;padding:16px 20px;overflow-y:auto;box-shadow:0 6px 20px rgba(0,0,0,.12);border:1px solid #e2e8f0}
.details-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid #e2e8f0;gap:8px;flex-wrap:wrap}
.details-word-wrap{display:flex;align-items:center;gap:8px}
.details-emoji{font-size:32px}
.details-word{font-size:28px;font-weight:800;color:#14213D;letter-spacing:1px}
.details-word .h1{color:#14213D}.details-word .h2{color:#b9720a}
.badge-col{display:flex;gap:6px;align-items:center}
.pos-badge{background:linear-gradient(135deg,#FCA311,#e08a0b);color:#14213D;padding:4px 12px;border-radius:14px;font-size:11px;font-weight:800;text-transform:uppercase;border:2px solid #fff}
.lvl-badge{padding:4px 12px;border-radius:14px;font-size:11px;font-weight:800;text-transform:uppercase;border:2px solid #fff;color:#fff}
.lvl-core{background:linear-gradient(135deg,#55efc4,#00b894)}
.lvl-mid{background:linear-gradient(135deg,#FCA311,#e08a0b)}
.lvl-adv{background:linear-gradient(135deg,#22345f,#14213D)}
.detail-section{margin-bottom:12px}
.detail-label{display:flex;align-items:center;gap:6px;font-weight:800;color:#14213D;font-size:12px;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.phonetic-box{background:#f1f3ff;border-left:5px solid #14213D;padding:6px 14px;border-radius:8px;font-style:italic;font-size:17px;color:#0d1626;font-weight:700}
.phoneme-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.phoneme-pill{background:#14213D;color:#fff;padding:4px 12px;border-radius:14px;font-size:16px;font-weight:800;border:2px solid #fff}
.phoneme-pill.h2{background:#FCA311;color:#14213D}
.phoneme-pill.full{background:#0d1626}
.phoneme-plus{color:#999;font-size:16px;font-weight:800}
.meaning-box{font-size:14px;color:#444;line-height:1.5;background:#f1f3ff;padding:8px 14px;border-radius:8px;border-left:5px solid #FCA311}
.example-item{background:#fbfbfd;padding:8px 14px;border-left:5px solid #ffd93d;margin-bottom:5px;border-radius:8px;font-size:13px;color:#2d3436;line-height:1.5;font-style:italic}
.example-item::before{content:'"';font-size:20px;color:#14213D;font-weight:700;margin-right:4px}
.tip-box{font-size:13px;color:#475569;line-height:1.5;background:#f1f3ff;padding:8px 14px;border-radius:8px;border-left:5px solid #14213D}
.tag-list{display:flex;flex-wrap:wrap;gap:5px}
.tag{padding:4px 10px;border-radius:14px;font-size:13px;font-weight:700;color:#fff;border:2px solid #fff;cursor:pointer;background:linear-gradient(135deg,#22345f,#14213D)}
.tag.active{background:linear-gradient(135deg,#FCA311,#e08a0b);color:#14213D}
/* ── Assessment / Test view ── */
.test-view{height:100%;background:#fff;border-radius:18px;box-shadow:0 6px 20px rgba(0,0,0,.12);border:1px solid #e2e8f0;padding:18px 22px;overflow-y:auto;display:flex;flex-direction:column}
.quiz-top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.quiz-progress-wrap{flex:1;height:12px;background:#f1f3ff;border-radius:8px;overflow:hidden;border:2px solid #e2e8f0}
.quiz-progress-bar{height:100%;background:linear-gradient(90deg,#22345f,#FCA311);width:0%;transition:width .4s}
.quiz-count{font-size:12px;font-weight:800;color:#14213D;white-space:nowrap}
.quiz-score-chip{background:#FCA311;color:#14213D;font-weight:800;font-size:12px;padding:4px 10px;border-radius:12px;border:2px solid #fff;white-space:nowrap}
.quiz-qtype{align-self:flex-start;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1px;padding:3px 10px;border-radius:10px;margin-bottom:10px}
.qtype-mcq{background:#f1f3ff;color:#14213D}
.qtype-type{background:#fff6e9;color:#b7791f}
.quiz-question{font-size:clamp(16px,2.1vw,22px);font-weight:800;color:#2d3436;line-height:1.45;margin-bottom:14px}
.quiz-options{display:flex;flex-direction:column;gap:8px}
.quiz-opt{text-align:left;background:#f1f3ff;border:3px solid #e2e8f0;border-radius:12px;padding:10px 14px;font-size:15px;font-weight:700;color:#2d3436;cursor:pointer;font-family:inherit;transition:all .15s;display:flex;align-items:center;gap:10px}
.quiz-opt .opt-key{background:#14213D;color:#fff;width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.quiz-opt:hover:not(:disabled){border-color:#14213D;transform:translateX(3px)}
.quiz-opt:disabled{cursor:default}
.quiz-opt.correct{background:#d4f8e8;border-color:#00b894;color:#0a7a5a}
.quiz-opt.correct .opt-key{background:#00b894}
.quiz-opt.wrong{background:#ffe0e0;border-color:#e74c3c;color:#c0392b}
.quiz-opt.wrong .opt-key{background:#e74c3c}
.quiz-input-wrap{display:flex;gap:8px;flex-wrap:wrap}
.quiz-input{flex:1;min-width:180px;padding:11px 16px;border:3px solid #e2e8f0;border-radius:12px;font-size:16px;font-weight:700;font-family:inherit;color:#2d3436}
.quiz-input:focus{outline:none;border-color:#14213D}
.quiz-input:disabled{background:#f4f4f4}
.quiz-hint{font-size:12px;color:#64748b;margin-top:8px;font-style:italic}
.quiz-btn{background:linear-gradient(135deg,#22345f,#14213D);color:#fff;border:2px solid #fff;font-weight:800;font-size:14px;padding:10px 22px;border-radius:14px;cursor:pointer;font-family:inherit;box-shadow:none}
.quiz-btn:active{transform:translateY(2px);box-shadow:none}
.quiz-btn.teal{background:linear-gradient(135deg,#FCA311,#e08a0b);color:#14213D;box-shadow:none}
.quiz-btn.teal:active{box-shadow:none}
.quiz-btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.quiz-feedback{margin-top:12px;padding:10px 14px;border-radius:12px;font-size:14px;font-weight:600;line-height:1.5}
.quiz-feedback.ok{background:#e6f9f0;border-left:5px solid #00b894;color:#0a7a5a}
.quiz-feedback.no{background:#fdeaea;border-left:5px solid #e74c3c;color:#c0392b}
.quiz-actions{margin-top:auto;display:flex;justify-content:flex-end;gap:10px;padding-top:14px}
.quiz-center{text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100%;gap:12px}
.quiz-big-emoji{font-size:60px}
.quiz-title{font-size:26px;font-weight:800;color:#14213D}
.quiz-sub{font-size:15px;color:#666;max-width:460px;line-height:1.55}
.quiz-meta{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;font-size:12px;font-weight:800}
.quiz-meta span{background:#f1f3ff;color:#14213D;padding:5px 12px;border-radius:12px}
.quiz-score-big{font-size:54px;font-weight:800;color:#14213D;line-height:1}
.review-wrap{width:100%;text-align:left;margin-top:6px}
.review-title{font-size:13px;font-weight:800;color:#14213D;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.review-list{display:flex;flex-direction:column;gap:8px}
.review-item{background:#fbfbfd;border-left:5px solid #ffd93d;padding:8px 12px;border-radius:8px;font-size:13px;line-height:1.5;color:#2d3436}
.review-item .r-you{color:#c0392b;font-weight:800}
.review-item .r-ans{color:#0a7a5a;font-weight:800}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:#f1f3ff;border-radius:10px}
::-webkit-scrollbar-thumb{background:linear-gradient(135deg,#22345f,#14213D);border-radius:10px}
@media(max-width:900px){.learn-view{grid-template-columns:1fr;grid-template-rows:1fr 1fr}}
</style>

  {type:"type",q:"Give the past tense of <b>see</b>. (It uses the 'aw' sound and has three letters.)",accept:["saw"],ans:"saw",hint:"3 letters, rhymes with 'draw'.",ex:"'saw' /sɔː/ — the 'aw' makes a long, open /ɔː/."},
  {type:"mcq",q:"Which spelling is correct?",opts:["awsome","awesome","ausome","awesom"],a:1,ex:"'awesome' begins with the 'aw' pattern: a-w-e-s-o-m-e."},
  {type:"type",q:"Which 'au' word means <i>extremely tired</i>? (Careful: the 'h' is silent.)",accept:["exhausted"],ans:"exhausted",hint:"Starts with 'ex-'.",ex:"'exhausted' /ɪɡˈzɔːstɪd/ — spelled with 'au', pronounced /ɔː/."},
  {type:"mcq",q:"If you <b>disturb</b> someone, you…",opts:["help them relax","interrupt their peace","teach them a skill","make them laugh"],a:1,ex:"To disturb is to interrupt or upset someone's calm."},
  {type:"mcq",q:"Pick the sentence where <b>fair</b> means <i>treating everyone equally</i>.",opts:["We rode rides at the fair.","The summer fair had bright lights.","It isn't fair to cut in line.","Bus fare costs two dollars."],a:2,ex:"'fair' can mean 'just / equal' or 'a public event'. (A bus <i>fare</i> is a different word.)"},
  {type:"type",q:"Write the <b>'air'</b> word meaning <i>to fix something that is broken</i>:<br>The mechanic will ______ my bike.",accept:["repair"],ans:"repair",hint:"re + pair.",ex:"'repair' /rɪˈpeər/ means to fix; it contains 'pair' (/eər/)."}
];

/* ===========================================================
   LEARN MODE
   =========================================================== */
let bookIdx=0,wordIdx=0;
function splitWord(w,b){if(b.type==="rime"){const r=b.pattern,c=w.length-r.length;return{h1:w.slice(0,c),h2:w.slice(c)}}else if(b.type==="onset"){const o=b.pattern;return{h1:w.slice(0,o.length),h2:w.slice(o.length)}}else{const i=w.indexOf(b.pattern);return i>=0?{h1:w.slice(0,i),h2:w.slice(i,i+b.pattern.length),tail:w.slice(i+b.pattern.length)}:{h1:w,h2:""}}}
function buildBookList(){const L=document.getElementById('bookList');L.innerHTML='';books.forEach((b,i)=>{const c=document.createElement('div');c.className='mini-book'+(i===bookIdx?' active':'');c.style.setProperty('--accent',b.c[0]);c.innerHTML=`<div class="b-emoji">${b.em}</div><div class="b-pattern">${b.pattern}</div><div class="b-count">${b.w.length} words</div>`;c.onclick=()=>selectBook(i);L.appendChild(c)})}
function selectBook(i){bookIdx=i;wordIdx=0;document.querySelectorAll('.mini-book').forEach((c,x)=>c.classList.toggle('active',x===i));document.getElementById('flipCard').classList.remove('flipped');updateDisplay();const a=document.querySelectorAll('.mini-book')[i];if(a)a.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'})}
function selectWord(j){wordIdx=j;document.getElementById('flipCard').classList.remove('flipped');updateDisplay()}
function renderSplit(w,b){const s=splitWord(w,b);return b.type==="vowel"?`<span class="h1">${s.h1}</span><span class="h2">${s.h2}</span><span class="h1">${s.tail||''}</span>`:`<span class="h1">${s.h1}</span><span class="h2">${s.h2}</span>`}
function renderChunks(w,b){const s=splitWord(w,b);if(b.type==="vowel"){let h='';if(s.h1)h+=`<div class="phoneme-chunk">${s.h1}</div>`;h+=`<div class="phoneme-chunk h2">${s.h2}</div>`;if(s.tail)h+=`<div class="phoneme-chunk">${s.tail}</div>`;return h}return`<div class="phoneme-chunk">${s.h1}</div><div class="phoneme-chunk h2">${s.h2}</div>`}
function renderPills(w,b){const s=splitWord(w,b);let h='';if(b.type==='vowel'){if(s.h1)h+=`<div class="phoneme-pill">${s.h1}</div><span class="phoneme-plus">+</span>`;h+=`<div class="phoneme-pill h2">${s.h2}</div>`;if(s.tail)h+=`<span class="phoneme-plus">+</span><div class="phoneme-pill">${s.tail}</div>`}else if(s.h1){h+=`<div class="phoneme-pill">${s.h1}</div><span class="phoneme-plus">+</span><div class="phoneme-pill h2">${s.h2}</div>`}else{h+=`<div class="phoneme-pill h2">${s.h2}</div>`}h+=`<span class="phoneme-plus">=</span><div class="phoneme-pill full">${w}</div>`;return h}
const LVL={C:["Core","lvl-core"],I:["Intermediate","lvl-mid"],A:["Advanced","lvl-adv"]};
function updateDisplay(){const b=books[bookIdx],row=b.w[wordIdx],[word,em,pos,ipa,def,sn,tip,lvl]=row;
  document.getElementById('bookTitle').textContent=b.name;
  document.getElementById('bookProgress').textContent=`${bookIdx+1} of ${books.length}`;
  document.getElementById('bigEmoji').textContent=em;
  document.getElementById('wordDisplay').innerHTML=renderSplit(word,b);
  document.getElementById('phonemeSplit').innerHTML=renderChunks(word,b);
  document.getElementById('meaningDisplay').textContent=def;
  document.getElementById('wordCounter').textContent=`${wordIdx+1} / ${b.w.length}`;
  document.getElementById('prevBtn').disabled=wordIdx===0;
  document.getElementById('nextBtn').disabled=wordIdx===b.w.length-1;
  document.getElementById('detailsEmoji').textContent=em;
  document.getElementById('detailsWord').innerHTML=renderSplit(word,b);
  document.getElementById('posBadge').textContent=pos;
  const lb=document.getElementById('lvlBadge');const L=LVL[lvl]||LVL.C;lb.textContent=L[0];lb.className='lvl-badge '+L[1];
  document.getElementById('phonemeRow').innerHTML=renderPills(word,b);
  document.getElementById('phoneticDisplay').textContent=ipa;
  document.getElementById('definitionDisplay').textContent=def;
  document.getElementById('examplesDisplay').innerHTML=`<div class="example-item">${sn}</div>`;
  document.getElementById('tipDisplay').textContent=tip;
  document.getElementById('familyDisplay').innerHTML=b.w.map((o,x)=>`<div class="tag${x===wordIdx?' active':''}" onclick="selectWord(${x})">${o[1]} ${o[0]}</div>`).join('')}
document.getElementById('flipCard').addEventListener('click',function(){this.classList.toggle('flipped')});
document.getElementById('pronounceBtn').addEventListener('click',e=>{e.stopPropagation();const u=new SpeechSynthesisUtterance(books[bookIdx].w[wordIdx][0]);u.rate=.85;speechSynthesis.speak(u)});
document.getElementById('prevBtn').addEventListener('click',e=>{e.stopPropagation();if(wordIdx>0)selectWord(wordIdx-1)});
document.getElementById('nextBtn').addEventListener('click',e=>{e.stopPropagation();if(wordIdx<books[bookIdx].w.length-1)selectWord(wordIdx+1)});
document.addEventListener('keydown',e=>{if(mode!=='learn')return;const b=books[bookIdx];if(e.key==='ArrowLeft'&&wordIdx>0)selectWord(wordIdx-1);if(e.key==='ArrowRight'&&wordIdx<b.w.length-1)selectWord(wordIdx+1);if(e.key==='ArrowUp'&&bookIdx>0)selectBook(bookIdx-1);if(e.key==='ArrowDown'&&bookIdx<books.length-1)selectBook(bookIdx+1);if(e.key===' '){e.preventDefault();document.getElementById('flipCard').classList.toggle('flipped')}});

/* ===========================================================
   MODE SWITCH
   =========================================================== */
let mode='learn';
const learnView=document.getElementById('learnView'),testView=document.getElementById('testView');
const learnBtn=document.getElementById('learnModeBtn'),testBtn=document.getElementById('testModeBtn');
function setMode(m){mode=m;const learn=m==='learn';learnView.style.display=learn?'grid':'none';testView.style.display=learn?'none':'flex';testView.style.flexDirection='column';learnBtn.classList.toggle('active',learn);testBtn.classList.toggle('active',!learn);if(!learn)renderStart()}
learnBtn.onclick=()=>setMode('learn');
testBtn.onclick=()=>setMode('test');

/* ===========================================================
   TEST MODE
   =========================================================== */
let qOrder=[],qPos=0,score=0,answered=false,misses=[];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function renderStart(){
  testView.innerHTML=`<div class="quiz-center">
    <div class="quiz-big-emoji">📝</div>
    <div class="quiz-title">Check What You Know</div>
    <div class="quiz-sub">A mixed assessment on r-controlled vowels and diphthongs. You will get two kinds of question: <b>choose the correct answer</b> and <b>type the answer</b>. Read the feedback after each one — that is where the real learning happens.</div>
    <div class="quiz-meta"><span>❓ ${quizBank.length} questions</span><span>🔀 Choice + Typed</span><span>💡 Explained answers</span></div>
    <button class="quiz-btn" id="startQuizBtn">Start the test →</button>
  </div>`;
  document.getElementById('startQuizBtn').onclick=startTest;
}
function startTest(){qOrder=shuffle(quizBank.map((_,i)=>i));qPos=0;score=0;misses=[];renderQuestion()}
function renderQuestion(){
  answered=false;
  const q=quizBank[qOrder[qPos]];
  const pct=Math.round((qPos)/qOrder.length*100);
  let body;
  if(q.type==='mcq'){
    body=`<div class="quiz-options" id="optWrap">`+q.opts.map((o,i)=>
      `<button class="quiz-opt" data-i="${i}"><span class="opt-key">${String.fromCharCode(65+i)}</span><span>${o}</span></button>`).join('')+`</div>`;
  }else{
    body=`<div class="quiz-input-wrap"><input class="quiz-input" id="typeInput" placeholder="Type your answer…" autocomplete="off"><button class="quiz-btn teal" id="checkBtn">Check</button></div><div class="quiz-hint">💡 Hint: ${q.hint}</div>`;
  }
  testView.innerHTML=`
    <div class="quiz-top">
      <div class="quiz-count">Q ${qPos+1} / ${qOrder.length}</div>
      <div class="quiz-progress-wrap"><div class="quiz-progress-bar" style="width:${pct}%"></div></div>
      <div class="quiz-score-chip">⭐ ${score}</div>
    </div>
    <div class="quiz-qtype ${q.type==='mcq'?'qtype-mcq':'qtype-type'}">${q.type==='mcq'?'Choose the correct answer':'Type the answer'}</div>
    <div class="quiz-question">${q.q}</div>
    ${body}
    <div id="feedbackSlot"></div>
    <div class="quiz-actions"><button class="quiz-btn" id="nextBtn2" disabled>${qPos===qOrder.length-1?'See results':'Next →'}</button></div>`;
  document.getElementById('nextBtn2').onclick=nextQuestion;
  if(q.type==='mcq'){
    document.querySelectorAll('.quiz-opt').forEach(btn=>btn.onclick=()=>checkMcq(+btn.dataset.i));
  }else{
    const inp=document.getElementById('typeInput');
    document.getElementById('checkBtn').onclick=checkTyped;
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!answered)checkTyped()});
    inp.focus();
  }
}
function markCorrectMcq(){const q=quizBank[qOrder[qPos]];document.querySelectorAll('.quiz-opt').forEach((b,i)=>{if(i===q.a)b.classList.add('correct');b.disabled=true})}
function checkMcq(i){
  if(answered)return;answered=true;
  const q=quizBank[qOrder[qPos]];const ok=i===q.a;
  document.querySelectorAll('.quiz-opt').forEach((b,x)=>{b.disabled=true;if(x===q.a)b.classList.add('correct');if(x===i&&!ok)b.classList.add('wrong')});
  finishAnswer(ok,q,q.opts[i]);
}
function norm(s){return s.toLowerCase().trim().replace(/[.!?,;:'"]/g,'')}
function checkTyped(){
  if(answered)return;
  const q=quizBank[qOrder[qPos]];const inp=document.getElementById('typeInput');const val=inp.value;
  if(!val.trim())return;
  answered=true;inp.disabled=true;document.getElementById('checkBtn').disabled=true;
  const ok=q.accept.some(a=>norm(a)===norm(val));
  finishAnswer(ok,q,val);
}
function finishAnswer(ok,q,given){
  if(ok)score++;
  else misses.push({q,given});
  const slot=document.getElementById('feedbackSlot');
  const ansTxt=q.type==='mcq'?q.opts[q.a]:q.ans;
  slot.innerHTML=`<div class="quiz-feedback ${ok?'ok':'no'}">${ok?'✅ <b>Correct!</b> ':'❌ <b>Not quite.</b> The answer is <b>'+ansTxt+'</b>. '}${q.ex}</div>`;
  document.getElementById('nextBtn2').disabled=false;
  document.getElementById('nextBtn2').focus();
}
function nextQuestion(){qPos++;if(qPos>=qOrder.length)showResults();else renderQuestion()}
function showResults(){
  const total=qOrder.length,pct=Math.round(score/total*100);
  let emoji,msg;
  if(pct>=90){emoji='🏆';msg='Outstanding — you have really mastered these patterns.'}
  else if(pct>=70){emoji='🎉';msg='Great work! A little review and you will have it nailed.'}
  else if(pct>=50){emoji='👍';msg='Good effort. Revisit the tricky patterns below and try again.'}
  else{emoji='🌱';msg='A solid start. Study the tips in Learn mode, then come back.'}
  let review='';
  if(misses.length){
    review=`<div class="review-wrap"><div class="review-title">🔁 Worth reviewing (${misses.length})</div><div class="review-list">`+
      misses.map(m=>{const ans=m.q.type==='mcq'?m.q.opts[m.q.a]:m.q.ans;
        const cleanQ=m.q.q.replace(/<br>/g,' ');
        return `<div class="review-item">${cleanQ}<br>Your answer: <span class="r-you">${m.given}</span> · Correct: <span class="r-ans">${ans}</span></div>`}).join('')+
      `</div></div>`;
  }
  testView.innerHTML=`<div class="quiz-center">
    <div class="quiz-big-emoji">${emoji}</div>
    <div class="quiz-score-big">${score} / ${total}</div>
    <div class="quiz-title">${pct}%</div>
    <div class="quiz-sub">${msg}</div>
    ${review}
    <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px">
      <button class="quiz-btn" id="retryBtn">Try again 🔄</button>
      <button class="quiz-btn teal" id="backLearnBtn">Back to learning 📚</button>
    </div>
  </div>`;
  document.getElementById('retryBtn').onclick=startTest;
  document.getElementById('backLearnBtn').onclick=()=>setMode('learn');
}

/* init */
buildBookList();updateDisplay();
</script>
</body></html>
