<!DOCTYPE html>
<html lang="en">
<head><script src="/static/js/content-protection.js?v=2" data-cb-protect></script>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suffix Mastery Lab — Intermediate to Advanced</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap');
:root{
  --navy:#14213D;--navy-2:#0b1526;--gold:#FCA311;--gold-soft:#fdeecb;--gold-ink:#7a5c00;
  --bg:#f9f9ff;--bg-soft:#f1f3ff;--ink:#161c27;--body:#4a5568;--muted:#718096;
  --line:#e2e8f0;--line-2:#dde2f3;--teal-50:#e6ebf3;
  --success:#38a169;--success-bg:#e9f7ef;--danger:#e53e3e;--danger-bg:#fdecec;
  --radius:8px;--radius-lg:14px;
  --shadow-sm:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06);
  --shadow:0 8px 24px -12px rgba(16,24,40,.18);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100%;font-family:'Outfit',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
body{background:var(--bg);color:var(--ink);padding:14px;-webkit-font-smoothing:antialiased}
.container{min-height:calc(100vh - 24px);display:flex;flex-direction:column;gap:12px}
.top-section{flex:0 0 auto;background:#fff;border-radius:var(--radius-lg);padding:12px 16px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;border:1px solid var(--line)}
.top-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;flex-wrap:wrap;gap:10px}
.top-title{font-size:17px;font-weight:700;color:var(--ink);letter-spacing:-.01em;display:flex;align-items:center;gap:9px}
.level-badge{background:var(--gold-soft);color:var(--gold-ink);padding:5px 12px;border-radius:999px;font-size:11px;font-weight:700;border:1px solid rgba(238,188,29,.4)}
.include-badge{background:var(--bg-soft);color:var(--body);padding:5px 14px;border-radius:999px;font-size:12px;font-weight:700;border:1px solid var(--line)}
.assign-btn{background:var(--navy);color:#fff;border:none;padding:7px 16px;border-radius:var(--radius);font-size:12px;font-weight:700;cursor:pointer;transition:.15s}
.assign-btn:hover{background:var(--navy-2)}
.book-list{display:flex;gap:10px;overflow-x:auto;overflow-y:visible;padding:8px 2px 10px;flex:0 0 auto;align-items:stretch}
.mini-book{flex-shrink:0;width:100px;border-radius:10px;cursor:pointer;background:#fff;border:1px solid var(--line);border-top:3px solid var(--accent,var(--navy));transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ink);box-shadow:var(--shadow-sm);position:relative;user-select:none;padding:8px 4px;gap:3px}
.mini-book .b-emoji{font-size:20px;line-height:1}
.mini-book .b-pattern{font-size:13px;font-weight:700;color:var(--navy)}
.mini-book .b-lvl{font-size:8px;background:var(--bg-soft);color:var(--muted);padding:1px 6px;border-radius:8px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.mini-book .b-count{font-size:9px;background:var(--bg-soft);color:var(--muted);padding:1px 6px;border-radius:8px;font-weight:600}
.mini-book:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.mini-book.active{border-color:var(--navy);box-shadow:0 0 0 2px var(--navy);z-index:2}
.mini-book.active::after{content:'✓';position:absolute;top:-7px;right:-7px;background:var(--gold);color:var(--navy);width:19px;height:19px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;box-shadow:var(--shadow-sm)}
.bottom-section{flex:1;min-height:440px;display:grid;grid-template-columns:45% 55%;gap:12px}
.card-display{background:#fff;border-radius:var(--radius-lg);padding:16px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;align-items:center;justify-content:space-between;perspective:1500px;position:relative;border:1px solid var(--line)}
.book-title{background:var(--navy);color:#fff;padding:7px 16px;border-radius:var(--radius);font-size:13.5px;font-weight:700;text-align:center}
.pronounce-btn{position:absolute;top:14px;right:14px;background:var(--navy);border:none;color:#fff;width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:15px;box-shadow:var(--shadow-sm);z-index:10;transition:.15s}
.pronounce-btn:hover{background:var(--navy-2)}
.flip-card{width:90%;height:65%;position:relative;cursor:pointer;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.4,0,.2,1)}
.flip-card.flipped{transform:rotateY(180deg)}
.flip-face{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:var(--radius-lg);display:flex;align-items:center;justify-content:center;flex-direction:column;box-shadow:var(--shadow);border:1px solid var(--line);overflow:hidden;padding:14px;gap:10px}
.flip-front{background:linear-gradient(150deg,var(--navy),var(--navy-2));color:#fff;border-color:transparent}
.flip-back{background:#fff;color:var(--ink);transform:rotateY(180deg)}
.big-emoji{font-size:clamp(50px,7vw,90px);filter:drop-shadow(0 4px 8px rgba(0,0,0,.25))}
.word-display{font-size:clamp(28px,4.6vw,54px);font-weight:800;text-align:center;letter-spacing:-.01em;line-height:1.1}
.word-display .h1{color:#fff}.word-display .h2{color:var(--gold)}
.phoneme-split{display:flex;gap:8px;font-size:clamp(18px,2.8vw,30px);font-weight:800;align-items:center;flex-wrap:wrap;justify-content:center}
.phoneme-chunk{background:var(--bg-soft);color:var(--navy);padding:6px 16px;border-radius:10px;border:1px solid var(--line-2)}
.phoneme-chunk.h2{background:var(--gold-soft);color:var(--gold-ink);border-color:rgba(238,188,29,.5)}
.meaning-display{font-size:clamp(14px,1.7vw,19px);font-weight:500;text-align:center;line-height:1.45;color:var(--body);padding:0 8px}
.word-nav{display:flex;align-items:center;gap:10px;background:var(--bg-soft);padding:6px 12px;border-radius:999px;border:1px solid var(--line)}
.nav-btn{background:#fff;border:1px solid var(--line);color:var(--navy);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:18px;font-weight:700;transition:.15s;display:flex;align-items:center;justify-content:center}
.nav-btn:hover:not(:disabled){border-color:var(--navy);background:var(--teal-50)}
.nav-btn:disabled{opacity:.35;cursor:not-allowed}
.word-counter{font-size:13px;font-weight:700;color:var(--navy);min-width:60px;text-align:center;font-variant-numeric:tabular-nums}
.details-panel{background:#fff;border-radius:var(--radius-lg);padding:18px 22px;overflow-y:auto;box-shadow:var(--shadow-sm);border:1px solid var(--line)}
.details-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--line);flex-wrap:wrap;gap:8px}
.details-word-wrap{display:flex;align-items:center;gap:10px}
.details-emoji{font-size:30px}
.details-word{font-size:22px;font-weight:800;color:var(--ink);letter-spacing:-.01em}
.details-word .h1{color:var(--ink)}.details-word .h2{color:var(--gold)}
.badge-group{display:flex;align-items:center;gap:6px}
.pos-badge{background:var(--gold-soft);color:var(--gold-ink);padding:4px 12px;border-radius:999px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border:1px solid rgba(238,188,29,.4)}
.level-tag{padding:4px 12px;border-radius:999px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line-2);color:var(--navy);background:var(--bg-soft)}
.level-tag.Intermediate{background:var(--teal-50);color:var(--navy);border-color:var(--line-2)}
.level-tag.Advanced{background:var(--navy);color:#fff;border-color:transparent}
.detail-section{margin-bottom:16px}
.detail-label{display:flex;align-items:center;gap:6px;font-weight:700;color:var(--navy);font-size:11px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.phonetic-box{background:var(--teal-50);border-left:3px solid var(--navy);padding:8px 14px;border-radius:var(--radius);font-style:italic;font-size:16px;color:var(--navy);font-weight:600}
.phoneme-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.phoneme-pill{background:var(--bg-soft);color:var(--navy);padding:5px 13px;border-radius:999px;font-size:14px;font-weight:700;border:1px solid var(--line-2)}
.phoneme-pill.h2{background:var(--gold-soft);color:var(--gold-ink);border-color:rgba(238,188,29,.5)}
.phoneme-pill.full{background:var(--navy);color:#fff;border-color:transparent}
.phoneme-plus{color:var(--muted);font-size:16px;font-weight:700}
.meaning-box{font-size:14px;color:var(--body);line-height:1.55;background:var(--teal-50);padding:10px 14px;border-radius:var(--radius);border-left:3px solid var(--navy)}
.example-item{background:var(--gold-soft);padding:10px 14px;border-left:3px solid var(--gold);margin-bottom:6px;border-radius:var(--radius);font-size:13px;color:var(--ink);line-height:1.55;font-style:italic}
.example-item::before{content:'"';font-size:18px;color:var(--gold-ink);font-weight:700;margin-right:4px}
.tag-list{display:flex;flex-wrap:wrap;gap:6px}
.tag{padding:5px 11px;border-radius:999px;font-size:13px;font-weight:600;color:var(--navy);border:1px solid var(--line-2);cursor:pointer;background:var(--bg-soft);transition:.15s}
.tag:hover{border-color:var(--navy)}
.tag.active{background:var(--navy);color:#fff;border-color:transparent}
.suffix-meaning{background:var(--teal-50);padding:10px 14px;border-radius:var(--radius);border-left:3px solid var(--navy);font-size:13px;color:var(--body);margin-top:6px}
.suffix-meaning b{color:var(--navy)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:var(--bg-soft);border-radius:10px}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:10px}
::-webkit-scrollbar-thumb:hover{background:var(--muted)}
@media(max-width:900px){.bottom-section{grid-template-columns:1fr;grid-template-rows:1fr 1fr}}

/* ── Assessment mode (matches reference modal pattern) ── */
.modal-overlay{display:none;position:fixed;inset:0;background:var(--bg);z-index:100;align-items:stretch;justify-content:center;padding:0}
.modal-overlay.open{display:flex}
.modal-box{background:#fff;border-radius:0;border:none;box-shadow:none;max-width:none;width:100%;height:100%;max-height:none;overflow-y:auto;padding:22px 24px 48px}
.modal-head,#quizStage{max-width:none;margin-left:0;margin-right:0;width:100%}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.modal-title{font-size:20px;font-weight:700;color:var(--ink)}
.modal-close{background:var(--bg-soft);color:var(--body);border:1px solid var(--line);width:30px;height:30px;border-radius:50%;font-size:14px;font-weight:700;cursor:pointer;transition:.15s}
.modal-close:hover{background:var(--line);color:var(--ink)}
.quiz-intro-title{font-size:18px;font-weight:700;color:var(--ink);margin-bottom:10px}
.quiz-intro-text{font-size:13.5px;color:var(--body);line-height:1.6;margin-bottom:14px}
.quiz-intro-list{font-size:13px;color:var(--body);line-height:1.8;margin:0 0 16px 18px}
.quiz-start-btn{background:var(--navy);color:#fff;border:none;padding:12px 28px;border-radius:var(--radius);font-weight:700;font-size:15px;cursor:pointer;font-family:inherit;display:block;margin:0 auto;transition:.15s}
.quiz-start-btn:hover{background:var(--navy-2)}
.quiz-progress-wrap{background:var(--bg-soft);border-radius:20px;height:8px;overflow:hidden;margin-bottom:14px}
.quiz-progress-bar{background:var(--navy);height:100%;transition:width .3s}
.quiz-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:11px;font-weight:700;color:var(--muted)}
.quiz-difficulty{padding:3px 10px;border-radius:999px;color:#fff;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.3px}
.diff-Intermediate{background:var(--navy)}
.diff-Advanced{background:var(--gold);color:var(--navy)}
.quiz-type-tag{background:var(--gold-soft);color:var(--gold-ink);padding:3px 10px;border-radius:999px;font-size:10px;font-weight:700;text-transform:uppercase}
.quiz-q{font-size:16px;font-weight:700;color:var(--ink);margin-bottom:14px;line-height:1.4}
.quiz-options{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.quiz-opt-btn{text-align:left;padding:11px 14px;border-radius:var(--radius);border:1px solid var(--line);background:#fff;font-family:inherit;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer;transition:.15s}
.quiz-opt-btn:hover:not(:disabled){border-color:var(--navy);background:var(--bg-soft)}
.quiz-opt-btn.correct{background:var(--success-bg);border-color:var(--success);color:#276749}
.quiz-opt-btn.wrong{background:var(--danger-bg);border-color:var(--danger);color:#c53030}
.quiz-opt-btn:disabled{cursor:default}
.quiz-input-row{display:flex;gap:8px;margin-bottom:12px}
.quiz-input{flex:1;padding:11px 14px;border-radius:var(--radius);border:1px solid var(--line);font-family:inherit;font-size:14px;font-weight:600;color:var(--ink)}
.quiz-input:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(20,33,61,.1)}
.quiz-input.correct{border-color:var(--success);background:var(--success-bg)}
.quiz-input.wrong{border-color:var(--danger);background:var(--danger-bg)}
.quiz-check-btn{background:var(--navy);color:#fff;border:none;padding:0 18px;border-radius:var(--radius);font-weight:700;cursor:pointer;font-family:inherit;transition:.15s}
.quiz-check-btn:hover{background:var(--navy-2)}
.quiz-check-btn:disabled{opacity:.4;cursor:not-allowed}
.quiz-feedback{padding:10px 14px;border-radius:var(--radius);font-size:13px;font-weight:600;margin-bottom:10px}
.quiz-feedback.correct{background:var(--success-bg);color:#276749;border-left:3px solid var(--success)}
.quiz-feedback.wrong{background:var(--danger-bg);color:#c53030;border-left:3px solid var(--danger)}
.quiz-explain{font-size:12.5px;color:var(--body);line-height:1.5;background:var(--bg-soft);padding:8px 12px;border-radius:var(--radius);border-left:3px solid var(--line-2);margin-bottom:12px}
.quiz-next-btn{background:var(--gold);color:var(--navy);border:none;padding:9px 20px;border-radius:var(--radius);font-weight:700;cursor:pointer;font-family:inherit;transition:.15s}
.quiz-next-btn:hover{background:#e0900c}
.quiz-result-score{font-size:44px;font-weight:800;color:var(--navy);text-align:center;margin:10px 0}
.quiz-result-msg{font-size:14px;color:var(--body);text-align:center;margin-bottom:16px;line-height:1.5}
.quiz-result-breakdown{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.quiz-bd-row{display:flex;justify-content:space-between;font-size:12.5px;background:var(--bg-soft);padding:8px 12px;border-radius:var(--radius);font-weight:600;color:var(--body)}
.quiz-retry-btn{background:var(--navy);color:#fff;border:none;padding:10px 24px;border-radius:var(--radius);font-weight:700;cursor:pointer;font-family:inherit;transition:.15s}
.quiz-retry-btn:hover{background:var(--navy-2)}
</style><!-- ── Global theme overlay (DESIGN-CBuddy.md) ── -->

</style>

<style>/* CareerBuddy: nav bar scrollbar visible (en) */
.tabbar,.tabs,.tab-bar,.tab-nav,[role="tablist"],.book-list,.books,.modules,.module-list,.mode-tabs{scrollbar-width:thin !important;scrollbar-color:#9aa4b8 transparent !important;overflow-x:auto !important}

.tabbar::-webkit-scrollbar-thumb,.tabs::-webkit-scrollbar-thumb,.tab-bar::-webkit-scrollbar-thumb,.book-list::-webkit-scrollbar-thumb,.books::-webkit-scrollbar-thumb,.modules::-webkit-scrollbar-thumb,.module-list::-webkit-scrollbar-thumb,.mode-tabs::-webkit-scrollbar-thumb,[role="tablist"]::-webkit-scrollbar-thumb{background:#cbd2e0 !important;border-radius:8px}
.tabbar::-webkit-scrollbar-track,.tabs::-webkit-scrollbar-track,.tab-bar::-webkit-scrollbar-track,.book-list::-webkit-scrollbar-track,.books::-webkit-scrollbar-track,.modules::-webkit-scrollbar-track,.module-list::-webkit-scrollbar-track,.mode-tabs::-webkit-scrollbar-track,[role="tablist"]::-webkit-scrollbar-track{background:transparent}
</style>
<style>/* CareerBuddy: uniform nav pill (v3) */
.tab,.tab-btn,.mode-btn,.mode-tab{border-radius:8px !important;border-bottom:none !important;padding:9px 16px !important;font-weight:700 !important;font-size:13.5px !important;cursor:pointer;transition:background .15s,color .15s !important;box-shadow:none !important}
.tab:not(.active):not(.on),.tab-btn:not(.active):not(.on),.mode-btn:not(.active):not(.on),.mode-tab:not(.active):not(.on){color:#4a5568 !important;background:transparent !important;border-color:transparent !important}
.tab:not(.active):not(.on):hover,.tab-btn:not(.active):not(.on):hover,.mode-btn:not(.active):not(.on):hover,.mode-tab:not(.active):not(.on):hover{background:#eef1f7 !important;color:#14213D !important}
.tab.active,.tab.on,.tab-btn.active,.tab-btn.on,.mode-btn.active,.mode-btn.on,.mode-tab.active,.mode-tab.on,.tabbar .active,.tabs .active,.tab-bar .active,[role="tab"][aria-selected="true"]{background:#14213D !important;color:#fff !important;border-radius:8px !important;border-color:transparent !important;font-weight:700 !important}
.tab.active:hover,.tab.on:hover,.tab-btn.active:hover,.tab-btn.on:hover,.mode-btn.active:hover,.mode-btn.on:hover,.mode-tab.active:hover,.mode-tab.on:hover{background:#0b1526 !important}

 background:#ffffff !important;

<body>
<div class="container">
<div class="sticky-nav">
<div class="top-section">
<div class="top-header">
<div class="top-title">🎓 Suffix Mastery Lab</div>
<div class="level-badge">⭐ INTERMEDIATE → ADVANCED</div>
<button class="assign-btn" id="assignBtn">📝 Assessment</button>
<div class="include-badge"><span id="bookProgress">1 of 16</span></div>
</div>
<div class="book-list" id="bookList"></div>
</div>

</div>
<div class="bottom-section">
<div class="card-display">
<div class="book-title" id="bookTitle">-TION/-SION (act, state, or process)</div>

let bookIdx=0,wordIdx=0;
function buildBookList(){const L=document.getElementById('bookList');L.innerHTML='';books.forEach((b,i)=>{const c=document.createElement('div');c.className='mini-book'+(i===bookIdx?' active':'');c.style.setProperty('--accent',b.c[0]);c.innerHTML=`<div class="b-emoji">${b.em}</div><div class="b-pattern">-${b.suf}</div><div class="b-lvl">${b.level}</div><div class="b-count">${b.w.length} words</div>`;c.onclick=()=>selectBook(i);L.appendChild(c)})}
function selectBook(i){bookIdx=i;wordIdx=0;document.querySelectorAll('.mini-book').forEach((c,x)=>c.classList.toggle('active',x===i));document.getElementById('flipCard').classList.remove('flipped');updateDisplay();const a=document.querySelectorAll('.mini-book')[i];if(a)a.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'})}
function selectWord(j){wordIdx=j;document.getElementById('flipCard').classList.remove('flipped');updateDisplay()}
function renderSplit(parts){return parts.map((p,i)=>`<span class="${i===0?'h1':'h2'}">${p}</span>`).join('')}
function renderChunks(parts){return parts.map((p,i)=>`<div class="phoneme-chunk ${i===0?'':'h2'}">${p}</div>`).join('')}
function renderPills(word,parts){let h=parts.map((p,i)=>`<div class="phoneme-pill ${i===0?'':'h2'}">${p}</div>`).join('<span class="phoneme-plus">+</span>');h+=`<span class="phoneme-plus">=</span><div class="phoneme-pill full">${word}</div>`;return h}
function updateDisplay(){const b=books[bookIdx],w=b.w[wordIdx],[word,em,pos,mn,sn,parts]=w;document.getElementById('bookTitle').textContent=b.name;document.getElementById('bookProgress').textContent=`${bookIdx+1} of ${books.length}`;document.getElementById('bigEmoji').textContent=em;document.getElementById('wordDisplay').innerHTML=renderSplit(parts);document.getElementById('phonemeSplit').innerHTML=renderChunks(parts);document.getElementById('meaningDisplay').textContent=mn;document.getElementById('wordCounter').textContent=`${wordIdx+1} / ${b.w.length}`;document.getElementById('prevBtn').disabled=wordIdx===0;document.getElementById('nextBtn').disabled=wordIdx===b.w.length-1;document.getElementById('detailsEmoji').textContent=em;document.getElementById('detailsWord').innerHTML=renderSplit(parts);document.getElementById('posBadge').textContent=pos;document.getElementById('levelTag').textContent=b.level;document.getElementById('levelTag').className='level-tag '+b.level;document.getElementById('phonemeRow').innerHTML=renderPills(word,parts);document.getElementById('suffixMeaning').innerHTML=`<b>-${b.suf}</b> ${b.hint}`;document.getElementById('phoneticDisplay').textContent=`/${word}/`;document.getElementById('definitionDisplay').textContent=mn;document.getElementById('examplesDisplay').innerHTML=`<div class="example-item">${sn}</div>`;document.getElementById('familyDisplay').innerHTML=b.w.map((o,x)=>`<div class="tag${x===wordIdx?' active':''}" onclick="selectWord(${x})">${o[1]} ${o[0]}</div>`).join('')}
document.getElementById('flipCard').addEventListener('click',function(){this.classList.toggle('flipped')});
document.getElementById('pronounceBtn').addEventListener('click',e=>{e.stopPropagation();const u=new SpeechSynthesisUtterance(books[bookIdx].w[wordIdx][0]);u.rate=.9;speechSynthesis.speak(u)});
document.getElementById('prevBtn').addEventListener('click',e=>{e.stopPropagation();if(wordIdx>0)selectWord(wordIdx-1)});
document.getElementById('nextBtn').addEventListener('click',e=>{e.stopPropagation();if(wordIdx<books[bookIdx].w.length-1)selectWord(wordIdx+1)});
document.addEventListener('keydown',e=>{if(document.getElementById('assignModal').classList.contains('open'))return;const b=books[bookIdx];if(e.key==='ArrowLeft'&&wordIdx>0)selectWord(wordIdx-1);if(e.key==='ArrowRight'&&wordIdx<b.w.length-1)selectWord(wordIdx+1);if(e.key==='ArrowUp'&&bookIdx>0)selectBook(bookIdx-1);if(e.key==='ArrowDown'&&bookIdx<books.length-1)selectBook(bookIdx+1);if(e.key===' '){e.preventDefault();document.getElementById('flipCard').classList.toggle('flipped')}});
buildBookList();updateDisplay();

const quiz = [
  {type:'mcq',q:'Which suffix generally means "full of" or "having the quality of"?',options:['-ous','-ment','-ist','-ology'],answer:0,explain:'-ous means "full of," as in courageous (full of courage) or gorgeous.'},
  {type:'type',q:"The scientist's new ______ (invent) amazed everyone.",answer:'invention',explain:'invent + ion → invention: something newly created.'},
  {type:'mcq',q:'Choose the word that means "a person who writes news for a living":',options:['journal','journals','journalist','journalism'],answer:2,explain:'The -ist suffix names the person who practices something — a journalist writes journalism.'},
  {type:'type',q:'Please ______ (simple) this explanation for beginners.',answer:'simplify',explain:'simpl + ify → simplify: to make something simpler.'},
  {type:'mcq',q:'What does the suffix "-ology" mean?',options:['full of','the study of','state of being','person who'],answer:1,explain:'-ology means "the study of," as in biology (study of life) or geology (study of rocks).'},
  {type:'type',q:'The company wants to ______ (modern) its old factory.',answer:'modernize',explain:'modern + ize → modernize: to make something more modern.'},
  {type:'mcq',q:'Which word correctly completes: "The doctor was very ______ during the emergency."?',options:['response','responsive','respondent','responsibly'],answer:1,explain:'responsive (respond + ive) means quick to react — the right fit for this sentence.'},
  {type:'type',q:'Her artwork is full of ______ (creative).',answer:'creativity',explain:'creativ + ity → creativity: the state or quality of being creative.'},
  {type:'mcq',q:'Which word means "a person who studies science"?',options:['science','scientific','scientist','sciences'],answer:2,explain:'-ist names the person who practices a field — a scientist studies science.'},
  {type:'type',q:'He is training to become a ______ (violin) player.',answer:'violinist',explain:'violin + ist → violinist: a person who plays the violin.'},
  {type:'mcq',q:'The suffix "-ship" usually turns a word into one that describes:',options:['action happening now','a state, condition, or skill','tendency to do something','full of something'],answer:1,explain:'-ship describes a state or condition, as in friendship or leadership.'},
  {type:'type',q:'The two countries formed a strong ______ (partner) to trade goods.',answer:'partnership',explain:'partner + ship → partnership: the state of working together.'},
  {type:'mcq',q:'Which suffix means "a person or thing that does something"?',options:['-ist / -ant / -ent','-ic','-ance','-ify'],answer:0,explain:'-ant/-ent/-ist all name a person or thing that performs an action, like assistant or student.'},
  {type:'type',q:'The study of living things is called ______ (bio).',answer:'biology',explain:'bio + logy → biology: the study of life.'},
  {type:'mcq',q:'Choose the correctly spelled word meaning "very necessary":',options:['essental','essential','essencial','essentail'],answer:1,explain:'essent + ial → essential.'},
  {type:'type',q:'The manager praised her for being highly ______ (product) this quarter.',answer:'productive',explain:'product + ive → productive: getting a lot of work done.'},
  {type:'mcq',q:'Which word best completes: "The team celebrated their sports ______."?',options:['champion','championship','champions','championed'],answer:1,explain:'champion + ship → championship: the top-level contest itself.'},
  {type:'type',q:'Please ______ (clear) your answer with an example.',answer:'clarify',explain:'clar + ify → clarify: to make something clear.'},
  {type:'mcq',q:'"Optimism," "tourism," and "criticism" all share a suffix meaning:',options:['a person who','a belief, practice, or condition','capable of being','relating to'],answer:1,explain:'-ism describes a belief, practice, or condition, like optimism (a hopeful outlook).'},
  {type:'type',q:'The two friends have been close since childhood; their ______ (friend) is very strong.',answer:'friendship',explain:'friend + ship → friendship: the state of being friends.'}
];

    <ul class="quiz-intro-list">
      <li><strong>${quiz.filter(q=>q.type==='mcq').length} Multiple-Choice</strong> — choose the correct answer</li>
      <li><strong>${quiz.filter(q=>q.type==='type').length} Type-the-Answer</strong> — write the missing word</li>
      <li>Covers all 16 suffixes, from -TION to -IZE</li>
    </ul>
    <button class="quiz-start-btn" id="quizStartBtn">▶ Start Assessment</button>`;
  document.getElementById('quizStartBtn').addEventListener('click',startQuiz);
}

function startQuiz(){
  qIdx=0;score=0;answered=false;
  quizBreakdown={Intermediate:{c:0,t:0},Advanced:{c:0,t:0}};
  // Spread the correct answer across the four options — the hand-written bank
  // favours the first two. Typed-answer questions are left alone.
  if(window.rotateQuizOptions) window.rotateQuizOptions(quiz);
  renderQuizQuestion();
}

function renderQuizQuestion(){
  answered=false;
  const item=quiz[qIdx];
  const difficulty=wordLevelMap[(item.type==='mcq'?item.options[item.answer]:item.answer).toLowerCase()]||'Intermediate';
  const stage=document.getElementById('quizStage');
  const pct=Math.round((qIdx/quiz.length)*100);
  let inner=`
    <div class="quiz-progress-wrap"><div class="quiz-progress-bar" style="width:${pct}%"></div></div>
    <div class="quiz-meta">
      <span>Question ${qIdx+1} of ${quiz.length}</span>
      <span><span class="quiz-difficulty diff-${difficulty}">${difficulty}</span> <span class="quiz-type-tag">${item.type==='mcq'?'Choose Answer':'Type Answer'}</span></span>
    </div>
    <div class="quiz-q">${item.q.replace(/______/g,'<u>______</u>')}</div>
    <div id="quizBody"></div>
    <div id="quizFeedbackArea"></div>`;
  stage.innerHTML=inner;
  const body=document.getElementById('quizBody');
  if(item.type==='mcq'){
    body.innerHTML=`<div class="quiz-options" id="quizOptions">${item.options.map((o,i)=>`<button class="quiz-opt-btn" data-i="${i}">${o}</button>`).join('')}</div>`;
    body.querySelectorAll('.quiz-opt-btn').forEach((btn,i)=>btn.addEventListener('click',()=>answerMCQ(i,difficulty)));
  }else{
    body.innerHTML=`<div class="quiz-input-row"><input type="text" class="quiz-input" id="quizInput" placeholder="Type your answer..." autocomplete="off"><button class="quiz-check-btn" id="quizCheckBtn">Submit</button></div>`;
    document.getElementById('quizCheckBtn').addEventListener('click',()=>answerType(difficulty));
    const inp=document.getElementById('quizInput');
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!answered)answerType(difficulty)});
    inp.focus();
  }
}

function afterAnswer(correct,explain,difficulty){
  answered=true;
  quizBreakdown[difficulty].t++;
  if(correct)quizBreakdown[difficulty].c++;
  const area=document.getElementById('quizFeedbackArea');
  area.innerHTML=`
    <div class="quiz-feedback ${correct?'correct':'wrong'}">${correct?'✅ Correct!':'❌ Not quite.'}</div>
    <div class="quiz-explain">${explain}</div>
    <button class="quiz-next-btn" id="quizNextBtn">${qIdx<quiz.length-1?'Next Question →':'See Results →'}</button>`;
  document.getElementById('quizNextBtn').addEventListener('click',()=>{
    if(qIdx<quiz.length-1){qIdx++;renderQuizQuestion()}else{showQuizResults()}
  });
}

function answerMCQ(i,difficulty){
  if(answered)return;
  const item=quiz[qIdx];
  const correct=i===item.answer;
  if(correct)score++;
  document.querySelectorAll('#quizOptions .quiz-opt-btn').forEach((btn,x)=>{
    btn.disabled=true;
    if(x===item.answer)btn.classList.add('correct');
    if(x===i&&!correct)btn.classList.add('wrong');
  });
  afterAnswer(correct,item.explain,difficulty);
}

function answerType(difficulty){
  if(answered)return;
  const item=quiz[qIdx];
  const inp=document.getElementById('quizInput');
  const val=inp.value.trim().toLowerCase();
  if(!val)return;
  const correct=val===item.answer.toLowerCase();
  inp.disabled=true;
  document.getElementById('quizCheckBtn').disabled=true;
  inp.classList.add(correct?'correct':'wrong');
  if(correct)score++;
  const extra=correct?'':` The correct answer is "${item.answer}".`;
  afterAnswer(correct,item.explain+extra,difficulty);
}

function showQuizResults(){
  const stage=document.getElementById('quizStage');
  const total=quiz.length;
  const pct=Math.round((score/total)*100);
  let msg='Nice start! Revisit the suffix books above and try again to sharpen your skills.';
  if(pct>=80)msg='Excellent mastery! You clearly understand intermediate-to-advanced suffixes.';
  else if(pct>=50)msg='Good job! You have a solid grasp — a bit more practice will make it perfect.';
  stage.innerHTML=`
    <div class="quiz-result-score">${score} / ${total}</div>
    <div class="quiz-result-msg">${pct}% correct — ${msg}</div>
    <div class="quiz-result-breakdown">
      ${Object.entries(quizBreakdown).map(([d,v])=>`<div class="quiz-bd-row"><span>${d}</span><span>${v.c} / ${v.t} correct</span></div>`).join('')}
    </div>
    <button class="quiz-retry-btn" id="quizRetryBtn">↻ Try Again</button>`;
  document.getElementById('quizRetryBtn').addEventListener('click',showQuizIntro);
}

document.getElementById('assignBtn').addEventListener('click',openQuiz);
document.getElementById('modalCloseBtn').addEventListener('click',closeQuiz);
document.getElementById('assignModal').addEventListener('click',e=>{if(e.target.id==='assignModal')closeQuiz()});
</script></body></html>
