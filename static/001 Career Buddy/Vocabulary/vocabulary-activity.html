<!DOCTYPE html>
<html lang="en">
<head><script src="/static/js/content-protection.js?v=2" data-cb-protect></script>

<title>Advanced Vocabulary Lab — Greek & Latin Roots</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap');
:root{
  --navy:#14213D;--navy-2:#0b1526;--gold:#FCA311;--gold-soft:#fdeecb;--gold-ink:#7a5c00;
  --bg:#f9f9ff;--bg-soft:#f1f3ff;--ink:#161c27;--body:#4a5568;--muted:#718096;
  --line:#e2e8f0;--line-2:#dde2f3;--teal-50:#e6ebf3;
  --success:#38a169;--success-bg:#e9f7ef;--danger:#e53e3e;--danger-bg:#fdecec;
  --radius:8px;--radius-lg:14px;
  --shadow-sm:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06);
  --shadow:0 8px 24px -12px rgba(16,24,40,.18);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;font-family:'Outfit',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
body{background:var(--bg);color:var(--ink);padding:14px;-webkit-font-smoothing:antialiased}
.container{height:100%;display:flex;flex-direction:column;gap:12px}
.top-section{flex:0 0 auto;background:#fff;border-radius:var(--radius-lg);padding:12px 16px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;border:1px solid var(--line)}
.top-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;flex-wrap:wrap;gap:10px}
.top-title{font-size:17px;font-weight:700;color:var(--ink);letter-spacing:-.01em;display:flex;align-items:center;gap:9px}
.level-badge{background:var(--gold-soft);color:var(--gold-ink);padding:5px 12px;border-radius:999px;font-size:11px;font-weight:700;border:1px solid rgba(238,188,29,.4)}
.include-badge{background:var(--bg-soft);color:var(--body);padding:5px 14px;border-radius:999px;font-size:12px;font-weight:700;border:1px solid var(--line)}
.book-list{display:flex;gap:10px;overflow-x:auto;overflow-y:visible;padding:8px 2px 10px;flex:0 0 auto;align-items:stretch}
.mini-book{flex-shrink:0;width:88px;border-radius:10px;cursor:pointer;background:#fff;border:1px solid var(--line);border-top:3px solid var(--accent,var(--navy));transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ink);box-shadow:var(--shadow-sm);position:relative;user-select:none;padding:8px 4px;gap:3px}
.mini-book .b-emoji{font-size:20px;line-height:1}
.mini-book .b-pattern{font-size:17px;font-weight:700;color:var(--navy)}
.mini-book .b-count{font-size:9px;background:var(--bg-soft);color:var(--muted);padding:1px 7px;border-radius:8px;font-weight:600}
.mini-book:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.mini-book.active{border-color:var(--navy);box-shadow:0 0 0 2px var(--navy);z-index:2}
.mini-book.active::after{content:'✓';position:absolute;top:-7px;right:-7px;background:var(--gold);color:var(--navy);width:19px;height:19px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;box-shadow:var(--shadow-sm)}
.bottom-section{flex:1;min-height:0;display:grid;grid-template-columns:45% 55%;gap:12px}
.card-display{background:#fff;border-radius:var(--radius-lg);padding:16px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;align-items:center;justify-content:space-between;perspective:1500px;position:relative;border:1px solid var(--line)}
.book-title{background:var(--navy);color:#fff;padding:7px 16px;border-radius:var(--radius);font-size:13.5px;font-weight:700;text-align:center}
.pronounce-btn{position:absolute;top:14px;right:14px;background:var(--navy);border:none;color:#fff;width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:15px;box-shadow:var(--shadow-sm);transition:.15s;z-index:10}
.pronounce-btn:hover{background:var(--navy-2)}
.flip-card{width:90%;height:65%;position:relative;cursor:pointer;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.4,0,.2,1)}
.flip-card.flipped{transform:rotateY(180deg)}
.flip-face{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:var(--radius-lg);display:flex;align-items:center;justify-content:center;flex-direction:column;box-shadow:var(--shadow);border:1px solid var(--line);overflow:hidden;padding:14px;gap:10px}
.flip-front{background:linear-gradient(150deg,var(--navy),var(--navy-2));color:#fff;border-color:transparent}
.flip-back{background:#fff;color:var(--ink);transform:rotateY(180deg)}
.big-emoji{font-size:clamp(50px,7vw,90px);filter:drop-shadow(0 4px 8px rgba(0,0,0,.25))}
.word-display{font-size:clamp(40px,6.5vw,76px);font-weight:800;text-align:center;letter-spacing:-.01em}
.word-display .h1{color:#fff}.word-display .h2{color:var(--gold)}
.phoneme-split{display:flex;gap:12px;font-size:clamp(28px,5vw,52px);font-weight:800;align-items:center}
.phoneme-chunk{background:var(--bg-soft);color:var(--navy);padding:6px 18px;border-radius:10px;border:1px solid var(--line-2)}
.phoneme-chunk.h2{background:var(--gold-soft);color:var(--gold-ink);border-color:rgba(238,188,29,.5)}
.meaning-display{font-size:clamp(15px,1.8vw,20px);font-weight:500;text-align:center;line-height:1.45;color:var(--body);padding:0 8px}
.word-nav{display:flex;align-items:center;gap:10px;background:var(--bg-soft);padding:6px 12px;border-radius:999px;border:1px solid var(--line)}
.nav-btn{background:#fff;border:1px solid var(--line);color:var(--navy);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:18px;font-weight:700;transition:.15s;display:flex;align-items:center;justify-content:center}
.nav-btn:hover:not(:disabled){border-color:var(--navy);background:var(--teal-50)}
.nav-btn:disabled{opacity:.35;cursor:not-allowed}
.word-counter{font-size:13px;font-weight:700;color:var(--navy);min-width:60px;text-align:center;font-variant-numeric:tabular-nums}
.details-panel{background:#fff;border-radius:var(--radius-lg);padding:18px 22px;overflow-y:auto;box-shadow:var(--shadow-sm);border:1px solid var(--line)}
.details-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.details-word-wrap{display:flex;align-items:center;gap:10px}
.details-emoji{font-size:32px}
.details-word{font-size:28px;font-weight:800;color:var(--ink);letter-spacing:-.01em}
.details-word .h1{color:var(--ink)}.details-word .h2{color:var(--gold)}
.pos-badge{background:var(--gold-soft);color:var(--gold-ink);padding:4px 12px;border-radius:999px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border:1px solid rgba(238,188,29,.4)}
.detail-section{margin-bottom:16px}
.detail-label{display:flex;align-items:center;gap:6px;font-weight:700;color:var(--navy);font-size:11px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.phonetic-box{background:var(--teal-50);border-left:3px solid var(--navy);padding:8px 14px;border-radius:var(--radius);font-style:italic;font-size:16px;color:var(--navy);font-weight:600}
.phoneme-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.phoneme-pill{background:var(--bg-soft);color:var(--navy);padding:5px 13px;border-radius:999px;font-size:15px;font-weight:700;border:1px solid var(--line-2)}
.phoneme-pill.h2{background:var(--gold-soft);color:var(--gold-ink);border-color:rgba(238,188,29,.5)}
.phoneme-pill.full{background:var(--navy);color:#fff;border-color:transparent}
.phoneme-plus{color:var(--muted);font-size:16px;font-weight:700}
.meaning-box{font-size:14px;color:var(--body);line-height:1.55;background:var(--teal-50);padding:10px 14px;border-radius:var(--radius);border-left:3px solid var(--navy)}
.example-item{background:var(--gold-soft);padding:10px 14px;border-left:3px solid var(--gold);margin-bottom:6px;border-radius:var(--radius);font-size:13px;color:var(--ink);line-height:1.55;font-style:italic}
.example-item::before{content:'"';font-size:18px;color:var(--gold-ink);font-weight:700;margin-right:4px}
.tag-list{display:flex;flex-wrap:wrap;gap:6px}
.tag{padding:5px 11px;border-radius:999px;font-size:13px;font-weight:600;color:var(--navy);border:1px solid var(--line-2);cursor:pointer;background:var(--bg-soft);transition:.15s}
.tag:hover{border-color:var(--navy)}
.tag.active{background:var(--navy);color:#fff;border-color:transparent}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:var(--bg-soft);border-radius:10px}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:10px}
::-webkit-scrollbar-thumb:hover{background:var(--muted)}
@media(max-width:900px){.bottom-section{grid-template-columns:1fr;grid-template-rows:1fr 1fr}}
.b-tier{font-size:8px;font-weight:700;padding:1px 6px;border-radius:8px;background:var(--bg-soft);color:var(--muted);letter-spacing:.3px;text-transform:uppercase}
.assign-btn{background:var(--navy);color:#fff;padding:7px 16px;border:none;border-radius:var(--radius);font-size:12px;font-weight:700;cursor:pointer;transition:.15s}
.assign-btn:hover{background:var(--navy-2)}
.modal-overlay{display:none;position:fixed;inset:0;background:var(--bg);z-index:100;align-items:stretch;justify-content:center;padding:0}
.modal-overlay.open{display:flex}
.modal-box{background:#fff;border-radius:0;border:none;box-shadow:none;max-width:none;width:100%;height:100%;max-height:none;overflow-y:auto;padding:22px 24px 48px}
.modal-head,#quizStage{max-width:760px;margin-left:auto;margin-right:auto;width:100%}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.modal-title{font-size:20px;font-weight:700;color:var(--ink)}
.modal-close{background:var(--bg-soft);color:var(--body);border:1px solid var(--line);width:30px;height:30px;border-radius:50%;font-size:14px;font-weight:700;cursor:pointer;transition:.15s}
.modal-close:hover{background:var(--line);color:var(--ink)}
.quiz-progress-wrap{background:var(--bg-soft);border-radius:20px;height:8px;overflow:hidden;margin-bottom:14px}
.quiz-progress-bar{background:var(--navy);height:100%;transition:width .3s}
.quiz-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:11px;font-weight:700;color:var(--muted)}
.quiz-difficulty{padding:3px 10px;border-radius:999px;color:#fff;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.3px}
.diff-Beginner{background:var(--success)}
.diff-Intermediate{background:var(--navy)}
.diff-Advanced{background:var(--gold);color:var(--navy)}
.quiz-type-tag{background:var(--gold-soft);color:var(--gold-ink);padding:3px 10px;border-radius:999px;font-size:10px;font-weight:700;text-transform:uppercase}
.quiz-q{font-size:16px;font-weight:700;color:var(--ink);margin-bottom:14px;line-height:1.4}
.quiz-options{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.quiz-opt-btn{text-align:left;padding:11px 14px;border-radius:var(--radius);border:1px solid var(--line);background:#fff;font-family:inherit;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer;transition:.15s}
.quiz-opt-btn:hover:not(:disabled){border-color:var(--navy);background:var(--bg-soft)}
.quiz-opt-btn.correct{background:var(--success-bg);border-color:var(--success);color:#276749}
.quiz-opt-btn.wrong{background:var(--danger-bg);border-color:var(--danger);color:#c53030}
.quiz-opt-btn:disabled{cursor:default}
.quiz-input-row{display:flex;gap:8px;margin-bottom:12px}
.quiz-input{flex:1;padding:11px 14px;border-radius:var(--radius);border:1px solid var(--line);font-family:inherit;font-size:14px;font-weight:600;color:var(--ink)}
.quiz-input:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(20,33,61,.1)}
.quiz-check-btn{background:var(--navy);color:#fff;border:none;padding:0 18px;border-radius:var(--radius);font-weight:700;cursor:pointer;font-family:inherit;transition:.15s}
.quiz-check-btn:hover{background:var(--navy-2)}
.quiz-hint{font-size:12px;color:var(--muted);font-style:italic;margin-bottom:8px}
.quiz-feedback{padding:10px 14px;border-radius:var(--radius);font-size:13px;font-weight:600;margin-bottom:10px}
.quiz-feedback.correct{background:var(--success-bg);color:#276749;border-left:3px solid var(--success)}
.quiz-feedback.wrong{background:var(--danger-bg);color:#c53030;border-left:3px solid var(--danger)}
.quiz-explain{font-size:12.5px;color:var(--body);line-height:1.5;background:var(--bg-soft);padding:8px 12px;border-radius:var(--radius);border-left:3px solid var(--line-2);margin-bottom:12px}
.quiz-next-btn{background:var(--gold);color:var(--navy);border:none;padding:9px 20px;border-radius:var(--radius);font-weight:700;cursor:pointer;font-family:inherit;transition:.15s}
.quiz-next-btn:hover{background:#e0900c}
.quiz-intro-title{font-size:18px;font-weight:700;color:var(--ink);margin-bottom:10px}
.quiz-intro-text{font-size:13.5px;color:var(--body);line-height:1.6;margin-bottom:14px}
.quiz-intro-list{font-size:13px;color:var(--body);line-height:1.8;margin:0 0 16px 18px}
.quiz-start-btn{background:var(--navy);color:#fff;border:none;padding:12px 28px;border-radius:var(--radius);font-weight:700;font-size:15px;cursor:pointer;font-family:inherit;display:block;margin:0 auto;transition:.15s}
.quiz-start-btn:hover{background:var(--navy-2)}
.quiz-result-score{font-size:44px;font-weight:800;color:var(--navy);text-align:center;margin:10px 0}
.quiz-result-msg{font-size:14px;color:var(--body);text-align:center;margin-bottom:16px;line-height:1.5}
.quiz-result-breakdown{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.quiz-bd-row{display:flex;justify-content:space-between;font-size:12.5px;background:var(--bg-soft);padding:8px 12px;border-radius:var(--radius);font-weight:600;color:var(--body)}
.quiz-retry-btn{background:var(--navy);color:#fff;border:none;padding:10px 24px;border-radius:var(--radius);font-weight:700;cursor:pointer;font-family:inherit;display:block;margin:0 auto;transition:.15s}
.quiz-retry-btn:hover{background:var(--navy-2)}
</style>

<div class="container">
  <div class="sticky-nav">
<div class="top-section">
    <div class="top-header">
      <div class="top-title">📚 Advanced Vocabulary Lab — Greek & Latin Roots</div>
      <div class="level-badge">⭐ INTERMEDIATE → ADVANCED</div>
      <button class="assign-btn" id="assignBtn">📝 Assessment</button>
      <div class="include-badge"><span id="bookProgress">1 of 37</span></div>
    </div>
    <div class="book-list" id="bookList"></div>
  </div>

  </div>
<div class="bottom-section">
    <div class="card-display">
      <div class="book-title" id="bookTitle"></div>
      <button class="pronounce-btn" id="pronounceBtn" aria-label="Hear word">🔊</button>
      <div class="flip-card" id="flipCard">
        <div class="flip-face flip-front" id="flipFront">
          <div class="big-emoji" id="bigEmoji"></div>
          <div class="word-display" id="wordDisplay"></div>

const questions = [["In a business context, what does 'telework' most precisely describe?", ["Work done automatically", "Work performed remotely", "Work involving small teams", "Work focused on writing"], 1, "TELE means far/distant; telework is work performed remotely."], ["A report says a model 'contradicts the initial hypothesis.' What does contradict mean?", ["Supports it", "Conflicts with it", "Predicts it", "Summarizes it"], 1, "CONTRA means against and DICT relates to saying: contradict means to conflict with a statement."], ["Which word most clearly contains the idea of 'small' in a technical context?", ["microarchitecture", "telepresence", "jurisdiction", "trajectory"], 0, "MICRO means small; microarchitecture describes the internal organization of a processor."], ["A manager takes a 'circumspect' approach. What is implied?", ["Careful consideration before acting", "Immediate action without review", "Complete rejection of evidence", "Remote communication"], 0, "CIRCUM relates to around and SPECT to look; circumspect means careful and prudent."], ["What does a 'protracted negotiation' imply?", ["It ended quickly", "It lasted longer than expected", "It happened remotely", "It was legally invalid"], 1, "PROTRACT is associated with drawing out; protracted means prolonged."], ["Which root family best helps decode 'cryptography'?", ["-GRAPH", "-PORT", "-TRACT", "AUTO-"], 0, "GRAPH relates to writing/recording; cryptography concerns secure information encoding."], ["Which statement about Greek and Latin roots is most accurate?", ["They give an exact modern definition every time.", "They are useful clues that must be combined with context.", "They are only useful for beginners.", "They eliminate the need to learn vocabulary."], 1, "Root knowledge is a meaning clue, not a complete replacement for context and dictionary verification."], ["In 'geospatial analytics', what does geospatial most likely mean?", ["Related to geographic location and spatial relationships", "Related to biology", "Related to speech", "Related to historical writing"], 0, "GEO relates to Earth/geography and spatial relates to position or location."], ["Which pair correctly contrasts 'prospective' and 'retrospective'?", ["future-oriented / past-oriented", "past-oriented / future-oriented", "small / large", "remote / local"], 0, "PROSPECTIVE looks forward; RETROSPECTIVE looks back."], ["What does 'autodidact' describe?", ["A self-directed learner", "A remote worker", "A geographic analyst", "A professional photographer"], 0, "AUTO means self and DIDACT relates to teaching: an autodidact learns independently."], ["Which word best means 'a short credential validating a specific skill'?", ["microcredential", "telemetry", "benediction", "trajectory"], 0, "MICRO means small/focused and credential refers to documented qualification."], ["In the sentence 'The API provides access to the dataset,' which root family is relevant to provide?", ["VID/VIS", "JECT", "DICT", "PORT"], 0, "PROVIDE is historically related to the VID/VIS family associated with seeing."], ["Which word means 'a formal decision or judgment'?", ["verdict", "photogrammetry", "traction", "methodology"], 0, "VERDICT belongs to the DICT family and refers to a formal judgment."], ["Which sentence uses 'traction' figuratively?", ["The tires have traction on wet roads.", "The startup gained traction in the enterprise market.", "The microscope measured traction.", "The contract created traction."], 1, "TRACTION can mean progress, momentum, or growing acceptance."], ["What is the most effective strategy for an unfamiliar advanced word?", ["Use only the first letter.", "Identify affixes/root, infer meaning, examine context, then verify.", "Ignore context and translate literally.", "Memorize pronunciation without meaning."], 1, "Advanced vocabulary analysis combines morphology, context, pronunciation, and verification."], ["Why is the spelling pattern 'ough' difficult in English phonics?", ["It has one fixed sound.", "It can represent different sounds in different words.", "It only occurs at word endings.", "It is always silent."], 1, "Though, through, thought, rough, and cough demonstrate multiple pronunciations."], ["Which pronunciation pattern is common for the suffix '-tion'?", ["/ʃən/", "/tɪŋ/", "/θən/", "/kən/"], 0, "In many words, -tion is pronounced /ʃən/, as in information and contradiction."], ["Which statement best distinguishes 'automatic' from 'autonomous'?", ["They are always identical.", "Automatic emphasizes operation without direct action; autonomous emphasizes independent operation or decision-making.", "Autonomous only describes people.", "Automatic means self-written."], 1, "The distinction is especially useful in technical and professional vocabulary."], ["A researcher documents the 'methodology' so others can reproduce the work. What is methodology?", ["A future prediction", "A systematic set of methods", "A geographic map", "A legal verdict"], 1, "METHODOLOGY refers to the organized methods used in research or practice."], ["Which word most clearly means 'to send across'?", ["transmit", "inspect", "reform", "autograph"], 0, "TRANS means across and MIT means send: transmit means to send from one place/system to another."]];

let moduleIndex=0, wordIndex=0;
let quizIdx=0, quizScore=0, quizAnswered=false;

function splitRoot(word, root) {
  const r=(root||'').replace(/^-|-$/g,'');
  const lower=word.toLowerCase(), i=lower.indexOf(r.toLowerCase());
  if(!r || i<0) return {h1:word,h2:'',tail:''};
  return {h1:word.slice(0,i),h2:word.slice(i,i+r.length),tail:word.slice(i+r.length)};
}
function renderWordHighlight(word, root) {
  const s=splitRoot(word,root);
  if(!s.h2) return `<span class="h1">${s.h1}</span>`;
  return `<span class="h1">${s.h1}</span><span class="h2">${s.h2}</span><span class="h1">${s.tail}</span>`;
}
function renderRootChunks(word, root) {
  const s=splitRoot(word,root), out=[];
  if(s.h1) out.push(`<div class="phoneme-chunk">${s.h1}</div>`);
  out.push(`<div class="phoneme-chunk h2">${s.h2||root}</div>`);
  if(s.tail) out.push(`<div class="phoneme-chunk">${s.tail}</div>`);
  return out.join('<span class="phoneme-plus">+</span>');
}
function renderRootPills(word, root, module) {
  const s=splitRoot(word,root), out=[];
  if(s.h1) out.push(`<div class="phoneme-pill">${s.h1}</div>`, `<span class="phoneme-plus">+</span>`);
  out.push(`<div class="phoneme-pill h2">${s.h2||root}</div>`);
  if(s.tail) out.push(`<span class="phoneme-plus">+</span>`, `<div class="phoneme-pill">${s.tail}</div>`);
  out.push(`<span class="phoneme-plus">=</span><div class="phoneme-pill full">${word}</div>`);
  return out.join('');
}
function speak(word) {
  if('speechSynthesis' in window) { speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(word); u.rate=.78; speechSynthesis.speak(u); }
}
function buildBookList() {
  const list=document.getElementById('bookList'); list.innerHTML='';
  modules.forEach((m,i)=>{
    const c=document.createElement('div'); c.className='mini-book'+(i===moduleIndex?' active':''); c.style.setProperty('--accent',m.c?.[0]||'#14213D');
    c.innerHTML=`<div class="b-emoji">${m.emoji}</div><div class="b-pattern">${m.name}</div><div class="b-tier">${m.origin}</div><div class="b-count">${m.words.length} words</div>`;
    c.onclick=()=>selectModule(i); list.appendChild(c);
  });
}
function selectModule(i) {
  moduleIndex=i; wordIndex=0; document.getElementById('flipCard').classList.remove('flipped');
  buildBookList(); updateDisplay();
  document.querySelectorAll('.mini-book')[i]?.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
}
function selectWord(i) { wordIndex=i; document.getElementById('flipCard').classList.remove('flipped'); updateDisplay(); }
function updateDisplay() {
  const m=modules[moduleIndex], w=m.words[wordIndex];
  document.getElementById('bookTitle').textContent=`${m.name} · ${m.origin}`;
  document.getElementById('bookProgress').textContent=`${moduleIndex+1} of ${modules.length}`;
  document.getElementById('bigEmoji').textContent=w.emoji || m.emoji;
  document.getElementById('wordDisplay').innerHTML=renderWordHighlight(w.word,m.root);
  document.getElementById('phonemeSplit').innerHTML=renderRootChunks(w.word,m.root);
  document.getElementById('meaningDisplay').textContent=w.meaning;
  document.getElementById('wordCounter').textContent=`${wordIndex+1} / ${m.words.length}`;
  document.getElementById('prevBtn').disabled=wordIndex===0;
  document.getElementById('nextBtn').disabled=wordIndex===m.words.length-1;
  document.getElementById('detailsEmoji').textContent=w.emoji || m.emoji;
  document.getElementById('detailsWord').innerHTML=renderWordHighlight(w.word,m.root);
  document.getElementById('posBadge').textContent=w.pos;
  document.getElementById('phonemeRow').innerHTML=renderRootPills(w.word,m.root,m);
  document.getElementById('phoneticDisplay').innerHTML=`<b>${w.word}</b> · root: /${m.root}/ · ${m.origin} origin`;
  document.getElementById('definitionDisplay').textContent=w.meaning;
  document.getElementById('examplesDisplay').innerHTML=`<div class="example-item">${w.example}</div>`;
  document.getElementById('familyDisplay').innerHTML=m.words.map((x,i)=>`<div class="tag ${i===wordIndex?'active':''}" onclick="selectWord(${i})">${x.word}</div>`).join('');
}

document.getElementById('flipCard').addEventListener('click',()=>document.getElementById('flipCard').classList.toggle('flipped'));
document.getElementById('pronounceBtn').addEventListener('click',e=>{e.stopPropagation(); speak(modules[moduleIndex].words[wordIndex].word);});
document.getElementById('prevBtn').addEventListener('click',()=>{if(wordIndex>0)selectWord(wordIndex-1);});
document.getElementById('nextBtn').addEventListener('click',()=>{if(wordIndex<modules[moduleIndex].words.length-1)selectWord(wordIndex+1);});
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'&&wordIndex>0)selectWord(wordIndex-1);
  if(e.key==='ArrowRight'&&wordIndex<modules[moduleIndex].words.length-1)selectWord(wordIndex+1);
  if(e.key==='ArrowUp'&&moduleIndex>0)selectModule(moduleIndex-1);
  if(e.key==='ArrowDown'&&moduleIndex<modules.length-1)selectModule(moduleIndex+1);
  if(e.key===' '&&document.activeElement?.tagName!=='INPUT'){e.preventDefault();document.getElementById('flipCard').classList.toggle('flipped');}
});

function openQuiz() { quizIdx=0;quizScore=0;quizAnswered=false;document.getElementById('assignModal').classList.add('open');showQuizIntro(); }
function closeQuiz() { document.getElementById('assignModal').classList.remove('open'); }
function showQuizIntro() {
  const stage=document.getElementById('quizStage');
  stage.innerHTML=`<div class="quiz-intro-title">Test your Greek & Latin root reasoning</div>
    <div class="quiz-intro-text">This assessment checks intermediate → advanced vocabulary reasoning using roots, context, morphology and professional usage.</div>
    <ul class="quiz-intro-list"><li><strong>${questions.length} Multiple-Choice</strong> questions</li><li>Covers root meaning, context and vocabulary application</li><li>Review the explanation after every answer</li></ul>
    <button class="quiz-start-btn" id="quizStartBtn">▶ Start Assessment</button>`;
  document.getElementById('quizStartBtn').addEventListener('click',startQuiz);
}
function startQuiz() { quizIdx=0;quizScore=0;renderQuizQuestion(); }
function renderQuizQuestion() {
  quizAnswered=false; const q=questions[quizIdx], stage=document.getElementById('quizStage');
  const pct=Math.round((quizIdx/questions.length)*100);
  stage.innerHTML=`<div class="quiz-progress-wrap"><div class="quiz-progress-bar" style="width:${pct}%"></div></div>
    <div class="quiz-meta"><span>Question ${quizIdx+1} of ${questions.length}</span><span><span class="quiz-difficulty diff-${quizIdx<8?'Intermediate':'Advanced'}">${quizIdx<8?'Intermediate':'Advanced'}</span> <span class="quiz-type-tag">Choose Answer</span></span></div>
    <div class="quiz-q">${q[0]}</div><div class="quiz-options">${q[1].map((o,i)=>`<button class="quiz-opt-btn" data-index="${i}">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}</div><div id="quizFeedbackArea"></div>`;
  stage.querySelectorAll('.quiz-opt-btn').forEach(btn=>btn.addEventListener('click',()=>checkAnswer(Number(btn.dataset.index),q)));
}
function checkAnswer(choice,q) {
  if(quizAnswered)return; quizAnswered=true; const correct=choice===q[2]; if(correct)quizScore++;
  document.querySelectorAll('.quiz-opt-btn').forEach((b,i)=>{b.disabled=true;if(i===q[2])b.classList.add('correct');else if(i===choice)b.classList.add('wrong');});
  document.getElementById('quizFeedbackArea').innerHTML=`<div class="quiz-feedback ${correct?'correct':'wrong'}">${correct?'✅ Correct!':'❌ Not quite.'}</div><div class="quiz-explain">${q[3]}</div><button class="quiz-next-btn" id="quizNextBtn">${quizIdx<questions.length-1?'Next Question →':'See Results →'}</button>`;
  document.getElementById('quizNextBtn').onclick=()=>{if(quizIdx<questions.length-1){quizIdx++;renderQuizQuestion();}else showQuizResults();};
}
function showQuizResults() {
  const pct=Math.round(quizScore/questions.length*100); let msg='Keep practicing the roots and use context to confirm meaning.';
  if(pct>=90)msg='Outstanding! Your root analysis and contextual reasoning are excellent.'; else if(pct>=75)msg='Great work! You have strong intermediate-to-advanced vocabulary reasoning.'; else if(pct>=60)msg='Good foundation. Review the modules and strengthen contextual inference.';
  document.getElementById('quizStage').innerHTML=`<div class="quiz-result-score">${quizScore} / ${questions.length}</div><div class="quiz-result-msg">${msg}<br><strong>${pct}%</strong></div><div class="quiz-result-breakdown"><div class="quiz-bd-row"><span>Correct answers</span><span>${quizScore}</span></div><div class="quiz-bd-row"><span>Needs review</span><span>${questions.length-quizScore}</span></div></div><button class="quiz-retry-btn" id="quizRetryBtn">↻ Try Again</button>`;
  document.getElementById('quizRetryBtn').onclick=startQuiz;
}
document.getElementById('assignBtn').addEventListener('click',openQuiz);
document.getElementById('modalCloseBtn').addEventListener('click',closeQuiz);
document.getElementById('assignModal').addEventListener('click',e=>{if(e.target.id==='assignModal')closeQuiz();});

buildBookList();updateDisplay();
</script>
