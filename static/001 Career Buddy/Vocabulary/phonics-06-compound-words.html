<!DOCTYPE html>
<html lang="en">

<title>Level 6 — Compound Words (Intermediate–Advanced)</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap');
:root{
  --navy:#14213D;--navy-2:#0b1526;--gold:#FCA311;--gold-soft:#fdeecb;--gold-ink:#7a5c00;
  --bg:#f9f9ff;--bg-soft:#f1f3ff;--ink:#161c27;--body:#4a5568;--muted:#718096;
  --line:#e2e8f0;--line-2:#dde2f3;--teal-50:#e6ebf3;
  --success:#38a169;--success-bg:#e9f7ef;--danger:#e53e3e;--danger-bg:#fdecec;
  --radius:8px;--radius-lg:14px;
  --shadow-sm:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06);
  --shadow:0 8px 24px -12px rgba(16,24,40,.18);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100%;font-family:'Outfit',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
body{background:var(--bg);color:var(--ink);padding:14px;-webkit-font-smoothing:antialiased}
.container{min-height:calc(100vh - 24px);display:flex;flex-direction:column;gap:12px}
.top-section{flex:0 0 auto;background:#fff;border-radius:var(--radius-lg);padding:12px 16px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;border:1px solid var(--line)}
.top-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;flex-wrap:wrap;gap:10px}
.top-title{font-size:17px;font-weight:700;color:var(--ink);letter-spacing:-.01em;display:flex;align-items:center;gap:9px}
.level-badge{background:var(--gold-soft);color:var(--gold-ink);padding:5px 12px;border-radius:999px;font-size:11px;font-weight:700;border:1px solid rgba(238,188,29,.4)}
.header-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.include-badge{background:var(--bg-soft);color:var(--body);padding:5px 14px;border-radius:999px;font-size:12px;font-weight:700;border:1px solid var(--line)}
.assign-btn{background:var(--navy);color:#fff;padding:7px 16px;border:none;border-radius:var(--radius);font-size:12px;font-weight:700;cursor:pointer;transition:.15s}
.assign-btn:hover{background:var(--navy-2)}
.book-list{display:flex;gap:10px;overflow-x:auto;overflow-y:visible;padding:8px 2px 10px;flex:0 0 auto;align-items:stretch}
.mini-book{flex-shrink:0;width:96px;border-radius:10px;cursor:pointer;background:#fff;border:1px solid var(--line);border-top:3px solid var(--accent,var(--navy));transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ink);box-shadow:var(--shadow-sm);position:relative;user-select:none;padding:8px 4px;gap:3px}
.mini-book .b-emoji{font-size:20px;line-height:1}
.mini-book .b-pattern{font-size:13px;font-weight:700;color:var(--navy)}
.mini-book .b-count{font-size:9px;background:var(--bg-soft);color:var(--muted);padding:1px 7px;border-radius:8px;font-weight:600}
.mini-book:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.mini-book.active{border-color:var(--navy);box-shadow:0 0 0 2px var(--navy);z-index:2}
.mini-book.active::after{content:'✓';position:absolute;top:-7px;right:-7px;background:var(--gold);color:var(--navy);width:19px;height:19px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;box-shadow:var(--shadow-sm)}
.bottom-section{flex:1;min-height:440px;display:grid;grid-template-columns:45% 55%;gap:12px}
.card-display{background:#fff;border-radius:var(--radius-lg);padding:16px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;align-items:center;justify-content:space-between;perspective:1500px;position:relative;border:1px solid var(--line)}
.book-title{background:var(--navy);color:#fff;padding:7px 16px;border-radius:var(--radius);font-size:13.5px;font-weight:700;text-align:center}
.pronounce-btn{position:absolute;top:14px;right:14px;background:var(--navy);border:none;color:#fff;width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:15px;box-shadow:var(--shadow-sm);z-index:10;transition:.15s}
.pronounce-btn:hover{background:var(--navy-2)}
.flip-card{width:90%;height:65%;position:relative;cursor:pointer;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.4,0,.2,1)}
.flip-card.flipped{transform:rotateY(180deg)}
.flip-face{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:var(--radius-lg);display:flex;align-items:center;justify-content:center;flex-direction:column;box-shadow:var(--shadow);border:1px solid var(--line);overflow:hidden;padding:14px;gap:10px}
.flip-front{background:linear-gradient(150deg,var(--navy),var(--navy-2));color:#fff;border-color:transparent}
.flip-back{background:#fff;color:var(--ink);transform:rotateY(180deg)}
.big-emoji{font-size:clamp(50px,7vw,90px);filter:drop-shadow(0 4px 8px rgba(0,0,0,.25))}
.word-display{font-size:clamp(32px,5vw,60px);font-weight:800;text-align:center;letter-spacing:-.01em;line-height:1.1}
.word-display .h1{color:#fff}.word-display .h2{color:var(--gold)}
.phoneme-split{display:flex;gap:8px;font-size:clamp(20px,3.2vw,34px);font-weight:800;align-items:center;flex-wrap:wrap;justify-content:center}
.phoneme-chunk{background:var(--bg-soft);color:var(--navy);padding:6px 16px;border-radius:10px;border:1px solid var(--line-2)}
.phoneme-chunk.h2{background:var(--gold-soft);color:var(--gold-ink);border-color:rgba(238,188,29,.5)}
.meaning-display{font-size:clamp(14px,1.7vw,18px);font-weight:500;text-align:center;line-height:1.45;color:var(--body);padding:0 8px}
.word-nav{display:flex;align-items:center;gap:10px;background:var(--bg-soft);padding:6px 12px;border-radius:999px;border:1px solid var(--line)}
.nav-btn{background:#fff;border:1px solid var(--line);color:var(--navy);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:18px;font-weight:700;transition:.15s;display:flex;align-items:center;justify-content:center}
.nav-btn:hover:not(:disabled){border-color:var(--navy);background:var(--teal-50)}
.nav-btn:disabled{opacity:.35;cursor:not-allowed}
.word-counter{font-size:13px;font-weight:700;color:var(--navy);min-width:60px;text-align:center;font-variant-numeric:tabular-nums}
.details-panel{background:#fff;border-radius:var(--radius-lg);padding:18px 22px;overflow-y:auto;box-shadow:var(--shadow-sm);border:1px solid var(--line)}
.details-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--line);flex-wrap:wrap;gap:8px}
.details-word-wrap{display:flex;align-items:center;gap:10px}
.details-emoji{font-size:30px}
.details-word{font-size:24px;font-weight:800;color:var(--ink);letter-spacing:-.01em}
.details-word .h1{color:var(--ink)}.details-word .h2{color:var(--gold)}
.badge-group{display:flex;gap:6px;flex-wrap:wrap}
.pos-badge{background:var(--gold-soft);color:var(--gold-ink);padding:4px 12px;border-radius:999px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border:1px solid rgba(238,188,29,.4)}
.level-tag{padding:4px 12px;border-radius:999px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line-2);color:var(--navy);background:var(--bg-soft)}
.level-tag.INT{background:var(--teal-50);color:var(--navy);border-color:var(--line-2)}
.level-tag.ADV{background:var(--navy);color:#fff;border-color:transparent}
.detail-section{margin-bottom:16px}
.detail-label{display:flex;align-items:center;gap:6px;font-weight:700;color:var(--navy);font-size:11px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.phonetic-box{background:var(--teal-50);border-left:3px solid var(--navy);padding:8px 14px;border-radius:var(--radius);font-style:italic;font-size:16px;color:var(--navy);font-weight:600}
.phoneme-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.phoneme-pill{background:var(--bg-soft);color:var(--navy);padding:5px 13px;border-radius:999px;font-size:14px;font-weight:700;border:1px solid var(--line-2)}
.phoneme-pill.h2{background:var(--gold-soft);color:var(--gold-ink);border-color:rgba(238,188,29,.5)}
.phoneme-pill.full{background:var(--navy);color:#fff;border-color:transparent}
.phoneme-plus{color:var(--muted);font-size:16px;font-weight:700}
.meaning-box{font-size:14px;color:var(--body);line-height:1.55;background:var(--teal-50);padding:10px 14px;border-radius:var(--radius);border-left:3px solid var(--navy)}
.example-item{background:var(--gold-soft);padding:10px 14px;border-left:3px solid var(--gold);margin-bottom:6px;border-radius:var(--radius);font-size:13px;color:var(--ink);line-height:1.55;font-style:italic}
.example-item::before{content:'"';font-size:18px;color:var(--gold-ink);font-weight:700;margin-right:4px}
.tag-list{display:flex;flex-wrap:wrap;gap:6px}
.tag{padding:5px 11px;border-radius:999px;font-size:13px;font-weight:600;color:var(--navy);border:1px solid var(--line-2);cursor:pointer;background:var(--bg-soft);transition:.15s}
.tag:hover{border-color:var(--navy)}
.tag.active{background:var(--navy);color:#fff;border-color:transparent}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:var(--bg-soft);border-radius:10px}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:10px}
::-webkit-scrollbar-thumb:hover{background:var(--muted)}
@media(max-width:900px){.bottom-section{grid-template-columns:1fr;grid-template-rows:1fr 1fr}}

/* ===== Assessment mode (matches reference modal pattern) ===== */
.modal-overlay{display:none;position:fixed;inset:0;background:var(--bg);z-index:100;align-items:stretch;justify-content:center;padding:0}
.modal-overlay.open{display:flex}
.modal-box{background:#fff;border-radius:0;border:none;box-shadow:none;max-width:none;width:100%;height:100%;max-height:none;overflow-y:auto;padding:22px 24px 48px}
.modal-head,#quizStage{max-width:none;margin-left:0;margin-right:0;width:100%}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.modal-title{font-size:20px;font-weight:700;color:var(--ink)}
.modal-close{background:var(--bg-soft);color:var(--body);border:1px solid var(--line);width:30px;height:30px;border-radius:50%;font-size:14px;font-weight:700;cursor:pointer;transition:.15s}
.modal-close:hover{background:var(--line);color:var(--ink)}
.quiz-intro-title{font-size:18px;font-weight:700;color:var(--ink);margin-bottom:10px}
.quiz-intro-text{font-size:13.5px;color:var(--body);line-height:1.6;margin-bottom:14px}
.quiz-intro-list{font-size:13px;color:var(--body);line-height:1.8;margin:0 0 16px 18px}
.quiz-start-btn{background:var(--navy);color:#fff;border:none;padding:12px 28px;border-radius:var(--radius);font-weight:700;font-size:15px;cursor:pointer;font-family:inherit;display:block;margin:0 auto;transition:.15s}
.quiz-start-btn:hover{background:var(--navy-2)}
.quiz-progress-wrap{background:var(--bg-soft);border-radius:20px;height:8px;overflow:hidden;margin-bottom:14px}
.quiz-progress-bar{background:var(--navy);height:100%;transition:width .3s}
.quiz-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:11px;font-weight:700;color:var(--muted)}
.quiz-difficulty{padding:3px 10px;border-radius:999px;color:#fff;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.3px}
.diff-Intermediate{background:var(--navy)}
.diff-Advanced{background:var(--gold);color:var(--navy)}
.quiz-type-tag{background:var(--gold-soft);color:var(--gold-ink);padding:3px 10px;border-radius:999px;font-size:10px;font-weight:700;text-transform:uppercase}
.quiz-q{font-size:16px;font-weight:700;color:var(--ink);margin-bottom:10px;line-height:1.4}
.quiz-sentence{font-size:15px;background:var(--gold-soft);border-left:3px solid var(--gold);padding:10px 14px;border-radius:var(--radius);font-style:italic;color:var(--ink);margin-bottom:14px}
.quiz-options{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.quiz-opt-btn{text-align:left;padding:11px 14px;border-radius:var(--radius);border:1px solid var(--line);background:#fff;font-family:inherit;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer;transition:.15s}
.quiz-opt-btn:hover:not(:disabled){border-color:var(--navy);background:var(--bg-soft)}
.quiz-opt-btn.correct{background:var(--success-bg);border-color:var(--success);color:#276749}
.quiz-opt-btn.wrong{background:var(--danger-bg);border-color:var(--danger);color:#c53030}
.quiz-opt-btn:disabled{cursor:default}
.quiz-input-row{display:flex;gap:8px;margin-bottom:12px}
.quiz-input{flex:1;padding:11px 14px;border-radius:var(--radius);border:1px solid var(--line);font-family:inherit;font-size:14px;font-weight:600;color:var(--ink)}
.quiz-input:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(20,33,61,.1)}
.quiz-input.correct{border-color:var(--success);background:var(--success-bg)}
.quiz-input.wrong{border-color:var(--danger);background:var(--danger-bg)}
.quiz-check-btn{background:var(--navy);color:#fff;border:none;padding:0 18px;border-radius:var(--radius);font-weight:700;cursor:pointer;font-family:inherit;transition:.15s}
.quiz-check-btn:hover{background:var(--navy-2)}
.quiz-check-btn:disabled{opacity:.4;cursor:not-allowed}
.quiz-hint{font-size:12px;color:var(--muted);font-style:italic;margin-bottom:8px}
.quiz-feedback{padding:10px 14px;border-radius:var(--radius);font-size:13px;font-weight:600;margin-bottom:10px}
.quiz-feedback.correct{background:var(--success-bg);color:#276749;border-left:3px solid var(--success)}
.quiz-feedback.wrong{background:var(--danger-bg);color:#c53030;border-left:3px solid var(--danger)}
.quiz-explain{font-size:12.5px;color:var(--body);line-height:1.5;background:var(--bg-soft);padding:8px 12px;border-radius:var(--radius);border-left:3px solid var(--line-2);margin-bottom:12px}
.quiz-next-btn{background:var(--gold);color:var(--navy);border:none;padding:9px 20px;border-radius:var(--radius);font-weight:700;cursor:pointer;font-family:inherit;transition:.15s}
.quiz-next-btn:hover{background:#e0900c}
.quiz-result-score{font-size:44px;font-weight:800;color:var(--navy);text-align:center;margin:10px 0}
.quiz-result-msg{font-size:14px;color:var(--body);text-align:center;margin-bottom:16px;line-height:1.5}
.quiz-result-breakdown{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.quiz-bd-row{display:flex;justify-content:space-between;font-size:12.5px;background:var(--bg-soft);padding:8px 12px;border-radius:var(--radius);font-weight:600;color:var(--body)}
.quiz-review-item{padding:10px 14px;border-radius:var(--radius);margin-bottom:8px;font-size:13px;line-height:1.5}
.quiz-review-item.ok{background:var(--success-bg);border-left:3px solid var(--success)}
.quiz-review-item.no{background:var(--danger-bg);border-left:3px solid var(--danger)}
.quiz-review-item b{color:var(--ink)}
.quiz-retry-btn{background:var(--navy);color:#fff;border:none;padding:10px 24px;border-radius:var(--radius);font-weight:700;cursor:pointer;font-family:inherit;transition:.15s}
.quiz-retry-btn:hover{background:var(--navy-2)}
</style><!-- ── Global theme overlay (DESIGN-CBuddy.md) ── -->

<div class="container">
<div class="sticky-nav">
<div class="top-section">
<div class="top-header">
<div class="top-title">🧩 Compound Words</div>

<div class="header-right">
<div class="include-badge"><span id="bookProgress">1 of 14</span></div>

function selectBook(i){bookIdx=i;wordIdx=0;document.querySelectorAll('.mini-book').forEach((c,x)=>c.classList.toggle('active',x===i));document.getElementById('flipCard').classList.remove('flipped');updateDisplay();const a=document.querySelectorAll('.mini-book')[i];if(a)a.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'})}

function renderSplit(parts){return parts.map((p,i)=>`<span class="${i%2===0?'h1':'h2'}">${p}</span>`).join('')}
function renderChunks(parts){return parts.map((p,i)=>`<div class="phoneme-chunk ${i%2===0?'':'h2'}">${p}</div>`).join('')}
function renderPills(word,parts){let h=parts.map((p,i)=>`<div class="phoneme-pill ${i%2===0?'':'h2'}">${p}</div>`).join('<span class="phoneme-plus">+</span>');h+=`<span class="phoneme-plus">=</span><div class="phoneme-pill full">${word}</div>`;return h}
function updateDisplay(){const b=books[bookIdx],w=b.w[wordIdx],[word,em,pos,mn,sn,parts,level]=w;document.getElementById('bookTitle').textContent=b.name;document.getElementById('bookProgress').textContent=`${bookIdx+1} of ${books.length}`;document.getElementById('bigEmoji').textContent=em;document.getElementById('wordDisplay').innerHTML=renderSplit(parts);document.getElementById('phonemeSplit').innerHTML=renderChunks(parts);document.getElementById('meaningDisplay').textContent=mn;document.getElementById('wordCounter').textContent=`${wordIdx+1} / ${b.w.length}`;document.getElementById('prevBtn').disabled=wordIdx===0;document.getElementById('nextBtn').disabled=wordIdx===b.w.length-1;document.getElementById('detailsEmoji').textContent=em;document.getElementById('detailsWord').innerHTML=renderSplit(parts);document.getElementById('posBadge').textContent=pos;const lt=document.getElementById('levelTag');lt.textContent=level==='ADV'?'Advanced':'Intermediate';lt.className='level-tag '+level;document.getElementById('phonemeRow').innerHTML=renderPills(word,parts);document.getElementById('phoneticDisplay').textContent=`/${word}/`;document.getElementById('definitionDisplay').textContent=mn;document.getElementById('examplesDisplay').innerHTML=`<div class="example-item">${sn}</div>`;document.getElementById('familyDisplay').innerHTML=b.w.map((o,x)=>`<div class="tag${x===wordIdx?' active':''}" onclick="selectWord(${x})">${o[1]} ${o[0]}</div>`).join('')}

const allWords=[];
books.forEach(b=>b.w.forEach(w=>allWords.push({word:w[0],em:w[1],pos:w[2],meaning:w[3],sentence:w[4],parts:w[5],level:w[6],book:b.name})));

function shuffleArr(a){const arr=[...a];for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
function blankSentence(sentence,word){const re=new RegExp('\\b'+word+'\\b','i');return sentence.replace(re,'_____')}
function normalize(s){return s.trim().toLowerCase().replace(/[^a-z]/g,'')}

let quizQuestions=[],quizIdx=0,quizScore=0,quizAnswered=false,quizLog=[],quizBreakdown={};

function openQuiz(){document.getElementById('assignModal').classList.add('open');showQuizIntro()}
function closeQuiz(){document.getElementById('assignModal').classList.remove('open')}

function showQuizIntro(){
  const stage=document.getElementById('quizStage');
  stage.innerHTML=`
    <div class="quiz-intro-title">Test what you've learned</div>
    <div class="quiz-intro-text">This assessment mixes three question styles — multiple-choice meaning checks, multiple-choice sentence completion, and typed sentence-completion answers — pulled from all 14 word families, so it works whether you're just starting out or sharpening advanced, idiomatic usage.</div>
    <ul class="quiz-intro-list">
      <li><strong>14 questions</strong>, mixing Intermediate and Advanced words</li>
      <li><strong>Multiple-Choice</strong> and <strong>Type-the-Answer</strong> formats</li>
      <li>Covers all 14 compound word families</li>
    </ul>
    <button class="quiz-start-btn" id="quizStartBtn">▶ Start Assessment</button>`;
  document.getElementById('quizStartBtn').addEventListener('click',()=>startQuiz('MIX',14));
}

function startQuiz(diff,count){
  let pool = diff==='MIX' ? allWords : allWords.filter(w=>w.level===diff);
  if(pool.length<4){pool=allWords;}
  const picks=shuffleArr(pool).slice(0,Math.min(count,pool.length));
  quizQuestions=picks.map((entry,i)=>buildQuestion(entry,i));
  quizIdx=0;quizScore=0;quizAnswered=false;quizLog=[];
  quizBreakdown={Intermediate:{c:0,t:0},Advanced:{c:0,t:0}};
  renderQuizQuestion();
}

function buildQuestion(entry,i){
  const type=['mcq-meaning','mcq-fill','text-fill'][i%3];
  const distractPool=allWords.filter(w=>w.word!==entry.word);
  const difficulty=entry.level==='ADV'?'Advanced':'Intermediate';
  if(type==='mcq-meaning'){
    const distractors=shuffleArr(distractPool).slice(0,3).map(w=>w.meaning);
    const options=shuffleArr([entry.meaning,...distractors]);
    return {type,entry,difficulty,prompt:`What does "${entry.word}" mean?`,options,correct:entry.meaning};
  }
  if(type==='mcq-fill'){
    const distractors=shuffleArr(distractPool).slice(0,3).map(w=>w.word);
    const options=shuffleArr([entry.word,...distractors]);
    return {type,entry,difficulty,prompt:'Choose the word that best completes the sentence:',sentence:blankSentence(entry.sentence,entry.word),options,correct:entry.word};
  }
  return {type,entry,difficulty,prompt:'Type the compound word that completes the sentence:',sentence:blankSentence(entry.sentence,entry.word),hint:`It's made from "${entry.parts[0]}" + "${entry.parts[1]}".`,correct:entry.word};
}

function renderQuizQuestion(){
  quizAnswered=false;
  const q=quizQuestions[quizIdx];
  const stage=document.getElementById('quizStage');
  const pct=Math.round((quizIdx/quizQuestions.length)*100);
  let inner=`
    <div class="quiz-progress-wrap"><div class="quiz-progress-bar" style="width:${pct}%"></div></div>
    <div class="quiz-meta">
      <span>Question ${quizIdx+1} of ${quizQuestions.length}</span>
      <span><span class="quiz-difficulty diff-${q.difficulty}">${q.difficulty}</span> <span class="quiz-type-tag">${q.type==='text-fill'?'Type Answer':'Choose Answer'}</span></span>
    </div>
    <div class="quiz-q">${q.prompt}</div>
    <div id="quizBody"></div>
    <div id="quizFeedbackArea"></div>`;
  stage.innerHTML=inner;
  const body=document.getElementById('quizBody');
  if(q.type==='mcq-meaning'){
    body.innerHTML=`<div class="quiz-options" id="optsWrap">${q.options.map((o,idx)=>`<button class="quiz-opt-btn" data-idx="${idx}">${o}</button>`).join('')}</div>`;
  }else if(q.type==='mcq-fill'){
    body.innerHTML=`<div class="quiz-sentence">${q.sentence}</div><div class="quiz-options" id="optsWrap">${q.options.map((o,idx)=>`<button class="quiz-opt-btn" data-idx="${idx}">${o}</button>`).join('')}</div>`;
  }else{
    body.innerHTML=`<div class="quiz-sentence">${q.sentence}</div><div class="quiz-hint">💡 Hint: ${q.hint}</div><div class="quiz-input-row"><input type="text" class="quiz-input" id="quizInput" placeholder="Type the compound word…" autocomplete="off"><button class="quiz-check-btn" id="quizCheckBtn">Check</button></div>`;
  }
  if(q.type==='mcq-meaning'||q.type==='mcq-fill'){
    document.querySelectorAll('#optsWrap .quiz-opt-btn').forEach(btn=>btn.addEventListener('click',()=>checkMCQ(btn,q)));
  }else{
    document.getElementById('quizCheckBtn').addEventListener('click',()=>checkFill(q));
    document.getElementById('quizInput').addEventListener('keydown',e=>{if(e.key==='Enter')checkFill(q)});
    document.getElementById('quizInput').focus();
  }
}

function afterAnswer(q,isCorrect,yourAnswer){
  quizAnswered=true;
  quizBreakdown[q.difficulty].t++;
  if(isCorrect){quizScore++;quizBreakdown[q.difficulty].c++}
  quizLog.push({prompt:q.prompt+(q.sentence?' '+q.sentence.replace('_____',`[${q.entry.word}]`):''),yourAnswer,correct:q.correct,isCorrect});
  const area=document.getElementById('quizFeedbackArea');
  area.innerHTML=`
    <div class="quiz-feedback ${isCorrect?'correct':'wrong'}">${isCorrect?'✅ Correct!':'❌ Not quite.'} <b>${q.entry.word}</b></div>
    <div class="quiz-explain">${q.entry.meaning}</div>
    <button class="quiz-next-btn" id="quizNextBtn">${quizIdx<quizQuestions.length-1?'Next Question →':'See Results →'}</button>`;
  document.getElementById('quizNextBtn').addEventListener('click',()=>{
    if(quizIdx<quizQuestions.length-1){quizIdx++;renderQuizQuestion()}else{showQuizResults()}
  });
}

function checkMCQ(btn,q){
  if(quizAnswered)return;
  const chosen=q.options[parseInt(btn.dataset.idx,10)];
  const isCorrect=chosen===q.correct;
  document.querySelectorAll('#optsWrap .quiz-opt-btn').forEach(b=>{
    b.disabled=true;
    if(b.textContent===q.correct)b.classList.add('correct');
    else if(b===btn)b.classList.add('wrong');
  });
  afterAnswer(q,isCorrect,chosen);
}

function checkFill(q){
  if(quizAnswered)return;
  const input=document.getElementById('quizInput');
  const val=input.value.trim();
  if(!val)return;
  const isCorrect=normalize(val)===normalize(q.correct);
  input.disabled=true;input.classList.add(isCorrect?'correct':'wrong');
  document.getElementById('quizCheckBtn').disabled=true;
  afterAnswer(q,isCorrect,val);
}

function showQuizResults(){
  const stage=document.getElementById('quizStage');
  const total=quizQuestions.length;
  const pct=Math.round((quizScore/total)*100);
  let msg="Keep exploring the word families above, then try again!";
  if(pct>=90)msg="Outstanding! You have a strong command of these compound words.";
  else if(pct>=70)msg="Great work! Just a few gaps left to close.";
  else if(pct>=50)msg="Good start — a bit more review will really help.";
  stage.innerHTML=`
    <div class="quiz-result-score">${quizScore} / ${total}</div>
    <div class="quiz-result-msg">${pct}% correct — ${msg}</div>
    <div class="quiz-result-breakdown">
      ${Object.entries(quizBreakdown).map(([d,v])=>`<div class="quiz-bd-row"><span>${d}</span><span>${v.c} / ${v.t} correct</span></div>`).join('')}
    </div>
    <div id="reviewList">${quizLog.map(l=>`
      <div class="quiz-review-item ${l.isCorrect?'ok':'no'}">
        <div>${l.prompt}</div>
        <div>Your answer: <b>${l.yourAnswer||'(no answer)'}</b>${l.isCorrect?'':` &nbsp;|&nbsp; Correct answer: <b>${l.correct}</b>`}</div>
      </div>`).join('')}</div>
    <button class="quiz-retry-btn" id="quizRetryBtn">↻ Try Again</button>`;
  document.getElementById('quizRetryBtn').addEventListener('click',showQuizIntro);
}

document.getElementById('assignBtn').addEventListener('click',openQuiz);
document.getElementById('modalCloseBtn').addEventListener('click',closeQuiz);
document.getElementById('assignModal').addEventListener('click',e=>{if(e.target.id==='assignModal')closeQuiz()});
</script></body></html>
