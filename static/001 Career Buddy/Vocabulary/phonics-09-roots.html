let bookIdx=0,wordIdx=0;
function buildBookList(){const L=document.getElementById('bookList');L.innerHTML='';books.forEach((b,i)=>{const c=document.createElement('div');c.className='mini-book'+(i===bookIdx?' active':'');c.style.setProperty('--accent',b.c[0]);c.innerHTML=`<div class="b-emoji">${b.em}</div><div class="b-pattern">${b.root}</div><div class="b-tier">Advanced</div><div class="b-count">${b.w.length} words</div>`;c.onclick=()=>selectBook(i);L.appendChild(c)})}
function selectBook(i){bookIdx=i;wordIdx=0;document.querySelectorAll('.mini-book').forEach((c,x)=>c.classList.toggle('active',x===i));document.getElementById('flipCard').classList.remove('flipped');updateDisplay();const a=document.querySelectorAll('.mini-book')[i];if(a)a.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'})}
function selectWord(j){wordIdx=j;document.getElementById('flipCard').classList.remove('flipped');updateDisplay()}
function renderSplit(parts,b){const rootIdx=parts.findIndex(p=>p===b.root||p.includes(b.root));return parts.map((p,i)=>`<span class="${(rootIdx>=0?i===rootIdx:i===0)?'h1':'h2'}">${p}</span>`).join('')}
function renderChunks(parts,b){const rootIdx=parts.findIndex(p=>p===b.root||p.includes(b.root));return parts.map((p,i)=>`<div class="phoneme-chunk ${(rootIdx>=0?i===rootIdx:i===0)?'':'h2'}">${p}</div>`).join('')}
function renderPills(word,parts,b){const rootIdx=parts.findIndex(p=>p===b.root||p.includes(b.root));let h=parts.map((p,i)=>`<div class="phoneme-pill ${(rootIdx>=0?i===rootIdx:i===0)?'':'h2'}">${p}</div>`).join('<span class="phoneme-plus">+</span>');h+=`<span class="phoneme-plus">=</span><div class="phoneme-pill full">${word}</div>`;return h}
function updateDisplay(){const b=books[bookIdx],w=b.w[wordIdx],[word,em,pos,mn,sn,parts]=w;document.getElementById('bookTitle').textContent=b.name;document.getElementById('bookProgress').textContent=`${bookIdx+1} of ${books.length}`;document.getElementById('bigEmoji').textContent=em;document.getElementById('wordDisplay').innerHTML=renderSplit(parts,b);document.getElementById('phonemeSplit').innerHTML=renderChunks(parts,b);document.getElementById('meaningDisplay').textContent=mn;document.getElementById('wordCounter').textContent=`${wordIdx+1} / ${b.w.length}`;document.getElementById('prevBtn').disabled=wordIdx===0;document.getElementById('nextBtn').disabled=wordIdx===b.w.length-1;document.getElementById('detailsEmoji').textContent=em;document.getElementById('detailsWord').innerHTML=renderSplit(parts,b);document.getElementById('posBadge').textContent=pos;document.getElementById('phonemeRow').innerHTML=renderPills(word,parts,b);document.getElementById('rootMeaning').innerHTML=`<b>${b.root}</b> <span class="root-origin">${b.origin}</span> ${b.hint}`;document.getElementById('phoneticDisplay').textContent=`/${word}/`;document.getElementById('definitionDisplay').textContent=mn;document.getElementById('examplesDisplay').innerHTML=`<div class="example-item">${sn}</div>`;document.getElementById('familyDisplay').innerHTML=b.w.map((o,x)=>`<div class="tag${x===wordIdx?' active':''}" onclick="selectWord(${x})">${o[1]} ${o[0]}</div>`).join('')}
document.getElementById('flipCard').addEventListener('click',function(){this.classList.toggle('flipped')});
document.getElementById('pronounceBtn').addEventListener('click',e=>{e.stopPropagation();const u=new SpeechSynthesisUtterance(books[bookIdx].w[wordIdx][0]);u.rate=.9;speechSynthesis.speak(u)});
document.getElementById('prevBtn').addEventListener('click',e=>{e.stopPropagation();if(wordIdx>0)selectWord(wordIdx-1)});
document.getElementById('nextBtn').addEventListener('click',e=>{e.stopPropagation();if(wordIdx<books[bookIdx].w.length-1)selectWord(wordIdx+1)});
document.addEventListener('keydown',e=>{const b=books[bookIdx];if(e.key==='ArrowLeft'&&wordIdx>0)selectWord(wordIdx-1);if(e.key==='ArrowRight'&&wordIdx<b.w.length-1)selectWord(wordIdx+1);if(e.key==='ArrowUp'&&bookIdx>0)selectBook(bookIdx-1);if(e.key==='ArrowDown'&&bookIdx<books.length-1)selectBook(bookIdx+1);if(e.key===' '){e.preventDefault();document.getElementById('flipCard').classList.toggle('flipped')}});
const assessmentQuestions = [{"q": "A product team says it wants to improve the system's autonomy. What does autonomy most precisely imply?", "o": ["More manual supervision", "Greater independent decision-making", "A larger physical size", "Faster communication"], "a": 1, "e": "AUTO means self; autonomy is independent decision-making or self-direction."}, {"q": "Which analysis best explains 'telemedicine'?", "o": ["tele = small; medicine = measurement", "tele = distant; medicine = healthcare", "tele = light; medicine = study", "tele = earth; medicine = technology"], "a": 1, "e": "TELE means far/distant, so telemedicine refers to healthcare delivered remotely."}, {"q": "In a security report, 'The evidence contradicts the initial hypothesis.' What does contradict mean?", "o": ["Support", "Conflicts with", "Summarizes", "Predicts"], "a": 1, "e": "CONTRA means against and DICT relates to saying: contradict = state or indicate the opposite/conflict."}, {"q": "Which word most strongly demonstrates the GRAPH root in a professional context?", "o": ["cryptography", "contract", "traction", "autonomy"], "a": 0, "e": "CRYPTO + GRAPHY refers to writing/recording through cryptographic methods; cryptography is a technical professional term."}, {"q": "A 'circumspect' manager is most likely to be:", "o": ["careless and impulsive", "careful about circumstances and consequences", "unable to make any decision", "focused only on past events"], "a": 1, "e": "CIRCUM means around and SPECT means look; circumspect describes careful consideration before acting."}, {"q": "What is the best meaning of 'protracted negotiation'?", "o": ["A negotiation that ended immediately", "A negotiation that lasted longer than expected", "A negotiation conducted remotely", "A negotiation based only on data"], "a": 1, "e": "PROTRACT means to draw out; protracted means prolonged or extended."}, {"q": "Which word contains the meaning 'send across'?", "o": ["transmit", "inspect", "reform", "autograph"], "a": 0, "e": "TRANS means across and MIT means send: transmit = send from one place/system to another."}, {"q": "Which statement about roots is most accurate?", "o": ["Root meanings always give the complete modern definition.", "Roots are useless once a learner reaches advanced English.", "Roots provide a powerful clue to meaning, but context and modern usage still matter.", "Every English word contains a Greek or Latin root."], "a": 2, "e": "Roots are clues, not complete definitions. Advanced learners combine root knowledge with context, grammar, and domain knowledge."}, {"q": "A logistics dashboard uses geospatial analytics. What information is it most likely processing?", "o": ["Geographic location and spatial relationships", "Only employee emotions", "Only written definitions", "Only historical biographies"], "a": 0, "e": "GEO relates to Earth/geography and spatial relates to position or location."}, {"q": "Which pair correctly contrasts 'retrospective' and 'prospective'?", "o": ["past-looking / future-looking", "future-looking / past-looking", "small / large", "remote / local"], "a": 0, "e": "RETRO relates to backward/past; PRO in prospective relates to forward or future orientation."}, {"q": "In 'cryptography', what does GRAPH contribute?", "o": ["Life", "Writing/recording", "Carrying", "Pulling"], "a": 1, "e": "GRAPH comes from Greek and relates to writing, drawing, or recording."}, {"q": "Why is 'ough' an advanced phonics challenge?", "o": ["It always has the same pronunciation.", "It can represent different sounds across words.", "It only appears in technical vocabulary.", "It is always silent."], "a": 1, "e": "English spelling is not perfectly phonemic; though, through, thought, rough, and cough illustrate variation."}, {"q": "Which sentence uses 'traction' figuratively?", "o": ["The tires gained traction on wet asphalt.", "The startup gained traction after its product solved a clear customer problem.", "The microscope measured traction.", "The report was tractioned."], "a": 1, "e": "TRACTION can mean progress, momentum, or growing acceptance in a market or project."}, {"q": "Which word best means 'a short, focused credential for a specific skill'?", "o": ["microcredential", "teleconference", "biography", "geothermal"], "a": 0, "e": "MICRO means small and credential refers to documented qualification; a microcredential validates a focused competency."}, {"q": "Which word means 'to make changes to improve a system or practice'?", "o": ["conform", "reform", "emit", "submit"], "a": 1, "e": "RE- means again/back and FORM relates to shape/form; reform means to change or improve."}, {"q": "In a software context, 'The API provides data to the client.' Which root family is relevant to 'provide'?", "o": ["VID/VIS", "JECT", "PORT", "DICT"], "a": 0, "e": "PROVIDE is historically related to Latin videre, 'to see'; the VID/VIS family includes provide, evidence, visible, revise, and supervise."}, {"q": "Which option is the best advanced learning strategy for an unfamiliar word?", "o": ["Guess from the first letter only.", "Identify possible prefix/root/suffix, infer a meaning, then verify it in context.", "Ignore context and translate literally.", "Memorize the word without understanding it."], "a": 1, "e": "Advanced word analysis combines morphology, context, pronunciation, and verification."}, {"q": "What does 'microarchitecture' refer to in computing?", "o": ["A very small building", "The internal organization and implementation of a processor", "Remote architecture", "Architecture based on geography"], "a": 1, "e": "MICRO means small; microarchitecture is the internal organization/design of a processor."}, {"q": "Which word most clearly means 'a formal decision or judgment'?", "o": ["verdict", "trajectory", "telemetry", "methodology"], "a": 0, "e": "VERDICT belongs to the DICT family and means a formal decision or judgment."}, {"q": "A research paper says, 'The methodology was transparent and reproducible.' What does methodology mean?", "o": ["A collection of unrelated opinions", "A systematic set of methods used for an activity or field", "A prediction about the future", "A geographic map"], "a": 1, "e": "METHODOLOGY refers to the organized system of methods used in research or practice."}];

const quizQuestions=assessmentQuestions.map(x=>({type:"mcq",tier:"Advanced",difficulty:"Advanced",q:x.q,options:x.o,answer:x.o[x.a],explain:x.e}));
let quizIdx=0,quizScore=0,quizAnswered=false;
function openQuiz(){document.getElementById('assignModal').classList.add('open');showQuizIntro()}
function closeQuiz(){document.getElementById('assignModal').classList.remove('open')}
function showQuizIntro(){const stage=document.getElementById('quizStage');stage.innerHTML=`<div class="quiz-intro-title">Test what you've learned</div><div class="quiz-intro-text">This assessment checks advanced Greek and Latin root analysis, contextual vocabulary, and professional usage.</div><ul class="quiz-intro-list"><li><strong>${quizQuestions.length} Multiple-Choice</strong> — choose the correct answer</li><li>One question at a time with immediate feedback</li><li>Scored across the full Greek & Latin Roots sequence</li></ul><button class="quiz-start-btn" id="quizStartBtn">Start Assessment →</button>`;document.getElementById('quizStartBtn').onclick=startQuiz}
function startQuiz(){quizIdx=0;quizScore=0;renderQuizQuestion()}
function renderQuizQuestion(){const stage=document.getElementById('quizStage'),q=quizQuestions[quizIdx];quizAnswered=false;stage.innerHTML=`<div class="quiz-progress-wrap"><div class="quiz-progress-bar" style="width:${quizIdx/quizQuestions.length*100}%"></div></div><div class="quiz-meta"><span>Question ${quizIdx+1} of ${quizQuestions.length}</span><span class="quiz-difficulty diff-Advanced">Advanced</span></div><div class="quiz-q">${q.q}</div><div class="quiz-options" id="quizOptions"></div><div id="quizFeedback"></div>`;q.options.forEach(opt=>{const b=document.createElement('button');b.className='quiz-opt-btn';b.textContent=opt;b.onclick=()=>checkMCQ(opt,b);document.getElementById('quizOptions').appendChild(b)})}
function checkMCQ(choice,btn){if(quizAnswered)return;quizAnswered=true;const q=quizQuestions[quizIdx];const buttons=[...document.querySelectorAll('.quiz-opt-btn')];buttons.forEach(b=>{b.disabled=true;if(b.textContent===q.answer)b.classList.add('correct')});if(choice===q.answer){quizScore++;btn.classList.add('correct');document.getElementById('quizFeedback').innerHTML=`<div class="quiz-feedback correct">✓ Correct.</div><div class="quiz-explain">${q.explain}</div>`}else{btn.classList.add('wrong');document.getElementById('quizFeedback').innerHTML=`<div class="quiz-feedback wrong">✗ Review this. Correct answer: <b>${q.answer}</b>.</div><div class="quiz-explain">${q.explain}</div>`}const next=document.createElement('button');next.className='quiz-next-btn';next.textContent=quizIdx===quizQuestions.length-1?'View Result →':'Next Question →';next.onclick=()=>quizIdx<quizQuestions.length-1?(quizIdx++,renderQuizQuestion()):showQuizResults();document.getElementById('quizFeedback').appendChild(next)}
function showQuizResults(){const pct=Math.round(quizScore/quizQuestions.length*100);const msg=pct>=90?'Excellent advanced mastery.':pct>=75?'Strong performance across the root families.':pct>=60?'Good progress. Keep strengthening contextual inference.':'Review the root families and retake the assessment.';document.getElementById('quizStage').innerHTML=`<div class="quiz-result-score">${quizScore}/${quizQuestions.length}</div><div class="quiz-result-msg">${pct}% — ${msg}</div><div class="quiz-result-breakdown"><div class="quiz-bd-row"><span>Greek & Latin Roots</span><span>${quizScore}/${quizQuestions.length}</span></div></div><button class="quiz-retry-btn" id="quizRetryBtn">Retry Assessment</button>`;document.getElementById('quizRetryBtn').onclick=startQuiz}
document.getElementById('assignBtn').addEventListener('click',openQuiz);document.getElementById('modalCloseBtn').addEventListener('click',closeQuiz);document.getElementById('assignModal').addEventListener('click',e=>{if(e.target.id==='assignModal')closeQuiz()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('assignModal').classList.contains('open'))closeQuiz()});

buildBookList();updateDisplay();
