<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100%;overflow:auto;font-family:'Outfit'}
body{background:var(--bg);padding:10px;color:#0f172a;min-height:100vh}
.container{min-height:100vh;height:auto;display:flex;flex-direction:column;gap:10px}

/* TOP - Book Selector */
.top-section{height:23vh;min-height:160px;background:var(--navy);border-radius:16px;padding:10px 16px;box-shadow:0 8px 24px rgba(3,105,161,.25);display:flex;flex-direction:column;border:1px solid var(--line)}
.top-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;flex-wrap:wrap;gap:6px}
.top-title{font-size:16px;font-weight:700;color:#fff;letter-spacing:.5px;display:flex;align-items:center;gap:8px}
.cefr-badge{background:#FCA311;color:#7a5c00;padding:4px 12px;border-radius:6px;font-size:12px;font-weight:800;letter-spacing:1px;border:1px solid var(--line)}
.include-badge{background:#14213D;color:#fff;padding:4px 14px;border-radius:8px;font-size:12px;font-weight:600;letter-spacing:.5px}
.header-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

.tab-bar{display:flex;gap:6px}
.tab-btn{background:rgba(255,255,255,.15);color:#fff;border:2px solid rgba(255,255,255,.5);padding:6px 16px;border-radius:8px;font-size:12px;font-weight:700;letter-spacing:.4px;cursor:pointer;transition:all .15s}
.tab-btn.active{background:#fff;color:#0b1526;border-color:#fff}

.filter-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.filter-label{color:rgba(255,255,255,.85);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px}
.level-chip{background:rgba(255,255,255,.15);color:#fff;border:2px solid rgba(255,255,255,.5);padding:3px 12px;border-radius:12px;font-size:11px;font-weight:700;cursor:pointer;transition:all .15s}
.level-chip.active{background:#FCA311;color:#7a5c00;border-color:#fff}

.book-list{display:flex;gap:8px;overflow-x:auto;overflow-y:visible;padding:8px 2px 10px;flex:1;align-items:center}
.mini-book{flex-shrink:0;width:108px;min-height:64px;border-radius:10px;cursor:pointer;background:#fff;border:1px solid #e2e8f0;border-top:3px solid var(--accent,#14213D);transition:transform .18s,box-shadow .18s;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#14213D;box-shadow:0 1px 3px rgba(16,24,40,.08);position:relative;user-select:none;padding:8px 6px;gap:3px}
.mini-book .b-emoji{font-size:20px;line-height:1}
.mini-book .b-name{font-size:11px;font-weight:700;text-align:center;line-height:1.2;letter-spacing:.3px;color:#14213D}
.mini-book .b-count{font-size:9px;background:#f1f3ff;color:#718096;padding:1px 6px;border-radius:6px;font-weight:600}
.mini-book:hover{transform:translateY(-3px);box-shadow:0 6px 18px rgba(0,0,0,.22)}
.mini-book.active{transform:translateY(-5px) scale(1.05);box-shadow:0 0 0 2px #fff,0 0 0 4px #14213D,0 8px 20px rgba(0,0,0,.3);z-index:2}
.mini-book.active::after{content:'✓';position:absolute;top:-7px;right:-7px;background:#14213D;color:#fff;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;border:1px solid var(--line)}
.mini-book.empty{opacity:.35;cursor:not-allowed}

/* BOTTOM */
.bottom-section{height:auto;min-height:calc(77vh - 10px);display:grid;grid-template-columns:42% 58%;gap:10px;min-height:0}
.bottom-section.quiz-mode{grid-template-columns:1fr}

/* LEFT - Flip card */
.card-display{background:#fff;border-radius:16px;padding:16px;box-shadow:0 8px 24px rgba(0,0,0,.1);display:flex;flex-direction:column;align-items:center;justify-content:space-between;perspective:1500px;position:relative;border:2px solid #e6ebf3}
.book-title{background:var(--navy);color:#fff;padding:6px 16px;border-radius:8px;font-size:13px;font-weight:700;letter-spacing:.5px;border:1px solid var(--line);box-shadow:0 4px 10px rgba(3,105,161,.3)}
.pronounce-btn{position:absolute;top:14px;right:14px;background:#14213D;border:1px solid var(--line);color:#fff;width:40px;height:40px;border-radius:50%;cursor:pointer;font-size:16px;box-shadow:0 4px 10px rgba(16,185,129,.4);z-index:10;transition:transform .15s}
.pronounce-btn:hover{transform:scale(1.08)}
.level-pill{position:absolute;top:14px;left:14px;padding:4px 10px;border-radius:6px;font-size:10px;font-weight:800;letter-spacing:.5px;z-index:10;border:1px solid var(--line)}
.level-pill.B1{background:#38bdf8;color:#0b1526}
.level-pill.B2{background:#fb923c;color:#431407}
.level-pill.C1{background:#f43f5e;color:#4c0519}
.flip-card{width:90%;height:60%;position:relative;cursor:pointer;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.4,0,.2,1)}
.flip-card.flipped{transform:rotateY(180deg)}
.flip-face{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-direction:column;box-shadow:0 10px 25px rgba(0,0,0,.15);overflow:hidden;padding:16px;gap:10px}
.flip-front{background:var(--navy);color:#fff;border:none}
.flip-back{background:#fff;color:#0f172a;transform:rotateY(180deg);border:2px solid #14213D}

.big-emoji{font-size:clamp(36px,5vw,60px);filter:drop-shadow(2px 2px 0 rgba(0,0,0,.2))}
.word-display{font-size:clamp(26px,4vw,44px);font-weight:700;text-align:center;letter-spacing:.5px;line-height:1.1}
.word-pron{font-size:clamp(12px,1.3vw,16px);color:rgba(255,255,255,.85);font-style:italic;letter-spacing:.5px}
.word-pos-front{display:inline-block;background:rgba(255,255,255,.2);padding:3px 12px;border-radius:6px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:1px;border:1px solid rgba(255,255,255,.3)}

.back-label{font-size:11px;font-weight:700;color:#14213D;text-transform:uppercase;letter-spacing:2px}
.back-meaning{font-size:clamp(14px,1.6vw,19px);font-weight:500;text-align:center;line-height:1.4;color:#1e293b;padding:0 12px}
.back-example{font-size:clamp(11px,1.2vw,14px);color:#475569;font-style:italic;text-align:center;line-height:1.5;padding:0 12px;border-top:1px solid var(--line);padding-top:10px;margin-top:6px}

.word-nav{display:flex;align-items:center;gap:10px;background:#f1f3ff;padding:6px 14px;border-radius:10px;border:2px solid #dde2f3}
.nav-btn{background:#fff;border:2px solid #14213D;color:#14213D;width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:18px;font-weight:700;transition:all .15s}
.nav-btn:hover{background:#14213D;color:#fff}
.nav-btn:disabled{opacity:.3;cursor:not-allowed}
.word-counter{font-size:13px;font-weight:700;color:#14213D;min-width:64px;text-align:center}

/* RIGHT - Details panel */
.details-panel{background:#fff;border-radius:16px;padding:18px 22px;overflow-y:auto;box-shadow:0 8px 24px rgba(0,0,0,.1);border:2px solid #e2e8f0}
.details-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;padding-bottom:10px;border-bottom:2px solid #e6ebf3;flex-wrap:wrap;gap:6px}
.details-word-wrap{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.details-word{font-size:26px;font-weight:700;color:#0b1526;letter-spacing:.3px}
.details-pron{font-size:14px;color:#64748b;font-style:italic;font-weight:500}
.pos-badge{background:var(--navy);color:#fff;padding:4px 12px;border-radius:6px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px}
.register-badge{padding:3px 10px;border-radius:6px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-left:6px}

.detail-section{margin-bottom:14px}
.detail-label{display:flex;align-items:center;gap:6px;font-weight:700;color:#14213D;font-size:11px;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:6px}
.def-box{font-size:14px;color:#1e293b;line-height:1.6;background:#f1f3ff;padding:10px 14px;border-radius:8px;border-left:4px solid #14213D}
.example-item{background:#fff9ef;padding:10px 14px;border-left:4px solid #FCA311;margin-bottom:6px;border-radius:8px;font-size:13px;color:#7a5c00;line-height:1.6;font-style:italic}
.example-item::before{content:'"';font-size:22px;color:#14213D;font-weight:700;margin-right:4px}
.collocation-list{display:flex;flex-wrap:wrap;gap:5px}
.colloc{background:var(--gold-soft);color:#7a5c00;padding:5px 12px;border-radius:14px;font-size:12px;font-weight:600;border:1px solid #FCA311}
.tag-list{display:flex;flex-wrap:wrap;gap:5px}
.tag{padding:5px 12px;border-radius:14px;font-size:12px;font-weight:600;color:#fff;cursor:pointer;background:var(--navy);transition:transform .15s}
.tag:hover{transform:translateY(-1px)}
.tag.active{background:var(--navy)}
.syn-list{display:flex;flex-wrap:wrap;gap:5px}
.syn{background:var(--bg-soft);color:#14213D;padding:4px 12px;border-radius:14px;font-size:13px;font-weight:600;border:1px solid #dde2f3}

/* QUIZ */
.quiz-panel{background:#fff;border-radius:16px;padding:20px 24px;box-shadow:0 8px 24px rgba(0,0,0,.1);height:auto;min-height:100%;max-height:calc(100vh - 210px);overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column}
.quiz-setup{max-width:640px;margin:0 auto;width:100%}
.quiz-setup h2{font-size:20px;color:#0b1526;margin-bottom:4px}
.quiz-setup p.sub{font-size:13px;color:#64748b;margin-bottom:18px}
.setup-group{margin-bottom:18px}
.setup-group-label{font-size:11px;font-weight:800;color:#14213D;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:8px}
.chip-row{display:flex;flex-wrap:wrap;gap:8px}
.setup-chip{background:#f1f3ff;border:2px solid #dde2f3;color:#14213D;padding:8px 16px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;transition:all .15s}
.setup-chip.active{background:var(--navy);color:#fff;border-color:#14213D}
.start-btn{margin-top:8px;width:100%;background:var(--navy);color:#fff;border:none;padding:14px;border-radius:12px;font-size:15px;font-weight:800;letter-spacing:.5px;cursor:pointer;box-shadow:0 6px 16px rgba(16,185,129,.35);transition:transform .15s}
.start-btn:hover{transform:translateY(-2px)}
.start-btn:disabled{opacity:.4;cursor:not-allowed;transform:none}

.quiz-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.quiz-progress-wrap{flex:1;height:8px;background:#e6ebf3;border-radius:6px;overflow:hidden}
.quiz-progress-bar{height:100%;background:var(--navy);transition:width .3s}
.quiz-score{font-size:13px;font-weight:800;color:#14213D;white-space:nowrap}
.quiz-exit{background:none;border:none;color:#94a3b8;cursor:pointer;font-size:13px;font-weight:700}

.quiz-question-box{max-width:680px;margin:0 auto;width:100%;flex:1;display:flex;flex-direction:column;justify-content:center}
.q-topic-tag{display:inline-block;background:#f1f3ff;color:#14213D;padding:3px 10px;border-radius:6px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;align-self:flex-start}
.q-prompt{font-size:19px;font-weight:700;color:#0f172a;line-height:1.5;margin-bottom:20px}
.q-prompt .blank{display:inline-block;min-width:70px;border-bottom:3px solid #14213D;color:#14213D}
.q-options{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.q-option{text-align:left;background:#f8fafc;border:2px solid #e2e8f0;padding:13px 16px;border-radius:10px;font-size:14px;font-weight:600;color:#1e293b;cursor:pointer;transition:all .15s}
.q-option:hover{border-color:#14213D;background:#f1f3ff}
.q-option.correct{background:#dcfce7;border-color:#16a34a;color:#14532d}
.q-option.incorrect{background:#fee2e2;border-color:#dc2626;color:#7f1d1d}
.q-option.disabled{pointer-events:none}
.q-type-input{width:100%;padding:14px 16px;border:2px solid #dde2f3;border-radius:10px;font-size:16px;font-weight:600;color:#0f172a;margin-bottom:14px;outline:none}
.q-type-input:focus{border-color:#14213D}
.q-type-input.correct{border-color:#16a34a;background:#dcfce7}
.q-type-input.incorrect{border-color:#dc2626;background:#fee2e2}
.q-feedback{padding:12px 16px;border-radius:10px;font-size:13px;line-height:1.6;margin-bottom:14px}
.q-feedback.correct{background:#dcfce7;color:#14532d;border-left:4px solid #16a34a}
.q-feedback.incorrect{background:#fee2e2;color:#7f1d1d;border-left:4px solid #dc2626}
.q-actions{display:flex;gap:10px;justify-content:flex-end}
.q-btn{padding:11px 22px;border-radius:10px;font-size:13px;font-weight:800;cursor:pointer;border:none}
.q-btn.primary{background:var(--navy);color:#fff}
.q-btn.secondary{background:#f1f3ff;color:#14213D;border:2px solid #dde2f3}
.q-btn:disabled{opacity:.4;cursor:not-allowed}

.results-box{max-width:640px;margin:0 auto;width:100%}
.results-score{text-align:center;margin-bottom:8px}
.results-score .big-num{font-size:48px;font-weight:800;color:#14213D}
.results-score .of{font-size:16px;color:#64748b;font-weight:600}
.results-grade{text-align:center;font-size:15px;font-weight:700;color:#0b1526;margin-bottom:20px}
.review-list{display:flex;flex-direction:column;gap:8px;margin-bottom:20px;max-height:280px;overflow-y:auto}
.review-item{padding:10px 14px;border-radius:10px;font-size:12.5px;line-height:1.5;border-left:4px solid #16a34a;background:#f8fafc}
.review-item.wrong{border-left-color:#dc2626}
.review-item .rw{font-weight:800;color:#0f172a}
.review-item .ra{color:#64748b}
.results-actions{display:flex;gap:10px}
.results-actions .q-btn{flex:1}

::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:#f1f3ff;border-radius:10px}
::-webkit-scrollbar-thumb{background:var(--navy);border-radius:10px}
.bottom-section.quiz-mode{height:calc(100vh - 23vh - 30px);min-height:520px}.bottom-section.quiz-mode #quizView{min-height:0}.bottom-section.quiz-mode .quiz-panel{height:100%;min-height:0;max-height:none}
@media(max-width:900px){.bottom-section{grid-template-columns:1fr;grid-template-rows:1fr 1fr}.bottom-section.quiz-mode{grid-template-rows:1fr}}

.learning-path{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;width:100%;margin-top:2px}
.learning-step{font-size:10px;font-weight:800;color:#14213D;background:#f1f3ff;border:1px solid #dde2f3;border-radius:10px;padding:4px 9px}
.assess-cta{background:var(--gold);color:#7a5c00;border:1px solid var(--line);padding:6px 12px;border-radius:8px;font-size:12px;font-weight:800;cursor:pointer;box-shadow:0 4px 10px rgba(245,158,11,.25)}
.assess-cta:hover{transform:translateY(-1px)}
.assessment-note{background:#ecfeff;border:1px solid #a5f3fc;color:#155e75;padding:10px 12px;border-radius:10px;font-size:12px;line-height:1.5;margin-bottom:14px}

// ============== SHARED STATE ==============
let selectedLevels = new Set(['B1','B2','C1']);
let bookIdx=0, wordIdx=0;

function currentWords(bi){ return books[bi].w.filter(w=>selectedLevels.has(w[7])); }

function updateHeaderCounts(){
  const totalWords = books.reduce((s,b)=>s+b.w.filter(w=>selectedLevels.has(w[7])).length,0);
  document.getElementById('includeBadge').textContent = `${books.length} Topics · ${totalWords} Words`;
}

// ============== FLASHCARD VIEW ==============
function buildBookList(){
  const L=document.getElementById('bookList');L.innerHTML='';
  books.forEach((b,i)=>{
    const words=currentWords(i);
    const c=document.createElement('div');
    c.className='mini-book'+(i===bookIdx?' active':'')+(words.length===0?' empty':'');
    c.style.setProperty('--accent',b.c[0]);
    c.innerHTML=`<div class="b-emoji">${b.em}</div><div class="b-name">${b.name}</div><div class="b-count">${words.length} words</div>`;
    if(words.length>0) c.onclick=()=>selectBook(i);
    L.appendChild(c);
  });
  updateHeaderCounts();
}
function selectBook(i){
  if(currentWords(i).length===0) return;
  bookIdx=i;wordIdx=0;
  document.querySelectorAll('.mini-book').forEach((c,x)=>c.classList.toggle('active',x===i));
  document.getElementById('flipCard').classList.remove('flipped');
  updateDisplay();
  const a=document.querySelectorAll('.mini-book')[i];if(a)a.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
}
function selectWord(j){wordIdx=j;document.getElementById('flipCard').classList.remove('flipped');updateDisplay()}

const LEVEL_COLORS={B1:'#38bdf8',B2:'#fb923c',C1:'#f43f5e'};

function updateDisplay(){
  const b=books[bookIdx], words=currentWords(bookIdx);
  if(words.length===0){ return; }
  if(wordIdx>=words.length) wordIdx=0;
  const w=words[wordIdx],[word,pron,pos,def,ex,syns,collocs,level]=w;
  document.getElementById('bookTitle').textContent=b.name;
  document.getElementById('bigEmoji').textContent=b.em;
  document.getElementById('wordDisplay').textContent=word;
  document.getElementById('wordPron').textContent=pron;
  document.getElementById('wordPos').textContent=pos;
  document.getElementById('backMeaning').textContent=def;
  document.getElementById('backExample').textContent=`"${ex}"`;
  document.getElementById('wordCounter').textContent=`${wordIdx+1} / ${words.length}`;
  document.getElementById('prevBtn').disabled=wordIdx===0;
  document.getElementById('nextBtn').disabled=wordIdx===words.length-1;
  document.getElementById('detailsWord').textContent=word;
  document.getElementById('detailsPron').textContent=pron;
  document.getElementById('posBadge').textContent=pos;
  document.getElementById('defBox').textContent=def;
  document.getElementById('exampleBox').innerHTML=`<div class="example-item">${ex}</div>`;
  document.getElementById('collocBox').innerHTML=collocs.map(c=>`<div class="colloc">${c}</div>`).join('');
  document.getElementById('synBox').innerHTML=syns.map(s=>`<div class="syn">${s}</div>`).join('');
  document.getElementById('familyDisplay').innerHTML=words.map((o,x)=>`<div class="tag${x===wordIdx?' active':''}" onclick="selectWord(${x})">${o[0]}</div>`).join('');
  const pill=document.getElementById('levelPill');pill.textContent=level;pill.className='level-pill '+level;
  const reg=document.getElementById('regBadge');reg.textContent=level;reg.style.background='var(--gold-soft)';reg.style.color='var(--gold-ink)';
}
document.getElementById('flipCard').addEventListener('click',function(){this.classList.toggle('flipped')});
document.getElementById('pronounceBtn').addEventListener('click',e=>{e.stopPropagation();const words=currentWords(bookIdx);const u=new SpeechSynthesisUtterance(words[wordIdx][0]);u.rate=.9;speechSynthesis.speak(u)});
document.getElementById('prevBtn').addEventListener('click',e=>{e.stopPropagation();if(wordIdx>0)selectWord(wordIdx-1)});
document.getElementById('nextBtn').addEventListener('click',e=>{e.stopPropagation();const words=currentWords(bookIdx);if(wordIdx<words.length-1)selectWord(wordIdx+1)});
document.addEventListener('keydown',e=>{
  if(document.getElementById('quizView').style.display!=='none') return;
  const words=currentWords(bookIdx);
  if(e.key==='ArrowLeft'&&wordIdx>0)selectWord(wordIdx-1);
  if(e.key==='ArrowRight'&&wordIdx<words.length-1)selectWord(wordIdx+1);
  if(e.key===' '){e.preventDefault();document.getElementById('flipCard').classList.toggle('flipped')}
});

document.querySelectorAll('.level-chip').forEach(chip=>{
  chip.addEventListener('click',()=>{
    const lvl=chip.dataset.lvl;
    if(selectedLevels.has(lvl)){
      if(selectedLevels.size>1) selectedLevels.delete(lvl); else return; // keep at least one level active
    } else selectedLevels.add(lvl);
    chip.classList.toggle('active',selectedLevels.has(lvl));
    if(currentWords(bookIdx).length===0){
      const firstOk=books.findIndex((b,i)=>currentWords(i).length>0);
      bookIdx = firstOk===-1?0:firstOk;
      wordIdx=0;
    }
    buildBookList();
    updateDisplay();
  });
});

// ============== TABS ==============
document.getElementById('tabFlash').addEventListener('click',()=>switchTab('flash'));
document.getElementById('tabQuiz').addEventListener('click',()=>switchTab('quiz'));

function switchTab(tab){
  document.getElementById('tabFlash').classList.toggle('active',tab==='flash');
  document.getElementById('tabQuiz').classList.toggle('active',tab==='quiz');
  const quizView=document.getElementById('quizView');
  document.getElementById('flashView').style.display = tab==='flash' ? 'contents' : 'none';
  quizView.style.display = tab==='quiz' ? 'block' : 'none';
  // Keep the assessment setup inside the normal page.
  // Full-screen mode is activated only after Start Assessment.
  quizView.classList.remove('assess-fullscreen');
  quizView.classList.toggle('assessment-started', tab==='quiz' && quizState.started);
  document.body.classList.toggle('assessment-active', tab==='quiz' && quizState.started);
  document.getElementById('bottomSection').classList.toggle('quiz-mode', tab==='quiz');
  document.getElementById('filterRow').style.visibility = 'hidden';
  document.getElementById('bookList').style.visibility = tab==='flash' ? 'visible' : 'hidden';
  if(tab==='quiz' && !quizState.started) renderQuizSetup();
}

// ============== ASSESSMENT / QUIZ ENGINE ==============
let quizState = {
  started:false, questions:[], idx:0, score:0, answers:[],
  settings:{topic:'All Topics', levels:new Set(['B1','B2','C1']), mode:'mixed', count:10}
};

function allWordsFlat(){
  const out=[];
  books.forEach(b=>b.w.forEach(w=>out.push({
    book:b.name, word:w[0], ipa:w[1], pos:w[2], def:w[3],
    ex:w[4], syns:w[5], collocs:w[6], level:w[7]
  })));
  return out;
}

function shuffle(arr){ return [...arr].sort(()=>Math.random()-0.5); }

function pickDistractors(pool,item,n=3){
  return shuffle(pool.filter(x=>x.word!==item.word)).slice(0,n);
}

function buildQuestion(item,pool,mode){
  const span = item.ex.match(new RegExp('\\b'+item.word.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','i'));

  let kind = mode;
  if(mode==='mixed') kind = Math.random()<0.5 ? 'mcq' : 'type';

  if(kind==='type'){
    let sentence = item.ex;
    if(span) sentence = sentence.replace(span[0], '_____');
    return {
      kind:'type', book:item.book,
      prompt:'Type the vocabulary word that best completes the sentence:',
      sentence, answer:item.word, def:item.def, word:item.word
    };
  }

  const distractors = pickDistractors(pool,item,3).map(d=>d.word);
  const options = shuffle([item.word,...distractors]);

  if(span && Math.random()<0.5){
    return {
      kind:'mcq', book:item.book,
      prompt:'Choose the word that best completes the sentence:',
      sentence:item.ex.replace(span[0], '_____'),
      options, answer:item.word, def:item.def, word:item.word
    };
  }

  return {
    kind:'mcq', book:item.book,
    prompt:'Which word matches this definition?',
    sentence:`"${item.def}"`,
    options, answer:item.word, def:item.def, word:item.word
  };
}

function renderQuizSetup(){
  const panel=document.getElementById('quizPanel');
  const s=quizState.settings;

  if(!s.topic) s.topic='All Topics';
  if(!s.levels || !(s.levels instanceof Set)) s.levels=new Set(['B1','B2','C1']);
  if(!s.mode) s.mode='mixed';
  if(!s.count) s.count=10;

  const topicOptions=['All Topics',...books.map(b=>b.name)];

  panel.innerHTML=`
    <div class="quiz-setup">
      <h2>Vocabulary Assessment</h2>
      <p class="sub">Test your vocabulary with multiple-choice and typed sentence questions from B1 to C1.</p>
      <div class="assessment-note">
        <strong>How it works:</strong> Select your topic, level, question type and number of questions,
        then click <strong>Start Assessment</strong> below.
      </div>

      <div class="setup-group">
        <div class="setup-group-label">Topic</div>
        <div class="chip-row" id="setupTopics">
          ${topicOptions.map(t=>`<div class="setup-chip${t===s.topic?' active':''}" data-topic="${t}">${t}</div>`).join('')}
        </div>
      </div>

      <div class="setup-group">
        <div class="setup-group-label">Level</div>
        <div class="chip-row" id="setupLevels">
          ${['B1','B2','C1'].map(l=>`<div class="setup-chip${s.levels.has(l)?' active':''}" data-lvl="${l}">${l}</div>`).join('')}
        </div>
      </div>

      <div class="setup-group">
        <div class="setup-group-label">Question Type</div>
        <div class="chip-row" id="setupMode">
          ${[['mcq','Choose the Correct Answer'],['type','Type the Answer'],['mixed','Mixed (Both)']].map(([v,l])=>`<div class="setup-chip${s.mode===v?' active':''}" data-mode="${v}">${l}</div>`).join('')}
        </div>
      </div>

      <div class="setup-group">
        <div class="setup-group-label">Number of Questions</div>
        <div class="chip-row" id="setupCount">
          ${[5,10,15,20].map(n=>`<div class="setup-chip${s.count===n?' active':''}" data-count="${n}">${n}</div>`).join('')}
        </div>
      </div>

      <button type="button" class="start-btn" id="startQuizBtn">▶ Start Assessment</button>
    </div>`;

  panel.querySelectorAll('#setupTopics .setup-chip').forEach(c=>{
    c.onclick=()=>{s.topic=c.dataset.topic;renderQuizSetup();}
  });

  panel.querySelectorAll('#setupLevels .setup-chip').forEach(c=>{
    c.onclick=()=>{
      const l=c.dataset.lvl;
      if(s.levels.has(l)){
        if(s.levels.size>1) s.levels.delete(l);
      }else{
        s.levels.add(l);
      }
      renderQuizSetup();
    }
  });

  panel.querySelectorAll('#setupMode .setup-chip').forEach(c=>{
    c.onclick=()=>{s.mode=c.dataset.mode;renderQuizSetup();}
  });

  panel.querySelectorAll('#setupCount .setup-chip').forEach(c=>{
    c.onclick=()=>{s.count=parseInt(c.dataset.count,10);renderQuizSetup();}
  });

  const startBtn=document.getElementById('startQuizBtn');
  if(startBtn){
    startBtn.onclick=(e)=>{
      e.preventDefault();
      e.stopPropagation();
      startQuiz();
    };
  }
}

function startQuiz(){
  const s=quizState.settings;
  const selectedLevels = s.levels && s.levels.size ? s.levels : new Set(['B1','B2','C1']);

  let pool=allWordsFlat().filter(w=>selectedLevels.has(w.level));
  if(s.topic!=='All Topics') pool=pool.filter(w=>w.book===s.topic);

  // If a narrow topic/level selection has fewer than the requested number,
  // use every available word in that selection rather than showing an error.
  if(pool.length===0){
    pool=allWordsFlat().filter(w=>selectedLevels.has(w.level));
  }
  if(pool.length===0){
    pool=allWordsFlat();
  }

  const count=Math.min(Math.max(parseInt(s.count,10)||10,1),pool.length);
  const chosen=shuffle(pool).slice(0,count);
  const distractorPool=pool.length>=4 ? pool : allWordsFlat();

  quizState={
    started:true,
    questions:chosen.map(item=>buildQuestion(item,distractorPool,s.mode)),
    idx:0,
    score:0,
    answers:[],
    settings:{
      topic:s.topic,
      levels:new Set(selectedLevels),
      mode:s.mode,
      count:count
    }
  };

  // Once the assessment actually starts, take over the entire viewport.
  document.getElementById('quizView').classList.add('assess-fullscreen');
  document.getElementById('quizView').classList.add('assessment-started');
  document.body.classList.add('assessment-active');
  renderQuestion();
}

function renderQuestion(){
  const panel=document.getElementById('quizPanel');
  const total=quizState.questions.length;
  const q=quizState.questions[quizState.idx];
  const pct=Math.round((quizState.idx/total)*100);

  panel.innerHTML=`
    <div class="quiz-top">
      <button type="button" class="quiz-exit" id="quizExitBtn">✕ Exit</button>
      <div class="quiz-progress-wrap"><div class="quiz-progress-bar" style="width:${pct}%"></div></div>
      <div class="quiz-score">${quizState.score} / ${quizState.idx} correct</div>
    </div>
    <div class="quiz-question-box" id="qBox">
      <div class="q-topic-tag">${q.book} · Question ${quizState.idx+1} of ${total}</div>
      <div class="q-prompt">${q.prompt}<br>
        <span style="font-weight:500;font-size:16px;color:#334155">
          ${q.sentence.replace('_____','<span class="blank">_____</span>')}
        </span>
      </div>
      <div id="qBody"></div>
    </div>`;

  document.getElementById('quizExitBtn').onclick=()=>{
    if(confirm('Exit this assessment? Your progress will be lost.')){
      quizState.started=false;
      document.body.classList.remove('assessment-active');
      document.getElementById('quizView').classList.remove('assess-fullscreen','assessment-started');
      switchTab('flash');
      renderQuizSetup();
    }
  };

  const body=document.getElementById('qBody');

  if(q.kind==='mcq'){
    body.innerHTML=`
      <div class="q-options">
        ${q.options.map(o=>`<button type="button" class="q-option" data-opt="${o}">${o}</button>`).join('')}
      </div>
      <div id="qFeedback"></div>
      <div class="q-actions">
        <button type="button" class="q-btn primary" id="qNextBtn" disabled>Next</button>
      </div>`;

    body.querySelectorAll('.q-option').forEach(btn=>{
      btn.onclick=()=>{
        if(btn.disabled) return;
        const given=btn.dataset.opt;
        const correct=given.toLowerCase()===q.answer.toLowerCase();

        quizState.answers.push({q,given,correct});
        if(correct) quizState.score++;

        body.querySelectorAll('.q-option').forEach(b=>b.disabled=true);
        btn.classList.add(correct?'correct':'incorrect');

        if(!correct){
          body.querySelectorAll('.q-option').forEach(b=>{
            if(b.dataset.opt.toLowerCase()===q.answer.toLowerCase()) b.classList.add('correct');
          });
        }

        document.getElementById('qFeedback').innerHTML=
          `<div class="q-feedback ${correct?'correct':'incorrect'}">
            ${correct?'Correct!':'Not quite. The correct answer is "'+q.answer+'".'} ${q.def}
          </div>`;

        document.getElementById('qNextBtn').disabled=false;
      };
    });
  }else{
    body.innerHTML=`
      <div class="type-answer-wrap">
        <input id="typeAnswer" class="type-answer" autocomplete="off" placeholder="Type your answer here">
        <div id="qFeedback"></div>
        <div class="q-actions">
          <button type="button" class="q-btn primary" id="qCheckBtn">Check Answer</button>
          <button type="button" class="q-btn primary" id="qNextBtn" disabled>Next</button>
        </div>
      </div>`;

    const inp=document.getElementById('typeAnswer');

    function normalize(v){
      return v.trim().toLowerCase().replace(/[.,!?;:]/g,'').replace(/\s+/g,' ');
    }

    function check(){
      if(document.getElementById('qCheckBtn').disabled) return;
      const given=inp.value.trim();
      const correct=normalize(given)===normalize(q.answer);

      quizState.answers.push({q,given,correct});
      if(correct) quizState.score++;

      inp.disabled=true;
      document.getElementById('qCheckBtn').disabled=true;
      document.getElementById('qNextBtn').disabled=false;

      document.getElementById('qFeedback').innerHTML=
        `<div class="q-feedback ${correct?'correct':'incorrect'}">
          ${correct?'Correct!':'The correct answer is "'+q.answer+'".'} ${q.def}
        </div>`;
    }

    document.getElementById('qCheckBtn').onclick=check;
    inp.addEventListener('keydown',e=>{
      if(e.key==='Enter'){
        e.preventDefault();
        check();
      }
    });
    inp.focus();
  }

  document.getElementById('qNextBtn').onclick=()=>{
    if(quizState.idx<total-1){
      quizState.idx++;
      renderQuestion();
    }else{
      renderResults();
    }
  };
}

function renderResults(){
  const panel=document.getElementById('quizPanel');
  const total=quizState.questions.length;
  const score=quizState.score;
  const pct=Math.round((score/total)*100);

  let grade='Keep practicing — review the words below and try again.';
  if(pct>=90) grade='Outstanding! You have a strong command of these words.';
  else if(pct>=75) grade='Great work! You are close to mastering this set.';
  else if(pct>=50) grade='Good progress — a bit more review will help.';

  panel.innerHTML=`
    <div class="results-box">
      <div class="results-score"><span class="big-num">${score}</span><span class="of"> / ${total}</span></div>
      <div style="text-align:center;font-size:13px;color:#64748b;margin-bottom:6px">
        ${pct}% correct · ${quizState.settings.topic} · ${Array.from(quizState.settings.levels).join(' / ')}
      </div>
      <div class="results-grade">${grade}</div>
      <div class="assessment-note">
        <strong>How to improve:</strong> Review every wrong answer, say the correct word aloud,
        and create one new sentence using the vocabulary.
      </div>
      <div class="review-list">
        ${quizState.answers.map(a=>`
          <div class="review-item ${a.correct?'':'wrong'}">
            <span class="rw">${a.q.word}</span> —
            ${a.correct?'✓ correct':'✗ you answered "'+(a.given||'(blank)')+'"'}
            <br><span class="ra">${a.q.def}</span>
          </div>`).join('')}
      </div>
      <div class="results-actions">
        <button type="button" class="q-btn secondary" id="retryBtn">Try Again</button>
        <button type="button" class="q-btn primary" id="newQuizBtn">New Assessment</button>
      </div>
    </div>`;

  document.getElementById('retryBtn').onclick=()=>startQuiz();
  document.getElementById('newQuizBtn').onclick=()=>{
    quizState.started=false;
    document.body.classList.remove('assessment-active');
    document.getElementById('quizView').classList.remove('assess-fullscreen','assessment-started');
    renderQuizSetup();
  };
}

buildBookList();updateDisplay();
</script></body></html>
