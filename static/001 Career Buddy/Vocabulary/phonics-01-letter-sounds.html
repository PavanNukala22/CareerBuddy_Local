<!DOCTYPE html>
<html lang="en">

<head><script src="/static/js/content-protection.js?v=2" data-cb-protect></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Level 1 — Letter Sounds & First Words</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap');

    :root {
      --navy: #14213D;
      --navy-2: #0b1526;
      --gold: #FCA311;
      --gold-soft: #fdeecb;
      --gold-ink: #7a5c00;
      --bg: #f9f9ff;
      --bg-soft: #f1f3ff;
      --ink: #161c27;
      --body: #4a5568;
      --muted: #718096;
      --line: #e2e8f0;
      --line-2: #dde2f3;
      --teal-50: #e6ebf3;
      --success: #38a169;
      --success-bg: #e9f7ef;
      --danger: #e53e3e;
      --danger-bg: #fdecec;
      --radius: 8px;
      --radius-lg: 14px;
      --shadow-sm: 0 1px 2px rgba(16, 24, 40, .04), 0 1px 3px rgba(16, 24, 40, .06);
      --shadow: 0 8px 24px -12px rgba(16, 24, 40, .18);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    html,
    body {
      min-height: 100%;
      font-family: 'Outfit', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif
    }

    body {
      background: var(--bg);
      color: var(--ink);
      padding: 14px;
      -webkit-font-smoothing: antialiased
    }

    .container {
      min-height: calc(100vh - 24px);
      display: flex;
      flex-direction: column;
      gap: 12px
    }

    .top-section {
      flex: 0 0 auto;
      background: #fff;
      border-radius: var(--radius-lg);
      padding: 12px 16px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      border: 1px solid var(--line)
    }

    .top-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      flex-wrap: wrap;
      gap: 10px
    }

    .top-title {
      font-size: 17px;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: -.01em;
      display: flex;
      align-items: center;
      gap: 9px
    }

    .level-badge {
      background: var(--gold-soft);
      color: var(--gold-ink);
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      border: 1px solid rgba(238, 188, 29, .4)
    }

    .include-badge {
      background: var(--bg-soft);
      color: var(--body);
      padding: 5px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      border: 1px solid var(--line)
    }

    .book-list {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      overflow-y: visible;
      padding: 8px 2px 10px;
      flex: 0 0 auto;
      align-items: stretch
    }

    .mini-book {
      flex-shrink: 0;
      width: 88px;
      border-radius: 10px;
      cursor: pointer;
      background: #fff;
      border: 1px solid var(--line);
      border-top: 3px solid var(--accent, var(--navy));
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--ink);
      box-shadow: var(--shadow-sm);
      position: relative;
      user-select: none;
      padding: 8px 4px;
      gap: 3px
    }

    .mini-book .b-emoji {
      font-size: 20px;
      line-height: 1
    }

    .mini-book .b-pattern {
      font-size: 17px;
      font-weight: 700;
      color: var(--navy)
    }

    .mini-book .b-count {
      font-size: 9px;
      background: var(--bg-soft);
      color: var(--muted);
      padding: 1px 7px;
      border-radius: 8px;
      font-weight: 600
    }

    .mini-book:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow)
    }

    .mini-book.active {
      border-color: var(--navy);
      box-shadow: 0 0 0 2px var(--navy);
      z-index: 2
    }

    .mini-book.active::after {
      content: '✓';
      position: absolute;
      top: -7px;
      right: -7px;
      background: var(--gold);
      color: var(--navy);
      width: 19px;
      height: 19px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 800;
      box-shadow: var(--shadow-sm)
    }

    .bottom-section {
      flex: 1;
      min-height: 440px;
      display: grid;
      grid-template-columns: 45% 55%;
      gap: 12px
    }

    .card-display {
      background: #fff;
      border-radius: var(--radius-lg);
      padding: 16px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      perspective: 1500px;
      position: relative;
      border: 1px solid var(--line)
    }

    .book-title {
      background: var(--navy);
      color: #fff;
      padding: 7px 16px;
      border-radius: var(--radius);
      font-size: 13.5px;
      font-weight: 700;
      text-align: center
    }

    .pronounce-btn {
      position: absolute;
      top: 14px;
      right: 14px;
      background: var(--navy);
      border: none;
      color: #fff;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 15px;
      box-shadow: var(--shadow-sm);
      transition: .15s;
      z-index: 10
    }

    .pronounce-btn:hover {
      background: var(--navy-2)
    }

    .flip-card {
      width: 90%;
      height: 65%;
      position: relative;
      cursor: pointer;
      transform-style: preserve-3d;
      transition: transform .7s cubic-bezier(.4, 0, .2, 1)
    }

    .flip-card.flipped {
      transform: rotateY(180deg)
    }

    .flip-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: var(--radius-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      box-shadow: var(--shadow);
      border: 1px solid var(--line);
      overflow: hidden;
      padding: 14px;
      gap: 10px
    }

    .flip-front {
      background: linear-gradient(150deg, var(--navy), var(--navy-2));
      color: #fff;
      border-color: transparent
    }

    .flip-back {
      background: #fff;
      color: var(--ink);
      transform: rotateY(180deg)
    }

    .big-emoji {
      font-size: clamp(50px, 7vw, 90px);
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, .25))
    }

    .word-display {
      font-size: clamp(40px, 6.5vw, 76px);
      font-weight: 800;
      text-align: center;
      letter-spacing: -.01em
    }

    .word-display .h1 {
      color: #fff
    }

    .word-display .h2 {
      color: var(--gold)
    }

    .phoneme-split {
      display: flex;
      gap: 12px;
      font-size: clamp(28px, 5vw, 52px);
      font-weight: 800;
      align-items: center
    }

    .phoneme-chunk {
      background: var(--bg-soft);
      color: var(--navy);
      padding: 6px 18px;
      border-radius: 10px;
      border: 1px solid var(--line-2)
    }

    .phoneme-chunk.h2 {
      background: var(--gold-soft);
      color: var(--gold-ink);
      border-color: rgba(238, 188, 29, .5)
    }

    .meaning-display {
      font-size: clamp(15px, 1.8vw, 20px);
      font-weight: 500;
      text-align: center;
      line-height: 1.45;
      color: var(--body);
      padding: 0 8px
    }

    .word-nav {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--bg-soft);
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid var(--line)
    }

    .nav-btn {
      background: #fff;
      border: 1px solid var(--line);
      color: var(--navy);
      width: 34px;
      height: 34px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 18px;
      font-weight: 700;
      transition: .15s;
      display: flex;
      align-items: center;
      justify-content: center
    }

    .nav-btn:hover:not(:disabled) {
      border-color: var(--navy);
      background: var(--teal-50)
    }

    .nav-btn:disabled {
      opacity: .35;
      cursor: not-allowed
    }

    .word-counter {
      font-size: 13px;
      font-weight: 700;
      color: var(--navy);
      min-width: 60px;
      text-align: center;
      font-variant-numeric: tabular-nums
    }

    .details-panel {
      background: #fff;
      border-radius: var(--radius-lg);
      padding: 18px 22px;
      overflow-y: auto;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--line)
    }

    .details-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line)
    }

    .details-word-wrap {
      display: flex;
      align-items: center;
      gap: 10px
    }

    .details-emoji {
      font-size: 32px
    }

    .details-word {
      font-size: 28px;
      font-weight: 800;
      color: var(--ink);
      letter-spacing: -.01em
    }

    .details-word .h1 {
      color: var(--ink)
    }

    .details-word .h2 {
      color: var(--gold)
    }

    .pos-badge {
      background: var(--gold-soft);
      color: var(--gold-ink);
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      border: 1px solid rgba(238, 188, 29, .4)
    }

    .detail-section {
      margin-bottom: 16px
    }

    .detail-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      color: var(--navy);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .08em;
      margin-bottom: 8px
    }

    .phonetic-box {
      background: var(--teal-50);
      border-left: 3px solid var(--navy);
      padding: 8px 14px;
      border-radius: var(--radius);
      font-style: italic;
      font-size: 16px;
      color: var(--navy);
      font-weight: 600
    }

    .phoneme-row {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap
    }

    .phoneme-pill {
      background: var(--bg-soft);
      color: var(--navy);
      padding: 5px 13px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 700;
      border: 1px solid var(--line-2)
    }

    .phoneme-pill.h2 {
      background: var(--gold-soft);
      color: var(--gold-ink);
      border-color: rgba(238, 188, 29, .5)
    }

    .phoneme-pill.full {
      background: var(--navy);
      color: #fff;
      border-color: transparent
    }

    .phoneme-plus {
      color: var(--muted);
      font-size: 16px;
      font-weight: 700
    }

    .meaning-box {
      font-size: 14px;
      color: var(--body);
      line-height: 1.55;
      background: var(--teal-50);
      padding: 10px 14px;
      border-radius: var(--radius);
      border-left: 3px solid var(--navy)
    }

    .example-item {
      background: var(--gold-soft);
      padding: 10px 14px;
      border-left: 3px solid var(--gold);
      margin-bottom: 6px;
      border-radius: var(--radius);
      font-size: 13px;
      color: var(--ink);
      line-height: 1.55;
      font-style: italic
    }

    .example-item::before {
      content: '"';
      font-size: 18px;
      color: var(--gold-ink);
      font-weight: 700;
      margin-right: 4px
    }

    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px
    }

    .tag {
      padding: 5px 11px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      color: var(--navy);
      border: 1px solid var(--line-2);
      cursor: pointer;
      background: var(--bg-soft);
      transition: .15s
    }

    .tag:hover {
      border-color: var(--navy)
    }

    .tag.active {
      background: var(--navy);
      color: #fff;
      border-color: transparent
    }

    ::-webkit-scrollbar {
      width: 8px;
      height: 8px
    }

    ::-webkit-scrollbar-track {
      background: var(--bg-soft);
      border-radius: 10px
    }

    ::-webkit-scrollbar-thumb {
      background: var(--line-2);
      border-radius: 10px
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--muted)
    }

    @media(max-width:900px) {
      .bottom-section {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr 1fr
      }
    }

    .b-tier {
      font-size: 8px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 8px;
      background: var(--bg-soft);
      color: var(--muted);
      letter-spacing: .3px;
      text-transform: uppercase
    }

    .assign-btn {
      background: var(--navy);
      color: #fff;
      padding: 7px 16px;
      border: none;
      border-radius: var(--radius);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: .15s
    }

    .assign-btn:hover {
      background: var(--navy-2)
    }

    /* ── View routing (Reader ⇄ Assignments) ── */
    .container {
      position: relative
    }

    .view {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
      opacity: 0;
      pointer-events: none;
      transform: translateX(24px) scale(.99);
      transition: opacity .32s ease, transform .32s cubic-bezier(.4, 0, .2, 1);
    }

    .view.active {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(0) scale(1);
      position: relative
    }

    .view.exit-left {
      transform: translateX(-24px) scale(.99)
    }

    /* ── Assignments view ── */
    .assignments-view {
      overflow-y: auto;
      padding-right: 2px
    }

    .assignments-header {
      flex: 0 0 auto;
      background: #fff;
      border-radius: var(--radius-lg);
      padding: 12px 16px;
      box-shadow: var(--shadow-sm);
      display: flex;
      align-items: center;
      gap: 14px;
      border: 1px solid var(--line);
      flex-wrap: wrap
    }

    .back-btn {
      background: var(--bg-soft);
      color: var(--navy);
      border: 1px solid var(--line);
      padding: 8px 16px;
      border-radius: var(--radius);
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      transition: .15s;
      font-family: inherit
    }

    .back-btn:hover {
      background: var(--line);
      border-color: var(--navy)
    }

    .assignments-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--ink);
      display: flex;
      align-items: center;
      gap: 8px
    }

    .assign-tabs {
      flex: 0 0 auto;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 2px
    }

    .assign-tab {
      flex: 1;
      min-width: 150px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      padding: 10px 14px;
      cursor: pointer;
      transition: .15s;
      text-align: left;
      font-family: inherit
    }

    .assign-tab:hover {
      border-color: var(--navy)
    }

    .assign-tab.active {
      border-color: var(--navy);
      box-shadow: 0 0 0 2px var(--navy);
      background: var(--bg-soft)
    }

    .assign-tab-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--ink)
    }

    .assign-tab-sub {
      font-size: 10.5px;
      color: var(--muted);
      margin-top: 2px
    }

    .assign-tab-progress {
      margin-top: 6px;
      height: 5px;
      background: var(--bg-soft);
      border-radius: 10px;
      overflow: hidden
    }

    .assign-tab-progress-bar {
      height: 100%;
      background: var(--gold);
      transition: width .3s
    }

    .assign-tab-count {
      font-size: 10px;
      font-weight: 700;
      color: var(--muted);
      margin-top: 4px
    }

    .assign-body {
      flex: 1;
      min-height: 0;
      background: #fff;
      border-radius: var(--radius-lg);
      padding: 18px 20px 26px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--line);
      overflow-y: auto
    }

    .assign-intro-title {
      font-size: 17px;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 4px
    }

    .assign-intro-text {
      font-size: 13px;
      color: var(--body);
      line-height: 1.55;
      margin-bottom: 16px
    }

    .quiz-progress-wrap {
      background: var(--bg-soft);
      border-radius: 20px;
      height: 8px;
      overflow: hidden;
      margin-bottom: 16px
    }

    .quiz-progress-bar {
      background: var(--navy);
      height: 100%;
      transition: width .3s
    }

    .q-single {
      padding-top: 2px
    }

    .quiz-meta-left {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--muted)
    }

    .q-card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
      flex-wrap: wrap
    }

    .q-num {
      background: var(--navy);
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      padding: 3px 10px;
      border-radius: 999px
    }

    .q-tier-tag {
      background: var(--teal-50);
      color: var(--navy);
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .3px
    }

    .quiz-meta {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 6px;
      margin-left: auto
    }

    .quiz-difficulty {
      padding: 3px 10px;
      border-radius: 999px;
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .3px
    }

    .diff-Beginner {
      background: var(--success)
    }

    .diff-Intermediate {
      background: var(--navy)
    }

    .diff-Advanced {
      background: var(--gold);
      color: var(--navy)
    }

    .quiz-type-tag {
      background: var(--gold-soft);
      color: var(--gold-ink);
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase
    }

    .quiz-q {
      font-size: 15px;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 12px;
      line-height: 1.4
    }

    .quiz-options {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 2px
    }

    .quiz-opt-btn {
      text-align: left;
      padding: 11px 14px;
      border-radius: var(--radius);
      border: 1px solid var(--line);
      background: #fff;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      color: var(--ink);
      cursor: pointer;
      transition: .15s
    }

    .quiz-opt-btn:hover:not(:disabled) {
      border-color: var(--navy);
      background: var(--bg-soft)
    }

    .quiz-opt-btn.correct {
      background: var(--success-bg);
      border-color: var(--success);
      color: #276749
    }

    .quiz-opt-btn.selected {
      border-color: var(--navy);
      background: var(--bg-soft);
      box-shadow: 0 0 0 2px rgba(20, 33, 61, .12)
    }

    .quiz-opt-btn.wrong {
      background: var(--danger-bg);
      border-color: var(--danger);
      color: #c53030
    }

    .quiz-opt-btn:disabled {
      cursor: default
    }

    .quiz-input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 12px
    }

    .quiz-input {
      flex: 1;
      padding: 11px 14px;
      border-radius: var(--radius);
      border: 1px solid var(--line);
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      color: var(--ink)
    }

    .quiz-input:focus {
      outline: none;
      border-color: var(--navy);
      box-shadow: 0 0 0 3px rgba(20, 33, 61, .1)
    }

    .quiz-check-btn {
      background: var(--navy);
      color: #fff;
      border: none;
      padding: 0 18px;
      border-radius: var(--radius);
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: .15s
    }

    .quiz-check-answer-btn {
      padding: 10px 20px;
      margin-top: 2px
    }

    .quiz-check-answer-btn:disabled {
      opacity: .4;
      cursor: not-allowed
    }

    .quiz-next-btn {
      background: var(--gold);
      color: var(--navy);
      border: none;
      padding: 10px 22px;
      border-radius: var(--radius);
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: .15s;
      margin-top: 4px
    }

    .quiz-next-btn:hover {
      background: #e0900c
    }

    .quiz-check-btn:hover {
      background: var(--navy-2)
    }

    .quiz-hint {
      font-size: 12px;
      color: var(--muted);
      font-style: italic;
      margin-bottom: 8px
    }

    function shuffleArr(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1));[a[i], a[j]] = [a[j], a[i]]; }

    // ── One single assignment, 12 questions at a time ──
    // The 39-question pool (Foundation + Blend + Digraph + Vowel Team) is cut
    // once into three 12-question decks with no question shared between them.
    // Every time "Assessment" is opened, or "New Attempt" is pressed after
    // finishing, the app moves to the next deck (1 → 2 → 3 → 1 → …) so three
    // attempts in a row never repeat a question, while the screen itself only
    // ever shows one single assignment — no picker, no tabs.
    const QUESTIONS_PER_ATTEMPT = 12;
    const NUM_DECKS = 3;
    let questionDecks = []; // built once per page load
    let deckIdx = 0;        // which deck the current/next attempt uses

    function buildQuestionDecks() {
      let all = [];
      Object.keys(questionPool).forEach(t => { all = all.concat(questionPool[t]); });
      all = shuffleArr(all);
      const decks = [];
      for (let i = 0; i < NUM_DECKS; i++) {
        decks.push(all.slice(i * QUESTIONS_PER_ATTEMPT, (i + 1) * QUESTIONS_PER_ATTEMPT));
      }
      return decks;
    }

      progress = currentQuestions.map(() => ({ status: 'pending', checked: false, correct: null, picked: null }));

      clearAutoReturn();

      clearAutoReturn();

      activeQIdx = 0;
      pendingPick = {};

      let msg = "Nice work — keep practicing!";
      if (pctScore >= 90) msg = "Outstanding! You've got these sounds down cold.";
      else if (pctScore >= 70) msg = "Great job! You're solidly through this material.";
      else if (pctScore >= 50) msg = "Good start! Review the books above, then try again.";
      else msg = "Keep exploring the books above — flip through a few, then try again!";
      document.getElementById('assignBody').innerHTML = `
    <div class="assign-intro-title">${assessment.title} — Complete!</div>
    <div class="assign-result-card">
      <div class="quiz-result-score">${score} / ${total}</div>

      const total = currentQuestions.length;

      const q = currentQuestions[i];

      const pct = Math.round(((i + (st.checked ? 1 : 0)) / total) * 100);

      if (!st.checked) {

          const picked = pendingPick[key];
          bodyHtml = `<div class="quiz-options">${q.options.map(o => `<button class="quiz-opt-btn${o === picked ? ' selected' : ''}" data-opt="${o}">${o}</button>`).join('')}</div>
        <button class="quiz-check-btn quiz-check-answer-btn" id="qCheckBtn"${picked ? '' : ' disabled'}>Check Answer</button>`;
        } else {
          const val = pendingPick[key] || '';
          bodyHtml = `<div class="quiz-hint">💡 Hint: ${q.hint}</div>
        <div class="quiz-input-row"><input type="text" class="quiz-input" id="qInput" placeholder="Type your answer..." autocomplete="off" value="${val}"></div>
        <button class="quiz-check-btn quiz-check-answer-btn" id="qCheckBtn">Check Answer</button>`;
        }
      } else {
        if (q.type === 'mcq') {
          bodyHtml = `<div class="quiz-options">${q.options.map(o => {
            let cls = 'quiz-opt-btn';
            if (o === q.answer) cls += ' correct'; else if (o === st.picked) cls += ' wrong';
            return `<button class="${cls}" disabled>${o}</button>`;
          }).join('')}</div>${feedbackHtml(st.correct, q.explain)}<button class="quiz-next-btn" id="qNextBtn">${i < total - 1 ? 'Next Question →' : 'Finish Assessment →'}</button>`;
        } else {
          bodyHtml = `<div class="quiz-hint">💡 Hint: ${q.hint}</div><div class="quiz-input-row"><input type="text" class="quiz-input" value="${st.picked || ''}" disabled></div>${feedbackHtml(st.correct, q.explain)}<button class="quiz-next-btn" id="qNextBtn">${i < total - 1 ? 'Next Question →' : 'Finish Assessment →'}</button>`;
        }
      }

      document.getElementById('assignBody').innerHTML = `
    <div class="assign-intro-title">${assessment.title}</div>
    <div class="quiz-progress-wrap"><div class="quiz-progress-bar" style="width:${pct}%"></div></div>
    <div class="q-single">
      <div class="q-card-head">
        <span class="quiz-meta-left"><span class="q-question-count">Question ${i + 1} of ${total}</span></span>
        <span class="quiz-meta"><span class="quiz-type-tag">${q.type === 'mcq' ? 'Choose Answer' : 'Type Answer'}</span></span>
      </div>
      <div class="quiz-q">${q.q}</div>
      <div id="qBody">${bodyHtml}</div>
    </div>`;

      if (!st.checked) {
        if (q.type === 'mcq') {
          document.querySelectorAll('.quiz-opt-btn').forEach(btn => btn.addEventListener('click', () => {
            pendingPick[key] = btn.getAttribute('data-opt');
            renderAssignBody();
          }));
          const checkBtn = document.getElementById('qCheckBtn');
          if (checkBtn) checkBtn.addEventListener('click', () => checkAnswer(i, q));
        } else {
          const input = document.getElementById('qInput');
          input.focus();
          input.addEventListener('input', e => { pendingPick[key] = e.target.value });
          input.addEventListener('keydown', e => { if (e.key === 'Enter') checkAnswer(i, q) });
          document.getElementById('qCheckBtn').addEventListener('click', () => checkAnswer(i, q));
        }
      } else {
        document.getElementById('qNextBtn').addEventListener('click', () => goToNextQuestion(i));
      }
    }

    function feedbackHtml(isCorrect, explain) {
      return `<div class="quiz-feedback ${isCorrect ? 'correct' : 'wrong'}">${isCorrect ? '✅ Correct!' : '❌ Not quite.'}</div>
    <div class="quiz-explain">${explain}</div>`;
    }

    function checkAnswer(i, q) {
      const p = progress[i];
      if (p.checked) return;
      const key = `q-${i}`;
      let val = pendingPick[key];
      if (q.type === 'fill') {
        val = (val || '').trim().toLowerCase();
        if (!val) return;
      } else {
        if (!val) return;
      }
      const isCorrect = q.type === 'mcq' ? (val === q.answer) : q.accept.includes(val);
      p.checked = true; p.correct = isCorrect; p.picked = val;
      renderAssignBody();
    }

    function goToNextQuestion(i) {
      progress[i].status = 'done';
      activeQIdx = i + 1;
      renderAssignBody();
    }


    document.getElementById('assignBtn').addEventListener('click', goToAssignments);
    document.getElementById('backToReaderBtn').addEventListener('click', goToReader);

    buildBookList(); updateDisplay();
  </script>
</body>

</html>
